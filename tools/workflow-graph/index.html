<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工作流图 · 实时解析</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --line: #d8dce4;
    --line-strong: #b3bac7;
    --text: #1d2330;
    --muted: #6b7382;
    --accent: #2f6df6;
    --warn: #c2410c;
    --warn-bg: #fff3e8;
    --ok: #16803c;
    --rollback: #a855f7;
    --mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.55 -apple-system, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    z-index: 6; background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 10px 18px; display: flex; align-items: flex-start; gap: 18px; flex-wrap: wrap;
  }
  .title { font-size: 15px; font-weight: 600; }
  .title .wfname { font-family: var(--mono); color: var(--accent); }
  .usewhen { color: var(--muted); max-width: 70ch; }
  .metaline { margin-top: 2px; color: var(--muted); }
  .metaline b { color: var(--text); font-weight: 600; }
  .spacer { flex: 1 1 auto; }
  .side { display: flex; align-items: center; gap: 12px; }
  .zoom { display: flex; align-items: center; gap: 3px; }
  .zoom button { min-width: 26px; padding: 3px 7px; line-height: 1.2; }
  .zoom #zoom-level { min-width: 56px; font-family: var(--mono); font-size: 12px; }
  .status { display: flex; align-items: center; gap: 6px; color: var(--muted); white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line-strong); }
  .status.live .dot { background: #22c55e; box-shadow: 0 0 0 3px #22c55e33; }
  .status.dead .dot { background: #ef4444; box-shadow: 0 0 0 3px #ef444433; }
  button {
    font: inherit; color: var(--text); background: #fff; border: 1px solid var(--line-strong);
    border-radius: 6px; padding: 3px 9px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  #banner {
    margin: 10px 18px 0; padding: 8px 12px; border: 1px solid #f0b27a; background: var(--warn-bg);
    color: var(--warn); border-radius: 6px; white-space: pre-wrap; font-family: var(--mono); font-size: 12px;
  }
  #banner.hidden { display: none; }
  .hidden { display: none; }
  #body { flex: 1 1 auto; display: flex; min-height: 0; }
  main { flex: 1 1 auto; min-width: 0; overflow: auto; padding: 20px 18px 60px; }
  #zoom-box { position: relative; min-width: 100%; }
  #chart { position: relative; transform-origin: 0 0; }
  #edges { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 0; overflow: visible; }
  path.edge { fill: none; stroke: #b3bac7; stroke-width: 1.4; }
  path.edge.hot { stroke: var(--accent); stroke-width: 2; }
  path.edge.faded { opacity: .12; }
  path.edge.rb { stroke: var(--rollback); stroke-dasharray: 6 4; }
  path.edge.rb.hot { stroke: var(--rollback); stroke-width: 2; }
  #rows { display: flex; flex-direction: column; align-items: center; gap: 46px; position: relative; z-index: 1; }
  .row { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .rowlabel { font-size: 11px; color: var(--muted); letter-spacing: .04em; }
  .cards { display: flex; gap: 20px; align-items: flex-start; }
  .card {
    flex: none; width: 330px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 11px 9px; cursor: pointer; position: relative;
  }
  .card:hover { border-color: var(--accent); }
  .card.hi { border-color: var(--accent); box-shadow: 0 0 0 2px #2f6df622; }
  .card.sel { border-color: var(--accent); box-shadow: 0 0 0 3px #2f6df633; }
  .card.rbtarget { border-style: dashed; border-color: var(--rollback); }
  .card.miss { border-left: 3px solid var(--warn); }
  .card.cyc { border-left: 3px solid #ef4444; }
  .hd { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .idx { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .nid { font-family: var(--mono); font-size: 12.5px; font-weight: 600; color: var(--accent); }
  .tag {
    font-size: 10.5px; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--line-strong);
    color: var(--muted); background: #fafbfc;
  }
  .tag.sub { border-color: #8fb4ff; color: var(--accent); background: #eef3ff; }
  .tag.subg { border: 1px dashed #94a3b8; color: #64748b; background: #f8fafc; }
  .tag.err { border-color: #f0b27a; color: var(--warn); background: var(--warn-bg); }
  .tag.rb { border-color: #d8b4fe; color: var(--rollback); background: #faf5ff; }
  .tag.goto { cursor: pointer; }
  .tag.goto:hover { border-color: var(--accent); color: var(--accent); }
  .ctitle { font-weight: 600; margin: 4px 0 5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip {
    font-size: 11px; color: var(--muted); background: #f2f4f7; border-radius: 4px; padding: 1px 6px;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .chip.zero { color: #a2a9b6; }
  .chip.exec { color: var(--accent); background: #eef3ff; }
  .chip.veri { color: var(--rollback); background: #faf5ff; }
  .vis {
    font-size: 10px; font-weight: 400; border-radius: 3px; padding: 0 4px; margin-left: 5px;
    border: 1px solid var(--line); color: var(--muted); vertical-align: 1px;
  }
  .vis.vis-executor { border-color: #8fb4ff; color: var(--accent); background: #eef3ff; }
  .vis.vis-verifier { border-color: #d8b4fe; color: var(--rollback); background: #faf5ff; }
  .fkey { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-left: 5px; font-weight: 400; }
  .ed-title, .ed-field {
    width: 100%; font: inherit; padding: 4px 6px; border: 1px solid var(--line-strong); border-radius: 4px;
  }
  /* 整字段 YAML 源码编辑：等宽字体、行号槽、当前行高亮、默认折行；
     高度随内容自适应，仍可手动拖大。层级：curline(0) < textarea(1) < gutter(2) */
  .ed-wrap {
    position: relative; border: 1px solid var(--line-strong); border-radius: 4px;
    background: #fbfcfe; overflow: hidden;
  }
  .ed-wrap:focus-within { border-color: var(--accent); }
  .ed-field {
    display: block; border: none; border-radius: 0; background: transparent;
    position: relative; z-index: 1;
    font-family: var(--mono); font-size: 12px; line-height: 1.6; tab-size: 2;
    padding: 6px 8px 6px 44px; resize: vertical; overflow-y: hidden; overflow-x: hidden;
    white-space: pre-wrap; overflow-wrap: anywhere; caret-color: var(--accent); outline: none;
    background-image: linear-gradient(to bottom, #eef1f6 0, #eef1f6 100%);
    background-repeat: no-repeat; background-size: 36px 100%;
  }
  .ed-gutter {
    position: absolute; top: 0; left: 0; width: 36px; padding: 6px 0; z-index: 2;
    text-align: right; pointer-events: none; font-family: var(--mono); font-size: 10px;
    line-height: 1.6; color: #9aa3b2; user-select: none;
  }
  .ed-gutter div { padding-right: 7px; min-height: calc(12px * 1.6); }
  .ed-gutter div.cur { color: var(--accent); font-weight: 600; }
  .ed-curline {
    position: absolute; left: 36px; right: 0; z-index: 0; pointer-events: none;
    background: #eef3ff; display: none;
  }
  .ed-mirror {
    position: absolute; top: 0; left: 44px; visibility: hidden; pointer-events: none;
    font-family: var(--mono); font-size: 12px; line-height: 1.6;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .ed-mirror div { min-height: calc(12px * 1.6); }
  .ed-actions { display: flex; gap: 8px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
  .ed-err {
    margin-top: 8px; padding: 6px 10px; border: 1px solid #f0b27a; background: var(--warn-bg);
    color: var(--warn); border-radius: 6px; white-space: pre-wrap;
  }
  .path, .deps {
    margin-top: 6px; font-family: var(--mono); font-size: 11px; color: var(--muted);
    overflow-wrap: anywhere;
  }
  .deps { font-family: inherit; }
  .deps b { font-family: var(--mono); font-weight: 500; color: var(--text); }
  .sect { margin-bottom: 12px; }
  .sect h4 { margin: 0 0 4px; font-size: 12px; color: var(--text); }
  .sect h4 em { font-style: normal; color: var(--muted); font-weight: 400; }
  .sect ul { margin: 0; padding-left: 18px; }
  .sect li { margin: 0 0 4px; overflow-wrap: anywhere; }
  code {
    font-family: var(--mono); font-size: .92em; background: #eef1f5; border-radius: 3px; padding: 0 3px;
  }
  .hint { color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
  .legend { color: var(--muted); font-size: 11.5px; }
  #panel {
    flex: 0 0 470px; width: 470px; min-width: 0; overflow: auto;
    background: var(--panel); border-left: 1px solid var(--line); padding: 12px 16px 48px;
  }
  #panel-drag {
    flex: 0 0 5px; cursor: col-resize; background: transparent;
    border-left: 1px solid transparent; margin-left: -1px;
  }
  #panel-drag:hover, body.dragging #panel-drag { background: #eef3ff; border-left-color: var(--accent); }
  body.dragging { user-select: none; cursor: col-resize; }
  #panel.hidden { display: none; }
  .p-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .p-title { font-size: 15px; font-weight: 600; margin: 8px 0 2px; overflow-wrap: anywhere; }
  .p-file { font-family: var(--mono); font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
  .p-meta {
    display: grid; grid-template-columns: minmax(64px, auto) 1fr; gap: 3px 12px;
    margin: 10px 0; padding: 9px 0 1px; border-top: 1px solid var(--line); font-size: 12px;
  }
  .p-meta span { color: var(--muted); }
  .p-meta b { font-weight: 500; font-family: var(--mono); font-size: 11.5px; overflow-wrap: anywhere; }
  .p-deps { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; margin: 6px 0 10px; font-size: 12px; }
  .p-deps .lbl { color: var(--muted); }
  .p-rule { border-top: 1px solid var(--line); margin: 12px 0 10px; }
  #toast {
    position: fixed; right: 16px; bottom: 16px; z-index: 20;
    background: #1d2330; color: #fff; border-radius: 6px; padding: 7px 12px; font-size: 12px;
    opacity: 0; transition: opacity .25s; pointer-events: none;
  }
  #toast.show { opacity: .94; }
</style>
</head>
<body>
<header>
  <div>
    <div class="title">工作流图 · <span class="wfname" id="wfname">-</span>
      <span class="tag" id="wfpath">-</span></div>
    <div class="usewhen" id="usewhen"></div>
    <div class="metaline" id="meta"></div>
    <div class="metaline" id="graph-nav"></div>
  </div>
  <div class="spacer"></div>
  <div class="side">
    <span class="legend">点击节点 → 右侧看详情 · 紫色虚线 = 回滚边（向上回到目标卡底边） · 灰虚线标 = 运行时生成子图 · 橙色左边 = 提示词缺失</span>
    <div class="zoom" title="Ctrl/⌘ + 滚轮也可缩放">
      <button id="zoom-out" aria-label="缩小">－</button>
      <button id="zoom-level" title="点击恢复 100%">100%</button>
      <button id="zoom-in" aria-label="放大">＋</button>
    </div>
    <span class="status" id="status"><span class="dot"></span><span id="statustext">连接中…</span></span>
  </div>
</header>
<div id="banner" class="hidden"></div>
<div id="body">
  <main id="canvas">
    <div id="zoom-box">
    <div id="chart">
      <svg id="edges"><defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,1 L9,5 L0,9 z" fill="#b3bac7"></path>
        </marker>
        <marker id="arrow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,1 L9,5 L0,9 z" fill="#2f6df6"></path>
        </marker>
      </defs></svg>
      <div id="rows"></div>
    </div>
    </div>
  </main>
  <div id="panel-drag" class="hidden" title="拖动调整面板宽度"></div>
  <aside id="panel" class="hidden"><div id="panel-body"></div></aside>
</div>
<div id="toast"></div>

<script>
const state = { graph: null, rootGraph: null, route: [], views: [], cards: new Map(), hover: null, selected: null, zoom: 1, editing: null };
const ZOOM_STEPS = [0.25, 0.33, 0.5, 0.67, 0.75, 0.9, 1, 1.1, 1.25, 1.5, 2, 3];
const num = value => { const n = parseFloat(value); return Number.isFinite(n) ? n : 0; };

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = s => esc(s).replace(/`([^`]+)`/g, (m, code) => `<code>${code}</code>`);
const baseName = p => String(p).split('/').pop();
const $ = id => document.getElementById(id);
const nodeById = id => (state.graph ? state.graph.nodes.find(n => n.id === id) : null);

function chip(label, extra) {
  return `<span class="chip${extra || ''}">${fmt(label)}</span>`;
}

function sectionChips(prompt) {
  if (!prompt) return '';
  return prompt.sections.map(s => {
    const cls = ['chip'];
    if (!s.items.length) cls.push('zero');
    if (s.visibility === 'executor') cls.push('exec');
    if (s.visibility === 'verifier') cls.push('veri');
    const tip = ` title="${esc(s.key)}${s.visibility_label ? ' · ' + esc(s.visibility_label) : ''}"`;
    return `<span class="${cls.join(' ')}"${tip}>${fmt(`${s.label} ${s.items.length}`)}</span>`;
  }).join('');
}

function visBadge(s) {
  if (!s.visibility || s.visibility === 'both') return '';
  return `<span class="vis vis-${esc(s.visibility)}">${esc(s.visibility_label)}</span>`;
}

function sectionList(prompt) {
  if (!prompt) return '';
  return prompt.sections.map(s => `
    <section class="sect">
      <h4>${esc(s.label)}<code class="fkey">${esc(s.key)}</code>${visBadge(s)} <em>${s.items.length} 项</em></h4>
      ${s.items.length
        ? `<ul>${s.items.map(i => `<li>${i === '' ? '<span class="hint">（空）</span>' : fmt(i)}</li>`).join('')}</ul>`
        : '<div class="hint">（该字段为空）</div>'}
    </section>`).join('');
}

function kvRows(pairs) {
  return (pairs || []).map(p => `<span>${esc(p.key)}</span><b>${fmt(p.value)}</b>`).join('');
}

// 面板内编辑提示词：每个字段一个 YAML 源码编辑框（每行一个 `- ` 条目，带行号与当前行高亮），
// 高度随内容自适应、仍可手动拖大；字段名与 task YAML 的键一一对应
const EDITABLE_KEYS = ['goal', 'approach', 'procedure', 'acceptance', 'out_of_scope'];

function editForm(node) {
  const prompt = node.prompt;
  const byKey = new Map(prompt.sections.map(s => [s.key, s]));
  const blocks = EDITABLE_KEYS.map(key => {
    const sect = byKey.get(key) || { key, label: key, items: [], visibility: 'both', visibility_label: '' };
    const source = sect.items.map(i => `- ${i}`).join('\n');
    return `<section class="sect" data-key="${esc(key)}">
      <h4>${esc(sect.label)}<code class="fkey">${esc(key)}</code>${visBadge(sect)}</h4>
      <div class="ed-wrap">
        <div class="ed-curline"></div>
        <div class="ed-gutter"></div>
        <div class="ed-mirror" aria-hidden="true"></div>
        <textarea class="ed-field" spellcheck="false" placeholder="- 每行一个条目">${esc(source)}</textarea>
      </div>
    </section>`;
  }).join('');
  return `<div class="p-rule"></div>
    <div class="sect"><h4>标题<code class="fkey">title</code></h4>
      <input class="ed-title" id="ed-title" value="${esc(prompt.title || '')}"></div>
    ${blocks}
    <div class="ed-actions">
      <button id="ed-save">保存</button>
      <button id="ed-cancel">取消</button>
      <span class="hint">写回 ${esc(node.ref.rel)}；YAML 源码形式，每行以 <code>- </code> 开头</span>
    </div>
    <div class="ed-err hidden" id="ed-err"></div>`;
}

// 行号、当前行高亮、高度自适应（手动拖大后尊重用户高度）。
// 默认折行后一个逻辑行可能占多个视觉行：用隐藏镜像 div 实测每行高度，让行号与高亮按视觉行对齐。
function syncEditor(ta, recordHeight) {
  const wrap = ta.closest('.ed-wrap');
  const gutter = wrap.querySelector('.ed-gutter');
  const cur = wrap.querySelector('.ed-curline');
  const mirror = wrap.querySelector('.ed-mirror');
  const lines = ta.value.split('\n');

  const style = getComputedStyle(ta);
  const padTop = parseFloat(style.paddingTop) || 0;
  const padLeft = parseFloat(style.paddingLeft) || 0;
  const padRight = parseFloat(style.paddingRight) || 0;
  mirror.style.width = Math.max(10, ta.clientWidth - padLeft - padRight) + 'px';
  mirror.innerHTML = lines.map(l => `<div>${esc(l) || ' '}</div>`).join('');
  const lineH = parseFloat(style.lineHeight) || 19;
  const heights = [...mirror.children].map(c => Math.max(c.offsetHeight, lineH));

  gutter.innerHTML = lines.map((_, i) => `<div style="height:${heights[i]}px">${i + 1}</div>`).join('');
  gutter.style.transform = `translateY(${-ta.scrollTop}px)`;

  const lineIdx = ta.value.slice(0, ta.selectionStart).split('\n').length - 1;
  [...gutter.children].forEach((el, i) => el.classList.toggle('cur', i === lineIdx));
  if (ta.selectionStart === ta.selectionEnd && document.activeElement === ta) {
    const top = padTop + heights.slice(0, lineIdx).reduce((a, b) => a + b, 0) - ta.scrollTop;
    cur.style.display = 'block';
    cur.style.top = top + 'px';
    cur.style.height = heights[lineIdx] + 'px';
  } else {
    cur.style.display = 'none';
  }
  if (!ta.dataset.userResized) {
    ta.style.overflowY = 'hidden';
    ta.style.height = 'auto';
    const h = Math.ceil(ta.scrollHeight + 2);
    ta.style.height = h + 'px';
    if (recordHeight) recordHeight(h);
  } else {
    ta.style.overflowY = 'auto';
  }
}

function bindEditor(ta) {
  let autoHeight = 0, lastWidth = 0;
  // 高度变化与 autosize 上次设置不一致才算用户拖动，避免自适应触发误判；宽度变化要重测折行
  new ResizeObserver(() => {
    if (autoHeight > 0 && Math.abs(ta.offsetHeight - autoHeight) > 2) {
      ta.dataset.userResized = '1';
    }
    if (Math.abs(ta.clientWidth - lastWidth) > 1) {
      lastWidth = ta.clientWidth;
      sync();
    }
  }).observe(ta);
  const sync = () => syncEditor(ta, h => { autoHeight = h; });
  ['input', 'keyup', 'click', 'scroll'].forEach(evt => ta.addEventListener(evt, sync));
  ta.addEventListener('blur', () => { ta.closest('.ed-wrap').querySelector('.ed-curline').style.display = 'none'; });
  ta.addEventListener('focus', sync);
  sync();
}

function renderEditPanel(node) {
  $('panel-body').innerHTML = `
    <div class="p-head">
      <span class="idx">#${node.index}</span>
      <code class="nid">${esc(node.id)}</code>
      <span class="tag sub">编辑提示词</span>
      <span class="spacer"></span>
      <button id="p-close" title="关闭（Esc 先退出编辑）">关闭</button>
    </div>
    <div class="p-file" title="${esc(node.ref.path)}">${esc(node.ref.rel)}</div>
    ${editForm(node)}
  `;
  $('p-close').addEventListener('click', closePanel);
  $('ed-cancel').addEventListener('click', () => { state.editing = null; renderPanel(node); });
  $('ed-save').addEventListener('click', () => saveEdit(node));
  $('panel-body').querySelectorAll('textarea.ed-field').forEach(bindEditor);
}

async function saveEdit(node) {
  const errBox = $('ed-err');
  errBox.classList.add('hidden');
  const fields = { title: $('ed-title').value };
  for (const key of EDITABLE_KEYS) {
    const sect = $('panel-body').querySelector(`section.sect[data-key="${key}"]`);
    const rawLines = sect.querySelector('textarea').value.split('\n');
    const items = [];
    const badLines = [];
    rawLines.forEach((line, i) => {
      if (!line.trim()) return;
      const match = line.match(/^\s*-\s+(.*)$/);
      if (match) items.push(match[1].trimEnd());
      else badLines.push(i + 1);
    });
    if (badLines.length) {
      errBox.textContent = `${key} 的第 ${badLines.join('、')} 行不是以 "- " 开头的条目，请修正后再保存。`;
      errBox.classList.remove('hidden');
      return;
    }
    fields[key] = items;
  }
  let result;
  try {
    const resp = await fetch('/api/save-prompt', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: node.ref.path,
        base_mtime_ns: node.ref.mtime_ns,
        base_size: node.ref.size,
        fields,
      }),
    });
    result = await resp.json();
  } catch (error) {
    errBox.textContent = '保存请求失败：' + error;
    errBox.classList.remove('hidden');
    return;
  }
  if (!result.ok) {
    errBox.textContent = result.error || '保存失败';
    errBox.classList.remove('hidden');
    return;
  }
  state.editing = null;
  toast('已保存：' + node.ref.rel);
  load();  // 立即刷新；SSE 监听会再推一次，保持其它客户端同步
}

function gotoTag(id) {
  const exists = !!nodeById(id);
  return `<span class="tag${exists ? ' goto' : ''}" ${exists ? `data-goto="${esc(id)}"` : ''} title="${exists ? '查看该节点' : '该节点不在图中'}">${esc(id)}</span>`;
}

function currentGraph() {
  let graph = state.rootGraph;
  let validDepth = 0;
  for (const id of state.route) {
    const child = graph.nodes.find(node => node.id === id)?.subgraph?.graph;
    if (!child) break;
    graph = child;
    validDepth++;
  }
  if (validDepth !== state.route.length) {
    state.route.length = validDepth;
    state.views.length = validDepth;
    closePanel();
  }
  return graph;
}

function openSubgraph(node) {
  if (!node.subgraph?.graph) return;
  state.views.push({ selected: node.id, scrollTop: $('canvas').scrollTop, scrollLeft: $('canvas').scrollLeft, zoom: state.zoom });
  state.route.push(node.id);
  closePanel();
  state.hover = null;
  render(currentGraph());
  requestAnimationFrame(() => { $('canvas').scrollTop = 0; $('canvas').scrollLeft = 0; });
}

function returnToParent() {
  if (!state.route.length) return;
  const previous = state.views.pop();
  state.route.pop();
  closePanel();
  state.hover = null;
  if (previous) { state.zoom = previous.zoom; updateZoomLabel(); }
  render(currentGraph());
  if (previous?.selected) select(previous.selected);
  requestAnimationFrame(() => {
    $('canvas').scrollTop = previous?.scrollTop || 0;
    $('canvas').scrollLeft = previous?.scrollLeft || 0;
  });
}

function buildCard(node) {

  el.title = '点击在右侧查看提示词详情';

  const chips = [];
  if (node.executor) chips.push(chip(`执行 ${node.executor}`));
  if (node.verifier) chips.push(chip(`验收 ${node.verifier}`));

  if (node.on_exhaust) chips.push(chip(`耗尽 ${node.on_exhaust}`));
  if (node.rollback_to) chips.push(`<span class="chip tag rb" style="border-radius:4px">回滚→ ${esc(node.rollback_to)}</span>`);

    ? preview.runtime_file

function renderPanel(node) {

  rows.push({ key: '层级', value: `第 ${node.layer + 1} 层 / 共 ${layer} 层` });
  if (node.executor) rows.push({ key: '执行', value: node.executor });
  if (node.verifier) rows.push({ key: '验收', value: node.verifier });

  if (node.on_exhaust) rows.push({ key: '耗尽策略', value: node.on_exhaust });
  if (node.rollback_to) rows.push({ key: '回滚到', value: node.rollback_to });
  if (node.ref) rows.push({ key: '提示词文件', value: node.ref.declared || node.ref.rel });
  if (node.subgraph) {

  const prompt = node.prompt;
  const preview = node.subgraph && node.subgraph.preview;
  const body = prompt
    ? `${sectionList(prompt)}
       ${prompt.meta && prompt.meta.length ? `<div class="p-rule"></div><div class="p-meta">${kvRows(prompt.meta)}</div>` : ''}
       ${node.extra && node.extra.length ? `<div class="p-rule"></div><div class="p-meta">${kvRows(node.extra)}</div>` : ''}`
    : preview
      ? `<div class="p-rule"></div><div class="hint">${esc(preview.summary)}</div>
         <div class="sect" style="margin-top:12px"><h4>实现子图规划</h4>
           <ul>${preview.stages.map(stage => `<li><b>${esc(stage.title)}</b>：${esc(stage.description)}</li>`).join('')}</ul>
         </div><div class="hint">${esc(preview.note)}</div>`
    : `<div class="p-rule"></div>
       <div class="hint">${node.subgraph
          ? (node.subgraph.exists
              ? '该节点是子图引用，子图内节点：'
              : '子图文件不存在（' + esc(node.subgraph.rel) + '），无法展开其节点与提示词。')
          : esc(node.prompt_error || '该节点没有提示词内容。')}</div>
       ${node.subgraph && node.subgraph.child_node_ids && node.subgraph.child_node_ids.length
          ? `<div class="chips" style="margin-top:8px">${node.subgraph.child_node_ids.map(gotoTag).join('')}</div>` : ''}`;

  $('panel-body').innerHTML = `
    <div class="p-head">
      <span class="idx">#${node.index}</span>

      ${node.in_cycle ? '<span class="tag err">依赖环</span>' : ''}

      <span class="spacer"></span>

    <div class="p-meta">${kvRows(rows)}</div>
    ${node.subgraph?.graph ? `<div class="p-rule"></div><button id="p-expand">展开子图 · ${node.subgraph.graph.view_kind === 'planned' ? '规划预览' : '真实结构'}</button><div class="hint" style="margin-top:8px">在画布查看节点、依赖及回滚关系，点击子节点查看提示词；可返回上级。</div>` : ''}
    ${node.subgraph?.error ? `<div class="hint">${esc(node.subgraph.error)}</div>` : ''}
    <div class="p-deps"><span class="lbl">依赖</span>${node.depends_on.length ? node.depends_on.map(gotoTag).join('') : '<span class="hint">无（根节点）</span>'}</div>
    <div class="p-deps"><span class="lbl">被依赖</span>${node.dependents.length ? node.dependents.map(gotoTag).join('') : '<span class="hint">无（终点节点）</span>'}</div>
    ${body}
  `;
  $('p-close').addEventListener('click', closePanel);
  const editBtn = $('p-edit');
  if (editBtn) editBtn.addEventListener('click', () => { state.editing = node.id; renderEditPanel(node); });
  const expandBtn = $('p-expand');
  if (expandBtn) expandBtn.addEventListener('click', () => openSubgraph(node));
}

function select(id) {
  if (state.selected === id && !state.editing) { closePanel(); return; }
  state.selected = id;
  state.editing = null;
  const node = nodeById(id);
  if (!node) { closePanel(); return; }
  renderPanel(node);
  $('panel').classList.remove('hidden');
  $('panel-drag').classList.remove('hidden');
  applyHighlight();
  requestAnimationFrame(() => {
    drawEdges();
    ensureVisible();
  });
}

function closePanel() {
  state.selected = null;
  state.editing = null;
  $('panel').classList.add('hidden');
  $('panel-drag').classList.add('hidden');
  $('panel-body').replaceChildren();
  applyHighlight();
  requestAnimationFrame(drawEdges);
}

function ensureVisible() {
  const card = state.cards.get(state.selected);
  if (!card) return;
  const box = $('canvas').getBoundingClientRect();
  const rect = card.getBoundingClientRect();
  if (typeof card.scrollIntoView !== 'function') return;
  if (rect.top < box.top + 8 || rect.bottom > box.bottom - 8 || rect.left < box.left + 8 || rect.right > box.right - 8) {
    card.scrollIntoView({ block: 'center', inline: 'nearest' });
  }
}

const EDGE_R = 7;                     // 折角圆角半径
const FAN_MARGIN = 40;                // 落点与卡片左右边缘的最小距离
const FAN_GAP = 24;                   // 左/右半区起点与卡片中线的距离
const FAN_SPREAD = 14;                // 同一侧多条边之间的落点间距
const FAN_SPAN = 14;                  // 同列（中线）落点的最大偏移
const SIDE_ANCHOR = 24;               // 单条边在该侧的落点偏移上限
const LANE_ANCHOR = 20;               // 走泳道的边至少偏离中线这么多（出线即朝泳道方向）
const SIDE_EPS = 12;                  // 判定“左/右/同列”的横向阈值
const LANE_MARGIN = 26;               // 卡片区边缘到第一条泳道的距离
const LANE_STEP = 14;                 // 泳道间距
const CHANNEL_TOP = 12;               // 空隙内第一条通道距上一行底边的距离
const CHANNEL_PITCH = 11;             // 通道间距上限
const CHANNEL_PITCH_MIN = 6;          // 通道间距下限
const MIN_SEP = 7;                    // 同一空隙里两段竖线的最小间隔
const ROW_GAP_MIN = 46;               // 行间距下限
const ROW_GAP_PAD = 16;               // 空隙中通道区之外保留的留白

const edgeKeyOf = edge => edge.from + '\u0000' + edge.to;
const sideOfDelta = dx => (dx > SIDE_EPS ? 'right' : (dx < -SIDE_EPS ? 'left' : 'center'));
const round1 = value => Math.round(value * 10) / 10;

function rowLayout() {
  const rows = [...document.querySelectorAll('.row')];
  return rows.map(row => {
    const cards = [...row.querySelectorAll('.card')];
    const block = row.querySelector('.cards');
    return {
      rects: new Map(cards.map(card => [card.dataset.id, {
        left: card.offsetLeft,
        right: card.offsetLeft + card.offsetWidth,
        cx: card.offsetLeft + card.offsetWidth / 2,
        top: card.offsetTop,
        bottom: card.offsetTop + card.offsetHeight,
      }])),
      width: block ? block.offsetWidth : 0,
      top: cards.length ? Math.min(...cards.map(card => card.offsetTop)) : 0,
      maxBottom: cards.length
        ? Math.max(...cards.map(card => card.offsetTop + card.offsetHeight))
        : 0,
    };
  });
}

// 拓扑分类：相邻层之间在空隙里走通道，跨层长边进左右泳道。
function planTopology(edges, layerOf) {
  const adjacent = [];
  const long = [];
  const demand = new Map();          // 空隙序号 -> 需要横穿它的边
  const need = (gap, edge) => {
    if (!demand.has(gap)) demand.set(gap, []);
    demand.get(gap).push(edge);
  };
  for (const edge of edges) {
    const from = layerOf.get(edge.from);
    const to = layerOf.get(edge.to);
    if (from === undefined || to === undefined) continue;
    if (edge.rollback) {
      // 回滚边向上走：出口空隙 = 来源行上方（from-1），入口空隙 = 目标行下方（to）
      if (to >= from) continue;      // 指向下层/同层是异常数据，不画
      if (to === from - 1) {
        adjacent.push(edge);
        need(to, edge);
      } else {
        long.push(edge);
        need(from - 1, edge);        // 出口空隙
        need(to, edge);              // 入口空隙
      }
      continue;
    }
    if (to <= from) continue;
    if (to === from + 1) {
      adjacent.push(edge);
      need(from, edge);
    } else {
      long.push(edge);
      need(from, edge);              // 出口空隙
      need(to - 1, edge);            // 入口空隙
    }
  }
  return { adjacent, long, demand };
}

// 跨层长边按走向分到左右泳道；同侧泳道只有当纵向区间不重叠时才复用。
function planLanes(longEdges, layerOf, rects) {
  const stacks = { left: [], right: [] };
  const laneOfEdge = new Map();
  const sideOfEdge = new Map();
  const items = longEdges
    .map(edge => ({
      edge,
      from: rects.get(edge.from),
      to: rects.get(edge.to),
      // 回滚边向上走，纵向区间按 [目标层, 来源层] 参与泳道复用判断
      start: layerOf.get(edge.rollback ? edge.to : edge.from),
      stop: layerOf.get(edge.rollback ? edge.from : edge.to),
    }))
    .filter(item => item.from && item.to)
    .sort((a, b) => (a.stop - a.start) - (b.stop - b.start) || a.start - b.start);
  for (const item of items) {
    const side = (item.to.cx - item.from.cx) < -SIDE_EPS ? 'left' : 'right';
    let lane = stacks[side].findIndex(spans => spans.every(([a, b]) => item.stop <= a || item.start >= b));
    if (lane === -1) { stacks[side].push([]); lane = stacks[side].length - 1; }
    stacks[side][lane].push([item.start, item.stop]);
    laneOfEdge.set(edgeKeyOf(item.edge), lane);
    sideOfEdge.set(edgeKeyOf(item.edge), side);
  }
  return { laneOfEdge, sideOfEdge, leftCount: stacks.left.length, rightCount: stacks.right.length };
}

// 落点可用范围：左半区 / 右半区 / 中线附近，三段互不相交。
function fanRange(rect, side) {
  const mid = rect.cx;
  const margin = Math.min(FAN_MARGIN, Math.max(0, (rect.right - rect.left) / 2 - 8));
  if (side === 'left') return [rect.left + margin, Math.max(rect.left + margin, mid - FAN_GAP)];
  if (side === 'right') return [Math.min(rect.right - margin, mid + FAN_GAP), rect.right - margin];
  const span = Math.min(FAN_SPAN, margin);
  return [mid - span, mid + span];
}

// 落点分配：同一节点的同一走向组成一束。
// 束内按对端横向位置排序后等距排开（箭头不合并）；单条边尽量贴近中线，
// 偏移量随“两端横向距离”收缩，保证走线只朝目标方向偏移、不出现反向绕行。
function planFan(entries, rectOf) {
  const buckets = new Map();
  for (const entry of entries) {
    const rect = rectOf(entry.id);
    if (!rect) continue;
    const bucketKey = entry.id + '\u0000' + entry.side;
    if (!buckets.has(bucketKey)) buckets.set(bucketKey, { side: entry.side, rect, span: 0, floor: 0, list: [] });
    const bucket = buckets.get(bucketKey);
    bucket.span += Math.abs(entry.other - rect.cx);
    bucket.floor = Math.max(bucket.floor, entry.minBase || 0);
    bucket.list.push(entry);
  }
  const result = new Map();
  for (const bucket of buckets.values()) {
    const { rect, side } = bucket;
    const count = bucket.list.length;
    const base = Math.min(SIDE_ANCHOR, Math.max(bucket.floor, bucket.span / Math.max(1, count) / 3));
    const [lo, hi] = fanRange(rect, side);
    // 泳道序号小的贴内圈，配合下面的通道排序，同侧多条长边互不交叉
    bucket.list.sort((a, b) => ((a.lane || 0) - (b.lane || 0)) || (a.other - b.other) || a.key.localeCompare(b.key));
    bucket.list.forEach((entry, index) => {
      let x = rect.cx;
      if (side === 'right') x = rect.cx + base + index * FAN_SPREAD;
      else if (side === 'left') x = rect.cx - base - index * FAN_SPREAD;
      else x = rect.cx + (index - (count - 1) / 2) * FAN_SPREAD;
      result.set(entry.key, { side, index, count, lo, hi, x: Math.max(lo, Math.min(hi, x)) });
    });
  }
  return result;
}

// 全正交折线：只保留拐点，拐角用圆弧过渡，避免“飞线”和尖角。
function orthoPath(points) {
  const clean = [];
  for (const point of points) {
    const last = clean[clean.length - 1];
    if (last && Math.abs(last[0] - point[0]) < 0.5 && Math.abs(last[1] - point[1]) < 0.5) continue;
    clean.push(point);
  }
  const pts = [];
  for (let i = 0; i < clean.length; i++) {
    if (i > 0 && i < clean.length - 1) {
      const prev = clean[i - 1];
      const cur = clean[i];
      const next = clean[i + 1];
      const straight = (Math.abs(prev[0] - cur[0]) < 0.5 && Math.abs(cur[0] - next[0]) < 0.5)
        || (Math.abs(prev[1] - cur[1]) < 0.5 && Math.abs(cur[1] - next[1]) < 0.5);
      if (straight) continue;
    }
    pts.push(clean[i]);
  }
  if (pts.length < 2) return null;
  let d = `M ${round1(pts[0][0])} ${round1(pts[0][1])}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const prev = pts[i - 1];
    const cur = pts[i];
    const next = pts[i + 1];
    const lenIn = Math.abs(cur[0] - prev[0]) + Math.abs(cur[1] - prev[1]);
    const lenOut = Math.abs(next[0] - cur[0]) + Math.abs(next[1] - cur[1]);
    const r = Math.min(EDGE_R, lenIn / 2, lenOut / 2);
    const inX = cur[0] + (prev[0] - cur[0]) / (lenIn || 1) * r;
    const inY = cur[1] + (prev[1] - cur[1]) / (lenIn || 1) * r;
    const outX = cur[0] + (next[0] - cur[0]) / (lenOut || 1) * r;
    const outY = cur[1] + (next[1] - cur[1]) / (lenOut || 1) * r;
    d += ` L ${round1(inX)} ${round1(inY)} Q ${round1(cur[0])} ${round1(cur[1])} ${round1(outX)} ${round1(outY)}`;
  }
  d += ` L ${round1(pts[pts.length - 1][0])} ${round1(pts[pts.length - 1][1])}`;
  return d;
}

// 一个空隙里的多条走线各占一条水平通道（互不重叠）。
// 竖线都是卡片朝通道方向伸出来的，所以某条横线若从别人的竖线上跨过去就会形成交叉。
// 空隙内的走线数量很少，直接穷举出交叉最少的通道顺序；太多时退化为贪心。
function orderChannels(items) {
  const list = items.slice();
  const count = list.length;
  if (count <= 1) return list;
  // 竖线：通道以上的部分在上方，以下的部分在下方（长边的泳道竖线同理）
  const verticals = (item, side) => {
    const xs = [];
    if (side === 'up' ? item.hasUpper : item.hasLower) xs.push(side === 'up' ? item.x1 : item.x2);
    if (item.laneX !== null && (side === 'up' ? !item.hasUpper : !item.hasLower)) xs.push(item.laneX);
    return xs;
  };
  const hits = (item, xs) => xs.some(x => item.min <= x && x <= item.max);
  // above 排在 below 上面时的交叉数
  const pairCost = (above, below) => (above === below ? 0
    : (hits(above, verticals(below, 'up')) ? 1 : 0) + (hits(below, verticals(above, 'down')) ? 1 : 0));

  const order = [];
  const used = new Array(count).fill(false);
  const best = { cost: Infinity, seq: null };
  const walk = (depth, cost) => {
    if (cost >= best.cost) return;
    if (depth === count) { best.cost = cost; best.seq = order.slice(); return; }
    for (let i = 0; i < count; i++) {
      if (used[i]) continue;
      let add = 0;
      for (const placed of order) add += pairCost(placed, list[i]);
      used[i] = true;
      order.push(list[i]);
      walk(depth + 1, cost + add);
      order.pop();
      used[i] = false;
    }
  };
  if (count <= 7) {
    walk(0, 0);
    if (best.seq) return best.seq;
  }
  // 兜底：贪心，每次挑“新增交叉最少”的一条排到当前最上面
  const rest = list.slice();
  const out = [];
  while (rest.length) {
    let pick = 0;
    let pickCost = Infinity;
    rest.forEach((cand, index) => {
      let add = 0;
      for (let i = 0; i < rest.length; i++) if (i !== index) add += pairCost(cand, rest[i]);
      if (add < pickCost) { pickCost = add; pick = index; }
    });
    out.push(rest.splice(pick, 1)[0]);
  }
  return out;
}

function drawEdges() {
  if (!state.graph) return;
  const chart = $('chart');
  const svg = $('edges');
  const zoomBox = $('zoom-box');
  const canvas = $('canvas');
  const rowsBox = $('rows');

  const layerOf = new Map(state.graph.nodes.map(n => [n.id, n.layer]));
  const edges = state.graph.edges;
  // 回滚边与依赖边共用一套拓扑/泳道/通道机制，走线方向取镜像：
  // 依赖边从来源卡底边出线、向下落到目标卡顶边；回滚边从来源卡顶边出线、向上回到目标卡底边。
  const allEdges = [...edges, ...(state.graph.rollbacks || []).map(rb => ({ ...rb, rollback: true }))];
  const { long, demand } = planTopology(allEdges, layerOf);

  // 行间距按最拥挤的空隙自动放宽，保证每条横向走线都有自己的通道
  const maxDemand = Math.max(1, ...[...demand.values()].map(list => list.length));
  rowsBox.style.gap = `${Math.max(ROW_GAP_MIN, ROW_GAP_PAD + maxDemand * CHANNEL_PITCH)}px`;

  // 第一遍测量：卡片区宽度 + 每条长边往左还是往右
  const firstRows = rowLayout();
  const blockWidth = firstRows.reduce((max, row) => Math.max(max, row.width), 0);
  const firstRects = new Map();
  firstRows.forEach(row => row.rects.forEach((rect, id) => firstRects.set(id, rect)));
  const { laneOfEdge, sideOfEdge, leftCount, rightCount } = planLanes(long, layerOf, firstRects);

  const leftSpace = leftCount ? LANE_MARGIN + (leftCount - 1) * LANE_STEP + EDGE_R + 8 : 0;
  const rightSpace = rightCount ? LANE_MARGIN + (rightCount - 1) * LANE_STEP + EDGE_R + 8 : 0;
  const sideSpace = Math.max(leftSpace, rightSpace);

  const scale = state.zoom;
  const padding = getComputedStyle(canvas);
  const contentWidth = Math.max(0, canvas.clientWidth - num(padding.paddingLeft) - num(padding.paddingRight));
  const width = Math.max(blockWidth + 2 * sideSpace, contentWidth / scale);
  chart.style.width = `${width}px`;
  chart.style.transform = `scale(${scale})`;

  const rows = rowLayout();
  const height = chart.offsetHeight;
  zoomBox.style.width = `${width * scale}px`;
  zoomBox.style.height = `${height * scale}px`;
  svg.setAttribute('width', width);
  svg.setAttribute('height', height);
  svg.setAttribute('viewBox', `0 0 ${width} ${height}`);

  const cardLeft = width / 2 - blockWidth / 2;
  const cardRight = width / 2 + blockWidth / 2;
  const cxOf = id => {
    const row = rows[layerOf.get(id)];
    const rect = row && row.rects.get(id);
    return rect ? rect.cx : 0;
  };
  const rectOf = id => {
    const row = rows[layerOf.get(id)];
    return row ? row.rects.get(id) : null;
  };

  // 出线落在朝向目标的那一侧；入线落在来线的那一侧（长边走泳道时跟随泳道方向）
  const exitSideOf = edge => sideOfEdge.get(edgeKeyOf(edge)) || sideOfDelta(cxOf(edge.to) - cxOf(edge.from));
  const entrySideOf = edge => sideOfEdge.get(edgeKeyOf(edge)) || sideOfDelta(cxOf(edge.from) - cxOf(edge.to));
  const laneBase = edge => (sideOfEdge.has(edgeKeyOf(edge)) ? LANE_ANCHOR : 0);
  const laneOfKey = key => (laneOfEdge.has(key) ? laneOfEdge.get(key) : null);
  // 回滚边的“出线”在目标卡底边（与依赖出线同扇），“入线”在来源卡顶边（与依赖入线同扇）
  const outFan = planFan(allEdges.map(edge => (edge.rollback ? {
    key: edgeKeyOf(edge), id: edge.to, other: cxOf(edge.from), side: entrySideOf(edge),
    minBase: laneBase(edge), lane: laneOfKey(edgeKeyOf(edge)),
  } : {
    key: edgeKeyOf(edge), id: edge.from, other: cxOf(edge.to), side: exitSideOf(edge),
    minBase: laneBase(edge), lane: laneOfKey(edgeKeyOf(edge)),
  })), rectOf);
  const inFan = planFan(allEdges.map(edge => (edge.rollback ? {
    key: edgeKeyOf(edge), id: edge.from, other: cxOf(edge.to), side: exitSideOf(edge),
    minBase: laneBase(edge), lane: laneOfKey(edgeKeyOf(edge)),
  } : {
    key: edgeKeyOf(edge), id: edge.to, other: cxOf(edge.from), side: entrySideOf(edge),
    minBase: laneBase(edge), lane: laneOfKey(edgeKeyOf(edge)),
  })), rectOf);

  const anchor = new Map();          // edgeKey -> {x1, x2}
  for (const edge of allEdges) {
    const key = edgeKeyOf(edge);
    const out = outFan.get(key);
    const into = inFan.get(key);
    if (!out || !into) continue;
    // 回滚边：x1 是来源卡顶边落点（入线扇），x2 是目标卡底边落点（出线扇）
    anchor.set(key, edge.rollback ? { x1: into.x, x2: out.x } : { x1: out.x, x2: into.x });
  }

  const laneXOf = key => {
    const laneIndex = laneOfEdge.get(key);
    if (laneIndex === undefined) return null;
    return sideOfEdge.get(key) === 'left'
      ? cardLeft - LANE_MARGIN - laneIndex * LANE_STEP
      : cardRight + LANE_MARGIN + laneIndex * LANE_STEP;
  };

  // 每条空隙里，横穿它的走线各占一条水平通道；越靠左的线走越靠上的通道，避免互相压住
  const channel = new Map();         // edgeKey -> {exit, entry}
  for (const [gap, list] of demand) {
    const band = ((rows[gap + 1] && rows[gap + 1].top) || rows[gap].maxBottom) - rows[gap].maxBottom;
    const room = Math.max(CHANNEL_PITCH_MIN, band - CHANNEL_TOP - ROW_GAP_PAD);
    const pitch = Math.min(CHANNEL_PITCH, Math.max(CHANNEL_PITCH_MIN, room / Math.max(1, list.length - 1)));
    const items = list
      .map(edge => {
        const key = edgeKeyOf(edge);
        const spot = anchor.get(key);
        if (!spot) return null;
        // 统一成“空隙上一行的卡 / 下一行的卡”：依赖边上方是 from、下方是 to；回滚边相反
        const upper = layerOf.get(edge.rollback ? edge.to : edge.from);
        const lower = layerOf.get(edge.rollback ? edge.from : edge.to);
        const upperSpot = edge.rollback ? spot.x2 : spot.x1;
        const lowerSpot = edge.rollback ? spot.x1 : spot.x2;
        const kind = upper === gap ? 0 : 1;   // 0 = 从上一行出来，1 = 落到下一行
        const laneX = laneXOf(key);
        const near = kind === 0 ? upperSpot : lowerSpot;      // 起/落点
        const far = laneX === null ? (kind === 0 ? lowerSpot : upperSpot) : laneX;
        return {
          edge,
          x1: spot.x1,
          x2: spot.x2,
          laneX,
          hasUpper: upper === gap,
          hasLower: lower === gap + 1,
          min: Math.min(near, far),
          max: Math.max(near, far),
        };
      })
      .filter(Boolean);
    orderChannels(items).forEach((item, index) => {
      const y = rows[gap].maxBottom + CHANNEL_TOP + index * pitch;
      const key = edgeKeyOf(item.edge);
      const record = channel.get(key) || {};
      const start = layerOf.get(item.edge.from);
      const stop = layerOf.get(item.edge.to);
      if (item.edge.rollback) {
        // 回滚边：出口空隙 = 来源行上方（start-1），入口空隙 = 目标行下方（stop）
        if (stop === start - 1) { record.exit = y; record.entry = y; }
        else if (stop === gap) record.entry = y;
        else record.exit = y;
      } else if (stop === start + 1) { record.exit = y; record.entry = y; }
      else if (start === gap) record.exit = y;
      else record.entry = y;
      channel.set(key, record);
    });
  }

  // 竖直段去重叠：同一空隙里共线且纵向相交的两段竖线，把后一段在本侧落点范围内让开
  const verticals = new Map();       // gap -> [{key, kind, x, lo, hi, y0, y1}]
  for (const [gap, list] of demand) {
    for (const edge of list) {
      const key = edgeKeyOf(edge);
      const spot = anchor.get(key);
      const lanes = channel.get(key);
      const fromRect = rectOf(edge.from);
      const toRect = rectOf(edge.to);
      if (!spot || !lanes || !fromRect || !toRect) continue;
      const segs = [];
      const out = outFan.get(key);
      const into = inFan.get(key);
      if (edge.rollback) {
        // 出口竖线：来源卡顶边向上伸到出口通道（落点跟着顶边入线扇让位）
        if (into && layerOf.get(edge.from) === gap + 1 && lanes.exit !== undefined) {
          segs.push({ key, kind: 'x1', x: spot.x1, lo: into.lo, hi: into.hi, y0: lanes.exit, y1: fromRect.top - 2 });
        }
        // 入口竖线：入口通道向上伸到目标卡底边（落点跟着底边出线扇让位）
        if (out && layerOf.get(edge.to) === gap && lanes.entry !== undefined) {
          segs.push({ key, kind: 'x2', x: spot.x2, lo: out.lo, hi: out.hi, y0: toRect.bottom + 1, y1: lanes.entry });
        }
      } else {
        if (out && layerOf.get(edge.from) === gap) {
          segs.push({ key, kind: 'x1', x: spot.x1, lo: out.lo, hi: out.hi, y0: fromRect.bottom + 2, y1: lanes.exit });
        }
        if (into && layerOf.get(edge.to) === gap + 1) {
          segs.push({ key, kind: 'x2', x: spot.x2, lo: into.lo, hi: into.hi, y0: lanes.entry, y1: toRect.top - 1 });
        }
      }
      if (segs.length) {
        if (!verticals.has(gap)) verticals.set(gap, []);
        verticals.get(gap).push(...segs);
      }
    }
  }
  for (const list of verticals.values()) {
    list.sort((a, b) => a.x - b.x || a.y0 - b.y0);
    const placed = [];
    for (const seg of list) {
      const clash = x => placed.some(p => Math.abs(p.x - x) < MIN_SEP - 0.01
        && Math.min(p.y1, seg.y1) - Math.max(p.y0, seg.y0) > 0.5);
      let x = seg.x;
      if (clash(x)) {
        const step = MIN_SEP + 1;
        let found = null;
        for (let k = 1; k <= 10 && found === null; k++) {
          for (const candidate of [seg.x + k * step, seg.x - k * step]) {
            const snapped = Math.max(seg.lo, Math.min(seg.hi, candidate));
            if (Math.abs(snapped - seg.x) < 0.5 || Math.abs(snapped - x) < 0.5) continue;
            if (!clash(snapped)) { found = snapped; break; }
          }
        }
        if (found !== null) x = found;
      }
      placed.push({ x, y0: seg.y0, y1: seg.y1 });
      const spot = anchor.get(seg.key);
      if (spot) spot[seg.kind] = x;
    }
  }

  const paths = [];
  for (const edge of allEdges) {
    const key = edgeKeyOf(edge);
    const fromRect = rectOf(edge.from);
    const toRect = rectOf(edge.to);
    const spot = anchor.get(key);
    const lanes = channel.get(key);
    if (!fromRect || !toRect || !spot || !lanes) continue;
    if (lanes.exit === undefined || lanes.entry === undefined) continue;
    const laneX = laneXOf(key);
    // 回滚边：来源卡顶边 → 出口通道 →（泳道上行）→ 入口通道 → 目标卡底边，箭头朝上
    const points = edge.rollback
      ? [[spot.x1, fromRect.top - 2], [spot.x1, lanes.exit]]
      : [[spot.x1, fromRect.bottom + 2], [spot.x1, lanes.exit]];
    if (laneX !== null) points.push([laneX, lanes.exit], [laneX, lanes.entry]);
    points.push([spot.x2, lanes.entry]);
    points.push(edge.rollback
      ? [spot.x2, toRect.bottom + 1]
      : [spot.x2, toRect.top - 1]);
    const d = orthoPath(points);
    if (!d) continue;
    paths.push(`<path class="edge${edge.rollback ? ' rb' : ''}" data-from="${esc(edge.from)}" data-to="${esc(edge.to)}"
      d="${d}" marker-end="url(#${edge.rollback ? 'arrow-rb' : 'arrow'})"></path>`);
  }
  svg.innerHTML = `<defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,1 L9,5 L0,9 z" fill="#b3bac7"></path></marker>
      <marker id="arrow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,1 L9,5 L0,9 z" fill="#2f6df6"></path></marker>
      <marker id="arrow-rb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,1 L9,5 L0,9 z" fill="#a855f7"></path></marker>
    </defs>` + paths.join('');
  applyHighlight();
}

function neighbors(id) {
  const related = new Set([id]);
  if (!id || !state.graph) return related;
  for (const edge of state.graph.edges) {
    if (edge.from === id) related.add(edge.to);
    if (edge.to === id) related.add(edge.from);
  }
  const node = nodeById(id);
  if (node && node.rollback_to) related.add(node.rollback_to);
  return related;
}

function applyHighlight() {
  const id = state.hover || state.selected;
  const related = neighbors(id);
  const rollbackTarget = id ? (nodeById(id) || {}).rollback_to : null;
  for (const [nodeId, card] of state.cards) {
    const on = !id || related.has(nodeId);
    card.classList.toggle('hi', !!id && nodeId !== id && related.has(nodeId));
    card.classList.toggle('sel', nodeId === state.selected);
    card.classList.toggle('rbtarget', !!id && nodeId !== id && rollbackTarget === nodeId);
    card.style.opacity = on ? '' : '0.35';
  }
  for (const path of document.querySelectorAll('path.edge')) {
    const on = !id || path.dataset.from === id || path.dataset.to === id;
    const isRb = path.classList.contains('rb');
    path.classList.toggle('hot', !!id && on);
    path.classList.toggle('faded', !!id && !on);
    // 回滚边高亮时保持紫色箭头，只加粗
    path.setAttribute('marker-end', isRb ? 'url(#arrow-rb)' : (id && on ? 'url(#arrow-hot)' : 'url(#arrow)'));
  }
}

function highlight(id) {
  state.hover = id;
  applyHighlight();
}

function updateZoomLabel() {
  $('zoom-level').textContent = `${Math.round(state.zoom * 100)}%`;
}

function setZoom(next) {
  const target = Math.min(ZOOM_STEPS[ZOOM_STEPS.length - 1], Math.max(ZOOM_STEPS[0], next));
  if (Math.abs(target - state.zoom) < 0.001) return;
  const canvas = $('canvas');
  const box = $('zoom-box');
  // 以画布中心为锚点，缩放前后视觉位置不变
  const totalW = Math.max(1, box.offsetWidth);
  const totalH = Math.max(1, box.offsetHeight);
  const fracX = (canvas.scrollLeft + canvas.clientWidth / 2) / totalW;
  const fracY = (canvas.scrollTop + canvas.clientHeight / 2) / totalH;
  state.zoom = target;
  drawEdges();
  canvas.scrollLeft = fracX * box.offsetWidth - canvas.clientWidth / 2;
  canvas.scrollTop = fracY * box.offsetHeight - canvas.clientHeight / 2;
  updateZoomLabel();
}

function stepZoom(direction) {
  const current = state.zoom;
  const next = direction > 0
    ? ZOOM_STEPS.find(step => step > current + 0.001)
    : [...ZOOM_STEPS].reverse().find(step => step < current - 0.001);
  if (next !== undefined) setZoom(next);
}

function render(graph) {
  state.graph = graph;
  const rows = $('rows');
  const scrollTop = $('canvas').scrollTop;
  rows.replaceChildren();
  state.cards = new Map();

  const byId = new Map(graph.nodes.map(n => [n.id, n]));
  const ordered = orderLayers(graph, byId).map((ids, depth) => ({ depth, ids }));

  for (const layer of ordered) {
    const row = document.createElement('div');
    row.className = 'row';
    row.dataset.layer = layer.depth;
    row.innerHTML = `<div class="rowlabel">第 ${layer.depth + 1} 层 · ${layer.ids.length} 个节点</div>`;
    const cards = document.createElement('div');
    cards.className = 'cards';
    for (const id of layer.ids) {
      const node = byId.get(id);
      if (!node) continue;
      const card = buildCard(node);
      cards.appendChild(card);
      state.cards.set(id, card);
    }
    row.appendChild(cards);
    rows.appendChild(row);
  }
  updateHeader(graph);
  if (state.selected) {
    const node = byId.get(state.selected);
    if (!node) closePanel();
    else if (state.editing !== state.selected) renderPanel(node);
    // 编辑中的面板不被热更新覆盖；保存时用 mtime+size 检测外部修改
  }
  requestAnimationFrame(() => {
    drawEdges();
    $('canvas').scrollTop = scrollTop;
  });
}

function orderLayers(graph, byId) {
  const layers = (graph.layers || []).map(ids => ids.slice());
  const position = new Map();
  const reindex = () => layers.forEach((ids, depth) => ids.forEach((id, i) => position.set(id, { depth, i })));
  reindex();
  const sortBy = key => {
    layers.forEach((ids, depth) => {
      const scored = ids.map((id, i) => {
        const node = byId.get(id);
        const refs = (node && node[key]) || [];
        const coords = refs.map(r => position.get(r)).filter(Boolean);
        const score = coords.length ? coords.reduce((a, c) => a + c.i, 0) / coords.length : i;
        return { id, score, i };
      });
      scored.sort((a, b) => (a.score - b.score) || (a.i - b.i));
      layers[depth] = scored.map(s => s.id);
    });
    reindex();
  };
  sortBy('depends_on');
  sortBy('dependents');
  sortBy('depends_on');
  return layers;
}

function updateHeader(graph) {
  const wf = graph.workflow || {};
  $('wfname').textContent = wf.name || '-';
  $('wfpath').textContent = wf.rel || '';
  $('usewhen').textContent = wf.use_when || '';
  const nav = $('graph-nav');
  nav.innerHTML = state.route.length
    ? `<button id="graph-back">← 返回${state.route.length === 1 ? '主图' : '上级'}</button> <b>${esc(state.route.join(' → '))}</b> · <span class="tag ${graph.view_kind === 'planned' ? 'subg' : ''}">${graph.view_kind === 'planned' ? '规划预览 · 非实际运行图' : '真实子图文件'}</span><div class="hint">${esc(graph.view_note || '')}</div>`
    : '<span class="hint">主图 · 点击子图节点，在详情面板展开子图</span>';
  if ($('graph-back')) $('graph-back').addEventListener('click', returnToParent);
  const s = graph.stats || {};
  const extras = [];
  if (wf.max_parallel !== null && wf.max_parallel !== undefined) extras.push(`并发上限 <b>${wf.max_parallel}</b>`);
  if (wf.max_rollbacks !== null && wf.max_rollbacks !== undefined) extras.push(`回滚上限 <b>${wf.max_rollbacks}</b>`);
  if (s.missing_prompts) extras.push(`提示词缺失 <b>${s.missing_prompts}</b>`);
  if (s.subgraphs) extras.push(`子图节点 <b>${s.subgraphs}</b>`);
  const rbCount = (graph.rollbacks || []).length;
  if (rbCount) extras.push(`回滚边 <b>${rbCount}</b>`);
  $('meta').innerHTML = [
    `节点 <b>${s.nodes}</b>`, `依赖边 <b>${s.edges}</b>`, `层级 <b>${s.layers}</b>`,
    ...extras, `解析于 <b>${esc(graph.parsed_at || '')}</b>`,
  ].join(' · ');
  const warnings = graph.warnings || [];
  showBanner(warnings.length ? '解析警告：\n' + warnings.join('\n') : '');
}

function showBanner(text) {
  const banner = $('banner');
  banner.textContent = text;
  banner.classList.toggle('hidden', !text);
}

document.addEventListener('keydown', event => {
  if (event.key !== 'Escape' || !state.selected) return;
  if (state.editing) {
    state.editing = null;
    const node = nodeById(state.selected);
    if (node) renderPanel(node);
    return;
  }
  closePanel();
});

$('panel-body').addEventListener('click', event => {
  const target = event.target.closest('[data-goto]');
  if (target) select(target.dataset.goto);
});

let toastTimer = null;
function toast(text) {
  const el = $('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

async function load(reason) {
  try {
    const resp = await fetch('/api/graph', { cache: 'no-store' });
    const graph = await resp.json();
    if (!graph.ok) {
      showBanner(`${graph.parsed_at} 解析失败（显示的是上一次成功的结果）：\n${graph.error || '未知错误'}`);
      return;
    }
    state.rootGraph = graph;
    render(currentGraph());
    if (reason) toast(reason);
  } catch (error) {
    showBanner('请求 /api/graph 失败：' + error);
  }
}

function connect() {
  const source = new EventSource('/api/events');
  source.addEventListener('open', () => {
    $('status').className = 'status live';
    $('statustext').textContent = '实时监听中';
  });
  source.addEventListener('ready', () => {
    $('status').className = 'status live';
    $('statustext').textContent = '实时监听中';
  });
  source.addEventListener('change', event => {
    const data = JSON.parse(event.data);
    const names = [...new Set((data.changed || []).map(baseName))];
    const shown = names.slice(0, 3).join('、') + (names.length > 3 ? ` 等 ${names.length} 个文件` : '');
    load(`已热更新：${shown || '文件变更'}`);
  });
  source.addEventListener('error', () => {
    $('status').className = 'status dead';
    $('statustext').textContent = '连接断开，重连中…';
  });
}

$('zoom-in').addEventListener('click', () => stepZoom(1));
$('zoom-out').addEventListener('click', () => stepZoom(-1));
$('zoom-level').addEventListener('click', () => setZoom(1));
$('canvas').addEventListener('wheel', event => {
  if (!event.ctrlKey && !event.metaKey) return;
  event.preventDefault();
  setZoom(state.zoom * (event.deltaY < 0 ? 1.1 : 1 / 1.1));
}, { passive: false });
updateZoomLabel();

window.addEventListener('resize', () => drawEdges());

// 侧面板宽度自由拖动：手柄在面板左缘，宽度记忆在元素 style 上， reopen 后保持
(function panelDrag() {
  const MIN = 320, MAX_RATIO = 0.8;
  const strip = $('panel-drag');
  const panel = $('panel');
  const body = $('body');
  let dragging = false;
  strip.addEventListener('mousedown', event => {
    dragging = true;
    document.body.classList.add('dragging');
    event.preventDefault();
  });
  window.addEventListener('mousemove', event => {
    if (!dragging) return;
    const rect = body.getBoundingClientRect();
    const width = Math.round(rect.right - event.clientX);
    const clamped = Math.min(Math.max(width, MIN), Math.round(rect.width * MAX_RATIO));
    panel.style.flexBasis = clamped + 'px';
    panel.style.width = clamped + 'px';
    requestAnimationFrame(drawEdges);
  });
  window.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    document.body.classList.remove('dragging');
    drawEdges();
  });
})();
connect();
load();
</script>
</body>
</html>
