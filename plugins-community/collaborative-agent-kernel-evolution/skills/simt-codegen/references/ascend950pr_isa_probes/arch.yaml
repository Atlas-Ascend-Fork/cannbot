  - id: close-A-durcy
    item: "'dur ~= execute cycles' (the cycle interpretation of the trace dur field)."
    status: split_2026-06-08    # cycle-COUNT half CONFIRMED (cross-oracle); absolute-CLOCK half still_UN
    why: >
      dur is a confirmed trace FIELD whose raw value is µs-scale (Chrome stores µs;
      displayTimeUnit:ns renders it). The closing_experiment was RUN 2026-06-08 (P-20,
      probes/msprof_oracle/): msprof simulation (`msprof op simulator` / msopprof, the SAME
