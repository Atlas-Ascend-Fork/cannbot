use_when: CANNBotDSL 通过精度与检视修复后的性能优化和回集成
workflow: dsl-performance
max_parallel: 1
nodes:
- id: optimize
  task_type: normal
  yaml: ../../tasks/cannbot-dsl/性能优化.yaml
  depends_on: []
  executor: ops-direct-invoke-perf-coordinator
  verifier: ops-direct-invoke-verifier
  max_retries: 0
  on_exhaust: exit
