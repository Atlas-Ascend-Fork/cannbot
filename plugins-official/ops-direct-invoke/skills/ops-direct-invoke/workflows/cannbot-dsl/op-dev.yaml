# CANNBot-DSL 完整算子开发工作流
use_when: CANNBotDSL 算子开发全流程（需求、规格、设计、TDD 实现、精度与性能验证、交付）
workflow: op-dev
max_parallel: 4
max_rollbacks: 4
nodes:
- id: create-workspace
  task_type: normal
  yaml: ../../tasks/cannbot-dsl/创建工作区.yaml
  depends_on: []
  executor: ops-direct-invoke-developer
  verifier: ops-direct-invoke-verifier
  max_retries: 1
  on_exhaust: exit
- id: environment
  task_type: normal
  yaml: ../../tasks/cannbot-dsl/环境就绪.yaml
  depends_on:
  - create-workspace
  executor: ops-direct-invoke-developer
  verifier: ops-direct-invoke-verifier
  max_retries: 2
  on_exhaust: exit
- id: requirements
  task_type: normal
  yaml: ../../tasks/cannbot-dsl/需求分析.yaml
  depends_on:
  - create-workspace
  executor: ops-direct-invoke-architect
  verifier: ops-direct-invoke-verifier
  max_retries: 2
  on_exhaust: exit
- id: spec
  task_type: normal
  yaml: ../../tasks/cannbot-dsl/规格生成.yaml
  depends_on:
  - requirements
  executor: ops-direct-invoke-architect
  verifier: ops-direct-invoke-verifier
  max_retries: 2
  on_exhaust: exit
- id: blackbox-design
  task_type: normal
  yaml: ../../tasks/cannbot-dsl/黑盒用例设计.yaml
  depends_on:
  - spec
  executor: ops-direct-invoke-architect
  verifier: ops-direct-invoke-verifier
  max_retries: 2
  on_exhaust: exit
- id: solution-design
  task_type: normal
  yaml: ../../tasks/cannbot-dsl/方案设计.yaml
  depends_on:
  - spec
  - environment
  executor: ops-direct-invoke-architect
  verifier: ops-direct-invoke-verifier
  max_retries: 2
  on_exhaust: exit
- id: implementation-gate
  task_type: normal
  yaml: ../../tasks/cannbot-dsl/实现门禁.yaml
  depends_on:
  - solution-design
  executor: ops-direct-invoke-architect
  verifier: ops-direct-invoke-verifier
  max_retries: 0
  on_exhaust: exit
- id: unit-planning
  task_type: normal
  yaml: ../../tasks/cannbot-dsl/单元任务拆分.yaml
  depends_on:
  - implementation-gate
  executor: ops-direct-invoke-architect
  verifier: ops-direct-invoke-verifier
  max_retries: 2
  on_exhaust: exit
- id: test-generator
  task_type: normal
  yaml: ../../tasks/cannbot-dsl/测试生成.yaml
  depends_on:
  - implementation-gate
  - unit-planning
  - blackbox-design
  executor: ops-direct-invoke-architect
  verifier: ops-direct-invoke-verifier
  max_retries: 2
  on_exhaust: exit
- id: implementation-loop
  task_type: subgraph
  file: .workflow/implementation-tasks.yaml
  depends_on:
  - test-generator
- id: precision-validation
  task_type: normal
  yaml: ../../tasks/cannbot-dsl/精度验证.yaml
  depends_on:
  - implementation-loop
  - blackbox-design
  - test-generator
  executor: ops-direct-invoke-developer
  verifier: ops-direct-invoke-verifier
  max_retries: 2
  on_exhaust: exit
- id: review-fix
  task_type: subgraph
  file: review-fix/workflow.yaml
  depends_on:
  - precision-validation
- id: performance
  task_type: normal
  yaml: ../../tasks/cannbot-dsl/性能优化.yaml
  depends_on:
  - review-fix
  executor: ops-direct-invoke-developer
  verifier: ops-direct-invoke-verifier
  max_retries: 3
  on_exhaust: exit
- id: documentation
  task_type: normal
  yaml: ../../tasks/cannbot-dsl/文档生成.yaml
  depends_on:
  - performance
  executor: ops-direct-invoke-developer
  verifier: ops-direct-invoke-verifier
  max_retries: 2
  on_exhaust: exit
- id: delivery
  task_type: normal
  yaml: ../../tasks/cannbot-dsl/交付.yaml
  depends_on:
  - documentation
  executor: ops-direct-invoke-developer
  verifier: ops-direct-invoke-verifier
  max_retries: 1
  on_exhaust: exit
