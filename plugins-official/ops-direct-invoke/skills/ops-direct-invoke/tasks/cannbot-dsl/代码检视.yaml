title: 可读性检视｜形成一次有证据的整改清单
goal:
- 对已验证算子形成可读性意见清单，供后续受限修复使用。
approach:
- 加载 cannbot-dsl-code-reviewer，按其文件检视的可读性规则与方法论实际阅读算子；规格和设计仅用于理解职责及排除误报，不重复验收实现子图的设计、资源或同步承诺，不要求性能采集证据。
- 在 $WORK_DIR/review-fix/review-report.md 用表格记录意见编号、规则、判定、置信度、源码位置、问题、证据及建议，必要时附真实片段；编号在后续修复中固定，置信度使用 0 至 100 的数值，零发现也明确说明。
- 对照真实源码给出分级与证据，语料外发现单独标注；不修改算子。验收本节点表示意见清单可用于整改，不表示所列问题已修复。
- 将执行记录写入 $WORK_DIR/.workflow/reports/，文件名包含节点 ID。
procedure:
- 核对逐项发现有真实行号、片段和依据，分级与置信度一致，不以规则示例代替实际源码。
- 核对报告中的编号唯一、置信度为数值，发现锚定 baseline 对应源码；本节点只验收检视结果质量，整改及功能验收由修复节点完成。
- 将验收结论与证据写入 $WORK_DIR/.workflow/reports/，文件名包含节点 ID。
acceptance:
- test -s "$WORK_DIR/review-fix/review-report.md"
out_of_scope:
- 不修改源码或冻结测试，不执行修复、设备测试或性能采集；交付真实问题清单，不将清单验收通过描述为风格问题已闭合。
