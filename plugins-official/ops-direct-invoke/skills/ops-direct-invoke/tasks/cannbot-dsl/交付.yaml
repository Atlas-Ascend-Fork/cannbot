title: 交付｜汇总最终产物
goal:
- 汇总当前算子的全部交付件与验收证据，形成可追溯交付清单。
approach:
- 读取 $WORK_DIR/perf-optimize/HANDOFF.md 与其引用的最终回集成证据，以最终源码、构建及加载身份编写文档和交付。优化前 selected.json 与 precision 报告仅作为历史来源；不引用淘汰候选或过期
  Native/AOT 产物。

- 交付源码与测试取自最终 CODE_DIR；用 `code_versions.py --work-dir "$WORK_DIR" status --bundle <交付目录>/code-history.bundle` 导出完整历史和清单，附 versioning 证据及 references/code-versions.md 中的独立恢复说明。DELIVERY.md 记录最终完整 SHA 与 bundle 摘要。
- 读取本 Skill 的 `references/code-versions.md`，按其中协议处理版本；本节点 ID 为 `delivery`（Unit 以生成节点 ID 为准）。用 `code_versions.py --work-dir "$WORK_DIR" status --node <节点ID>` 获取 CODE_DIR，WORK_DIR 始终保持为原工作流目录。
- 按已确认需求清单中的交付绝对路径，交付验收通过的源码、测试、文档、Native 产物及验证证据。
- 逐项读取上游节点的通过状态、最终文件路径、适用环境与结果证据。
- 仅使用交付目录中的文件，离开原 workflow 目录完成独立副本复跑，并保存证据。
- 在交付目录下写入 DELIVERY.md，并将相同索引保存在 `$WORK_DIR/DELIVERY.md`；列出交付件、运行、导出与复验入口、Native 产物及其验证证据、限制和未解决的非阻断事项。
- 将本节点执行过程记录写入 `$WORK_DIR/.workflow/reports/`，文件名包含节点 ID；业务产物仍写入本任务约定的位置。
procedure:
- 核对当前源码和交付产物身份与性能节点选定的最终回集成版本一致；性能报告来自 perf-optimize/run/，未引用旧 performance/performance-report.md。

- 读取本 Skill 的 `references/code-versions.md`，通过本节点 status 取得 CODE_DIR；审查提交、依赖版本、冻结输入及原始证据的一致性。发生代码写入的节点须完成协议中的 verifier 登记；不得将 checkpoint 成功视作验证或验收通过。
- 核对独立副本复跑通过，实际加载的源码、测试及辅助模块来自交付目录，交付位置及版本与需求清单和本次验收记录一致。
- 核对 `DELIVERY.md` 所列交付件均可定位到真实文件。
- 核对必需的功能、精度、性能、文档及上游验收证据齐备且相互对应；未将未通过的节点或测试描述为已通过。
- 将验收结论与证据写入 `$WORK_DIR/.workflow/reports/`，文件名包含节点 ID。
acceptance:
- test -s "$WORK_DIR/DELIVERY.md"
out_of_scope:
- 不新增实现功能，不把未通过的节点或测试描述为已通过。
