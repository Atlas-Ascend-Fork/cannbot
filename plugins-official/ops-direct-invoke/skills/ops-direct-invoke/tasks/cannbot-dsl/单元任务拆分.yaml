title: Unit 规划｜从算子设计拆分实现单元
goal:
- 将已验收的算子设计拆分为具有依赖关系、可独立验收的最小纵向实现单元。
approach:
- 将 `$WORK_DIR/design/doc/spec.yaml`、设计目录和已有实现信息提供给 `cannbot-dsl-unit-planner`；Skill 只读取这些输入并在 `$WORK_DIR/design/units/` 产出 `U01.yaml` 至 `U<n>.yaml`。
- 向规划 Skill 提供实现路径约定：公开模块为 `operators/<op>/<op>.py`；`<op>` 取 spec.op.name。每个 Unit 填写明确的允许修改文件；Unit 依赖表达能力或设计先后要求，共享写集的串行关系由实现子图生成器添加。
- 将设计中的导出入口和共享编译工厂纳入对应 Unit 的实现范围与可观察验证义务；性能目标保留在设计验证方案，由性能节点实测，不声明为只靠 TDD 验收的 performance 义务。
- 不设固定 Unit 数量，不发明设计中没有的算法、API、资源数字或测试 Case。设计缺少实现所需事实时记录缺项与来源并终止本节点，由框架处理结果。
- Unit 的 `design_sources` 记录实际设计文件与章节；具体测试输入、Case ID 和 Golden 留给测试生成节点。
- 将设计的强制承诺、允许选项和演进边界提供给规划 Skill；新增设计约束与补证须关联验证义务或明确的源码、编译产物、设备证据检查，不以描述字段代替完成判据。
- 将节点执行过程写入 `$WORK_DIR/.workflow/reports/`，文件名包含节点 ID。
procedure:
- 运行 `scripts/validate_unit_contracts.py --units-dir "$WORK_DIR/design/units"`，校验能力依赖闭包、义务 ID、设计约束与补证关联；失败时停止交接测试生成。脚本检查声明结构，不证明人工证据已通过。
- 核对每个 Unit 文件可解析，依赖无环，`requires` 能由依赖中的 `provides` 满足，首个数值 Unit 有独立端到端验收义务。
- 核对各 Unit 的设计来源真实存在且内容相关，没有固定数量假设或提前分配的测试 Case。
- 核对 supported_domain 与边界、out_of_scope 及后继覆盖一致，能力依赖与写入顺序原因明确；设计约束和补证有义务关联或带通过判据与 reject_examples 的 review_evidence，输入触发条件对应真实故障面。
- 核对 `scope.domain_constraints` 与 supported_domain 一致，按本 Unit 实际取值声明且可机器校验，并覆盖设计文档的最小合法输入；无法覆盖或与 spec 冲突时记录证据并返回设计，不靠收窄声明域或调整用例形状迁就；跨输入关系等无法表达项已列明，不以自然语言替代可执行声明。
- Unit 的 `supported_domain` / `domain_constraints` 只把 spec 节点执行记录中“支持域声明表”标为 `specified`/`derived` 的断言当作需求；`implicit` 按约定处理；`platform`/`implementation` 只作限制，不写成输入域要求；未声明的界不得自行补成具体数值。
- 核对每条强制承诺的 `review_evidence.reject_examples` 对应真实替代路线并明确判失败；只写正向存在性判据判失败。
- 将验收结论与证据写入 `$WORK_DIR/.workflow/reports/`。
acceptance:
- set -- "$WORK_DIR"/design/units/U*.yaml; for unit_file do test -s "$unit_file" || exit 1; done
- Unit 契约校验退出码为 0，记录对应本轮 Unit 文件；设计约束与补证关联无缺项。
out_of_scope:
- 不生成 Golden、白盒或 TDD Case，不编写实现，不运行设备精度或性能验证。
