task_type: normal
title: 白盒测试设计
goal:
- 依据实际代码生成白盒用例并纳入现有测试框架。
approach:
- 读取 $USER_PROMPT、$WORK_DIR/需求分析.md 和 $WORK_DIR/环境信息.md；必要输入缺失、失效或冲突时，停止依赖该输入的操作，在本阶段报告中记录阻塞证据，按 harness 原生协议结束执行。
- 必须加载 `repo-test-develop`、`repo-coding-rules` Skill，按其中的要求执行；Kirin 平台开发不加载 `repo-test-develop` 改为加载 `repo-test-develop-kirin`。
- 读取当前源码、$WORK_DIR/{{id:算子开发}}-实现记录.md、$WORK_DIR/{{id:黑盒测试设计}}-黑盒测试设计.md 和 $WORK_DIR/{{id:测试工程开发}}-测试工程说明.md，按实际代码枚举有效控制流与边界。
- 按需求允许范围生成触发用例，直接写入现有 ST 框架并接入统一入口；沿用已确认的 golden、预期错误和阈值，不另建框架、不修改算子。将全部用例文件路径赋给 whitebox_cases，多文件逐一检查。
- 运行全量黑盒与白盒用例，按已安装的 ops-direct-invoke/templates/测试执行记录.md 写入 $WORK_DIR/{{id}}-测试执行记录.md，保存原始日志与问题归属证据；按已安装的 ops-direct-invoke/templates/白盒测试设计.md
  写入 $WORK_DIR/{{id}}-白盒测试设计.md，记录源码位置/条件、用例映射、文件和执行命令。暴露的算子缺陷连同复现证据交下游修复。
procedure:
- 读取 $USER_PROMPT、$WORK_DIR/需求分析.md 和 $WORK_DIR/环境信息.md；必要输入缺失、失效或冲突时，记录阻塞证据并判定验收失败。
- 必须加载 `repo-test-develop`、`repo-coding-rules` Skill，按其中的要求执行；Kirin 平台开发不加载 `repo-test-develop` 改为加载 `repo-test-develop-kirin`。
- 读取源码、ST 框架与 $WORK_DIR/{{id}}-白盒测试设计.md，独立核对有效分支、触发用例和接入情况；给 whitebox_cases 赋实际路径，多文件逐一检查。
- 只读核对 $WORK_DIR/{{id}}-测试执行记录.md、全量黑盒与白盒原始日志及当前源码/测试哈希，区分设计覆盖、实际命中与受阻路径；不重复构建或运行用例。
- 检视本节点新增或修改的测试与脚本代码是否符合编码规则；本节点验收用例及接入质量：测试/框架错误或设计遗漏导致失败；正确用例暴露的算子缺陷须有归属证据，连同受影响覆盖交下游修复，不将节点通过表述为算子功能通过。
- 由 verifier 按已安装的 ops-direct-invoke/templates/验收报告.md 写入 $WORK_DIR/{{id}}-验收报告.md，执行 test -s "$WORK_DIR/{{id}}-验收报告.md"；通过、失败或阻塞均记录逐项结论与证据路径。重试仅追加问题处理和受影响项复核结果；当前版本缺少有效证据即失败，不补造或重跑测试。
acceptance:
- test -s "$whitebox_cases"
- test -s "$WORK_DIR/{{id}}-白盒测试设计.md"
- test -s "$WORK_DIR/{{id}}-测试执行记录.md"
- 白盒用例已进入现有框架，覆盖全部已识别的有效源码分支，测试实现符合需求、精度标准与编码规则。
- 运行记录真实、问题归属与证据完整，算子缺陷及受影响覆盖明确；无未解决的测试实现或框架接入问题。
out_of_scope:
- 改动已确认需求或放宽精度标准、以篡改 golden/用例掩盖失败、伪造确认或验证证据。
- 加载本 task 明确引用以外的 Skill、向 PM 或用户发起交互、等待其答复、派发 Agent、修改 harness 或调度状态、重置或回退其他节点。
- 将中间产物写出 $WORK_DIR，或使用不以 {{id}}- 开头的中间报告名；算子交付件按目标仓约定路径写入。
- 性能采集与优化验收、回顾与经验总结、PR、外部 CI 或合并事务。
- 修改被测算子实现；算子缺陷交下游代码修复。
- executor 编写或修改验收者报告、为等待验收报告而停止交付；verifier 重新构建、安装或运行测试、替执行者补造执行证据。
executor: ops-direct-invoke-developer
verifier: ops-direct-invoke-verifier
on_exhaust: exit
