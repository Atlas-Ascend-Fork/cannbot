# 只供 workflow-graph 展示运行时生成的子图，不传给 harness。
subgraphs:
  solution-design:
    title: 性能分组建模与 DSL 方案落稿
    workflow_file: design-opt.yaml
    summary: 有性能 case 时由 Agent 分组建模、搜索并逐组选一个共享优选方案；缺少 VF 成本时允许有界微实验。无 case 走范式设计；两条路线均输出完整 DSL 设计。
    note: selection.yaml 唯一记录路线、分组与赢家；模型失败不静默降级。DESIGN.md 定义输入分发和剩余合法域的设计默认路径，附必要的 SoC 事实。
    stages:
    - title: design · 同会话建模与落稿
      description: 同一执行者完成路线判断、分组建模、阶段自检与完整 DESIGN/soc-info 落稿，随后一次独立验收；原生重试基于现有产物恢复，不默认重跑模型。
  precision:
    title: 精度预检、修复与放行
    runtime_file: $WORK_DIR/precision/workflow.yaml
    workflow_file: precision.yaml
    summary: 先用目标设备跑白盒、黑盒及非空 performance；无失败则零修复并复用预检结果直接放行，有失败进入修复节点按 case 归因整改，修复后逐组复用当前有效完整结果，补跑缺失或失效分组，最终聚合放行。
    note: 预检只记录不判绿，判定与重试交给修复节点；最终节点仍有失败时由 harness 回退到修复节点重做（受 max_rollbacks 预算约束），修复后按当前绑定复用或补跑。失败源于冻结用例或设计时带证据终止，不改冻结资产。
    stages:
    - title: precision-check
      description: 在目标设备跑白盒、黑盒及非空 performance 各一次，逐例结果复制到 precision/precheck/，失败清单按 branch_ids、design_ref 与 unit_id 聚合写入 precheck.yaml。
    - title: precision-fix
      description: 按失败清单逐项归因；实现问题在 Unit 源码范围内修复并重跑受影响组，用例或设计冲突记录后终止；零失败只写零修复记录。
    - title: precision-final · 全量放行
      description: 逐组复用预检、实现完整 TDD、修复或本节点的当前有效完整结果，只补跑缺失或失效分组；全部适用分组通过聚合门禁后放行，失败由 harness 回退到 precision-fix。
  review-fix:
    title: 可读性检视与修复
    runtime_file: $WORK_DIR/review-fix/workflow.yaml
    workflow_file: review-fix.yaml
    summary: 保存已通过的 Git 基线与冻结 case，检视一次，修复并全量回归；验收失败按 core 预算重试，本轮功能失败先恢复基线，最后一轮验收基线托底。
    note: 固定三节点子图在主图组装时落盘。正常验收要求原全量 case 通过及置信度 ≥80 的有效意见落实；托底仅表示已恢复功能可靠的基线，整改结论仍为 FAIL。
    stages:
    - title: baseline
      description: 提交已验证实现，冻结测试资产和 case 集合，保存原始全量结果。
    - title: review
      description: 实际阅读算子，产生可读性报告及带固定 ID、置信度与真实位置的意见清单。
    - title: fix · 原生重试
      description: 修复 HIGH 意见并用 --all 验证全部 active case（含非空 performance）；验收失败由 harness 按预算重试。本轮功能失败先恢复 baseline，有预算时返回失败，最后一轮验收基线托底；性能、文档和交付统一消费验收通过的选定版本。
