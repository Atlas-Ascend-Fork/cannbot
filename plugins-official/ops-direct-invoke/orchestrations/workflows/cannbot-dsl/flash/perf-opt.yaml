use_when: Flash 工作流的可选性能优化子图：用户确认接入性能优化且存在 active performance 用例时，在 implementation 验收后调用
  ops-perf-optimize-workflow 完成优化、回集成与全量验证。挂载到 op-dev-flash.yaml 时使用 performance-optimize 节点，依赖 implementation。
