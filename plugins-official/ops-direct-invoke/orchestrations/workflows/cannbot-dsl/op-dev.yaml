# CANNBot-DSL 完整算子开发工作流
use_when: CANNBotDSL 算子开发全流程（需求、规格、设计、TDD 实现、精度验证与交付；性能优化按需挂载）
workflow: op-dev
max_parallel: 4
max_rollbacks: 4
nodes:
- id: create-workspace
  task_type: normal
  yaml: ../../tasks/cannbot-dsl/创建工作区.yaml
  depends_on: []
  executor: ops-direct-invoke-developer
  verifier: ops-direct-invoke-verifier
  max_retries: 1
  on_exhaust: exit
- id: environment
  task_type: normal
  yaml: ../../tasks/cannbot-dsl/环境就绪.yaml
  depends_on:
  - create-workspace
  executor: ops-direct-invoke-developer
  verifier: ops-direct-invoke-verifier
  max_retries: 0
  on_exhaust: exit
- id: requirements
  task_type: normal
  yaml: ../../tasks/cannbot-dsl/需求分析.yaml
  depends_on:
  - create-workspace
  executor: ops-direct-invoke-architect
  verifier: ops-direct-invoke-verifier
  max_retries: 2
  on_exhaust: exit
- id: spec
  task_type: normal
  yaml: ../../tasks/cannbot-dsl/规格生成.yaml
  depends_on:
  - requirements
  executor: ops-direct-invoke-architect
  verifier: ops-direct-invoke-verifier
  max_retries: 2
  on_exhaust: exit
- id: performance-cases
  task_type: normal
  yaml: ../../tasks/cannbot-dsl/性能用例准备.yaml
  depends_on:
  - spec
  executor: ops-direct-invoke-architect
  verifier: ops-direct-invoke-verifier
  max_retries: 2
  on_exhaust: exit
- id: blackbox-design
  task_type: normal
  yaml: ../../tasks/cannbot-dsl/黑盒用例设计.yaml
  depends_on:
  - spec
  executor: ops-direct-invoke-architect
  verifier: ops-direct-invoke-verifier
  max_retries: 2
  on_exhaust: exit
- id: solution-design
  task_type: subgraph
  template: design-opt.yaml
  file: design-opt/workflow.yaml
  depends_on:
  - performance-cases
  - spec
  - environment
- id: unit-planning
  task_type: normal
  yaml: ../../tasks/cannbot-dsl/单元任务拆分.yaml
  depends_on:
  - solution-design
  executor: ops-direct-invoke-architect
  verifier: ops-direct-invoke-verifier
  max_retries: 2
  on_exhaust: exit
- id: test-generator
  task_type: subgraph
  template: test-generation.yaml
  file: test-generation/workflow.yaml
  depends_on:
  - performance-cases
  - unit-planning
  - blackbox-design
- id: implementation
  task_type: normal
  yaml: ../../tasks/cannbot-dsl/全量实现.yaml
  depends_on:
  - test-generator
  executor: ops-direct-invoke-developer
  verifier: ops-direct-invoke-verifier
  max_retries: 3
  on_exhaust: exit
- id: precision-validation
  task_type: subgraph
  template: precision.yaml
  file: precision/workflow.yaml
  depends_on:
  - performance-cases
  - implementation
  - blackbox-design
  - test-generator
- id: review-fix
  task_type: subgraph
  template: review-fix.yaml
  file: review-fix/workflow.yaml
  depends_on:
  - precision-validation
- id: documentation
  task_type: normal
  yaml: ../../tasks/cannbot-dsl/文档生成.yaml
  depends_on:
  - review-fix
  executor: ops-direct-invoke-developer
  verifier: ops-direct-invoke-verifier
  max_retries: 2
  on_exhaust: exit
