title: 性能优化
goal:
- 在CANNBOT-DSL的Flash 工作流中,完成CANNBOT-DSL算子的性能优化任务。或完成指定CANNBOT-DSL算子的性能优化任务
approach:
- 从 $USER_PROMPT、$WORK_DIR/design/doc/ 下的 spec.yaml、REQUIREMENTS.md、DESIGN.md、$WORK_DIR/environment/ 下的 environment.yaml、env_selected_soc.yaml、soc-info.yaml 及已验收上游交付件接入算子代码及版本、Golden及测试入口、编译构建工程、blackbox/whitebox/performance 全量用例与判定标准、环境、性能目标及修改授权。
- 性能目标分两种处理：用户已给出时逐项沿用其目标、适用 case 与判定口径，不改写、不放宽、不补造阈值；未给出时不得自行假定或套用默认目标，将缺口报告给 PM，由需求对齐阶段按集中问卷补齐，未获用户明确答复前保持阻塞、不启动优化。
- 首次输出目录为 $WORK_DIR/性能优化/；续跑时接入任务 prompt 指定的已有请求、恢复点及获准续写的运行目录。
- 必须加载 `ops-perf-optimize-workflow` Skill，按其中的要求执行。
- 将最终实现、性能结果、Flash 工作流全量用例验证记录及恢复入口的路径汇总至 $WORK_DIR/性能优化交接.md。
procedure:
- 读取需求、环境及性能优化交接，核对采用的性能目标与用户答复一致：已给出时逐项对应，未给出时须有问卷答复依据；按 blackbox、whitebox、performance 全量用例及判定标准核对最终版本的逐例原始结果，确认全部执行通过；流程未完成、用例跳过、结果失败、目标缺失或证据不足时不通过。
- 读取 $WORK_DIR/.workflow/sessions/ 下本节点 execute 阶段的 session 存档（文件名以本节点任务 ID 开头，形如 <task_id>.execute.<时间戳>.jsonl；子图节点在同名子目录），在验收报告中记录实际读取的存档文件名与时间，并核对执行者声明与实际执行过程一致。
- 将结论、证据路径及上述 session 记录写入 $WORK_DIR/性能优化验收报告.md，并执行 test -s "$WORK_DIR/性能优化验收报告.md"。
acceptance:
- 'test -s "$WORK_DIR/性能优化交接.md"'
out_of_scope:
- 未经授权修改 Flash 工作流的规格、设计、Golden、runner、测试用例、判定标准或写出约定范围。
context:
  execute:
    skills:
    - ops-perf-optimize-workflow
  verify:
    skills:
    - ops-direct-invoke-doc-templates
