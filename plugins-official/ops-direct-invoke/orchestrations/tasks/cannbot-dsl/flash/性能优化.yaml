title: 性能优化
goal:
- 在单个性能节点内冻结对照、按授权预算探索并选择最终正确实现，保留完整比较与验收证据。
approach:
- 读取 `$OPS_DIRECT_INVOKE_ROOT/docs/code-versions.md`，以 `optimize` 查询版本状态并取得真实 CODE_DIR；核对 implementation 的原始通过记录、已验收版本、测试、原用户性能场景、目标、比较协议、采用条件及预算来源；缺测量场景或必要预算时明确阻断，不造默认用例。
- 运行固定 runner 前将 `CANNBOTDSL_CASE_CACHE_DIR` 设为 `$WORK_DIR/case-cache/performance-optimize`，缓存放在代码仓外；`--input` 显式枚举所需设计和全部测试源，不包含结果和缓存。
- Flash 本节点覆盖版本协议参考文档中的旧性能写集：允许与 implementation 相同的明确生产源码路径及必要的 `scripts/performance` 采集脚本，begin 的 `--allow` 逐项列出，不放大至 operators 目录；测试、Golden 和设计保持冻结。
- 不可改写地冻结原控制的源码、测试、提交和协议；interleaved 尚无候选时只冻结对照并等待配对，不伪造控制样本。
- 登记假设、候选身份及父版本、有限尝试、停止条件和预算，预留最终回归；失败、超时、编译失败和复评均按原合同计账，不换名清零。
- 每轮启动候选探索前，先在 `opt/candidates.yaml` 登记新候选、在 `opt/iteration.yaml` 将新轮次记为 planned，运行 `"$PYTHON" "$OPS_DIRECT_INVOKE_ROOT/tools/flash_backend_checks.py" budget --contract "$WORK_DIR/contract/perf-contract.yaml" --next-rounds 1`；脚本自动读取现有两份台账，恢复已开始轮次时改用 `--next-rounds 0`。检查通过后才标记 started 并探索；失败、重试和中断不清零。该机器检查只约束候选和轮次；没有已确认模型评价上限时不启动多阶段 OpModel 搜索，改用有限候选的直接证据与实测。
- 在真实 CODE_DIR 串行生成并 checkpoint 候选；诊断子集可提前淘汰错误，但正式计时和排名前必须通过当前版本完整功能集合。
- 使用冻结协议及已有真实测量能力采样，保留顺序和所有样本；正确性 runner 不是计时器。缺少正式测量能力报告 BLOCKED_ENV，不造旁路。
- 按停止条件选候选或获授权保留原控制，恢复或回写真实代码仓并记录当前 HEAD 和加载路径；最终版本须有完整当前正确性、必要构建加载及设计符合证据。
- 在 `$WORK_DIR/opt/report.md` 保存原控制、预算账目、候选、决定、停止原因、目标结果及局限；通过 code_versions verify 归档最终完整正确性结果，由验收者独立核对并按原协议登记证据。硬目标未达不能宣称完成。
procedure:
- 读取 `$OPS_DIRECT_INVOKE_ROOT/docs/code-versions.md`，以 `optimize` 执行 code_versions status，取得并使用返回的真实 CODE_DIR；执行检查时同样将 `CANNBOTDSL_CASE_CACHE_DIR` 设为 `$WORK_DIR/case-cache/performance-optimize`，核对冻结输入不含结果和缓存。核验全部必要证据成功后按协议执行 verify --accept 登记本轮成功证据。
- 按 Flash 本节点写集核对 begin 的 `--allow`：仅 implementation 的明确生产源码路径及必要 `scripts/performance` 采集脚本，测试、Golden 和设计不得改动；本节点写集覆盖版本协议参考文档的旧性能写集。
- 核对 budget 命令的累计候选与已启动轮次来自当前台账，仍满足原契约上限；同一轮不得因新反馈追加未预登记的模型搜索阶段。
- 检查原控制不变、预算与失败账目、同口径比较、最终选择和三类证据；内部基线没有单独验收，须由本节点验收。
acceptance:
- 'test -s "$CODE_DIR/operators/<op>/<op>.py"'
- 'test -s "$WORK_DIR/opt/report.md"'
out_of_scope:
- 不改控制、冻结测试或阈值，不增预算、切换设备或重开流程，不生成额外性能子节点及独立回归、检视或文档节点。
context:
  execute:
    skills: [cannbot-dsl-best-practice, cannbot-dsl-test-generator, ops-theoretical-performance-estimation]
  verify:
    skills: [cannbot-dsl-best-practice, cannbot-dsl-test-generator, ops-theoretical-performance-estimation]
