title: 实现与自检
goal:
- 交付满足规格与设计的当前实现及完整数值、构建加载和设计符合证据。
approach:
- 检查集成原始裁决、测试源身份和当前环境；测试资产有问题时停止并交回集成，不能重造参考。测试源以 WORK_DIR 中集成任务实际冻结并交付的版本为准。
- Flash 生产源码统一写入 WORK_DIR/operators/<op>/；公开入口固定为 WORK_DIR/operators/<op>/<op>.py。不得把正式源码写入 CODE_DIR 或其他临时目录；缓存、日志和运行结果放在 WORK_DIR 的独立目录。
- 开启精确生产文件写集的代码 attempt，`--input` 显式枚举设计和全部测试源，不包含结果和缓存，不放开整个算子目录，也不创建同仓 live dependency。运行固定 runner 前将 `CANNBOTDSL_CASE_CACHE_DIR` 设为 `$WORK_DIR/case-cache/implementation`，缓存放在代码仓外。
- 首次实现前读取 `$DOC_TEMPLATES_DIR/templates/DSL实现结构参考.md`，从本轮已提供的 `$WORK_DIR/cannbot-dsl/samples/` 按运算类型、数据流和接口用法找一两个最贴近的样例，先看 README 再看源码；快照缺失时沿环境报告定位有效参考，不因此重拉或切换版本。核对公开入口、Host、Kernel 与编译函数的结构，按 `docs/zh/api/` 定向查本轮实际使用的接口，复用同版本依据。无同型样例时明确记录差异，仅借鉴结构；只对未决能力用实际候选的必要编译或现有用例验证，不逐功能重复造探针。记录实际参考路径与借鉴点，不照搬样例算法和参数。 参考限于 API 用法和代码结构；依据当前规格与设计自行实现，不照搬样例实现。
- 实现前一次核对已验收 DESIGN 和 selection 中影响正确性及明确结构约束的要求，重点包括数值链、支持域、容量、缓冲生命周期和同步；报告仅记录实际冲突、偏离或仍需编译/设备确认的能力，不逐条抄录已遵循的设计条款。普通实现细节不升格为设计硬项。
- 按规格和设计实现，可用现有黑盒、白盒及 performance 正确性用例诊断；保留原失败和真实命令，按根因修复，同条件无变化不重复昂贵执行。
- 执行者自检：默认要求最终交付只有一个实际可执行 kernel；仅当 DESIGN 明确声明需要多 kernel、阶段职责、依赖/同步关系及理由时，才允许多 kernel。先从 kernel 定义、实例化及调用关系核对；动态生成或源码无法确定数量时再读已有编译 manifest/导出信息，不以公开函数数量代替，也不为此例行追加构建。未获 DESIGN 明确允许的多 kernel 直接阻断。
- 每次为修复编译、精度或性能问题而改变上述结构前，先对照相关设计条款、模型采用的配置和容量依据；改动后立即核对实际源码及受影响的条款，并用已有适用小用例或编译证据定向验证。若正确性修复只能通过偏离强制设计条款实现，保留原失败和可行候选，先报告具体冲突并按原协议交方案节点裁决；本节点不得自行把偏差当作已满足设计，也不因该冲突重造测试或放宽精度。
- 完整设备回归前先解决源码、编译或已有证据已揭示的实际冲突，报告只记录冲突的处理结果及仍待设备确认的项目。静态可见的偏差先修复或报告设计级阻断，不等完整 --all 跑完才发现结构不符；既有定向结果不替代最终完整回归。
- 当前候选 checkpoint 后，直接读取 code_versions status --node implementation 的 head、changes、attempts、accepted 与 stale_accepted；核对当前源码 SHA、冻结的设计和测试输入、设备与环境、固定 runner 的完整 --all 命令及原始 evidence。只有身份一致且 valid、exit_code=0 的完整设备结果可复用；同一身份已有完整失败记录时先用其日志诊断并修复，不原样重复全量上板。
- 身份变化、没有完整原始结果，或针对失败完成实际修复后，在候选稳定时以 code_versions verify 执行固定 runner 的完整 --all 设备正确性；同一身份的失败结果未产生新诊断或修改时不得原样重跑；局部诊断不能拼接代替全量。复用与新运行均记录真实加载模块和设备属性，并关闭布局、状态和副作用专项义务。
- 根据实际交付方式提供当前版本的构建和加载证据；未明确要求 AOT 时，固定 runner 中实际使用的当前 JIT 构建与加载记录即可，不额外生成或验收 AOT。明确交付 AOT 时才核对该产物与当前源码的对应及真实加载，JIT 结果不能替代过期 AOT。报告引用已有命令、源码位置和原始证据即可，不另造逐项审计表。
- 新运行以 code_versions verify 归档完整原始结果；复用旧成功结果时在 `$WORK_DIR/implementation/report.md` 记录当前源码版本、冻结输入、设备、命令、原 attempt 和 evidence ID。验收者独立核对数值、构建加载和设计符合后按原协议登记证据；源码变化默认重新验证，不能以注释或 AST 等价自免。
procedure:
- '读取测试集成报告，运行一次 `"$PYTHON" "$OPS_DIRECT_INVOKE_ROOT/tools/flash_review_summary.py" --work-dir "$WORK_DIR" --node implementation --device <目标设备>`，集中取得 WORK_DIR 实际交付的源码/测试身份、受管版本、已有运行和逐 Case 异常；汇总只定位差异，不替代语义裁决，核对冻结输入不含结果和缓存。必要补跑仍使用仓外缓存。新运行成功时用本次 attempt 和 evidence ID 执行 verify --accept；复用旧成功结果时用原 attempt 和 evidence ID 执行 verify --accept。两者均由 code_versions 复核当前源码和冻结输入，失败证据不能接受。'
- 结合相关源码复核报告中的实际冲突、结构性修复和待证能力是否已解决；编译或设备验证按到期时机判断，不要求逐条设计符合表，不因缺少额外探针或重复报告拒收。
- 核对设计交接的编译/设备事项已在约定消费点前闭环，并能回指 DESIGN 的权威定义与实际执行证据；到期仍待证或反例未解决时失败，最小路径通过不替代最终完整回归。
- 独立验收者复核当前源码/测试身份和完整设备结果；默认实际 kernel 数量必须为 1；若超过 1，必须在 DESIGN 中找到明确的多 kernel 许可、阶段、依赖/同步和理由，否则判失败。数量核对沿用上述源码优先方式，已有证据足够时不重复取证；复用完整运行后只检查尚未解决的实质缺口。
- 核对影响正确性的支持域、调用契约、容量、同步和明确设计约束；数值、构建与加载优先共同引用当前固定 runner 的有效记录，已有原始证据足以回答的问题不再追加探针。仅对有具体依据、会影响交付的缺口做定向补查，一次收齐问题；修复只复核受影响部分，代码身份变化后沿用现有回归要求。
acceptance:
- 'test -s "$WORK_DIR/operators/<op>/<op>.py"'
- 'test -s "$WORK_DIR/implementation/report.md"'
out_of_scope:
- 不改已验收测试、Golden、阈值或上游契约，不缩域，不补造 Unit、TDD、独立检视、文档或交付产物。
- 不比较多次构建的二进制字节差、不以缓存时间戳推定来源，也不为报告行号、措辞或历史日志归档描述编写审计脚本、重跑当前正确实现。当前源码/输入身份不匹配、实际加载来源不明和当前必要原始结果缺失仍须解决；历史失败记录缺失如实注明，不补造记录。
context:
  execute:
    skills: [cannbot-dsl-best-practice, cannbot-dsl-test-generator]
  verify:
    skills: [cannbot-dsl-best-practice, cannbot-dsl-test-generator]
