title: 测试准备｜Unit TDD 用例草拟
goal:
- 按 Unit 义务设计输入合法、特征可触发且判别范围有依据的 TDD 标准行；本阶段不判定目标实现或设计路线的精度通过。
approach:
- 按本轮固定插件资源的 `$DOC_TEMPLATES_DIR/templates/测试生成子图.md` 核对本义务的真实输入、必要触发及判据，只推导会影响这些结论的参数；必要依据在 tdd-evidence.md 保留一份，condition/note 只写必要摘要和引用，不复抄逐块参数全集、误差值或位级结论。不以标签或取样值证明整行覆盖，不等待尚未产生的并行产物。
- 按本轮固定插件资源的 `$DOC_TEMPLATES_DIR/templates/节点资料与报告.md`，围绕本节点职责读取必要资料并引用原始证据，避免重复调查和报告全文抄写；保留本任务要求的实际执行与独立审查。
- 读取已安装 ops-direct-invoke 的 $DOC_TEMPLATES_DIR/templates/测试生成子图.md 中本节点适用的方法与证据约定，不调用 PM 入口；<op> 取 design/doc/spec.yaml 的 op.name。直接消费已验收规格、需求、DESIGN、selection、Unit、环境与已有
  blackbox/performance，不重新决定已冻结语义。
- 使用环境记录中的 "$PYTHON" 执行 "$WORK_DIR/scripts/validate_unit_contracts.py" --units-dir "$WORK_DIR/design/units"，保留命令和退出码；冻结 Unit 契约不合法时阻塞，不在本节点修订。 使用选定 "$PYTHON" 和已安装 cannbot-dsl-test-generator 的实际脚本绝对路径执行公开只读命令 scripts/build_tdd_cases.py --check-unit-contracts --units-dir "$WORK_DIR/design/units"，保留命令与退出码；该模式不需要 spec、DESIGN、CSV、Golden 或设备，与正式入口共用校验，只确认 Unit 接收契约，不代表用例绑定和触发已通过。 上游 Unit 内容、实际接收契约及选定解释器均未变且证据有效的预检可引用，但实际遇到不兼容或绑定失败时必须当前阻断；不能省略冻结条件或以“仅草稿”放行。
- 加载测试生成 Skill 的 Unit TDD 与证据契约，按其中“选例与成本”在保留必要覆盖和判别力的前提下选例；按 native Unit 依赖阅读验证义务，设计真实输入和断言，CSV unit_id 使用 Skill 约定的小写，义务 ID 与原义务一致。
- 按共享模板“Unit 义务与本阶段边界”将当前公开输入和可观察结果能够判定的义务落实为真实用例，记录判别声明的实际输入、派生触发、断言依据及拟关联设计来源。原 Unit 明确交由后续 review_evidence 的要求保留原责任及时机，不伪造 TDD 或提前宣称通过；使用中发现冻结义务自身与声明域、观察量或判据冲突时提交具体缺口，不以报告解释、其他 Unit 的证据或另有审查安排自行豁免。只处理当前落用例时实际遇到的问题，不重做上游设计或全部 Unit 的验收。
- 只写 test-generation/tdd-rows.json（公开分组写入入口的标准 JSON 行数组）及 tdd-evidence.md。不等待 Golden 或白盒；尚未确定的白盒关联保留设计引用与待核对依据，不编造
  branch ID，不丢弃必要覆盖。
- 按共享模板“判别力实验的证据前提”自检原义务、合法输入、必要触发、断言与声明的判别范围；通过公开配方定义及不依赖并行产物的局部检查确认必要特征，不逐项模拟完整算法或证明设计精度可行性。不得读取、导入或等待并行 Golden/runner，即使其文件已经出现或分支先通过也不改变本节点输入边界。已有数值模拟只按实际对象、范围和局限记录为风险线索，不视为目标执行或单独据此否决草稿；参考数值链交 Golden，三路资产兼容性交集成，真实目标精度交实现与精度阶段。结构承诺仍沿原 review_evidence 保留，不用风险交接豁免用例非法、触发不可达或判别声明无依据。
- 发现上游冲突、工具或环境缺口时保留事实、最小证据、影响及建议责任阶段，按既有阻塞交接协议结束；同条件重试只做最小复核，不越权修订上游。
procedure:
- 按本轮固定插件资源的 `$DOC_TEMPLATES_DIR/templates/测试生成子图.md` 独立核对原义务、实际输入、必要派生触发与判据，以及多调用/分块中会改变结论的部分；按同一最小证据与裁决边界审查，不新增逐块参数表、误差清单、位级结论或注入数量门槛。报告或自检通过不代替原始依据；只审当前草稿，不要求提前写正式 CSV 或运行后续完整校验。
- 按本轮固定插件资源的 `$DOC_TEMPLATES_DIR/templates/节点资料与报告.md`，围绕本节点职责读取必要资料并引用原始证据，避免重复调查和报告全文抄写；保留本任务要求的实际执行与独立审查。
- 核对本节点实际输入版本、允许写入范围、原始命令/退出码和证据，不能只接受自述；不代跑整批测试，不替执行者补证据。
- 按共享模板“Unit 义务与本阶段边界”独立核对草稿的义务归属、真实输入、派生触发和断言是否支持所声称的判别能力，并按测试生成 Skill 证据契约的“选例与成本”核对选例取舍；绑定 ID 或路径覆盖不能代替必要子项的依据。联查 Unit 证据安排及未解决缺口，未把专项证据换成普通数值/shape/设备归属断言，也未自行豁免冻结义务。后续证据保留原责任和时机，尚未绑定白盒或未来目标代码尚未实现不单独构成本阶段失败；当前 TDD 不可生成及上游安排缺口按原协议交接，不替上游完成验收。草稿通过不代表完整 TDD 校验或专项补证已通过。 明确区分用例契约无法消费与尚未验证的实现数值风险：不支持的谓词、互斥触发条件、无法绑定的冻结条件或无依据的必要判别声明仍 fail 并交接；自写算法模拟超限不等于正式入口不兼容或真实目标失败，不能单独据此阻断草稿。不得调用并行 Golden/runner 提前代判；参考职责及数值链疑点按原记录交 Golden/负责阶段，跨分支兼容性由集成核对，真实目标精度沿原正式测试。
- 按同一阶段边界审查现有局部检查及判别依据，不替作者新增算法模拟、调用并行产物或重跑实验。正常对照、触发或观察范围不足时撤回不成立的检出声明并核对原义务是否仍有足够依据，不将模拟器失败升级为设计或目标失败。用例合法性、可构造性、触发、必要判别范围及绑定缺口仍须关闭；非必要精确值和冗余统计可修正或删除，不另加门槛。
- 核对只写本分支草稿与证据，不要求提前运行依赖 Golden 和白盒的 build_tdd_cases.py。
acceptance:
- test -s "$WORK_DIR/test-generation/tdd-rows.json"
- test -s "$WORK_DIR/test-generation/tdd-evidence.md"
out_of_scope:
- 不派发其他 Agent、启动子工作流或修改调度状态、已启动 YAML；调度仅由当前 harness 子图承担。
- 不创建或修改本轮 scripts/ 中的固定工作流工具，不修改外部 Skill、生产算子、冻结 spec/DESIGN/Unit、performance 行、环境或精度标准。
- 不删除用例、改为 excluded、缩小真实输入或放宽断言换取通过；未验证事项如实记录。
- 不写 Golden、固定 runner、正式 CSV 或白盒暂存行，不以未绑定 ID 逃避关联校验。
context:
  execute:
    skills:
    - cannbot-dsl-test-generator
  verify:
    skills:
    - cannbot-dsl-test-generator
