title: 方案设计｜同会话建模选型与完整落稿
goal:
- 由同一执行者连续完成路线判断、必要建模和完整设计，为后续测试与实现提供覆盖完整规格支持域、面向性能且证据一致的交付。
approach:
- 本节点由同一执行者在同一次执行会话内连续完成路线判断、建模选型、阶段自检、设计落稿及整体自检，不派发建模或落稿子 Agent，不把阶段自检当作独立验收。全部交付完成后交独立 verifier；原生重试可能创建新会话，不承诺跨重试保留会话上下文。建模、搜索、模型资格与阶段自检要求仅适用于 model_groups 路线；无 active 性能 case 时写 paradigm selection，跳过这些要求并直接按范式落稿，两条路线均完成 DESIGN、soc-info 和最终自检。
- 完整搜索输出、失败记录和中间候选留在原始文件中，当前会话优先读取决定本次选择的摘要和必要片段，不反复打印整批记录。每阶段及时更新已有交付和节点执行报告，简记当前采用方案、关键证据位置、未解决项及下一步；不新增摘要文件或台账。宿主发生上下文压缩或原生重试时据实际产物恢复，不假定历史上下文仍完整，不固定 token 阈值或依赖未公开的会话控制接口。
- 恢复先读验收反馈（若有）、当前 selection、DESIGN、soc-info 及本节点执行报告，确认版本、内容身份和实际缺项，再按需读取原始依据。建模未完成时复用身份匹配的有效单例，只补缺失或失效部分；建模已完成而落稿未完成时核对阶段结论与证据身份后继续落稿，不重验或重跑整个搜索。仅表达、引用或报告变化时复用有效模型和回读；实际改变结构、参数、数据通路、槽数、同步或成本时，沿影响范围更新模型、selection、DESIGN 及失效证据，必要时局部重评，不扩大用户授权或设备实验。不存在的产物/历史检查点如实说明，不补造；必要交付无法完成则按原协议失败并保留已有成果，不以骨架或局部分数凑通过。
- 按本轮固定插件资源的 `$DOC_TEMPLATES_DIR/templates/节点资料与报告.md`，围绕本节点职责读取必要资料并引用原始证据，避免重复调查和报告全文抄写；保留本任务要求的实际执行与独立审查。
- 读取 `$WORK_DIR/design/doc/spec.yaml`、`$WORK_DIR/design/doc/REQUIREMENTS.md`、`$WORK_DIR/environment/environment.yaml`、`$WORK_DIR/environment/env_selected_soc.yaml`、`$WORK_DIR/operators/<op>/test/testcase.csv`（`<op>` 取 spec.op.name）及环境节点报告中的解释器、CANN/DSL 版本和 API 资料路径（默认文档索引为 $WORK_DIR/cannbot-dsl/docs/zh/api/index.md，优先沿用环境报告确认的实际路径，按当前方案定向查阅；文档或样例签名与选定 Python 实际加载的 DSL 不一致时，以该安装版本的公开签名为准）；参考源码与 `contract/perf-contract.yaml` 若存在则使用，用户意图以 `$USER_PROMPT` 及其附件来源为补充。按已验收环境结论仅在 `PASS/full` 下执行；直接消费已验收输入，使用中发现缺项或冲突时记录并停止。
- 读取冻结规格、需求、已验收环境和性能 case 后，按 $DOC_TEMPLATES_DIR/templates/设计落稿核对.md 的“先确定规则，再展开说明”区分性能评价范围与完整规格支持域，在现有 DESIGN 章节中落盘已知规则及 soc-info 事实。扩大昂贵搜索或长文展开前，先核对当前候选决定方案的索引/分块映射、物理分配或别名、生产消费与复用关系及槽数/容量推导；接入和必要建模可用于确定关系，不要求提前选定最终参数或新增门禁。规则变化后先更新受影响定义再继续比较。草稿不算完成，分批补齐实际选型后的最终承诺；扩读针对具体缺口，不等长文一次性输出。
- '写 `$WORK_DIR/design/selection.yaml`：固定 `version: 1`；performance 无 active 行时设 `route: paradigm`、`reason` 说明未提供 case、`groups: []`，不检查模型运行时、不启动搜索或 VF 实验。有 active 行时必须设 `route: model_groups`，不得因运行时或成本缺失静默降级。'
- '模型路线的 selection 包含 `context` 文件路径及非空 `groups`；每组包含唯一 `id`（字母或数字开头，仅字母、数字、下划线或连字符）、非空 `case_ids`、字符串 `rationale/applicability/objective/budget` 和 `winner`。winner 包含 `candidate`、`qualified: true`、文件路径 `config/search_evidence/replay_evidence/qualification_evidence`、非空文件路径列表 `artifacts/cost_evidence`，以及文件路径列表 `vf_evidence`（无 VF 时可为空并在资格记录说明）。context 位于 design/model/，每组文件位于 design/model/<id>/；所有路径相对 WORK_DIR 并指向真实非空文件。沿用原生记录并索引，字段齐全不证明搜索质量或成本资格。'
- 有性能 case 时先整理全部 active case 的 ID、来源与实际输入，再根据算法路径、dtype、layout、任务几何与资源约束划组；每个 case 恰属一组，说明分组理由和可由真实输入判定的适用域。不默认只取首条或一条一组；同一计算结构优先共用参数化模型，结构或资源策略不同才拆模型族。按 $DOC_TEMPLATES_DIR/templates/设计落稿核对.md 的“性能导向与候选形成”确定设计目标及有意义的结构/参数候选，不因关闭后续调优仅以正确或容量可行为选型目标。逐组在搜索前记录共同目标、已确认的 case 权重与约束、代表集评分办法及结论范围、资格筛选、适用的同分及不确定性处理办法、搜索及 VF 实验预算与停止条件。执行者负责按原单位管理累计消耗、在途预留和停止条件；区分自行制定的搜索计划与用户明确的资源、时限及授权上限，后者不得自行放宽。自行计划调整或超支时沿既有记录如实说明原因、实际范围和未完成项，不把事后调整冒充预先计划；不为补齐计划强行新增阈值，不更改用户评测口径或虚构性能门槛。
- 仅模型路线加载 `ops-theoretical-performance-estimation` 并读取其 ops-opmodel-toolkit/SKILL.md，按 $DOC_TEMPLATES_DIR/templates/OpModel接入.md 核对已确认 "$PYTHON" 中的实际 wheel 版本、加载位置与本次接口；设置 OPMODEL_SKILL_DIR 和本轮 OPMODEL_WORKSPACE，按 references/new-operator.md、perf-eval.md 及 agent-dag-opt/search-integration.md 的当前公开契约建立或复用用户模型；模型交付按 toolkit 核对 SEMANTICS.md、SPEC.md 与 README.md，保留完整输出/状态/模式及复现范围，不替代冻结算子规格。依赖缺失或版本不兼容时记录阻塞，不安装或更换环境。开发语言为 dsl，目标硬件绑定实际 SKU，新硬件/profile 须保留物理来源。
- 按 toolkit 公开 YAML/hooks 契约在用户工作区编辑模型和实验，完整 case 与搜索会话不放系统 /tmp，不在 Skill/wheel 安装目录写入模型或修改通用框架。将完整定义、case、配置、hooks 及复现资产归档到 $WORK_DIR/design/model/<group-id>/；context 记录规格/用户来源、解释器/CANN/DSL、toolkit 来源与 wheel 实际版本/加载位置、模型和硬件/成本内容身份及归档后复现命令。已有模型缺失能力无法在授权适配内解决时记录并停止。
- 模型路线对全部 active performance case 做轻量覆盖检查，从实际输入核对路径、参数适用域、分块/分发边界及可推导资源特征，不为取得逐 case 记录默认运行完整模型。昂贵的候选探索、比较与最终配置回读以代表集为主，代表仅从原 case 中选取，综合覆盖不同成本路径/资源策略、分块或分发变化的边界、尾块/非整除、容量或负载紧张点及常规分布；dtype/layout 仅在改变成本或约束时独立覆盖，不机械枚举或生成新 case。一条 case 可承担多个角色；等价特征可合并，无法说明覆盖关系的差异保留并按缺口扩充，不强行压缩，也不因尚未仿真就自动扩成全量。
- 逐组在评分前沿用既有计划/搜索证据与执行报告记录代表 case、选择理由、覆盖对象和限制，以及候选保留依据、扩充条件和本阶段预算/停止条件，不新增 selection 字段、独立台账或固定代表数。可先以有理由的接入 case 跑通参数化模型，再以代表集探索和选型；对实际评价的 case 从真实输入重推任务数、分核/最重核负载、指令/搬运量、有效 tile 与容量，核对候选参数确实生效，不把接入几何写死。模型内部多 group/task 不代替用户 case 覆盖；候选空间变化时复核代表集适用性。代表集评分与全组用户目标及权重的关系须有依据，不按代表数擅改用户权重，不把未评价 case 记零、补造结果或声称已完成全组性能评价；无法证明的性能外推如实限定。
- 按 $DOC_TEMPLATES_DIR/templates/OpModel接入.md 的“分层筛选与评价范围”逐组组织轻量过滤、粗筛、缺口补筛及入围精评，搜索可表达的结构与参数；实际涉及局部评分或显式 Vec/VF 搜索时，按接入资料的“模型比较与搜索边界”核对入口、真实覆盖与复评范围；沿既有计划/搜索记录在评分前明确各阶段候选与 case 范围、保留规则、原预算及停止条件，不固定粗筛数量或 Top-K，不默认全部候选先跑完整代表集。保留声明空间、固定维度及理由、实际评分候选、淘汰或暂缓依据、预算未覆盖部分和分阶段排名。参与同一阶段比较的候选使用相同 case 集与成本/评分口径，粗筛分数不冒充完整代表集结论；证实违反语义、容量或依赖约束可淘汰，模型执行失败或证据不足记为未决，不伪装为性能差。未决成本仍遵守原资格规则，不能进入有效排名。代表集排名须结合全组轻量覆盖及完整资格证据才能形成组方案，不将其声称为全组或全空间最优。
- 离线模型评价按 $DOC_TEMPLATES_DIR/templates/OpModel接入.md 的“有界并行与统一汇总”组织本轮允许的执行适配，独立配置且资源允许时优先有界并行，组间共用节点并发额度，执行者分别管理原组/阶段预算及其有据调整；沿既有计划、搜索证据和日志保留实际范围、并发与预算依据及结果，按原单位预留/结算，区分尝试与逻辑覆盖、单例复用与整批重算。代表集、必要补证、全组轻量覆盖、完整资格和最终配置回读沿原要求，不扩大搜索、环境或设备实验授权。
- 在预算内保留综合目标较好、在某类代表场景有明确优势且在已比较范围内未被全面压过、以及差异处于有依据的模型不确定性范围内的竞争候选，不机械只留代表集第一名或固定数量。区分候选规则、各 case 的实际生效配置和评价结果；在输入、模型、硬件及成本等评估身份一致且实际生效配置及预测行为等价时，可有据合并评价并复用结果，不凭参数名或相近总分判等。沿既有搜索证据或原生记录保留每个被合并候选到对应 case 结果的关联和等价依据；某个 case 上等价不代表其他 case 或全组等价，不得因去重删除其余比较关系，不新增 selection 字段或固定记录格式。不发明不确定性阈值，未知成本不能借“保留竞争”成为有效评分。精评时入围候选在完整当前代表集及有据增加的必要场景上同口径交叉比较，记录实际评价范围、有效配置、资格、逐 case 原始结果、汇总和退化；不默认追加候选与全部 case 的交叉仿真。未建模 case 的性能未确认，不据此认定性能差或自动产生全量仿真义务；已确认的逐 case 性能约束仍须有足够依据，不能以采样豁免。必要比较或资格证据在预算内无法完成时保留缺口并按原协议报告未完成。
- 全组轻量覆盖检查、代表集比较或已有证据暴露新的路径/几何边界、资源或调度行为、无法证明的容量边界，或影响筛选的退化/排名差异时，从原 case 中补入能揭示缺口者，并复查受影响的已筛候选是否需恢复；不只增加 case 而沿用失效淘汰结论。完整代表集扩充后，参与同一阶段比较的候选按更新后的同一 case 范围评分，精评覆盖完整扩充代表集；复用有效组合，只补缺失或失效组合，不直接排序不同覆盖范围的分数。单纯尚未仿真、无关名次交换、已有代表能解释的差异或提高报告覆盖率不构成扩充理由。扩充、必要的额外或全量评价均须对应具体缺口或已确认约束，由执行者结合适用预算说明必要范围与停止条件，不默认整批重跑。覆盖或本阶段必要资格无法成立时报告未完成；未计算的非必需性能结果如实限定，不伪装成已验证，也不单独阻断代表集选型。
- 依据代表集同口径比较、全组轻量覆盖和完整资格证据，按预定共同目标选择一个共享方案，可含合法的输入参数公式；某 case 违反语义、容量或依赖约束，或本阶段必要资格未闭合时，候选不能成为覆盖全组的合格赢家。确需不同结构时说明证据，调整分组与输入适用域，记录变化并重新比较受影响部分，不通过拆组或事后改权重掩盖退化。导出赢家后，以 selection 引用的最终配置及依赖资产为起点，对当前代表集和必要补证场景实际重新加载、恢复生效配置并复评，不以搜索内存参数、另写公式或旧赢家代替回读，不默认要求全部组内 case 再回放。全组各 case 的参数适用性和资格仍须有依据，不能逐 case 挑不同赢家伪装成组方案。同步实际评价范围、生效配置、原始结果、汇总、资格、引用及复现入口；未实评输入不写成已有性能预测，不以代表集成绩声称全组性能达标或最优。保留历史阶段和方案身份；变更时优先核对原 case 中能体现变更的场景，必要时扩充，不能只凭新旧配置相同的 case 证明其他 case 的回读。沿用有据等价复用规则，记录实际加载、参数恢复入口和原始结果关联，只补缺失或失效部分。比较和回读证据由 selection 既有 search_evidence、replay_evidence 等字段引用，不新增索引格式或复制原生台账。
- 在同一评价范围和口径内，最终采用方案与原规则下的搜索第一名不一致时，在 selection 现有 objective/rationale 等说明及既有证据引用中写明原排名、采用方案、偏离理由和决定性证据；区分原始性能排名、资格筛选与最终裁决，不将代表集扩充或实际评价范围变化后的排名变化误记为同范围规则偏离。不能只在执行报告解释而让 selection 与引用排名矛盾，也不要求机械采用性能第一名。
- 本阶段允许范围内确需补充或修订模型内部裁决办法时，在既有计划/搜索记录保留原规则、新规则、理由、变更时机及对排名/选择的影响，事后调整不得冒充预注册。不得据此改变用户已确认目标、权重、退化约束或容量等资格门槛，不给未知成本补有效评分。仅派生聚合/排序变化且模型、参数、输入、硬件/成本身份及原始结果完整有效时，重算受影响评分、资格与结论并保留旧结果身份，无需重跑模型；计算条件改变或身份不足时按影响补证/重算。赢家回读与全组资格要求不变，不新增字段、台账、设备实验或审批节点。
- 对进入最终选型的候选，在既有资格记录中对账模型定义、DAG 及 hooks/补充说明涉及的全部物理资源对象，覆盖组内全部 case 的实际配置；临时量、转换输出、缓冲槽数与对齐开销须有归属。说明逻辑对象到物理分配实例的映射及容量上限的单实例、共享域或整体口径，按实际分片、复制、槽数、填充和对齐计算需求，核对不均匀分片中的最重实例，不从核数假定均分。核对当前工具版本的内置换算、分配、校验语义和保证范围，先识别已有证据已证明的结论与具体缺失/失效项，再决定补证；不因报告名称、字段展示或未采用某入口就追加完整仿真。不得以资源未声明、not_run、筛选通过或仿真完成代替相应义务，也不能只看手工组件表而漏掉 DAG 中间量或将别名重复计数。不为字面一致强制新增模型字段或指定接口；声明变化影响分配或校验语义时按影响核对，说明补清且原依据有效时复用。不新增固定组件枚举或记录格式。
- 容量口径区分固定预留、并存分配与生命周期峰值，并核对可用硬件容量来源；固定预留不因逻辑值结束就释放。完整可靠的静态分配或保守上界推导足以证明相应容量时直接使用，上界超限不单独证明实际超容。依赖别名、错峰或槽复用才能成立的结论，须证明字节范围、存活区间、读写依赖及再次使用条件，不能仅因计划复用就扣减。容量成立不代替适用的生产者、版本、区域、尺寸、尾块和槽回绕等合法性/生命周期检查。已有有效证据优先复用；确有动态缺口时才补适用模型检查或回放，范围足以保留并覆盖相关行为，不能随意缩短任务或按形状更小假定最坏情况已覆盖。共享推导或边界证据须关联全部被覆盖 case 的实际配置与适用依据，证据不足则扩充或保留必要完整执行，不以代表集豁免容量。启动前核对当前入口是否附带搜索、槽配置调整、完整任务展开及大型 trace/图导出，选择足够的适用方式；固定 tiling、单点或 Top-K 不证明工作量受限，关闭 trace 也不代表省去仿真。不为报告形式默认全 case 重量级回放；确有必要时仍由执行者管理适用预算并遵守用户资源与授权限制。补证须对应被验配置，工具改变槽数/阶段等参数时不能直接证明原方案，按已有变更规则核对影响。仅完成本阶段设计级证明，未到期实现补证仍交 Unit，不增加编译或设备实验。
- 模型阶段自检限于实际评价范围及既定全组适用性、资格责任，按与最终独立验收相同的建模交付质量标准及接入资料的“模型比较与搜索边界”核对：模型与既定目标及必要性能、结构约束一致，必要比较同口径且可信，全组适用性和完整容量资格成立，最终配置已按要求回读，关键引用可追溯，结论不超出证据。交叉核对最终配置、全部组内 case 的容量结论、资格记录未解决项和 winner.qualified；容量推导或关键前提未闭合时保留草稿/原始证据，按原协议失败，不交付合格 selection，也不以“留给实现”豁免本阶段缺项。只补清单或解释且模型参数、成本与排名不受影响时说明依据并复用有效搜索/回读结果；实质改变结构、参数或成本时按影响重评，不默认整批重跑或刷新旧证据。 模型 case 检查或脚本 PASS 只证明其实际检查范围，不代表最终 DESIGN 或完整规格支持域已经自检通过；后者按提交前整体自检核对，不据此把未建模合法域转成全 case 仿真义务。
- VF 成本按 toolkit references/framework/vf-costs.md 先复用身份和适用域匹配的证据；缺实测时允许有依据的估算用于探索，注明实现/硬件/dtype/工作量、公式/单位、分块、来源和不确定性，不升格为设备或校准资格；确实未知且无法解释的成本不参与有效比较。成本身份变化按影响重评，不能把文档中新估算追认为原搜索输入。缺失且影响决策、仍需实测且本轮已获授权时，允许按 opmodel 的最小实验指引在本轮隔离目录编写、编译并运行 VF 微核，沿用选定设备与环境，限定 case、次数、时限与停止条件；先做独立正确性检查，再采集可区分 VF 有效服务与搬运/启动/同步开销的对照及必要 Profiling。保留源码/二进制/编译身份、命令/退出码、原始样本、硬件频率与成本适用域，不能把完整 Kernel Task Duration 直接当作纯 VF 成本。
- 未知、域外或不合格 VF 成本不得用任意常数、指令猜测、端到端残差或敏感性扫描补成有效评分。拒绝相关候选；预算内无法给某组找到合格赢家或排序证据不足时，保存缺口并按执行协议失败，不把分析假设交给下游当作已选方案。VF 结果只补算子级成本证据，不代表完整算子收益。
- 模型阶段生成后回读 selection，核对 YAML 可解析、路线对应当前 performance active 集合、case 无遗漏或重复、无未知 case，且赢家字段齐全、引用文件真实非空并位于约定目录。对本轮实际用于评分和入围判断的候选，按该阶段要求的 case 范围核对比较完整性，直接评价与有据的等价复用均可提供结果；无结果时在既有记录中区分已证实不合格、执行失败、预算未覆盖及其他未决原因，不因去重后缺少独立记录而静默排除或记为性能差。已证实违反共同资格的候选按原规则淘汰，无需补齐其他组合；必要比较缺失时按原协议报告未完成，不为填满记录扩大搜索或实验范围。自检须回读实际交付及其关键原始依据，不能以脚本全绿代替上述交付质量核对；归档、清理或修订后核对受影响的引用与结论，复用仍有效的证据，不为自检形式新增实验或重跑模型。自行设定预算超支本身不判交付失败；必要比较、资格或回读缺失仍报告未完成，用户明确的资源和授权限制仍须遵守。将自检结果、执行命令与退出码、搜索/实验身份及未覆盖范围写入 `$WORK_DIR/.workflow/reports/`，文件名包含节点 ID；旧的未被 selection 引用的模型产物不作为当前方案依据。
- 按已安装 ops-direct-invoke 的 $DOC_TEMPLATES_DIR/templates/运行工具.md 中“DSL 版本与 API 依据”，以选定 Python 实际加载的 DSL 确认关键方案所依赖的数据通路、布局/精度与同步等能力及限制，引用已有有效依据。设计确定算法及必须满足的关系，具体 API、调用写法、地址和事件编号由实现阶段在允许范围内选择；不要求逐步骤接口映射、签名清单或生产代码骨架。真实 API 示例按需提供，已写出的用法仍核对实际语义与适用版本；错误示例可修正或收敛为有能力依据的正确抽象，不能删掉写法来掩盖方案不可行。已知关键能力冲突本节点解决或阻塞；需编译/设备才能确认的组合能力按首次消费前补证安排，不新增设备实验。
- 两条路线均加载 `cannbot-dsl-best-practice`，作为 DSL 公共结构、实现约束和关键能力依据的参考，按当前方案定向读取。按 $DOC_TEMPLATES_DIR/templates/设计落稿核对.md 的“一条规则，一个定义位置”区分数值契约、选型依赖的机制和普通实现选择：数学对象、逻辑对象、布局及有效访问/消费应对应清楚，不要求提前固定 API、指令组合、地址或事件编号，不为能力表编造绕行或扫描全部接口。自行选定的具体转换/表示机制须有适用接口及组合后的数值依据；普通 API 选择交实现，但性能、结构和数值承诺不得降为可选。
- selection.route 为 model_groups 时加载 `ops-theoretical-performance-estimation` 并读取其 ops-opmodel-toolkit/SKILL.md，按 references/opmodel-design-gen.md 与 assets/templates/design.md 主导完整 DESIGN.md 的落稿；多实现模板与逐 case 交接按 $DOC_TEMPLATES_DIR/templates/OpModel接入.md 在既有单文件及稳定章节中组织，关联完整输入清单、规则、生效参数与实际证据状态，代表集不冒充全组已仿真，不要求全量仿真或新增文档、表格及字段；基于本任务已完成阶段自检的模型方案、冻结规格及实际 DSL 契约组织语义与接口、计算与数据流、任务与流水、参数、资源与同步、成本、验证及限制；不加载 `cannbot-dsl-op-design` 或 `ops-design-paradigms`，不另套其完整设计模板、候选选择或成本分析流程。采用 selection 的共享赢家，复用其引用的原生配置、实际评价范围内的预测、覆盖依据、成本/硬件身份与搜索边界；区分模型事实、拟实现方案和实际验证，不为落稿形式重新搜索、重选赢家或启动模型回放、校准及设备实验；确有模型与设计不兼容时按本任务恢复及变更规则处理。
- selection.route 为 paradigm 时沿用 `cannbot-dsl-op-design` 与 `ops-design-paradigms`，按冻结 op.paradigms 和公式选择通用层及 DSL 适配资料，以范式驱动完成设计，标注未提供性能 case、未建模，不虚构模型排名或性能目标；不因模型路线改用 OpModel 落稿而要求本路线加载 toolkit 或启动建模。
- 输出固定为 $WORK_DIR/design/doc/DESIGN.md 单文件，不生成 INDEX.md 或分支文件。按本路线选定的落稿 Skill 和 $DOC_TEMPLATES_DIR/templates/设计落稿核对.md 的共同规则，保留足以驱动实现与验证的公开契约映射、数值链及状态边界、输入分发/参数规则、关键计算与数据流、Host/Kernel 及导出/编译工厂、资源生命周期与预算、同步关系、模型承接、关键 DSL 能力依据和验证/演进边界。按模板数值链从实际分块、过滤/掩码及任务分发推导合法输入下可达的局部有效性，明确局部运算的定义、贡献表示及合并规则，不从全局有有效结果推定每个局部任务都有贡献；只处理当前算法实际涉及的状态，不枚举无关组合或另建用例集。完整合法域、必要性能与结构承诺及稳定章节/branch ID 不变；关键规则仅在所属位置定义，其余展开引用，不抄规格、环境、模型原始结果或长 API 附录。
- 模型组用于评价与选型，在 DESIGN.md 中说明各组赢家的真实输入选择条件、参数规则及其与实际执行路径的对应，允许多组指向同一路径。算法、数据流、同步及必要资源关系可由共同实现和参数规则表达时，复用公共计算、调度与资源定义，不因组名、case 集合或配置取值不同直接要求独立 Kernel 或复制设计分支；确有算法、数据流、同步或资源策略差异时保留相应路径与依据。有依据的编译特化或不同编译产物可以保留，不强制合并为一个 Kernel，也不为共享实现更改本任务选定赢家或省略各组选择规则及边界验证。处理选择条件重叠的优先级或互斥性，以设计默认路径覆盖其余合法输入；按 $DOC_TEMPLATES_DIR/templates/设计落稿核对.md 的缓冲链规则，在既有参数/资源章节证明完整支持域到实际配置规则、资源需求或可靠上界及容量结论的闭环，不要求所有输入使用同一配置。性能 case 容量通过不能代替该证明；默认或回退路径仍须有明确分块、分段、槽数及适用依据，不能只写“通用配置”或“减小 tile”。模型路线依据冻结规格及实际 DSL 契约确定该路径，不为覆盖剩余输入引入范式资料，不将未建模域声称为模型优选。性能 case 只约束相应子域，不缩小 spec 支持域；不按 case_id 分发，不将离线分组误作新增公开参数。
- 按 toolkit 区分固定承诺、受约束选择和真正待补项，明确强制设计承诺、允许选项和 Unit 演进边界；本任务选型实际依赖的参数、数据通路与资源/流水条件须承接清楚，不能因原生配置或推导未标“必须”而降为实现自由度。影响方案可行性或关键承诺的受约束选择须有允许范围、不变量、能力依据、落实/验证时机与失败返回点；普通代码组织和允许范围内的 API、地址或事件选择交实现决定，不逐项枚举选项或补证计划，不因未定具体写法自动阻断；关键能力无依据或当前依赖未闭合仍阻断，不用部分可实现结论代替本任务完整交付。保留从输入到写回的语言无关执行算法，适用边界联查实际工作项、消费者、槽/代次及释放条件，不把精简示例变成删去完整算法。涉及尾块、对齐、填充或中转的关键路径，按“设计落稿核对”区分分配容量、实际访问范围与有效计算范围，并沿实际消费者核对范围传递。将补零、写满 tile 或中转机制列为强制要求前，说明其规格、接口、真实消费依赖或明确选定策略的依据与适用条件，不从固定容量或参考样例直接推导机制必需。同一对象声明的回退及触发条件须与强制/禁止条款自洽；相互允许又禁止的冲突在本节点按设计权限处理，超出权限按原协议终止，不交由下游自行选择解释。关键能力需有适用版本和来源；尚需首次实现补证的可行性假设给出最小场景、通过判据、首个消费 Unit 之前的验证义务及失败影响。已知不可行或影响正确性的阻断未决项在本节点终止，不以 TODO 交接。
- 从选定 SoC、环境证据及按需加载的 npu-arch 写 $WORK_DIR/environment/soc-info.yaml，只记录设计和下游所需的实际 SKU、架构、核数、硬件容量/资源约束等事实，注明单位、来源和适用域，未知项显式标记。设计分配量、槽数和预算在 DESIGN.md 的所属定义维护，soc-info 不另算或复制一套设计分配结论；模型物理参数引用原始来源。无匹配算力/带宽口径时不强求 MFU/MBU 分母，不编造峰值。
- 提交前按 $DOC_TEMPLATES_DIR/templates/设计落稿核对.md 的“提交与独立验收”完成整体自检：确认当前输入与送审对象身份后，先沿冻结规格核对最终关键语义、非平凡改写/转换组合和特殊值；再联查完整支持域、有效计算/访问、物理分配/生命周期、容量、同步及必要性能结构关系；最后核对模型资格/回读、排名、引用与复现身份。模型阶段检查和文件/字段/脚本成功不能替代设计语义自检；共同方法和证据边界以模板为准，报告只索引实际依据、范围和未关闭项，不新增脚本、全量数值仿真或设备实验。普通实现选择及未到期编译/设备补证不提前要求，当前语义或关键关系矛盾未关闭不得交接。
- 送审、返工和恢复按 $DOC_TEMPLATES_DIR/templates/设计落稿核对.md 的“返工的变更摘要与按差异复核”执行：保留可比较快照，先确认应采用的共同定义，再核对实际影响，同步模型、selection、设计引用与必要展开，最后只补缺失或失效证据。表达修正须确认语义未变，涉及规则、物理关系或成本的变化不能仅逐句追修报告；未评价合法域仍须有可落实设计，未到期实现补证不提前执行。有效结论按依据复用，不默认全文重写或整批重跑；超出权限或关键不兼容无法闭合时停止。
- 将路线、selection 引用、关键规则定义位置及核对依据/结果、章节完成度与可行性补证义务写入 `$WORK_DIR/.workflow/reports/`，文件名包含节点 ID；落稿只消费 selection 引用的当前模型资产，不因历史 STATUS.md 或 operator.yaml 存在而改变路线。
procedure:
- 一次最终独立验收覆盖本节点模型与设计的完整交付，按 $DOC_TEMPLATES_DIR/templates/设计落稿核对.md 的共同顺序先审最终设计关键语义，再审支持域、资源、同步及性能结构，最后联查模型资格、必要比较、回读和交付身份；同一有效依据只审一次，不把阶段自检当作独立验收。无 active 性能 case 的范式路线不要求模型或搜索证据，两条路线均保留必要性能与结构约束。
- 按本轮固定插件资源的 `$DOC_TEMPLATES_DIR/templates/节点资料与报告.md`，围绕本节点职责读取必要资料并引用原始证据，避免重复调查和报告全文抄写；保留本任务要求的实际执行与独立审查。
- 按 $DOC_TEMPLATES_DIR/templates/OpModel接入.md 核对模型确由选定环境的 wheel 和用户资产运行，实际版本/入口/profile 与复现记录一致，保存的 hardware 引用、显式覆盖及实际生效配置一致，解析器换型或入口不支持时有明确处置，不把文档默认当作运行事实；未把旧 checkout、局部硬件覆盖或安装成功当作有效建模/成本资格。
- 按 $DOC_TEMPLATES_DIR/templates/OpModel接入.md 的“有界并行与统一汇总”独立核对实际执行与既有计划/原始记录：用户明确的资源、时限与授权限制得到遵守，实际并发有资源依据；预算管理由执行者负责，自行设定的组/阶段预算超支或调整本身不作为拒收理由，不要求事后提高上限、补造预留或重新运行来消除历史超支。超支若伴随必要比较、资格或回读缺失，按实际交付缺口判断；实际任务及输出身份隔离，汇总无覆盖，必要比较的逻辑组合无遗漏，重复或未知项未混入评分，尝试未重复计入覆盖或评分，失败及未覆盖原因可追溯。复用、淘汰与最终回读沿原契约，不以先完成子集或不适用缓存冒充完整比较；合法等价复用与代表集扩充后的有效单例结果保留，整批汇总按当前范围重算，有依据的串行不单独拒收；只审现有证据，不替作者重跑仿真、补并发证明或新增实验。
- 按执行者自检所用的共同交付质量标准及 $DOC_TEMPLATES_DIR/templates/设计落稿核对.md 的“性能导向与候选形成”，独立核对默认性能导向、与主要瓶颈相关的候选及采用/排除依据，未以关闭后续调优取消初始性能选型；再核对模型与目标及必要性能、结构约束、必要比较可信性、全组适用性与容量资格、最终配置回读、关键引用和结论边界；不因自行计划偏差要求重跑已有效的模型结果，也不以自检通过代替独立判断。独立读取 selection，对照当前 performance active case ID 与引用文件核对路线、分组覆盖和证据引用，不只接受执行者自检结论。范式路线无分组及模型运行时要求；模型路线每个 case 恰属一组，无重复、遗漏或未知 case，赢家字段齐全、引用文件真实非空且位于约定目录。分组有结构或资源依据、输入适用域及共同目标可解释，未为逐 case 挑赢家任意拆组；目标与权重在比较前确定，退化约束与用户确认口径一致。
- 审查全部 active case 的轻量覆盖检查及代表集依据，沿真实输入核对路径、参数适用域、分块/分发边界和资源特征；代表来自原 case 并覆盖关键行为，未用固定几何代替参数化，不强求固定数量、独立字段或额外实验。昂贵探索和比较以代表集为主，扩充对应具体缺口或已确认约束，不因未仿真就要求全量。核对共同目标、用户权重与代表集评分关系及实际结论范围，未评价输入未被计零、补造结果或误记为性能淘汰。候选未无据只留第一名；代表集或候选空间改变后，受影响淘汰依据和必要候选恢复有核对。沿候选清单、生效配置、原始结果和排名核对去重前后必要比较关联，等价复用须有适用身份和依据，不能因标签缺失或合法复用没有独立运行而遗漏或拒绝候选。仅审已有证据，不替作者搜索或新增实验。
- 按 $DOC_TEMPLATES_DIR/templates/OpModel接入.md 的“模型比较与搜索边界”及“分层筛选与评价范围”审查轻量过滤依据、粗筛/补筛的同范围比较、竞争候选保留与恢复，以及入围候选在完整当前代表集及必要场景上的精评与最终配置回读，联查全组轻量覆盖和语义、数量、容量及依赖资格，不把组内全部 case 独立仿真设为默认门槛。核对粗筛选择保留机制覆盖并有成本取舍依据，未固定 case 数或 Top-K，未按完整代表集全交叉要求验收粗筛，也未用粗筛分数代替精评；必要精评和回读已有有效证据，不以自行预算是否超支替代交付完整性判断；有效单例不因阶段不同被要求重跑。必要比较或资格缺失仍不通过；仅未计算非必需性能结果不单独阻断，也不能声称该 case 已有预测、全组性能达标或全组最优。核对既定目标、权重、评分口径、逐 case 原始结果、汇总及退化限定在实际评价范围，未擅改用户约束。扩充和额外/全量执行须有具体缺口或约束依据并遵守用户明确的资源和授权限制；自行预算的管理与偏差不单独否决有效交付。以 selection 引用的最终配置及依赖资产为起点，独立核对实际评价场景的生效配置、结果、汇总、资格、引用和复现入口对应同一采用方案，历史阶段与身份清楚。变更由能够体现差异的场景验证，未仅凭配置未变场景宣称其余回读成立；未实评部分有适用性/资格依据及明确性能结论边界。合法复用有等价依据及原始结果关联，不要求独立重跑；复现资产按记录可用，不限定文件名或命令形式，不替作者搜索或补实验。
- 对照既定计划、实际同范围排名和 selection 独立核对最终选择；偏离有明确且可追溯的资格/裁决依据，规则变更的时机与影响如实记录且未改变用户确认约束。候选阶段或评价范围不同先核对可比性，不强迫赢家等于初筛或原始性能第一名；未解释矛盾、事后规则伪装预注册或证据不足仍不通过，不替作者新增实验或重复搜索。
- 独立沿实际模型、DAG、hooks 和生效配置核对全部组内 case 的物理资源及临时量覆盖，不只接受组件表；联查实例归属、分片/复制、槽数/对齐、当前工具换算语义与可用硬件容量，排除漏计和重复计数。固定预留不因逻辑值结束而扣除；完整静态分配或可靠上界可证明相应容量，上界超限不单独证明实际超容。依赖别名、错峰或复用的结论须有适用生命周期和依赖依据，容量通过不能豁免仍有要求的生产者、版本、区域、尺寸、尾块与槽回绕检查；not_run 或未声明不按已完成/零占用处理。独立核对共享推导、代表/边界证据对每个被覆盖 case 的实际配置和行为是否适用，不能仅凭更小形状、较少任务或一次成功认定覆盖。动态缺口有足够检查或回放，未默认要求逐 case 完整仿真、trace 或统一报告形式；仅缺这些形式不单独否决，工具退出成功、文件齐全或执行者声明也不能代替证明。补证配置与被验方案一致，自动调整槽数/阶段等变化有影响核对；缺口、不适用或配置不一致仍不放行。说明补清复用有效证据，声明改变分配/校验语义时按影响核对，不强制加字段或整批重跑。最终配置、逐 case 容量资格、未解决项与 qualified 一致；只验本阶段设计级义务，不提前要求未到期编译/设备补证，不替作者运行搜索或实验。
- 按 toolkit 区分模型语义/规格/运行复现、数学参考、实现精度参考、执行数值回放与设备验证；核对模型交付及引用完整，不能仅凭候选导出或某一验证通过替代其他资格。对照硬件/成本来源与选定设备、当前模型和 VF 实现身份，估算探索与匹配实测分别验收，不能因缺 VF 实测单独否决有依据的探索，也不能将其当成校准或设备资格。复用或新增的 VF 成本覆盖实际评分域，新增实验有正确性、源码/编译身份、原始采样、开销隔离对照及频率资格；未知项未进入排名，新增实验遵守用户明确的资源和授权限制；不以自行设定预算超支单独否决。证据不足退回执行者补齐，不重复跑整批搜索或设备实验。
- 核对无把模型预测当成设备收益或全局最优、无静默降级；每组无合格赢家时不得通过。核对写入与实验未越过 out_of_scope，验收结论与证据写入 `$WORK_DIR/.workflow/reports/`，文件名包含节点 ID。
- 按已安装 ops-direct-invoke 的 `$DOC_TEMPLATES_DIR/templates/运行工具.md` 中“DSL 版本与 API 依据”及 $DOC_TEMPLATES_DIR/templates/设计落稿核对.md 的同一职责边界审查关键能力：普通 API、指令组合或地址/事件未选定不单独拒收，不要求完整代码或逐步调用映射；选型依赖的机制及必要表示、性能、资源和同步关系不能省略。设计已经固定的具体转换或改写须满足原数值契约，适用签名/类型组合存在不等于组合后等价；错误示例不得豁免。仅编译/设备可判定的能力按既有首次消费前补证安排，不以此推迟已知语义错误或扩大实验范围，不替作者补证。
- 按 $DOC_TEMPLATES_DIR/templates/设计落稿核对.md 的同一数值链、调度链和缓冲链独立核对最终 DESIGN：实际分块/筛选的局部运算及贡献合并有定义，支持域到配置规则、可靠资源上界和容量结论闭合，物理表示/别名、有效范围、槽数及同步关系一致。模型抽象须有适用映射，不遮蔽影响资格、成本和正确性的差异；静态推导或有限分支证明足够时直接使用，不从性能 case 或模型通过外推全域。只核对当前方案必要展开，不强制统一机制、固定用例集、全输入枚举或全 case 仿真，不替作者重跑模型或设备实验。
- 首次验收按 $DOC_TEMPLATES_DIR/templates/设计落稿核对.md 覆盖完整关键语义和必要交付；发现阻断后仍收齐不依赖该错误的轻量检查，注明受阻及未检查范围，不强迫继续昂贵工作。返工按“验收者独立划定范围”优先核对未关闭项、实际修改、关联影响及此前未检查项，有效历史证据与本轮审查共同覆盖原要求；只有结论字样不能继承通过，旧结论被证据否定时明确纠正。范围不明扩大必要检查，不按轮次重审全文；语义、性能结构或资格阻断未关闭仍 fail。
- 按 selection.route 独立核对落稿方法与设计依据：model_groups 路线以 ops-theoretical-performance-estimation 内 ops-opmodel-toolkit 子目录的设计文档生成工作流主导完整设计，不加载 `cannbot-dsl-op-design` 或 `ops-design-paradigms`，也不以其模板、范式选型或成本分析增加验收门槛；承接本任务最终模型及原生证据，不只提交定量附录或模型结果摘要。paradigm 路线沿用 `cannbot-dsl-op-design` 与 `ops-design-paradigms`，核对对应语言范式资料，不要求模型运行时或搜索结果。模型路线同时按 $DOC_TEMPLATES_DIR/templates/OpModel接入.md 核对多 case/实现模板的映射和状态：完整原 case 清单无遗漏，结构不同的路径有完整定义，未评价输入不冒充已预测；单文件内的稳定章节与既有原始记录可提供这些关联，不因未拆分设计文件、未新增表格或未全量仿真拒收。两条路线均保留必要的 DSL 公共结构与实现约束，数学/接口、数值阶段、Host/Kernel、导出/编译工厂、资源/同步、关键能力依据和验证安排足以驱动 Golden、白盒及 Unit，稳定章节/branch 引用一致；无需重复上游环境验收或在本节点内重复审查同一模型依据。
- 模型路线核对各组赢家、参数选择与实际执行路径的对应清楚，可由共同实现表达的组复用公共定义，未仅因分组或参数取值不同要求独立 Kernel、复制计算链或新增路径；分别组织的算法、数据流、同步或资源策略有依据，必要编译特化与编译产物未被强制合并。各组参数、输入选择条件及边界验证仍完整承接 selection，未为共享实现更改赢家、混淆配置或遗漏覆盖；预测/参数可追溯且明确模型范围。分发基于真实输入，条件互斥或优先级明确，默认路径覆盖剩余合法域。范式路线明确无性能 case 和未建模，两条路线均未缩减冻结支持域或虚构收益。
- 核对性能评价范围与完整规格支持域已区分，模型原始结果、代表集、共享配置、全组覆盖和资格依据与落稿一致。未建模合法域仍有参数规则、计算路径、资源/边界处理与可落实验证安排，并有适用的配置及容量证明，不能只列待补证而宣称设计完整；无法覆盖的输入在设计权限内调整配置并联查计算、布局、同步和生命周期，保留选型依据及必要性能与结构约束，涉及已评价方案变化时按原影响规则重评。无可证明合法配置时报告设计缺口，不转交实现临时补方案或自行缩减支持域；明确的未来编译/设备可行性义务仍按首次消费时机验证，不提前要求通过。不因未逐 case 仿真、模型断言仅适用于实际评价范围或缺少全组预测单独否决，也不强迫扩成完整支持域模型；但设计不能把模型限制直接变成公开限制、使用错误公式或虚构性能预测。必要数值、性能与结构要求、实际资格或设计依据缺失仍不通过；同一有效证据只核对一次，不替作者搜索或补回放。
- 沿执行段的固定承诺、受约束选择和待补项核对实现自由度及关键能力依据，按 $DOC_TEMPLATES_DIR/templates/设计落稿核对.md 核对容量、实际访问、有效消费、补零/填充/中转的适用依据及互斥条款；选择边界、补证通过条件、首次消费前时机和失败影响完整可落实。普通 API、地址或事件选择未定不单独阻断，已知不可行、关键关系缺失或强制/回退条款冲突不得交接；不提前要求未到期编译或设备结果。
- 核对 soc-info 与选定 SoC 一致，所用核数/容量/硬件参数有适用来源，未知项未伪装为已知；未为不适用指标强求峰值。核对未为落稿形式重复搜索或新增设备测试，验收证据写入 `$WORK_DIR/.workflow/reports/`。
acceptance:
- test -s "$WORK_DIR/design/selection.yaml"
- test -s "$WORK_DIR/design/doc/DESIGN.md"
- test -s "$WORK_DIR/environment/soc-info.yaml"
out_of_scope:
- 模型路线不加载 cannbot-dsl-op-design、ops-design-paradigms 或套用其完整设计流程；使用 ops-theoretical-performance-estimation 内 ops-opmodel-toolkit 主导建模与落稿。无性能 case 的范式路线沿原约定；两条路线均保留 DSL 最佳实践、关键能力依据及独立验收。
- 不编写生产算子，不做端到端设备性能选优，不新增设备实验；仅保留建模原有且本轮明确授权的隔离 VF 成本微实验边界，不能因合并扩大授权。
- 不修改冻结规格、需求、testcase.csv、Golden、环境原始事实及 contract/perf-contract.yaml；本任务可在原授权范围修订自己产生的模型、selection、DESIGN 及 soc-info，保留原始证据并按影响更新结果。
- 不修改 opmodel 通用框架、共享成本/硬件定义、已有算子资产或安装环境，不切换解释器、CANN 或目标设备；仅使用本轮隔离资产。
- 不生成 INDEX.md、branches/ 或新增恢复脚本、字段和台账，不改变公开支持域，不按 case_id 设计运行时分发；不改写正在运行或待恢复的冻结 YAML、会话、产物和状态。
