title: 测试集成｜汇合、检查、修复与独立放行
goal:
- 交付符合冻结契约、可供实现消费的完整测试资产。
approach:
- 沿冻结策略核对四类数值用例共用固定比较器、参考绑定及当前辅助模块身份；阶段二属于正式判定，不以旁路通过代替正式结果。不在集成阶段重选数值标准，旧比较器或参考身份的通过结论不可直接复用；原始输入和参考缓存按既有有效性规则处理。
- 集成放行前确认固定 runner 在各 sheet、筛选与全量模式采用冻结的完整比较策略，最终 CSV status、退出码与门禁读取的结论一致。公共策略已有有效回归可引用，按本次配置/版本核对实际绑定，不为每个算子重写比较器或整套探针；新增/变化的绑定才补必要 CPU 证据，不要求提前加载生产算子或运行设备。
- 读取已安装 ops-direct-invoke 的 $DOC_TEMPLATES_DIR/templates/节点资料与报告.md，以及 $DOC_TEMPLATES_DIR/templates/测试生成子图.md 中“四节点测试集成与恢复”、真实输入、Unit 边界、Golden 与 CPU 方法、审查建议与缺陷关闭；本任务不使用旧八节点图专属的派发和回滚方法。复用已验收准备证据，不通读历史会话重做上游验收。
- 消费当前 spec、DESIGN、selection、Unit、环境及三路准备成果，<op> 取 spec.op.name。首次集成确认三路已通过且版本适用；重试以当前正式资产和反馈为起点，不把旧草稿重新灌回已纠错的 CSV。 对 Unit 明确交由本阶段承接的要求，从原语义核对最终正式资产中存在启用、可执行且输入与判据相符的用例；已有黑盒或白盒覆盖同一语义时直接复用并在 integration-report.md 索引承接关系，不按证据名称重复造例。纯结构要求保留既定 review_evidence 责任与时机，不伪造内部观测；发现冻结义务使用接收入口不支持的判据，按原协议交接，不自行删除义务或改冻结 Unit。 按共享模板“集成复核边界”复用各准备分支明确验收且仍适用的结论，先核对版本与本次汇合影响，不重复推导同一分支的既有事实；发现具体矛盾、漏检或依据失效时再定向复核。
- 作为唯一正式 CSV 写入者，仅首次汇合尚未写入的内容时，才从已验收草稿经公开 update_case_group.py 串行写 whitebox 并校验，再绑定实际 active 白盒分支并写入 tdd。重试或部分汇合中断后先核对当前正式分组和原始写入/校验记录：已提交或已修正内容保留，存在但未完成验证的内容补校验或定向修复，只补有证据确认尚未写入的缺失部分；不无条件重做汇合或回灌旧草稿，无法确认当前内容时先定位而非整表重建。保全 blackbox/performance 及其他未修改分组，区分实际覆盖与路径关联，不用 DESIGN 引用冒充 branch ID。
- TDD 写入后运行 "$PYTHON" "$WORK_DIR/scripts/validate_contract_consistency.py" --units-dir "$WORK_DIR/design/units" --test-dir "$WORK_DIR/operators/<op>/test"，要求全部 active TDD 及 execution.calls 符合声明域；缺失、越界或冲突按原协议处理，不用 --allow-undeclared 降级。原门禁仍绑定当前 Unit/CSV 时直接引用。
- 在首次完整 TDD 校验及缓存准备前完成真实全量输入的 CPU 资源安排；沿用共享约定中 独立主参考的依据、契约指定的计算精度与内置比较策略及既有业务断言，不重新设计参考或为每个 case 增加性质。
- 对稳定候选按“四节点测试集成与恢复”完成 CPU 工作与执行者静态自检；未确认当前客户端有可靠后台执行、退出结果和恢复机制时，从一开始默认串行，不先启动后台再尝试回收。仅有适用依据时才重叠 CPU 与只读自检，不派发审查子 Agent。CPU 经公开 build_tdd_cases.py 完整校验和缓存准备，并完成全部 active blackbox、whitebox、tdd 和非空 performance 的适用逐例/逐调用检查；自检聚焦汇合后的新增关联、转交承接、完整覆盖与 CPU 可执行性，并核对准备结论仍适用于同一候选；单分支已验且未受影响的预期、触发与判据不重复推导。 自检按转交要求逐项核对实际承接用例的输入、预期、判据与原通过条件，而非仅核对 ID、名称或设计路径；本阶段关闭测试资产准备和 CPU 可确认事项，目标设备实际结果仍按既定阶段验证，不提前宣称行为已通过。
- CPU 运行期间不修改其读取的 CSV、Golden、辅助模块或相关输入；自检发现问题先记录。回收真实退出码、日志和逐例结果后再统一修复；仅能可靠串行执行时记录限制并串行完成，不自行增加并行大用例。
- 依原要求处理自检和 CPU 发现的问题，在允许范围内修正 whitebox/tdd、Golden，以及有规格依据的 blackbox；经公开准备入口更新 runner/辅助模块，不修改公共实现。保留 case ID、原失败与差异，不删用例、改 excluded、缩小真实输入或放宽断言掩盖失败。
- 修改 Golden 或参考计算方式后补齐受影响的独立核验，历史准备裁决只适用于原版本，不复写原作者报告；在本节点记录新版本与核验依据。按影响更新绑定、说明、统计及证据，仅补缺失或失效范围，最终仍须有当前完整校验与全部适用 CPU 通过记录；不为减少重跑保留真实缺陷。
- 保存 test-generation/integration-report.md，引用当前候选、实际执行对象/版本、范围、原始命令和真实退出结果、自检、修复、复用及设备待验证项；按共享方法区分正常参考、可选缺陷对照与目标实现结果，说明当前正式证据及被取代记录，不能只按路径或状态归属。后台工作记录身份和退出结果，串行注明方式。沿原要求记录 runner/必需辅助模块的准备来源、版本、公开接口与 Golden/比较器关系，复用有效记录、只补失效项；不复制历史报告或自行宣告独立验收。
- 重试先读取 harness 原生反馈及其原始验收报告路径、当前资产和有效结果，按共享约定核对未结束 CPU 工作的归属与输入版本。不能重复启动工作或误杀其他进程；保留适用结果，不重建全部准备内容。原生重试耗尽则退出，不私设循环、新开流程或重置计数。
- 使用中发现冻结输入对同一公开调用的合法性、预期结果或义务含义冲突，或当前交付必需的工具/权限缺口时，保留具体事实和影响，按原协议失败交接；已记录或本节点无权修改不构成放行依据。明确安排且尚未到期的未来编译/设备补证保留责任和时机，不因结果不存在单独阻塞，也不提前标为通过。测试资产仅在本节点独立验收通过后冻结供后继消费，不修改上游或调度协议。
procedure:
- 核对准备、缓存加载与正式 runner 的有效策略和参考绑定一致，默认 native 缺失或异常不降级；阶段一失败、阶段二通过应由正式结果和退出码放行，两阶段失败仍失败。复用公共回归及本轮绑定证据，不要求尚未完成的目标设备结果提前通过。
- 独立检查完整数值策略确实位于正式调用链，按实际 reference_mode 核对参考来源；使用独立同精度参考时须用相同物化输入及规定计算精度，采用允许的主参考截断时不得宣称已做同精度计算，要求 native 时缺失或异常必须失败；阶段一失败而阶段二通过时正式结果可通过，两阶段失败仍失败。复用公共策略有效回归和本次绑定证据；只有旁路结果、标准仅部分实现或需实现者自行改固定工具时不得冻结，不新增设备实验或每算子重复证明公共比较器。
- 读取已安装 ops-direct-invoke 的 $DOC_TEMPLATES_DIR/templates/测试生成子图.md 中“四节点测试集成与恢复”及适用公共方法，按 $DOC_TEMPLATES_DIR/templates/节点资料与报告.md 独立验收最终候选；不采用旧八节点图的额外审查任务或回滚，不把执行者自检当作独立验收。
- 按 $DOC_TEMPLATES_DIR/templates/测试生成子图.md 的“集成复核边界”独立审查最终 CSV、Golden、runner、辅助模块与 integration-report.md：核对准备裁决及输入身份仍适用，重点检查正式写入、白盒/TDD 跨分支关联、Unit 转交承接、完整覆盖、CPU 结果及集成修改。原分支已明确验收且内容、依据未变又不受影响的语义、触发和判据引用原结论，不从头复审；未检查项不能当作通过，实际矛盾、缺口和失效结论沿影响定向检查，影响范围无法确认时扩大必要审查。转交要求须有正式启用、输入与判据匹配的可执行测试，不能只靠 ID、名称或交接说明；允许复用有效黑盒或白盒，不重复造例。数值语义不以纯评审替代，后续结构或设备证据保留原责任及时机，不提前认证。
- 核对声明域门禁对应当前 Unit/CSV，正式分组写入串行且 performance 保全；完整 TDD 校验真实执行，全部 active case/调用有当前适用 CPU 结果，设备或目标实现才能确认的行为未提前标为通过。缓存命中不能代替内容检查，未执行或检查失败不能放行。
- 核对 独立主参考的依据、计算精度、内置比较策略及冻结标准；修改后的参考有受影响核验证据，旧版本通过未直接套给新版本。核对固定 runner 和全部必需辅助模块的当前版本、公开接口、准备来源/加载身份及与 Golden 元数据、实际比较器绑定的一致性；文件存在或 build_tdd_cases.py 通过不单独证明入口可用。优先复用有效准备证据，相关变更后补失效项，不要求提前加载尚未实现的目标算子。临时性质或辅助脚本异常未成为新门槛，真实缺陷未被忽略。
- 核对自检与 CPU 证据对应最终测试资产，实际执行对象、版本、输入/比较口径、范围及退出结果可追溯；正常参考、可选缺陷对照和目标实现未混计，当前正式证据与被取代原始结果关系明确，不按文件名或 passed/failed 推断归属，不将 CPU/诊断结果冒充目标设备通过。后台模式在启动前有可靠执行、结果与恢复依据，未确认则串行；修复前 CPU 工作已完成或按权限停止且结果真实，不以进程消失、启动成功或补哈希当作成功。串行且检查完整不单独拒收，不替作者重跑或补证。
- 对照原要求、真实问题、实际改动及当前证据独立判断关闭和影响。若同一公开调用仍同时要求拒绝与成功返回，或输入合法性、期望、义务含义未确定，则当前测试契约未成立，不因上游已通过、仅列为记录项或本节点无权修改而放行。已明确且未到期的未来补证可按原责任及时机保留，不要求提前执行，也不提前认证。其他本阶段必要证据缺失或真实缺陷未关闭仍 fail，指出具体条款、定位、责任建议与可复用依据，不另设路由或私有重试。
- 将本次独立验收报告保存到 .workflow/reports/ 下以实际节点 ID 开头的文件；test-generation/final-report.md 只保存报告索引、版本和本次结论，不作为另一套裁决。该索引由 verifier 生成，不要求执行者预先交付。FAIL 反馈保留原始报告绝对路径供原生重试消费。
- 只有最终测试资产及本阶段到期证据全部满足要求才通过，冻结供实现使用；测试放行不代表算子能力、设备精度或专项补证已经通过。失败按本节点原生重试处理，不增加独立审查节点或自动审批。
acceptance:
- test -s "$WORK_DIR/test-generation/integration-report.md"
- test -s "$WORK_DIR/operators/<op>/test/testcase.csv"
- test -s "$WORK_DIR/operators/<op>/test/<op>_golden.py"
- test -s "$WORK_DIR/operators/<op>/test/test_<op>.py"
out_of_scope:
- 不派发其他 Agent、启动子工作流、修改 harness 或调度状态、已启动 YAML；不自行批准、重置预算或回滚。
- 不修改冻结 spec/DESIGN/Unit、用户 performance 场景、环境、精度标准或目标实现，不运行 NPU 或性能实验。
- 不新增或修改固定工作流执行脚本、外部 Skill 的公共 runner/缓存工具源码，不用私有入口绕过门禁；允许经既有公开 prepare_golden.py 准备入口重新生成或安装本工作区的固定 runner 与辅助模块副本，并核对更新后的接口/版本，不直接改写这些副本的公共实现。固定工具缺失或不兼容按原协议交接。
- 不删除用例、改 excluded、缩小真实输入或放宽断言换取通过；不覆盖其他角色的历史报告。
- CPU 读取候选期间不改其输入资产；不得遗留无法确认归属的后台工作后宣称完成或并发修改候选。
context:
  execute:
    skills:
    - cannbot-dsl-test-generator
  verify:
    skills:
    - cannbot-dsl-test-generator
