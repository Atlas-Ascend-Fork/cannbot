title: M1｜需求分析（并行分支 B）
goal:
- 将已确认的算子需求整理为可供规格生成消费的需求记录。
approach:
- 按本轮固定插件资源的 `$DOC_TEMPLATES_DIR/templates/节点资料与报告.md`，围绕本节点职责读取必要资料并引用原始证据，避免重复调查和报告全文抄写；保留本任务要求的实际执行与独立审查。
- 读取启动前已确认的 `$WORK_DIR/需求分析.md`、原始任务及输入约束，整理为下游规格所需的需求记录；本节点不重新调用交互式需求对齐 Skill。
- 在 `$WORK_DIR/design/doc/REQUIREMENTS.md` 记录接口、输入输出、目标环境、精度与性能要求、边界条件和未决事项的来源。
- 恢复或重试时先读取本节点已有需求记录、有效证据及反馈，确定实际缺项与变化；继续使用有效正文，仅修订受影响的要求、来源或未决项。已由上游验收的输入直接消费，不因进入新一轮尝试而重新调查或全量复核。
- 从已确认需求、`$USER_PROMPT` 及附件记录用户性能场景、已给 case ID 和原始来源；仅在这些输入均未提供场景时注明“未提供性能 case”。存在 `$WORK_DIR/contract/perf-contract.yaml` 时同时核对其 `target`、`cases`、`protocol`、`budget` 与已确认需求一致；契约缺项、case 为空或相互冲突时记录并终止。无契约时仍保留用户 case 及其设计评价用途，不要求为其补实测达标目标、协议或调优预算，不自行创建契约或新增场景。按 repo-requirement 的边界分别记录初始生成的性能导向与后续实测调优意愿；不接入后者不等于只求功能正确或取消设计选型。用户答复与内部推导分别注明来源，不把扩大解释写成用户明确。
- 发现影响规格生成的缺项或冲突时记录来源与影响并终止本节点，不自行决定，也不在运行中等待用户答复。
- 将本节点执行过程记录写入 `$WORK_DIR/.workflow/reports/`，文件名包含节点 ID；业务产物仍写入本任务约定的位置。
- '`REQUIREMENTS.md` 维护当前有效的需求及来源引用；重试原因、差异核对、命令与哈希清单写入本次尝试的节点报告，保留旧报告并引用已有原始证据。业务内容未变化时不改写正文，也不为证明本轮执行而追加复核章节；正文必要的证据引用须指向已落盘文件或真实条目。'
procedure:
- 按本轮固定插件资源的 `$DOC_TEMPLATES_DIR/templates/节点资料与报告.md`，围绕本节点职责读取必要资料并引用原始证据，避免重复调查和报告全文抄写；保留本任务要求的实际执行与独立审查。
- 核对 `REQUIREMENTS.md` 各项要求与用户确认记录可追溯。
- 核对接口、约束和验收口径与确认记录一致；仍有影响规格的缺项或冲突时不通过，标注阻塞不等于需求已就绪。
- 依据当前需求记录与有效来源独立验收；恢复或返工时重点核对反馈项及受影响内容，保留本节点全部验收要求。输入和正文未变不要求执行者追加本轮复核章节或重跑已有有效检查；证据不足时指出具体缺口。核对当前正文的来源和必要引用可定位，历史尝试记录留在节点报告，不要求将其汇入需求正文。
- 依据已确认需求、原始任务与附件核对用户性能场景、已给 ID 和来源无遗漏；未提供场景与场景信息不足已区分。存在 `contract/perf-contract.yaml` 时核对其目标与 case 引用一致，`cases` 为空、`target` 不可判定或 `budget` 缺失时不通过；无契约不作为无 case 的依据，不要求仅提供 case 的任务补实测达标目标或调优预算。按原始答复核对未将关闭后续调优扩写为取消初始生成的性能目标或将 case 降为仅正确性用途，内部推导未冒充用户确认；上游交接与原始要求冲突时按原协议处理，不擅改冻结输入。
- 将验收结论与证据写入 `$WORK_DIR/.workflow/reports/`，文件名包含节点 ID。
acceptance:
- test -s "$WORK_DIR/design/doc/REQUIREMENTS.md"
out_of_scope:
- 不生成 `spec.yaml`、设计方案、测试用例或算子实现。
- 正式需求记录只承载当前有效内容和必要的来源、证据引用；每次尝试的过程与历史结论保存在节点报告，不写入需求正文。
context:
  execute:
    skills:
    - ops-direct-invoke-repo-guide
  verify:
    skills:
    - ops-direct-invoke-repo-guide
