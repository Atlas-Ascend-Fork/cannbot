title: 实现｜单会话逐 Unit 实现
goal:
- 在一个节点内完成全部 Unit，交付符合冻结设计并通过完整 TDD 的实现，供后续精度验证消费。
approach:
- 正式执行沿冻结完整数值策略，未指定时使用已写入 spec 的内置默认策略；TDD、筛选、预检及 --all 的结果由同一固定 runner 判定。两阶段的最终 status 直接进入既有结果绑定和门禁，旁路检查只用于诊断；不能为消除阶段一红灯改算法/阈值或自行追加比较文件代替正式绿灯。
- 按本轮固定插件资源的 `$DOC_TEMPLATES_DIR/templates/节点资料与报告.md`，围绕本节点职责读取必要资料并引用原始证据，避免重复调查和报告全文抄写；保留本任务要求的实际执行与独立审查。
- 按冻结 DESIGN 与 Unit 实现运行时输入分发和设计默认路径，分发仅使用真实输入元数据/已定义语义，禁止按 case_id 选择生产路径；selection 和模型资产只作设计来源，不在实现阶段搜索或重选赢家。
- 读取 `$WORK_DIR/environment/environment.yaml`、`$WORK_DIR/design/doc/spec.yaml`、`$WORK_DIR/design/doc/DESIGN.md`、`$WORK_DIR/design/units/`
  与 `$WORK_DIR/operators/<op>/test/testcase.csv`；API 资料入口优先沿用环境节点报告确认的实际路径，默认索引为 `$WORK_DIR/cannbot-dsl/docs/zh/api/index.md`，按当前 Unit 涉及的接口定向查阅；文档或样例签名与选定 Python 实际加载的 DSL 不一致时，以该安装版本的公开签名为准，按下述版本规则核对适用性，不要求通读；先定位设计索引与 Unit 依赖，正文按当前 Unit 的 design_sources 按需读取，不因最终交付全部就通读所有后继 Unit 和下游工作流。环境结论不为 `PASS/full` 或设计、Unit 缺失时按工作流政策终止。
- 本节点一次交付全部 Unit 实现，公开模块固定为 `$WORK_DIR/operators/<op>/<op>.py`（`<op>` 取 `spec.op.name`），并按设计补齐导出入口与共享编译工厂；本节点总写集为各 Unit 声明路径并集，但每次编辑仅限当前 Unit 的 source_files 及其能力；共享同一文件不代表可以提前实现后续能力。首个 Unit 可先建立公开模块骨架与共享编译工厂，但不提前实现后续 Unit 的计算。后继 Unit 在转入时读取并实现，不为凑齐文件或导出提前写完整算子。
- 加载 `cannbot-dsl-best-practice` 指导生产代码和整体实现，按共享 out_of_scope 区分必要约束与实现自由度；按需参考 `$WORK_DIR/cannbot-dsl/samples/` 并记录参考点。数学语义及选定方案的关键承诺以冻结 DESIGN/Unit 为准，实现者在原写集和允许范围内决定具体 API、调用组合、地址、事件编号及等价循环/索引写法，无需为普通实现选择返回设计。按 `$DOC_TEMPLATES_DIR/templates/运行工具.md` 的“DSL 版本与 API 依据”核对实际加载版本，复用有效能力依据，只对新增、不确定或变化的用法补查实际语义与必要验证。示例不自动限定实现形式；关键接口若因公开契约或所选方案不可替代而明确固定，仍须保留。API 无法落实关键数据/数值/资源/同步或必要性能关系时按原阻塞协议交接，不擅改设计、升级依赖或用包装隐藏冲突；兼容签名不等于编译或设备通过，沿既定 Unit TDD 和到期补证，不新增实验。
- 按 Unit 依赖序执行模板“实现与证据验收”的三个动作：实现当前能力、反证自检、依据结论行动，不采用“先写完再统一跑测试”。数值通过只确认相关测试，尝试结束只说明本轮操作终止；能力完成还须当前设计约束、到期补证与受影响回归均有有效依据。历史红绿顺序如实保留，不为补齐过程删除正确能力、制造红灯或重演实现。最终交付仍须满足全部 Unit 的本阶段要求；设备名取本轮实际目标设备，与精度验证同口径，禁止用 CPU 冒充。
- 保持当前执行会话和上下文，不派发逐 Unit 子 Agent。首次实现先按 Unit 依赖序调用 `"$PYTHON" "$WORK_DIR/scripts/check_impl_progress.py" --work-dir "$WORK_DIR" --enter-unit <当前UnitID> --device <目标设备>`，成功后才编辑当前能力；同 Unit 重试再次进入不会清除失败。工具拒绝跳过 Unit、未取得当前版本正式绿灯就切换，以及循环未完成就提前跑全量。转入工具只核对数值和顺序，先按下述自检与行动判断确认当前能力，不能用转入成功代替设计符合性。
- 正式测试和转入命令独立执行，不接 `tail/grep/head/tee` 管道或后续命令掩盖退出码。工具自动归档 runner.log、runner-process.json 和原始返回码，并只显示有界日志摘要；0 表示该调用成功，1 是测试失败需按红灯/诊断语义处理，2 是工具/绑定/顺序失败需先处理。失败不等于获准继续后继；每次运行读取返回码和实际逐例结果。
- 实现前从当前 Unit 的 design_constraints、implementation.feasibility_checks 与对应 DESIGN 条款，按共享 out_of_scope 的共同口径确认强制承诺、全部适用判据、已有 reject_examples、补证时机和允许自由度。按模板核对实际 API 的输入/结果表示、有效范围及真实数值、索引、执行与资源关系，不以选择 API 另建设计，也不为每项普通选择新增报告或补证；首次使用前完成必要补证，契约有实质歧义或超出权限时按原协议交接，不重新验收上游设计或新增实验。
- 新增能力的局部 TDD 执行经 `"$PYTHON" "$WORK_DIR/scripts/check_impl_progress.py" --work-dir "$WORK_DIR" --run-sheet tdd --unit <当前UnitID> --device <目标设备>` 启动固定 runner，工具从 Unit 的 depends_on 依赖及 CSV 的 unit_id 关联自动选出当前 Unit 及其传递依赖的 active TDD，用精确 case ID 筛选调用固定 runner，自动传入 --require-accelerator，并绑定实际运行、选择范围和新结果；不执行无关或后续未实现 Unit。执行与聚合沿用相同的运行环境及入口配置；将 WORK_DIR 加入 PYTHONPATH，CANNBOTDSL_OP_MODULE 设为 operators.<op>.<op>，非默认入口及错误匹配器保持一致。
- 红：在实现当前 Unit 之前运行上述局部 TDD，再用 `"$PYTHON" "$WORK_DIR/scripts/check_impl_progress.py" --work-dir "$WORK_DIR" --unit <当前UnitID>` 核对当前 Unit 与依赖的逐项结论。依赖应保持通过，当前 Unit 的失败须能关联本 Unit 的缺失能力或断言，保留具体 case、输入、义务与诊断；运行器、环境、输入构造或前置依赖失败不自动算有效红灯。首个 Unit 的公开模块尚未建立时，须结合缺失路径与验证义务说明原因，不能只凭任意导入异常确认红灯。已有实现或首轮全绿时，按当前代码及用例实际触发证据核对能力与覆盖，继续完成设计核对；不要求补齐首次红灯来证明可复用，不破坏正确实现或虚构历史记录。
- 已知失败的诊断：首次局部测试仍经上述 --unit 入口执行；之后的修复迭代先读取实际失败行、输入与原始诊断，选择能覆盖已知失败原因的原用例集合，说明选择依据，不只挑最容易通过的用例。直接调用固定 runner 的公开入口 `"$PYTHON" "$WORK_DIR/operators/<op>/test/test_<op>.py" --sheet tdd --case-id <原失败case_id> --device <目标设备> --require-accelerator`；多例用 --grep 批跑，case ID 经正则转义并完整锚定，不能同时传 --case-id。保持与正式执行相同的环境、目标模块/入口及错误匹配器，保留原行的输入、seed、断言、repeat 与完整调用序列，不缩小输入或拆掉触发失败所需的前置调用。不得调用 runner 私有函数或另写简化比较器替代原测试。
- 诊断仍失败时，先修复、补充必要定位或按权限边界交接，不机械启动整个依赖闭包或全量；诊断通过后再执行必要的正式回归。无法可靠缩小失败范围、疑似跨用例状态/顺序问题或单例不能复现时，保留必要前置与顺序；公开筛选无法保持触发条件则使用原始批次，不把未复现写成已修复。首次无已知失败、仅补齐完整证据或已有有效诊断时，不为流程形式额外增加单例运行。
- 诊断结果只用于定位：分别归档每轮命令、源码与用例版本、退出码和筛选结果，核对选中 case 集合实际完整执行；固定 runner 的单例/grep CSV 与全量结果分开，不修改、补签 execution 绑定，不把诊断通过当作 Unit 绿灯或节点放行。正式回归仍经 check_impl_progress.py 的 --run-sheet 入口执行并产生有效绑定。
- 绿：只在该 Unit 的 `source_files` 范围内实现；已知失败按上述诊断顺序验证修复后，经同一 --run-sheet tdd --unit 入口取得当前 Unit 与依赖的正式绿灯。已有完整能力的修复按下述规则选择局部或一次全量回归；每轮把逐例结果 CSV 另存为带轮次与范围后缀的文件，红、诊断、绿与回归证据分别保留，后续运行不覆盖上一轮。
- 反证自检：数值转绿后重新读取当前 Unit 原条款、实际源码及必要已有产物，按共享 out_of_scope 的共同口径和模板逐项核对全部适用判据及 reject_examples，主动检查当前实现是否仍属于“用例通过但违反承诺”的反例。原始证据须实际支持相应结论，不能以自己的实现摘要、记录数量或哈希代替内容审查；在 implementation/design-evidence.yaml 现有 checks 中增量记录实现位置、原始依据和未关闭项，不等全部 Unit 后集中补写。
- 回归：局部执行已包含当前 Unit 的依赖闭包，逐项确认依赖未回退。修改共享源码还影响其他已实现 Unit 时，依据变更范围补充必要回归并记录依据；已有能力修复按下述重试规则选择局部或一次全量回归，不机械逐 Unit 重跑重叠闭包；不能仅凭依赖闭包未失败就忽略共享写集影响。同时复核共享改动影响的已实现 Unit 的设计承诺，记录影响范围与依据；出现功能回退、结构偏差或必要证据缺口立即处理，不攒到最后。
- 行动判断贯穿编码、诊断和自检，不等数值转绿：按共享 out_of_scope 的共同口径及模板区分当前到期强制要求、允许选项和未到期且尚未消费的后续要求。发现当前强制偏差、到期补证未完成或依据不足时，停止推进后继；可在本节点权限内解决的继续修复当前能力，无法完成或需要改变冻结契约时保存事实并按原协议报告阻塞、结束本轮尝试。自检与必要回归支持当前 Unit 全部到期要求时才转入下一 Unit。不能以登记差异代替落实，也不为把数值清单全部跑绿继续实现后继或反复全量验证；受阻能力保持未完成，此自检不代替最终独立验收。
- 进度只认 `testcase_output/tdd/` 的逐例结果 CSV 及其有效全量或局部 execution 版本绑定；unit-loop.json 仅由工具维护转入顺序及绿灯证据引用，不是可手写的通过状态，也不替代 CSV/绑定；每轮保留命令、退出码、逐例结果与失败证据，通过后再做受影响能力回归。
- 节点重试先沿用工具的 active Unit，不重建或手改 testcase_output/.executions/unit-loop.json；已交付能力的修复继续使用原局部/全量回归规则，不要求重演循环。修复前序能力可显式 --enter-unit <前序UnitID> 回退，受影响后继须重新逐步确认；不补造红灯。读取最近执行范围与原始结果，用 --unit 核对对应局部证据或用无 --unit 门禁核对全量证据的版本；结合仍有效的设计约束证据确定仍需完成的能力；TDD 已绿但强制偏差或证据缺口未解决的 Unit 仍需处理，不能只按测试结果跳过。局部证据失效时保留已有源码，针对当前或受影响 Unit 实际重跑取得现状，不据旧绿灯跳过、不补签结果，也不因缺少全量 CSV 就重写实现或运行全部后续 Unit。已有正确能力可以首轮全绿复用。
- 已有能力修复重试按模板从全部未关闭反馈、当前实际代码及适用证据定位当前阻塞和关联影响，先核对建议顺序与 Unit 依赖、首次消费时机及冻结契约相容。反馈不能授权推迟前置强制要求或改变设计，受阻后继未完成不成为先行实现的理由。未完成能力仍按逐 Unit 方法推进；不重演已完成红绿或机械遍历重叠闭包，先处理已知偏差，再按真实影响完成必要正式回归。条件未变且问题仍超出本节点权限时，仅复核阻塞条件、引用有效证据并按原协议结束，不重新展开后继或完整调查；真实契约冲突不带着未裁决阻断反复完整验证，不自建跨阶段调度。
- 全量收口前先核对全部 Unit 的能力与未关闭项，不把工具的数值 PASS 当成全部能力完成；已知可由当前材料确认的强制偏差须先处理，需要执行才能判断的义务仍按原安排验证，不预先假定通过。源码收敛到准备交付版本后，若已有完整 TDD 通过且默认门禁确认当前源码、冻结输入、工具及运行环境的绑定仍有效，直接引用，不再补跑一轮。否则经同一工具执行不带 --unit 的 --run-sheet tdd --device <目标设备>，再运行默认进度门禁取得当前版本完整放行。正式验证中发现缺陷或之后仍需改代码时继续修复，按现有失效边界补齐必要验证与绑定，不额外规定只能执行一次，仍遵守既有节点及验证预算，不为少重跑保留缺陷。局部结果与元数据单独保存，不拼接不同范围或版本冒充全量，不沿用被局部执行撤销的旧全量结果。
- 修复只在本节点内进行，重试次数由 harness 按节点预算控制；不在节点内自行循环计数、另建工作流或调用其他节点代替。
- 按模板“修复与收口”区分正式修复与诊断变体，核对实际写入及加载路径。正常修复仍在原写集进行；为定位而临时削弱目标计算的改动及超出冻结设计允许范围的探索，沿用 implementation/raw/ 的隔离权限，不覆盖正式源码或改动冻结输入。隔离结果不能自动成为正式实现；采用须符合当前 Unit 的完整契约，超出冻结设计的部分先由负责阶段完成设计变更并取得有效输入，本节点无权自行批准。不据此扩大诊断或设备实验范围。
- 按 $DOC_TEMPLATES_DIR/templates/设计一致性证据.md 在 implementation/design-evidence.yaml 增量保存各 Unit 的设计约束及前置检查事实，按原设计允许自由度核对，不等全部实现后才首次自检。共享改动同步核对受影响承诺；本批修复后先确认实际源码、原始执行结果及必要编译/设备产物，再更新受影响的说明、finding、引用与摘要，不只改哈希，也不沿用已失效的旧路径描述。材料仍有效时引用，不重复抄写；仅报告解释变化不重做有效验证，必要真实证据缺失时由本节点补齐。运行 "$PYTHON" "$WORK_DIR/scripts/check_design_evidence.py" --work-dir "$WORK_DIR"，对准备交付版本补齐缺失或失效项后提交验收，保留历史记录。
- 将实现版本、参数生效事实、测试命令与逐例结果写入 `$WORK_DIR/.workflow/reports/`，文件名包含节点 ID。执行记录和最终回复分别说明实际完成的能力、数值结果及未关闭项；按协议阻塞结束时明确本轮未完成，区分已证实事实与未知归因，报告已尝试范围及建议负责阶段，不声称实现完成或验收通过。
- 遇到疑似冻结输入或其他阶段缺陷时，在本节点原执行报告按“测试执行记录”的阻塞交接要求保留最小判别证据，说明事实与假设、相关 case/Unit/条款和版本、当前权限内无法修复的原因、建议负责阶段及影响范围；不能仅凭实现或测试失败归咎上游。提出工具/框架缺陷结论前，先核对已有复现是否满足与当前故障相关的公开契约；绕过某层检查后进入下一阶段不证明原入口有缺陷，须读取后续完整校验结果；多项条件变化后的成功不能单独归因某一改动。证据不足保留“原因未确认”，不据此认可私有绕行、依赖变更或上游返工。本规则仅核对实际提出的归因，沿用已有资料及适用测试记录，不扩大实验范围或强制每个接口新增正常对照、探针。重试先核对这些条件，未变化只补条件复核并引用已有证据，按原协议结束，不重复完整调查或越权改冻结资产。
procedure:
- 核对正式结果反映 spec 的完整策略、参考身份及当前 runner 版本，复用仍有效的完整策略结果，不给旧单阶段/旁路 CSV 补签。比较器能力或契约不一致时按原协议报告，不将其误判为候选算法错误，也不降低设备、覆盖或结构证据要求。
- 验收与执行、自检共同采用共享 out_of_scope 的判定口径，以本轮冻结的 spec.yaml、DESIGN.md 和全部 Unit 为依据：spec 规定公开语义、适用域、接口和数值契约，DESIGN 规定选定方案的关键承诺与允许自由度，Unit 承接本阶段能力及到期验证义务。按本轮固定插件资源的 `$DOC_TEMPLATES_DIR/templates/节点资料与报告.md` 读取必要资料；测试、Golden、skill、示例及证据模板用于核验和解释既有要求，不自行增加判据，不重做上游设计或建模。依据存在实质冲突时按下述交接规则处理，不自行选择较宽口径。
- 运行 `"$PYTHON" "$WORK_DIR/scripts/check_impl_progress.py" --work-dir "$WORK_DIR"`，核对全部 Unit 的 active TDD 与当前交付源码的完整原生结果 CSV、execution.json 一致；检查实际命令、模块/入口加载、目标设备、退出码和逐例覆盖。完整实跑及有效绑定可共同支持全部 Unit 的数值结论，局部、诊断、旧版本或拼接结果不能冒充全量；删除、跳过、改断言、放宽阈值或替换 Golden 取得的通过无效，不以 CPU 结果代替设备结果。
- 从当前源码及必要的已有编译产物核对 DESIGN 与 Unit 的关键承诺，包括 Buffer 分配容量、实际访问与有效计算范围，切块和工作分配，索引与写回，主要计算流、dtype/舍入链，以及分发条件、优先级和默认路径。保留冻结方案中必要的搬运粒度/次数、并行、调度、资源预算及生命周期等性能与结构约束，不能仅凭数值通过放行真实偏差；生产路径不依赖 case_id 或模型搜索环境，不以违反冻结契约的替代计算路径或诊断变体冒充交付能力。按 `$DOC_TEMPLATES_DIR/templates/运行工具.md` 中“DSL 版本与 API 依据”复用有效接口证据，核对实际 DSL 版本、加载身份及新增或变化用法，核对实际 API 是否落实必要的数值、归约/广播、访问/计算、资源与同步关系，不以名称、调用形式、地址或事件编号与示例不同单独否决；允许范围内的等价机制无需改设计或另增逐项选择报告，公开契约及不可替代的关键接口承诺仍须满足。不把示例的固定参数当作设计要求，不新增全量接口探测或设备实验。
- 同步按设计要求的实际依赖、参与者、条件和资源生命周期验收：生产完成先于消费，必要读取完成先于覆盖复用，首次使用、工作项切换和结束状态满足相应关系。显式接口、编译器自动生成或组合机制均可承接，不因 API 名称、手写 flag 数量或调用形式不同单独判失败；也不能仅凭同步符号存在或普通数值测试通过认定符合。必要依赖未覆盖、等待无对应信号或无法据现有证据判断时仍不通过；同步机制等价不能豁免必要性能与结构约束。
- 读取 implementation/design-evidence.yaml 及“设计一致性证据”模板，运行 `"$PYTHON" "$WORK_DIR/scripts/check_design_evidence.py" --work-dir "$WORK_DIR"` 核对覆盖和版本，再独立审查所引原始内容。必要证据限于判断当前用例结果、关键承诺和本阶段到期补证所需的材料；从 DESIGN 与全部 Unit 核对，不仅检查执行者主动列出的项目。说明、finding、引用与实际源码及必要产物须一致，记录齐全、哈希或脚本 PASS 不代替内容判断；数值通过、尝试结束不等于能力完成。明确属于后续阶段且尚未消费的要求不提前阻断，本阶段缺项也不得后移；不为形式要求追加报告、固定篇幅或设备实验。
- 核对改动仍在 Unit 允许写集内，冻结 spec、DESIGN、Unit、Golden 与测试资产未被修改。按模板“修复与收口”检查正式源码与诊断变体隔离、实际加载及恢复后证据的适用性；已知失败的诊断保留原 case 输入、断言及必要调用顺序，经固定 runner 公开接口实际执行完整选中集合。诊断通过不代替正式回归；源码恢复、共享改动或其他变化使结论失效时须补齐受影响证据，不能只补哈希、更新摘要或沿用撤销的绿灯。
- 最终判断以当前实现及有效证据为准，不因首次红灯时机、首轮全绿、历史自检顺序或执行次数单独否决，不要求逐 Unit 重演已完成闭包或重复有效全量运行。对全部未关闭反馈按真实影响核对，仍适用的证据复用，不替执行者重跑。默认不全面回放会话，仅在版本、加载、覆盖、写集或真实性存疑时定向追查；伪造记录或手改工具状态不能因测试通过被豁免。小差异按共享 out_of_scope 处理，不以逐字匹配或执行者的等价自述代替实际判断，也不把真实数值、性能或结构偏差降为小差异。
- 发现 spec、DESIGN、Unit 或测试间实质矛盾时，引用具体条款、当前事实及不能同时满足的原因，区分节点内可修复问题与需负责阶段裁决的缺口；不强令执行者同时满足冲突要求，不擅改冻结资产或放宽必要约束。对实际提出的工具/框架缺陷，独立核对已有复现合法性、原始失败及绕行后的完整校验；进入更晚报错或多条件变化后的成功不能单独证明工具缺陷，归因不足保留未知，不据此认可私有绕行、依赖变更或上游返工。沿用既有报告交接，条件未变时仅复核并引用有效证据，不重复完整调查，不要求新增探针或设备实验，不调度其他节点。
- 结论只因用例失败或无效通过、关键方案偏差、必要证据缺失或失效而阻断；将契约冲突造成的无法判定如实归入相关未满足要求并交接，不自行增加验收标准。每个阻断指出对应 spec/DESIGN/Unit 条款、代码或产物位置、原始证据、实际影响或尚不能判定之处，以及权限内的最小收口条件；按既有模板、摘要及路径约定写入 `$WORK_DIR/.workflow/reports/`，文件名含节点 ID，不新增字段或部分通过状态。未解决的关键偏差和到期证据缺口仍判失败，不要求先实现受阻后继再修前置；全部 Unit 的本阶段交付缺项不能宣称整体完成。旧冻结运行沿用原协议，不改写其流程、产物、状态或历史结论。
acceptance:
- test -s "$WORK_DIR/operators/<op>/<op>.py"
- test -s "$WORK_DIR/implementation/design-evidence.yaml"
- '"$PYTHON" "$WORK_DIR/scripts/check_impl_progress.py" --work-dir "$WORK_DIR"'
out_of_scope:
- 不创建、改写或扩展本轮 scripts/ 中由启动器提供的工作流工具，不通过自行生成验收脚本绕过门禁；缺失、参数不兼容或哈希失效时保留错误并终止，由 PM 处理工具供应。
- 不修改 `spec.yaml`、`DESIGN.md`、Unit、Golden、测试用例、断言或精度阈值。
- 不在执行、自检或验收中另加门槛：本任务的“关键承诺”和“强制要求”采用同一口径，包括冻结 spec 的公开语义、支持域、接口和数值契约，DESIGN/Unit 明确要求的计算流、数据/资源关系与必要性能、结构约束，以及本任务已有的权限、真实执行和有效证据要求，均按原阶段范围和到期时机适用。搬运粒度/次数、并行、调度、资源预算及同步/生命周期等必要约束不得因数值通过而豁免。允许自由度内的 API/调用组合、地址、事件编号、循环/索引写法及等价机制由实现决定，按实际效果核对，不按示例形式冻结。小差异仅指不影响上述要求及其可判定性的命名、辅助函数划分、等价表达或风格差异，只作建议，不阻断 Unit 推进或节点验收；不得据此豁免明确强制承诺。skill 和示例用于落实本轮契约，不把其中与必要约束无关的风格规定升级为当前阻塞，也不擅自扩大验证范围；必要要求有实质歧义时按原协议交接。
- 不执行全量精度放行与性能采集，不做设计或候选变更。
- 不删除用例、不以 CPU 检查代替设备结果、不以跳过失败换取通过。
- 不运行白盒与黑盒用例；两组由精度阶段负责，本节点只用 TDD 驱动实现。
- 不为补齐红绿过程删除正确实现、重演已完成能力或补造记录；不以最终测试全绿代替设计符合性、本阶段必要补证或有效执行绑定。
- 不手写进度、Unit 通过状态或验收结论；数值进度仍只来自测试入口输出与 `check_impl_progress.py` 聚合。客户端待办和报告不得把仅数值通过、尝试结束或已登记阻塞标成受阻能力完成；不新增进度字段、通过状态或调度状态，自检不代替最终独立验收。
context:
  execute:
    skills:
    - cannbot-dsl-best-practice
  verify:
    skills:
    - cannbot-dsl-best-practice
