title: 寻优｜按证据联合迭代与选优
goal:
- 在已确认目标与预算内，通过有反馈的实现探索得到可复核的采用结论。
approach:
- DSL 候选的 API 依据沿用已安装 ops-direct-invoke 的 `$DOC_TEMPLATES_DIR/templates/运行工具.md` 中“DSL 版本与 API 依据”：复用已验收环境与接口证据，只对新增或变化的 API 用法补齐版本适用依据，不因参考样例而切换 DSL 或改冻结设计。已知接口冲突先在本节点权限内修正候选；需改环境或上游设计时按原阻塞政策终止，不用失败候选消耗正式性能采集；不新增设备实验或扩大既定预算。
- 按本轮固定插件资源的 `$DOC_TEMPLATES_DIR/templates/节点资料与报告.md`，围绕本节点职责读取必要资料并引用原始证据，避免重复调查和报告全文抄写；保留本任务要求的实际执行与独立审查。
- 读取 `$WORK_DIR/opt/baseline.yaml`、`$WORK_DIR/contract/perf-contract.yaml`、`$WORK_DIR/design/doc/`、`$WORK_DIR/operators/<op>/` 与 基线索引的原始精度证据，使用上游已验收的基线和协议。加载 `ops-theoretical-performance-estimation` 并读取其 ops-opmodel-toolkit/SKILL.md，按 references/joint-optimization/guide.md、workflow.md 与 agent-dag-opt/search-integration.md 选当前授权阶段；目标/重评分按 framework/objectives.md 处理，保留来源与目标修订，不把目标分数当成加速比，不修改该 Skill 或 opmodel 通用框架；算子模型改动仅限已有授权的算子目录。业务执行与验收契约以本 task 和已冻结性能契约为准；引用参考不扩大授权、增加用户未确认的性能门槛或恢复已取消的独占要求。
- 从 `$WORK_DIR/opt/` 恢复已有候选、台账、测量与迭代记录。保持原始控制 commit、正确性标准、目标、comparison snapshot 和用例版本不变；当前实测最佳单独记录，只作为可选开发起点和附加对照，不替换原始控制。跨轮累计预算，harness 重试和恢复不构成新的优化预算；不改调度状态、不自行启动子工作流。
- 使用性能寻优记录模板，在 `opt/iteration.yaml` 保存本轮业务进展、有限的实验计划、计划与已用预算、当前最佳、证据索引和下一步依据。每次开始新一轮前登记具体假设、有限实验集合及候选名额；已开始的轮次以及失败或中断的尝试均保留计数。读到结果后新增方案或新判别实验进入下一轮，不通过扩大原计划规避轮次上限。`max_candidates` 为整个优化过程登记的完整候选累计上限，编译失败、精度失败及未测候选也占名额；同一身份的恢复不重复计数。`max_rounds` 限制探索轮次，与每例采样数、无效补采次数分开；最小实验和模型反馈也纳入有限轮次计划，不能在候选上限之外无限试验。基线与最终回归的必要测量及预留按已冻结预算安排，余量不足不先花完再要求回归超支。
- 逐轮根据语义、源码、当前最佳和已验证观察选择下一步；可以先提出少量候选，也可以先解决会改变决策的疑点，不要求先生成并完成整批方案。候选覆盖有实质差别的分解/融合、物化/重计算、驻留、分核、布局、同步或流水机制；只有证据支持时才扩展相邻参数。同机制反例尚未解释时先做有判别力的小实验或停止该分支，不重复生成等价变体。
- 模型搜索按问题和能力选择；使用时按 $DOC_TEMPLATES_DIR/templates/OpModel接入.md 核对已安装 wheel 和用户模型，设置 OPMODEL_SKILL_DIR 及优化阶段 OPMODEL_WORKSPACE。没有适用模型或关键差异不能表达时，可在授权内直接做设备实验并注明未使用搜索；用户明确要求的模型工作不能静默略过。选择模型搜索时实际使用 toolkit 的适用公开入口，保存空间、固定维度及理由、已评分范围、成本/profile/wheel 版本与排名，完整候选同口径复评，涉及局部评分或显式 Vec/VF 搜索时沿接入资料的“模型比较与搜索边界”核对实际覆盖与适用范围；沿 $DOC_TEMPLATES_DIR/templates/OpModel接入.md 核对保存硬件引用与实际解析/加载结果，模型或成本配置变化单独记录并按影响重评，不能计作实现收益；实际涉及显式 Vec/VF 计划或变换搬运时关联计划步骤、调用域、布局/访问、计费量、缓冲及释放边界，单次 VF 预测不冒充完整 case；已有编译反馈关联实际候选/源码和构建身份，失败证据按接入资料保留，失效工件及旧设备数据不复用，不因新参考追加设备实验或改变冻结 comparison；已有会话不代替设备预算，不假定会自动生成 DSL 或采集真机结果。
- 实现前在 `opt/candidates.yaml` 登记稳定 ID、父候选或多个组合来源、来源、等价依据、变更、预期机制、新增代价、失败信号和适用 case；有有效测前预测时冻结快照，无预测明确注明。只冻结本次实验候选，后续新方向登记新 ID/版本，不覆写旧定义或倒填测前预测。最小编译、数值、成本或流水实验在 `iteration.yaml` 关联假设与证据，不冒充完整候选的搜索或性能收益。
- 每个候选使用独立 commit 或标签，允许从冻结基线、已有候选或当前最佳派生，保留父版本及相对原始控制的完整 diff，不覆盖已验收基线和其他候选。核对实际分块、核数、指令和搬运粒度、布局、驻留、缓冲及同步是否落实。编译迫使结构变化时保留原失败，登记新的候选/实现对应关系；有效结构等价的源码变体可合并性能实验，但保存各自源码身份和合并依据，不将一次失败扩大为整个实现族无解。
- 先编译并按原 Golden 与精度标准验证原 case 集中受影响的输出、边界及适用副作用；涉及异步复用或 scratch 时覆盖必要的连续不同输入调用与缓冲生命周期。失败候选保留错误与最小反例，不进入有效性能排名。必要正确性通过后先做能回答当前问题的完整对照，再决定是否展开新方案；未完成冻结 comparison 要求的探索性测量单独标为诊断，不参与采用。模型探索缺 VF 实测时可按 toolkit 形成有依据的估算，保留实现/硬件/dtype/工作量绑定和不确定性，不冒充校准或设备收益；无法解释的未知成本不参与有效模型排名，足以反转选择时在原预算内补判别证据或保留排序不确定性。实际采用仍须原正确性与同口径设备证据，不以探索估算替代正式实测。
- 正式比较沿用冻结共同条件及 `protocol.comparison`，设备、编译、缓存、输入配方、计时边界、预热、样本数、顺序、工具与统计量一致；沿用基线采集入口及环境约定，不启用调试旁路。independent 使用基线索引的 `opt/control.yaml`；已失去可比性的控制证据只在既定预算内重测受影响范围。interleaved 同次逐例配对采集原始控制与候选，控制记录放在 `opt/controls/<candidate>/<collection>.yaml`，候选放在 `opt/measurements/<candidate>/<collection>.yaml`；双方 collection_id、pair_id 对应。当前最佳可附加比较，但所有采用证据保留对原始控制的同口径结果。
- 采集保留全部有效和无效尝试、原始文件、命令、退出码、实际加载版本、case_version、snapshot/protocol_id 及共享观测；不要求独占、不等待安静窗口，观测不可得记 unknown，不丢慢样本、不重复取优。无效补采仅按已确认错误种类及剩余预算进行；恢复同一事先计划的逻辑采集序列时，先确认版本、环境、输入及协议仍可比，保留原 collection_id、所有已完成有效样本及无效尝试，只补尚缺数量；重启后的必要预热单独记录，不计入样本。交错方式保留已完成的整对，未完成对不跨中断补配；其单侧结果保留为缺失配对的无效证据并计入补采预算，后续双方重新采集新的 pair_id。不因进程重启自动新建 collection；身份或可比性已变化而必须另开序列时，记录具体原因，旧片段保留且开销累计，不跨 collection 拼接或为清零无效预算重开序列，剩余额度不足就停止。每份正式比较运行 `"$PYTHON" "$WORK_DIR/scripts/check_perf_contract.py" --contract <契约路径> --purpose comparison --measurement <候选记录> --reference <控制记录>`，保存输出；脚本通过不等于收益成立。
- 每次实验后及时分类反馈，先区分观察、证据和解释，再决定继续、改方向或停止分支。分类包括语义/实现、数量、部署约束、服务成本、执行结构与证据资格；解释完整关键路径和新增代价，不将重叠 pipe busy 相加或仅凭占比判根因。重要实现变化后重新声明模型适用域；偏差影响下一步选择时，仅在既有授权范围内修正算子模型，经未参与拟合样本验证并重放历史候选后再用于排序。无需校准时注明理由；有效设备收益与模型校准分别验收，不为拟合结果修改通用框架或名义峰值。
- 将每次实验结果、偏差、反例、分支的停止及重新打开条件写入 `opt/ledger.yaml`，在 `iteration.yaml` 关联本轮证据、已用/剩余预算、当前最佳及下一步理由。未测、正确性失败、成本未知、实测变慢和证据不足分别记录。收益无法与波动区分或记录不可比时标为 evidence_insufficient，不冒称改善或变慢已证明。按冻结目标选择当前最佳，不能默认以最低单例延迟代替用户整体或其他目标。
- 在确认目标及停止条件满足、预算耗尽或已无有证据支持且可在预算内完成的下一步时结束探索；用户停止或能力阻塞如实记录。未达目标但仍有预算和有依据的方向时，不因完成一批候选自动结束；不默认固定轮数无改善就是全局收敛。存在无法解决的输入、权限或环境问题时就地终止并报告，不伪造完成结论。
- 最终逐项对照原始要求、自然语言 target 与 adopt_rule，写明比较对象、方向、case 范围、逐例结果及预定汇总方法，区分目标达成、可采用和预算耗尽。采用只来自原正确性通过且正式实测支持已确认条件的集合，保留全部有效样本，不用单次最小值、模型排名或事后修改统计量选赢家；用户只要求达到范围时不额外要求未确认的改善幅度。证据不足或无合格新方案时保留原控制。
- 全量正确性使用既有 test/test_<op>.py --all --device <原目标设备> --require-accelerator；基础三组保持非空，非空 performance 必须覆盖，空 performance 记录未提供，不额外采集性能。
- 交接统一检视前，将 decision 选定实现恢复到实际算子工作树。新候选按原 CSV 全部分组 active case（基础 blackbox/whitebox/tdd 非空及非空 performance） 完成全量精度验证，保留逐例原始 CSV、命令、环境、退出码与实现身份；只通过受影响子集不足以进入检视。原始控制可复用仍有效的原全量证据。全量失败时保留失败记录并在预算内重新选定合格版本或保留原始控制，不将失败实现交给检视。把最终选定版本的全量结果保存到 `opt/pre-review-results/`，写入 `opt/pre-review.json`：candidate（或 baseline）、commit、git_dir、operator_files（与 review_fix.py inventory 同口径的源码及测试 SHA256）、runtime（module、entry、error_matcher 三字段，缺省 run/空字符串与原执行记录一致）、device、results_root（上述目录的绝对路径）、全量精度及原始证据索引。该指针仅表示待检视版本，不能作为交付版本。
- 写入 `opt/decision.yaml`，包含采用项及 commit、相对原始控制的结果与口径、目标逐项响应、真实结束原因、已用预算、淘汰层次和反例、未解释项及最终回归的证据索引。重试须保留既有决策历史和补充原因，不清空探索重新开始；执行过程记录写入 `$WORK_DIR/.workflow/reports/`，文件名包含节点 ID。
procedure:
- 按已安装 ops-direct-invoke 的 `$DOC_TEMPLATES_DIR/templates/运行工具.md` 中“DSL 版本与 API 依据”核对候选新增或变化的 DSL 用法及其原始证据与既定环境一致，已知接口冲突未被当成性能波动或留给后续回归；未擅自切换版本、修改冻结设计或扩大实验范围。沿用有效接口证据，不重复调查基线已确认接口。
- 按本轮固定插件资源的 `$DOC_TEMPLATES_DIR/templates/节点资料与报告.md`，围绕本节点职责读取必要资料并引用原始证据，避免重复调查和报告全文抄写；保留本任务要求的实际执行与独立审查。
- 读取已验收的 `opt/baseline.yaml` 与性能契约，审查 `opt/iteration.yaml`、`opt/candidates.yaml`、`opt/ledger.yaml`、`opt/decision.yaml` 及其原始证据索引；独立核对实际源码、命令、退出码与结果对应，不重复上板替执行者补证据。
- 核对轮次和完整候选按冻结预算累计，失败、中断、最小实验和模型反馈没有被漏计或藏在无界轮次中；计划在行动前登记，重试恢复没有清零、重复领取额度或覆写历史样本，基线与最终回归的必要开销仍遵守约定。停止原因有证据，预算耗尽不等于目标完成；未达目标且存在可执行方向时，没有因完成预先一批候选而提前收工。
- 核对实验由明确假设及新证据驱动，下一轮引用前轮结果，失败分支有最小反例和重新打开条件；没有靠改候选名重复同机制失败。候选含父版本/组合来源、完整变更和测前依据，后续变化用新身份；原始控制不变，当前最佳依冻结目标更新，未以局部赢家替换总体目标或原始对照。
- 核对正确性来自原 case 与原标准，实际实现与候选、预测的对应关系可追溯；编译/精度失败没有进入性能排名，最小实验或源参数存在没有被当作完整实现验证。模型搜索和预测在使用时有真实运行证据，未使用时如实说明；按 $DOC_TEMPLATES_DIR/templates/OpModel接入.md 核对硬件引用与生效配置、实际涉及的 Vec/VF 和搬运范围、已有编译反馈及源码身份，沿接入资料的同一比较与搜索边界核对实际覆盖、复评及失败证据，局部预测不冒充完整 case 或设备收益，未涉及的计划/构建不额外要求产物；算子模型修正有授权、独立验证及历史重放，设备收益未冒充模型校准完成，未修改引用 Skill 与通用框架。
- 核对所有正式候选与控制使用同一 comparison snapshot、case_version 及预定统计量；independent 对照仍可比，interleaved 来自同次真实配对。原始样本、失败记录、版本及协议校验输出完整，不挑最小值、不丢慢样本、不用诊断或异时拼接结果选优；共享或 unknown 如实说明且未设独占门禁，采集序列没有因结果不理想而重复取优。
- 对照已确认自然语言目标、原始要求及采用条件，独立复核逐项响应和计算。要求改善时，完整实测及分布须支持可分辨的稳定改善；其他目标按原义判定，不新增门槛、不换比值方向或汇总权重。模型排名和结构脚本通过不等于性能达标；证据不足则不得采用新版本。
- 核对 `opt/pre-review.json`、实际工作树及 decision 版本一致，源码/测试哈希、运行入口和设备对应，全部适用分组的全量通过证据完整；原控制复用须仍有效，不以受影响子集替代全量。
- 核对 decision 的采用项、commit、结论和结束原因与台账、预算、原始证据一致，原控制身份未被覆盖；保留基线、未达标、未测及能力限制均如实呈现。写入验收报告，不把本节点未解决的问题交给回归节点处理。
acceptance:
- 'test -s "$WORK_DIR/opt/iteration.yaml"'
- 'test -s "$WORK_DIR/opt/candidates.yaml"'
- 'test -s "$WORK_DIR/opt/ledger.yaml"'
- 'test -s "$WORK_DIR/opt/decision.yaml"'
- 'test -s "$WORK_DIR/opt/pre-review.json"'
out_of_scope:
- 不创建、改写或扩展本轮 scripts/ 中由启动器提供的工作流工具，不通过自行生成验收脚本绕过门禁；缺失、参数不兼容或哈希失效时保留错误并终止，由 PM 处理工具供应。
- 不修改引用的 ops-opmodel-toolkit Skill、opmodel 通用框架或 harness，不自行启动子 Agent、子工作流或修改调度状态。
- 不修改 perf-contract.yaml、原始控制身份、已验收设计与接口、Golden、用例及精度标准，不扩大预算、变更设备或计量口径。
- 不以模型排名、诊断性采样、正确性失败版本或不可比证据采用候选，不以任务重试重启预算；目标和预算内没有下一步时不得无限探索。
context:
  execute:
    skills:
    - cannbot-dsl-best-practice
    - ops-theoretical-performance-estimation
    - cannbot-dsl-test-generator
  verify:
    skills:
    - cannbot-dsl-best-practice
    - ops-theoretical-performance-estimation
    - cannbot-dsl-test-generator
