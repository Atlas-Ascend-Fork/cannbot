title: Unit 规划｜从算子设计拆分实现单元
goal:
- 将已验收的算子设计拆分为具有依赖关系、可独立验收的最小纵向实现单元。
approach:
- 按本轮固定插件资源的 `$DOC_TEMPLATES_DIR/templates/节点资料与报告.md`，围绕本节点职责读取必要资料并引用原始证据，避免重复调查和报告全文抄写；保留本任务要求的实际执行与独立审查。
- 读取已验收的 `$WORK_DIR/design/selection.yaml` 了解路线与分组来源；实现契约以 DESIGN.md 为准。按设计中的真实能力增量及依赖拆分 Unit，承接参数选择、分发优先级和默认路径；模型组数不决定 Unit 或 Kernel 数量，不因组名或配置取值不同为同一能力重复建 Unit 或复制实现。同结构各组的参数选择可由同一 Unit 承接，也可随真实能力演进分阶段完成；存在结构差异、前置补证或独立能力边界时仍合理拆分，不强制合并 Unit、算法路径或必要编译特化。逐组选择条件、参数规则和边界判据须在既有义务或专项证据中有明确归属，共享实现不能省略这些要求；可行性补证按其执行条件安排到负责 Unit，补证先于首次消费。不重新分组、选优或要求模型运行时。
- 先读取 `$WORK_DIR/environment/environment.yaml` 与 `$WORK_DIR/design/doc/DESIGN.md`，只确认存在且可读，并按环境结论执行本工作流的放行政策：`final_status`
  的 `status` 为 `PASS` 且 `execution_mode` 为 `full` 时才继续；`WARNING/compile_only` 时终止本节点并判定验收失败，`FAIL/blocked` 或未知状态按契约错误终止；使用中发现输入矛盾时同样终止并说明。
- 将 `$WORK_DIR/design/doc/spec.yaml`、设计目录和已有实现信息提供给 `cannbot-dsl-unit-planner`；沿用其 Unit 格式和“逐份产出与检查”，在 `$WORK_DIR/design/units/` 产出 `U01.yaml` 至 `U<n>.yaml`，不修改 Skill。
- 首轮先读环境结论、spec、规划 Skill 的 Unit 格式、DESIGN 索引/能力路径及测试生成的公开契约，先在既有执行报告简记能力与依赖轮廓，再展开当前 Unit 的设计正文。不把通读下游工作流、全部测试资料或工具源码作为落盘前提；只有具体义务表达或接口疑问才定向补查，未解缺口仍按原规则阻断。
- 按规划 Skill 的逐份产出方法，当前 Unit 的能力边界和必要事实明确后即写入 U<nn>.yaml，用 YAML 解析器检查单一 unit 对象、文件名/ID 和原格式必需字段/义务，再推进下一份。不等待完整报告后一次性输出，不对尚未产齐的目录执行完整集合校验；边界变化同步修订受影响草稿。
- 逐份落盘仅保存草稿，不代表冻结或允许下游消费；事实不足时在既有报告记录待处理项，不写虚构判据或空壳 Unit。报告仅简记已产出文件、当前项及待核对条款；全部产齐后仍完成全量依赖、覆盖与子条件检查及原契约校验，再提交独立验收。
- 重试先读未关闭项、已有 U*.yaml 和执行报告，核对来源版本与适用性，沿用有效草稿并定向补齐当前/受影响项，不默认删目录、重写全部或重做下游调查。报告缺失时从文件和原始记录恢复定位；输入变化或草稿不可信时先核对影响，不因文件存在就认定可复用。
- 向规划 Skill 提供实现路径约定：公开模块为 `operators/<op>/<op>.py`；`<op>` 取 spec.op.name。每个 Unit 填写明确的允许修改文件；Unit 依赖表达能力或设计先后要求，共享写集的先后关系由实现节点按
  Unit 依赖处理。同时声明公开入口正常加载所需的包标记、注册或构建元数据路径；已有项目按实际包形态处理，不将包标记视为计算能力或新增 Unit。生产入口须加载本轮源码，模型/其他依赖的同名包不能替代目标实现，不能到实现阶段才越权补文件。
- 将设计中的导出入口和共享编译工厂纳入对应 Unit 的实现范围；公开可测行为与导出/编译产物验证分别按共享模板安排，不强挂同一种 TDD 义务；性能目标保留在设计验证方案，由性能节点实测，不声明为只靠 TDD 验收的 performance 义务。
- 按本轮固定插件资源的 `$DOC_TEMPLATES_DIR/templates/设计一致性证据.md` 中“规划与验证安排”承接当前 Unit 能力范围、义务触发、归属、可观察结果及判据，并向规划 Skill 提供测试生成公开契约。验证义务按该模板区分整项共同前提与各覆盖场景的适用条件；input_conditions 约束所有绑定用例，不把某个示例的精确参数作为整项限制。规划可构造条件和证据安排，具体输入、配方与断言留给测试；数值判别沿冻结比较口径和容差，混合要求在现有字段分别承接并保留必要联合证据。 接收入口的能力以当前测试生成 Skill 的公开契约为准，逐项确认输入可构造、观察量可获得且判据受该入口支持；不得把其他测试类型支持的判据直接用于 TDD，也不将白盒名称视为能够观测任意内部状态。入口不支持时保留原要求，在现有字段和报告中明确转交的可执行测试或专项证据、责任阶段、通过条件与首次消费时机；输出可观察的数值语义仍须由实际测试验证，源码评审不能替代。已有黑盒或白盒用例能够承接同一语义时允许复用，具体 Case ID 留给测试阶段核对，不为证据名称重复建例。
- 不设固定 Unit 数量，不发明设计中没有的算法、资源数字或测试 Case。具体 API、地址、事件编号及等价循环/索引写法由实现阶段在允许范围内选择，未定这些细节不算设计缺项；Unit 承接关键能力依据、约束与真实补证责任，不替实现者预选接口。真正缺少方案所需事实或能力依据时记录来源并按原协议终止，由框架处理结果。
- Unit 的 `design_sources` 记录实际设计文件与章节；具体测试输入、Case ID 和 Golden 留给测试生成节点。
- 将设计的强制承诺、允许选项和演进边界提供给规划 Skill；新增设计约束与补证须关联验证义务或明确的源码、编译产物、设备证据检查，不以描述字段代替完成判据。规划承接原设计要求及其所引用的选型前提，不自行增加实现形式限制；允许的 API 或代码选择保留为实现自由度，不因尚未选择具体写法而新增 feasibility_checks，真正需编译/设备确认的关键组合能力仍在首次消费前补证。通过判据描述需保持的数值/索引关系、覆盖边界及原设计明确冻结的执行结构；设计符号、伪代码及文档引用一致性要求，不自动转成源码变量名、表达式拼写或分支形式必须逐字一致。搬运粒度、调用次数等性能或结构承诺仍关联原设计依据完整承接，不因表达等价而删除；涉及容量、有效范围、补零或中转时，按设计的适用条件承接义务，不把预留容量、示例写法或未冻结的保守选择升级为必须初始化、写满 tile 或固定存储路径，也不据此自动增加填充区全零的回读验收。若设计范围与强制机制相互冲突或缺少实现所需依据，按原协议交回设计处理，不在规划或实现中自行删除冻结承诺；`review_evidence.reject_examples` 须指出违反的原承诺和判失败依据，不能仅因属于替代路线就拒绝原设计允许的回退或等价表达。
- 提交前从 DESIGN 强制承诺及全部必要子条件核对 Unit 集合的归属、可构造触发、公开判据或专项证据和时机，沿“规划与验证安排”保留一份简要依据与来源，不再复制完整设计验证矩阵。一个承诺 ID、依赖闭包或脚本成功不证明覆盖；仅按适用语义检查 dtype、数值/特殊值、边界、异常、分发和结构，不机械生成组合或新增业务要求。自检逐个覆盖场景与整项共同前提、Unit 域及实际派生关系是否相容，不只检查场景分别有解；不同输入共同完成的覆盖不强求单例满足，也不以示例取值排除其他必需场景。修正条件时按模板联查行为、观察量及判别子项，保留真实输入限制、必要数值与结构覆盖；不靠删轴、删条件或改成空泛判据收口。一个依据可支持多个条件；不生成 Case、Golden 或未来结果，未知项不能计为通过。 自检同时核对“义务能否由接收入口执行”和“转交要求是否有人承接”：前者检查当前公开契约，后者检查责任、通过条件和时机，不以删除义务、泛称后续验证或路径引用代替闭环。未来测试尚未生成不单独阻断规划，但不能提前标为已验证。 使用选定 "$PYTHON" 和已安装 cannbot-dsl-test-generator 的实际脚本绝对路径执行公开只读命令 scripts/build_tdd_cases.py --check-unit-contracts --units-dir "$WORK_DIR/design/units"，保留命令与退出码；该模式不需要 spec、DESIGN、CSV、Golden 或设备，与正式入口共用校验，只确认 Unit 接收契约，不代表用例绑定和触发已通过。 不同字段的契约分别核对，scope.domain_constraints 支持某关系不证明 input_conditions 支持；预检失败先在规划权限内修正原义务表达并保留语义，无法闭合不冻结。
- 义务与 Unit 不相容时，按模板“规划与验证安排”在本阶段修正条件、验证方式或归属，必要时调整能力边界并核对依赖与覆盖。更新 Unit 正文，在原报告保留条款去向、责任及时机，不只记为提示后放行；只有原设计要求完整保留、验证安排可落实且正文判据相互一致时才提交冻结验收。无法在权限内处理时按原协议终止，不留给测试生成解释矛盾或凑覆盖；规划不要求未来实现、编译或设备结果提前通过。
- 将节点执行过程写入 `$WORK_DIR/.workflow/reports/`，文件名包含节点 ID。
- 向规划 Skill 区分算子完整支持域与 Unit 阶段范围。规格支持域及其来源表决定全局业务要求，不补造界或把平台/实现限制写成需求；各 Unit 可按设计允许的真实能力增量声明合法子域，其形状、dtype、标量条件不是新增公开限制。scope.domain_constraints 保持非空并对应 supported_domain，无法表达的跨输入关系列明且保留验证责任。按规划 Skill 的阶段域与最小场景契约提供对应设计路径、最小场景依据、前序保留面和后继覆盖，不再另定义一套“全局最小输入”。错误码沿现有黑盒入口及 review_evidence 承接，公开验证权限与到期时机须可落实，不伪造异常 TDD，也不为兼容而延期前置要求。首个数值 Unit 在合法子域完成真实入口、必要计算和写回；可后置风险由后继承接，首次消费前补证及必要结构承诺不后移，不固定 Unit 数量、规模或特征清单。review_evidence 沿用必需字段和 reject_examples，以实际违反原承诺的情形说明判失败依据，不强迫每项都发明另一套算法或拒绝合法替代。
procedure:
- 按本轮固定插件资源的 `$DOC_TEMPLATES_DIR/templates/节点资料与报告.md`，围绕本节点职责读取必要资料并引用原始证据，避免重复调查和报告全文抄写；保留本任务要求的实际执行与独立审查。
- 首次验收从实际 DESIGN 承诺出发，按 `$DOC_TEMPLATES_DIR/templates/设计一致性证据.md` 的“规划与验证安排”独立审查 Unit 集合的能力增量、义务及必要子条件、域内可达性、归属、可观察性和判据，沿冻结比较口径判断数值可检出性；不只沿执行者映射或字段存在性审查。按同一模板逐场景核对其能与 Unit 域、整项共同前提及派生关系同时成立，input_conditions 未把示例锁成全局限制；多个互斥场景允许分别由不同输入覆盖，不因未生成具体用例而失败。输入条件、行为、观察量和必要判别子项相互一致；不得以删除覆盖、必要共同前提或结构承诺绕过矛盾。反向核对满足当前判据的实现是否仍可能违反应承接的原要求；必要数值义务和结构证据均不能漏，另有 review_evidence 或报告记录不豁免正文矛盾。只验收可落实的规划及责任时机，不要求完整测试输入或未来编译/设备结果；缺口指出后交执行者处理，不替其补写。 独立核对每条测试义务的输入、观察量和判据受实际接收入口支持，跨测试类型的判据未混用；转交要求保留原语义且有可执行的承接方式、责任阶段、通过条件和首次消费时机，不只检查正文存在交接描述。可观察数值语义未以源码评审替代，允许复用能够覆盖同一语义的既有黑盒或白盒测试；本阶段验收安排可落实，不要求未来 Case 已产生或设备结果提前通过。
- 先核对义务可达性、归属与可判定性；发现阻断后继续收齐不依赖该错误、可独立完成的轻量静态检查，受阻部分注明未检查原因，不强制继续昂贵检查。重验先处理修改和关联影响，再补此前未检查项；只有原报告明确检查、内容/依据未变且不受影响的结论可以复用，不能把上一轮未发现的问题当作已通过，也不默认重新生成全部草稿或复跑全域检查。
- 核对 Unit 的划分依据是 DESIGN 中的真实能力边界、前置补证与依赖，未按模型组数机械设定 Unit/Kernel 数量，也未只因组名或配置取值不同重复规划同一能力；共同实现可承接多组参数选择，确需拆分或编译特化时有原设计依据，不反向要求合并。全部可达路径、各组选择条件与参数规则、重叠优先级、边界和默认路径均有明确的义务或专项证据归属，共享实现未造成漏验。关键补证已分配到负责 Unit，执行顺序在首次消费前且有通过判据与失败阻断；本节点只验收规划，不要求尚未实现的补证结果，未把离线 case 分组或预测排名当作实现完成证据。
- 核对环境结论与 `environment.yaml` 原文一致：状态为 `PASS` 且执行模式为 `full` 时已放行，`WARNING/compile_only` 时本节点未产出 Unit 且判定验收失败；未把拒绝实现的环境继续推进，也未把该政策写成环境
  Skill 的原始结论。
- 运行 `"$PYTHON" "$WORK_DIR/scripts/validate_unit_contracts.py" --units-dir "$WORK_DIR/design/units"`，校验能力依赖闭包、义务 ID、设计约束与补证关联；失败时停止交接测试生成。脚本检查声明结构，不证明人工证据已通过。 同时核对上述测试生成 Skill 的 --check-unit-contracts 预检真实通过，结构门禁不能替代接收谓词检查；不支持的条件仍在当前阶段阻断，不以报告转交或未来验收代替可执行规划。
- 核对每个 Unit 文件可解析，依赖无环，`requires` 能由依赖中的 `provides` 满足，首个数值 Unit 有独立端到端验收义务。
- 核对公开模块的包结构及必要标记/元数据已进入允许写集，生产源码与模型依赖的加载边界清楚；不以只声明模块字符串代表能够加载，不要求此阶段执行尚未实现的目标。
- 核对各 Unit 的设计来源真实存在且内容相关，没有固定数量假设或提前分配的测试 Case。
- 核对 supported_domain 与边界、out_of_scope 及后继覆盖一致，能力依赖与写入顺序原因明确；设计约束和补证有义务关联或带通过判据与 reject_examples 的 review_evidence，输入触发条件对应真实故障面。
- 核对 scope.domain_constraints 与 supported_domain、当前能力和设计允许的阶段边界一致且可机器校验，未把阶段子域误作算子全局支持域。按规划 Skill 的同一口径独立核对设计路径、最小场景来源、前序保留面及后继覆盖，不要求全部 Unit 共用同一数值；依据不足或设计承诺不能保留仍指出缺口。错误码证据的入口、权限、责任及时机闭合，未误挂异常 TDD、包装普通输出或提前宣称已验证，也未延迟前置要求。不能为迁就工具删除设计要求或永久缩减支持域；真正超出规格、缺少设计依据或无法合理覆盖时按原协议返回，不能用域外输入凑判别力。跨输入关系等无法表达项已列明，不以自然语言代替可执行声明。
- 核对算子全局需求仅采用 spec 支持域声明表有依据的 specified/derived 断言，implicit 按约定处理，platform/implementation 作为限制，未声明的界不补造数值。另独立核对 Unit 阶段子域来自真实设计能力增量、依赖及后继覆盖；合法的阶段收窄不成为新增公开需求，也不因其界未逐字出现在规格表而否决。
- 核对每条强制承诺的 `review_evidence.reject_examples` 说明实际违反原承诺的情形及判失败依据，不强迫为每项发明另一套算法；不能将原设计明确允许的回退或等价表达作为拒绝理由，也未在规划中自行增加实现形式限制；未因 API、地址、事件编号尚未选定而拒收或制造前置补证，真正的能力缺口仍保留责任、判据与时机；判据核对实际数值/索引关系、覆盖边界和明确冻结的执行结构，未把设计符号、伪代码或文档引用一致性升级为源码逐字匹配。搬运粒度、调用次数等性能或结构要求有原设计依据且未被语义等价说明豁免；容量、有效范围、补零与中转的义务符合设计适用条件，未将预留容量、示例或未冻结的保守选择提升为强制机制或额外回读门槛；设计本身冲突时已按原协议交接，未自行豁免冻结承诺。只写正向存在性判据判失败。
- 将验收结论与证据写入 `$WORK_DIR/.workflow/reports/`。
acceptance:
- set -- "$WORK_DIR"/design/units/U*.yaml; for unit_file do test -s "$unit_file" || exit 1; done
- Unit 契约校验退出码为 0，记录对应本轮 Unit 文件；设计约束与补证关联无缺项。
out_of_scope:
- 不创建、改写或扩展本轮 scripts/ 中由启动器提供的工作流工具，不通过自行生成验收脚本绕过门禁；缺失、参数不兼容或哈希失效时保留错误并终止，由 PM 处理工具供应。
- 不生成 Golden、白盒或 TDD Case，不编写实现，不运行设备精度或性能验证。
context:
  execute:
    skills:
    - cannbot-dsl-unit-planner
    - cannbot-dsl-test-generator
  verify:
    skills: []
