title: M2｜CANNBotDSL 黑盒用例设计
goal:
- 依据冻结规格形成覆盖合法行为、边界及异常语义的可执行黑盒用例。
approach:
- 按本轮固定插件资源的 `$DOC_TEMPLATES_DIR/templates/节点资料与报告.md`，围绕本节点职责读取必要资料并引用原始证据，避免重复调查和报告全文抄写；保留本任务要求的实际执行与独立审查。
- 必须加载 `cannbot-dsl-test-generator` Skill，只运行其 DSL 黑盒用例设计模块；输入与输出均以本工作流的 CANNBotDSL 算子契约为准。
- 将 `$WORK_DIR/design/doc/spec.yaml` 与 `$WORK_DIR/operators/<op>/test/` 分别作为规格和测试目录传给 Skill，按其当前黑盒设计与校验方法执行，保存覆盖报告及校验记录。
- 直接编写 `$WORK_DIR/operators/<op>/test/testcase.csv` 的 blackbox 行，每例绑定真实 spec 路径、公开输入配方及期望。正常用例须符合公开支持域；负向或明确要求的域外行为沿冻结契约核对故意违反的条件、其余前提、调用入口及结果，不从参考实现或“防御”标签新增保证。若冻结规格对同一调用同时要求拒绝和成功返回，保留证据按原协议终止，不自行修改规格或以 excluded 掩盖冲突。固定配方不能表达的复杂布局/结构按原规则记录排除理由或采用经验证扩展，不以口头声明代替可执行 case。
- 使用 Skill 的 `update_case_group.py --sheet blackbox` 在锁内重读、更新并原子保存 CSV，保留并行节点写入的 performance 行。
- 本节点只编辑 `$WORK_DIR/operators/<op>/test/testcase.csv` 的 blackbox 分组。异常用例必须对应 spec.op.error_codes 和 raises_error 语义；生成阶段不调用被测算子，也不依赖 DESIGN.md、Golden 或 Unit。
- 将本节点执行过程记录写入 `$WORK_DIR/.workflow/reports/`，文件名包含节点 ID；业务产物仍写入本任务约定的位置。
procedure:
- 按本轮固定插件资源的 `$DOC_TEMPLATES_DIR/templates/节点资料与报告.md`，围绕本节点职责读取必要资料并引用原始证据，避免重复调查和报告全文抄写；保留本任务要求的实际执行与独立审查。
- 核对数学语义、dtype 组合、分支、边界和极值有可追溯 case 或按原规则说明的排除理由；沿真实输入及 spec 独立确认正常支持域、负向前提、公开入口和期望一致。参考实现的域外返回未被当成新增保证；明确要求的域外行为未漏验。使用中发现同一调用结果冲突时不因上游已通过而继承放行，也不能用排除行代替冲突裁决；只审本节点使用的契约，不重复整体验收上游。
- 核对 testcase.csv 中的输入名称、dtype、rank 与预期错误代码通过脚本校验。
- 核对 `operators/<op>/test/testcase.csv` 的 blackbox 逻辑分组非空、case_id 唯一，且生成阶段未调用被测算子。
- 核对未将外部用例表或未执行场景写成已通过结果；黑盒设计只产用例，实际设备判定留给精度验证节点。
- 将验收结论与证据写入 `$WORK_DIR/.workflow/reports/`，文件名包含节点 ID。
acceptance:
- 'test -s "$WORK_DIR/operators/<op>/test/testcase.csv"'
out_of_scope:
- 不实现算子，不生成 Golden、白盒或 TDD 用例，不执行设备精度和性能测试。
context:
  execute:
    skills:
    - cannbot-dsl-test-generator
    - ops-direct-invoke-repo-guide
  verify:
    skills:
    - ops-direct-invoke-repo-guide
