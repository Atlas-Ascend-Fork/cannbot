title: 检视基线｜保存已验证实现与冻结用例
goal:
- 保存功能已通过的算子版本，为风格修复提供固定回归依据和可恢复基线。
approach:
- 读取 $OPS_DIRECT_INVOKE_ROOT/docs/code-versions.md，通过 $OPS_DIRECT_INVOKE_ROOT/tools/code_versions.py status --node precision-validation 获取 CODE_DIR 和已验收的完整 SHA。沿用统一代码仓，不另建 Git 仓库或 baseline 标签；baseline.json 记录此已验收提交，不能以新提交替代精度证据。
- 从精度执行记录沿用 CANNBOTDSL_OP_ENTRY 与 CANNBOTDSL_ERROR_MATCHER（未设置时分别使用 run 与空值），先从该提交的 versioning/artifacts 原始结果按三组复制到 $WORK_DIR/review-fix/baseline-results，再运行 $OPS_DIRECT_INVOKE_ROOT/tools/review_fix.py baseline --work-dir "$WORK_DIR" --code-dir "$CODE_DIR" --commit <精度已验收完整SHA> --results-dir "$WORK_DIR/review-fix/baseline-results"。脚本只读核对统一仓库、精度验收与结果摘要，输出保存为 baseline.json；已有记录时核对一致后复用，不覆盖冻结记录。
- 自行将原全量结果复制到 $WORK_DIR/review-fix/baseline-results，避免后续 runner 覆盖基线证据；基线与冻结资产在整个检视修复阶段保持不变。
- 将节点执行记录写入 $WORK_DIR/.workflow/reports/，文件名包含节点 ID。
procedure:
- 核对 baseline 提交、baseline.json 和 baseline-results 对应统一代码仓上游 precision-validation 已验收版本；源码与测试资产均纳入基线，缓存和输出位于代码仓外。
- 运行相同的只读基线检查命令，核对输出与 baseline.json 及保存的原始结果一致；脚本不负责 Git 提交或恢复。
- 核对冻结清单包含规格、设计、用例、Golden、测试入口与辅助模块，三个分组原始结果覆盖冻结的 case；不重复执行上游全量测试。
- 将验收结论与证据写入 $WORK_DIR/.workflow/reports/，文件名包含节点 ID。
acceptance:
- test -s "$WORK_DIR/review-fix/baseline.json"
- test -s "$WORK_DIR/review-fix/baseline-results/blackbox/verify_result_blackbox.csv"
- test -s "$WORK_DIR/review-fix/baseline-results/whitebox/verify_result_whitebox.csv"
- test -s "$WORK_DIR/review-fix/baseline-results/tdd/verify_result_tdd.csv"
out_of_scope:
- 不修改算子、规格、设计或测试资产，不重跑测试，不覆盖已有基线或操作宿主仓库。
context:
  execute:
    skills: []
  verify:
    skills: []
