title: 检视基线｜保存已验证实现与冻结用例
goal:
- 保存功能已通过的算子版本，为风格修复提供固定回归依据和可恢复基线。
approach:
- 按本轮固定插件资源的 `$DOC_TEMPLATES_DIR/templates/节点资料与报告.md`，围绕本节点职责读取必要资料并引用原始证据，避免重复调查和报告全文抄写；保留本任务要求的实际执行与独立审查。
- 启用性能优化时直接使用联合迭代已验收的 `opt/pre-review.json` 和 `opt/pre-review-results/`，检视实际选定的候选或原始控制；未启用时使用全量精度验证节点已验收的实现和证据，在 $WORK_DIR/operators/<spec.op.name> 开发目录自行管理 Git，元数据独立存放在 $WORK_DIR/review-fix/git；提交全部源码与测试资产并保留 baseline 标记，不纳入 .case_cache、__pycache__ 等派生缓存与 testcase_output 测试输出，不操作宿主仓库暂存区。
- 从待检视指针的 runtime（无优化时从精度执行记录）沿用 CANNBOTDSL_OP_ENTRY 与 CANNBOTDSL_ERROR_MATCHER（未设置时分别使用 run 与空值），运行本 Skill 的 "$PYTHON" "$WORK_DIR/scripts/review_fix.py" baseline --work-dir "$WORK_DIR"。脚本只读核对 baseline 提交与当前源码、测试资产一致及原通过证据完整；通过后将输出的提交号、资产哈希、case 清单、设备与运行入口保存为 $WORK_DIR/review-fix/baseline.json，不覆盖已冻结记录。
- 优化路径下脚本核对 pre-review 的源码/测试哈希与工作树一致，沿用对应全量结果，不使用优化前旧 CSV 冒充候选证据；在 baseline.json 中保存 input_selection。两个 Git 仓的 commit 可因元数据不同而不同，用源码/测试哈希及来源 commit 映射身份，不假定 opt/git 与 review-fix/git 的提交号相同。
- 自行将对应版本的全量结果复制到 $WORK_DIR/review-fix/baseline-results，避免后续 runner 覆盖基线证据；基线与冻结资产在整个检视修复阶段保持不变。
- 将节点执行记录写入 $WORK_DIR/.workflow/reports/，文件名包含节点 ID。
- performance 分组非空时一并冻结 case 清单和正确性结果，基线恢复时使用原结果，不做性能计时；为空时记录未提供，不要求该组结果。
procedure:
- 按本轮固定插件资源的 `$DOC_TEMPLATES_DIR/templates/节点资料与报告.md`，围绕本节点职责读取必要资料并引用原始证据，避免重复调查和报告全文抄写；保留本任务要求的实际执行与独立审查。
- 优化路径核对 input_selection 对应 opt/pre-review 的来源与哈希、decision 及全部适用分组原始全量结果，保证检视覆盖选定优化实现或原控制。
- 核对 baseline 提交、baseline.json 和 baseline-results 对应上游已通过版本，Git 元数据位于本轮 review-fix/git；源码与测试资产均已纳入基线，缓存和测试输出未混入提交。
- 运行相同的只读基线检查命令，核对输出与 baseline.json 及保存的原始结果一致；脚本不负责 Git 提交或恢复。
- 核对冻结清单包含规格、设计、用例、Golden、测试入口与辅助模块，各适用分组原始结果覆盖对应组冻结的全部 case，非空 performance 未遗漏；不重复执行上游全量测试。
- 将验收结论与证据写入 $WORK_DIR/.workflow/reports/，文件名包含节点 ID。
acceptance:
- test -s "$WORK_DIR/review-fix/baseline.json"
- test -s "$WORK_DIR/review-fix/baseline-results/blackbox/verify_result_blackbox.csv"
- test -s "$WORK_DIR/review-fix/baseline-results/whitebox/verify_result_whitebox.csv"
- test -s "$WORK_DIR/review-fix/baseline-results/tdd/verify_result_tdd.csv"
out_of_scope:
- 不创建、改写或扩展本轮 scripts/ 中由启动器提供的工作流工具，不通过自行生成验收脚本绕过门禁；缺失、参数不兼容或哈希失效时保留错误并终止，由 PM 处理工具供应。
- 不修改算子、规格、设计或测试资产，不重跑测试，不覆盖已有基线或操作宿主仓库。
context:
  execute:
    skills: []
  verify:
    skills: []
