title: 门禁｜检查环境状态并决定是否实现
goal:
- 根据环境结论决定是否放行实现及其后续验证流程。
approach:
- 使用已验收的 `$WORK_DIR/environment/environment.yaml` 和 `$WORK_DIR/design/doc/DESIGN.md`，只确认文件存在且可读取；根据环境结论执行本工作流的放行政策。使用中发现输入矛盾时终止并报告。
- 将放行或拒绝的决定及所依据的环境状态、设计文件路径写入 `$WORK_DIR/.workflow/implementation-gate-decision.yaml`。
- '`PASS/full` 时决定为放行；`WARNING/compile_only` 时按本工作流的更严格政策决定为拒绝；`FAIL/blocked` 或未知状态属于契约错误，按执行协议终止本节点并说明证据。'
- 将本节点执行过程记录写入 `$WORK_DIR/.workflow/reports/`，文件名包含节点 ID；业务产物仍写入本任务约定的位置。
procedure:
- 核对门禁决定与 `environment.yaml` 的 `final_status` 原文一致，所引依据文件真实存在。
- '仅当 `final_status.status: PASS`、`execution_mode: full`、已验收的 `DESIGN.md` 存在且可读取时，确认决定为放行并验收通过。'
- '`WARNING/compile_only` 时确认决定为拒绝，并判定本节点验收失败，以保证实现、精度、性能、文档、检视和交付节点不被调度。'
- 将验收结论与证据写入 `$WORK_DIR/.workflow/reports/`，文件名包含节点 ID。
acceptance:
- 'test -s "$WORK_DIR/.workflow/implementation-gate-decision.yaml"'
out_of_scope:
- 只写本节点的门禁决定和报告，不修改环境或设计产物，不重新执行环境探测或方案设计。
context:
  execute:
    skills: []
  verify:
    skills: []
