title: 规格｜生成结构化算子规格
goal:
- 将已确认的需求转换为结构化算子规格。
approach:
- 资料仅列 MERE/MARE、阈值或基础通过条件，不等于明确要求单阶段；核对引用的完整标准。新任务受支持的浮点输出默认 staged_relative、fallback.reference_mode=native，并明确高精度主参考和同精度参考的职责、计算及舍入语义；整数、布尔默认精确比较，不要求同精度辅助参考。明确要求其他标准才覆盖，不自动迁移冻结契约。
- 生成器、注册表和示例填入的初始容差不是用户或目标规格的明确标准。无明确标准时，调用 DSL 测试 Skill 的 check_tolerance.py --spec SPEC --defaults 取得只读默认提案（不是当前 spec 的校验结果），将其中 source/per_dtype 写入待冻结 spec，再执行普通精度预检和完整规格校验。采用 DSL 测试 Skill 的内置默认值：支持的浮点 dtype 使用 staged_relative 完整两阶段，整数/布尔使用精确比较；将实际 per_dtype、阈值及默认依据写入 spec。已有用户/规格明确标准优先，不能用默认值覆盖、近似替代或放宽。完整契约只能选工具支持的策略，不能将阶段二写成说明或旁路附件后让单阶段预检代表兼容。
- 按本轮固定插件资源的 `$DOC_TEMPLATES_DIR/templates/节点资料与报告.md`，围绕本节点职责读取必要资料并引用原始证据，避免重复调查和报告全文抄写；保留本任务要求的实际执行与独立审查。
- 必须加载 `ops-spec-gen` Skill，使用其非交互入口，按其中的要求执行。
- 生成前必须读取该 Skill 的 category、paradigm 和 category-paradigm 映射注册表；范式分类在本节点完成并冻结，后续设计节点不得重新选择。
- 读取需求分析节点的有效产物，生成算子接口、输入输出、属性、数据类型、shape、格式、约束、异常语义、精度标准和性能目标，以 `$WORK_DIR/design/doc` 作为生成器 `--output-dir`。
- 恢复或重试时先读取本节点已有 spec、有效校验记录及反馈，确定实际缺项与变化；有效规格继续使用，不因尝试轮次变化重新生成。上游已验收的需求直接消费；发现输入缺陷时记录并终止，不在本节点重做需求验收。
- 依据已确认需求补齐规格并执行 Skill 的完整校验，保存命令、退出码和 findings；缺少依据或存在未决项时记录并终止，不补造事实。
- 在本节点执行记录保留 spec 中所有数值/枚举断言的来源与推导依据，覆盖 shape_constraints.symbols.* 的 range 下界与上界（含未声明的界）、const 值、rank、属性约束与默认值、outputs.*.shape_bounds、dtype 组合、精度契约、reduction.fixed_value、boundary/extreme 的数值阈值及 global_constraints 跨字段关系。同一来源或同一推导规则可合并说明，明确对应字段及适用范围，直接引用已确认需求条目或已有有效证据；不要求每个断言独立成行、固定表格或重复抄写原文。合并记录不减少完整规格的核对范围。
- 来源明确给出的值须可定位到包含该值的原文；推导值和隐含约定须说明关系及依据，平台或实现限制不得冒充需求界。对新增、收紧、推导或存在争议的约束展开具体依据及必要原文；其余沿用已确认条目引用，不重复抄写。缺失的界不得补造，无依据的约束不得冻结；不以合并说明掩盖个别字段的来源缺失、不同取值或适用条件。
- "范式边界清单只提供候选，不决定公开保证。依据已确认来源（desc、proto、需求分析）和支持域逐项处理候选提示：域内适用边界、明确要求的域外行为须补齐；域外且来源未规定行为时，在既有执行记录说明不适用，不创建可执行条目。支持域外不等于必须拒绝，不据模板或参考实现内部防御新增结果、报错或错误码。来源明确要求报错时须有校验层、可触发输入及预期；同一公开入口、输入和条件下不得同时要求拒绝与成功返回。自检按同一口径核对实际保证及候选处置；适用性或必须交付的保证确实未决时记录并终止，不将候选 info 当硬门禁，也不以校验返回 0 代替语义核对。"
- 已有完整校验和精度预检证据仅在其对应的 spec、相关输入、工具及运行条件仍适用时复用；必要证据缺失或失效时补齐对应检查。规格修改后执行最终 spec 的完整校验，规格或预检依赖变化使预检身份失配时更新相应预检，不以局部检查冒充完整校验。
- 必须加载 `cannbot-dsl-test-generator` Skill，按其中的精度契约预检入口执行，只检查当前 spec 的测试消费能力；在规格冻结前保存命令、退出码、spec 哈希和逐 dtype 判定策略。指标、公式、阈值及独立主参考的精度/舍入语义须与已确认需求一致，使用测试 Skill 支持的内置比较策略；资料来源不自动决定比较器，不用注册表默认值覆盖已确认标准。工具不支持或依赖缺失时在本节点记录能力缺口并终止，不把冲突留给测试生成重试。
- 将本节点执行过程记录写入 `$WORK_DIR/.workflow/reports/`，文件名包含节点 ID；业务产物仍写入本任务约定的位置。
- 规格及其证据索引维护当前有效内容：索引引用适用于当前 spec 的命令、退出码、findings、版本和原始结果，每次真实执行的证据只保存一份。重试原因、历史比较和本轮复核过程写入本次尝试的节点报告并保留旧报告，不向证据索引追加逐轮复核章节；已有有效证据只引用，不复制或仅为换成本轮时间而重跑。
procedure:
- 核对来源是否为完整判定流程，阈值摘要不能作为仅限单阶段的依据；默认策略及 reference_mode 与公共精度预检一致。此处只验收规格表达与预检，不要求尚未生成的 Golden 绑定或目标执行结果。
- 核对已区分明确标准与生成器/示例默认；无明确标准时，最终 spec 实际采用统一默认值，普通精度预检和完整规格校验均针对写回后的同一版本，不能以 --defaults 提案通过替代。核对未指定时实际采用并冻结内置默认策略及其参数；已有明确标准完整承接，所选正式策略与全部数值要求一致。只校验局部阈值或补充文字、存在不受支持的判据时不得放行；不要求用户额外提交独立数值契约文件。
- 按本轮固定插件资源的 `$DOC_TEMPLATES_DIR/templates/节点资料与报告.md`，围绕本节点职责读取必要资料并引用原始证据，避免重复调查和报告全文抄写；保留本任务要求的实际执行与独立审查。
- 审查执行者的完整校验记录，确认对应当前 spec 且返回 0；证据不足时退回补齐，不重跑同一校验代替执行者提供证据。
- 逐项核对 `spec.yaml` 覆盖接口、输入、输出、属性、dtype、shape/格式约束、精度口径和异常边界。
- 核对每条规格可追溯到 `$WORK_DIR/design/doc/REQUIREMENTS.md` 的已确认需求；不存在 TODO、会阻断黑盒设计或方案设计的未决项及相互冲突的约束。
- 对照完整 spec 核对所有数值/枚举断言的来源及推导，覆盖 symbol 下界/上界（含未声明的界）、const、rank、属性约束及默认值、shape_bounds、dtype 组合、精度契约、reduction.fixed_value、boundary/extreme 数值阈值及 global_constraints 跨字段关系。允许合并记录、直接引用已确认需求或有效证据，但须确认所关联字段和适用范围均被覆盖，不能仅抽查部分字段或以记录数量代替完整语义审查。
- 核对来源原文确实支持所声明的值，推导及隐含约定有依据，平台或实现限制未冒充需求界；重点核对新增、收紧、推导或争议约束。无依据的约束、遗漏、错误和冲突仍判不合格，缺失的界不得补造；仅未独立成行、未使用固定表格或未重复抄写已有原文不单独判失败。
- 核对边界和异常保证及候选提示的处置均依据已确认来源和支持域：域内适用边界、明确要求的域外行为没有遗漏；不适用理由可定位，未因范式清单、参考内部防御或支持域限制而新增报错或结果承诺。声明报错有来源、校验层、可触发输入及预期；同一入口、输入和条件下的结果相容。候选未登记的 info 不单独判失败，标签命中或工具通过也不代替语义审查；真实保证遗漏、无依据新增承诺或影响公开契约的未决项仍判失败。
- 核对精度契约预检证据对应最终 spec 且通过；逐 dtype 的指标、公式、阈值及 backend 忠实执行权威标准，独立主参考职责和实际内置比较策略可追溯。只有本地附加检查时不得冒充权威验收；会阻断实现的附加标准也须有已确认依据。工具能力检查通过不代替上述语义核对；缺口未解决不冻结规格，不重复运行已有有效预检。
- 以当前 spec 和适用证据完成独立验收；恢复或返工时核对反馈项及变化影响，仍满足全部规格验收要求。证据索引须可定位当前有效原始记录，不要求每轮追加复核章节或复制历史证据；已有记录并不等于已验收通过，缺少有效裁决时仍独立给出本次结论。
- 将验收结论与证据写入 `$WORK_DIR/.workflow/reports/`，文件名包含节点 ID。
acceptance:
- 'test -s "$WORK_DIR/design/doc/spec.yaml"'
- 本节点执行记录或其引用的有效证据覆盖完整 spec 的数值/枚举断言及来源、必要推导与适用范围；同源或同规则可合并记录并明确对应字段。无依据的约束、遗漏、错误或冲突判失败，不因缺少独立表格行、固定格式或重复原文而失败。
out_of_scope:
- 不生成测试代码、CANNBotDSL 实现或设计方案。
- 正式规格及证据索引只承载当前有效内容和必要引用；每次尝试的过程与历史结论保存在节点报告，不写入业务正文，不删除仍需追溯的原始证据。
context:
  execute:
    skills:
    - ops-direct-invoke-repo-guide
    - ops-spec-gen
    - cannbot-dsl-test-generator
  verify:
    skills:
    - ops-direct-invoke-repo-guide
