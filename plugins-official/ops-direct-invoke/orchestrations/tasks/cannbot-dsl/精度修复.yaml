title: 精度修复｜按失败清单归因并修复
goal:
- 依据预检失败清单定位并修复实现问题；失败源于冻结用例或设计时带证据终止；修复后重跑受影响分组，供最终节点放行。
approach:
- 正式执行沿冻结完整数值策略，未指定时使用已写入 spec 的内置默认策略；TDD、筛选、预检及 --all 的结果由同一固定 runner 判定。两阶段的最终 status 直接进入既有结果绑定和门禁，旁路检查只用于诊断；不能为消除阶段一红灯改算法/阈值或自行追加比较文件代替正式绿灯。
- 按本轮固定插件资源的 `$DOC_TEMPLATES_DIR/templates/节点资料与报告.md`，围绕本节点职责读取必要资料并引用原始证据，避免重复调查和报告全文抄写；保留本任务要求的实际执行与独立审查。
- 读取 `$WORK_DIR/precision/precheck.yaml`、`$WORK_DIR/precision/precheck/` 的逐例结果、实现节点验收报告与 `$WORK_DIR/design/units/`。
- 由 `precision-final` 回退而来时，先读 `$WORK_DIR/precision/execution.yaml`、`precision-report.md` 与最新逐例结果，只处理新增失败与未关闭项，已完成修复不重做、不覆盖既有 fix-report 记录。
- 无失败项时只写 `$WORK_DIR/precision/fix-report.md` 记录“零修复”，不修改源码、用例或设计。
- 有失败项时逐条归因后再改：
  - 实现问题（分支未实现、关键参数未生效、边界或异常语义错误、精度实现偏差）→ 在 Unit 声明的源码路径范围内修复，不改用例、Golden、断言或阈值；
  - 用例或设计冲突（样例与 spec 矛盾、分支条件不可达、设计未覆盖该路径）→ 记录 case_id、依据与影响，按执行协议终止，不自行改写冻结资产。
- 修复反馈与分组回归分开：每类已有明确失败的修复先用固定 runner 公开入口 `"$PYTHON" "$WORK_DIR/operators/<op>/test/test_<op>.py" --sheet <原失败分组> --case-id <原失败ID> --device <目标设备> --require-accelerator` 确认；多例用 --grep 将原 case ID 正则转义并完整锚定后同进程批跑，不同时传 --case-id。选择能区分已知原因的原失败用例，记录依据；保持正式环境、目标模块/入口、错误匹配器及原输入、seed、断言、repeat 和完整调用序列，不调用 runner 私有函数或另写比较器。诊断仍失败先继续定位或按权限交接，不机械重跑整组；诊断通过只说明该范围修复有效，不作为本节点交付或全量放行证据。
- 在现有 fix-report 中记录本批次的失败项、实际源码差异及受影响分组并集；同组多类修复不因类别数量重复整组回归。各项有必要诊断依据且该批次代码稳定后，经 `"$PYTHON" "$WORK_DIR/scripts/check_impl_progress.py" --work-dir "$WORK_DIR" --run-sheet <受影响分组> --device <目标设备>` 对每个需回归分组完整执行一次并产生正式版本绑定，确认原本通过的用例未回退。分组依据原失败行及共享源码影响确定，来自最终节点的 TDD 失败也须处理；performance 无 active 行不执行。不能以“不是本次失败分组”为由忽略共享改动影响。
- 共享路径、布局、同步或调用状态等影响无法可靠缩小，或疑似跨用例状态/顺序问题时，及时扩大诊断或执行必要整组检查，不等到批末才处理已知回退。筛选必须保留触发所需前置与顺序，公开接口无法保持时使用原始批次；未复现不得写成已修复。合并仅减少不必要重复执行，不能用作无证据批量改动或跳过问题的理由。
- 诊断与正式分组回归分开归档到 `$WORK_DIR/precision/fix/<轮次>/`，保存各次命令、退出码、实际加载/环境、源码与用例版本、选中集合、逐例结果及正式 execution 绑定。批末分组回归对应同一最终代码版本；中途再改源码使证据失效时重新取得必要结果，不拼接旧版本通过、不补签绑定。恢复时当前版本完整分组证据仍有效可引用，不为重填报告重复运行；没有可归因失败或已有有效诊断时不额外补造单例运行。
- performance 仅在有 active case 时执行；其失败与其他正确性失败同样归因、修复，不在此测量性能。
- 按失败逐项更新 `$WORK_DIR/precision/fix-report.md`：case_id、归因类别、修改位置、诊断依据、受影响分组及回归范围理由、正式分组回归的命令/版本/结果与未解决项；同次整组结果由多项引用，不重复抄写或伪装成多次执行。本节点完成受影响分组回归后交接，不能凭诊断或分组通过替代 precision-final 对全部适用分组的完整放行；已取得当前版本有效绑定的完整分组结果可由终验复用，终验仍须补齐其他缺失、失效或失败分组，不因修复报告或局部通过宣称全量完成。
- 沿用 $DOC_TEMPLATES_DIR/templates/设计一致性证据.md；修改实现后在 implementation/design-evidence.yaml 追加本次影响分析及受影响承诺的新证据，先复核实际新代码再更新 snapshot，保留旧版本记录。检查完整性和当前源码绑定，不能只刷新哈希复用已经失效的结构结论；无法按原设计修复则在本节点终止。
- 修改实现时加载 `cannbot-dsl-best-practice`，保持冻结的接口、执行路径、精度口径与设计承诺；状态与预算由 harness 管理，不在节点内自行循环计数。
- 遇到疑似冻结输入或其他阶段缺陷时，在本节点原执行报告按“测试执行记录”的阻塞交接要求保留最小判别证据，说明事实与假设、相关 case/Unit/条款和版本、当前权限内无法修复的原因、建议负责阶段及影响范围；不能仅凭实现或测试失败归咎上游。重试先核对这些条件，未变化只补条件复核并引用已有证据，按原协议结束，不重复完整调查或越权改冻结资产。
procedure:
- 核对正式结果反映 spec 的完整策略、参考身份及当前 runner 版本，复用仍有效的完整策略结果，不给旧单阶段/旁路 CSV 补签。比较器能力或契约不一致时按原协议报告，不将其误判为候选算法错误，也不降低设备、覆盖或结构证据要求。
- 按本轮固定插件资源的 `$DOC_TEMPLATES_DIR/templates/节点资料与报告.md`，围绕本节点职责读取必要资料并引用原始证据，避免重复调查和报告全文抄写；保留本任务要求的实际执行与独立审查。
- 独立审查阻塞归因和交接证据，区分当前节点可修复问题与需其他阶段处理的缺口；归因不足时指出需要补齐的具体判别证据，不把执行者猜测作为上游返工结论。未解决阻塞维持失败，按既有摘要长度和报告路径约定交接；不调度其他节点，也不放宽冻结资产或验收标准。
- 源码有修改时，独立核对受影响设计承诺的证据已更新、其余复用有依据，运行 "$PYTHON" "$WORK_DIR/scripts/check_design_evidence.py" --work-dir "$WORK_DIR"；强制承诺不一致或证据不足时不通过，不以精度恢复代替设计符合性。零修复时直接复用当前有效记录，不重建证据。
- 核对每条失败项都有归因与处置（修复或带证据终止），没有未归因就改代码的情况。
- 核对修改范围未越过 Unit 允许的源码路径，spec、DESIGN、Unit、用例、Golden 与阈值未被修改。
- 独立核对每类修复的诊断选择、原用例触发上下文与实际结果；诊断未复现、筛选漏测或只有诊断通过不能算完成分组回归。按实际源码差异复核受影响分组并集，批次最终版本有各必要分组全部 active 用例的真实回归及有效绑定，原本通过的用例未回退；共享影响或状态问题有及时扩大的检查，未解决项如实列出。
- 同组多类修复可引用同一次当前版本完整分组执行，不要求为每个类别重复整组；不得拼接失效结果、只换哈希或补造诊断记录。核对 fix-report 与原始结果、命令、退出码和版本对应，诊断和分组回归均未被表述为最终全量精度放行；precision-final 按当前完整分组绑定复用有效结果、补齐缺失或失效结果并通过最终聚合门禁，不要求重复运行同版本有效分组。
- 将验收结论与证据写入 `$WORK_DIR/.workflow/reports/`，文件名包含节点 ID。
acceptance:
- 'test -s "$WORK_DIR/precision/fix-report.md"'
out_of_scope:
- 不创建、改写或扩展本轮 scripts/ 中由启动器提供的工作流工具，不通过自行生成验收脚本绕过门禁；缺失、参数不兼容或哈希失效时保留错误并终止，由 PM 处理工具供应。
- 不修改 spec、DESIGN、Unit、用例、Golden、断言或精度阈值；不把未修复项写成已修复。
- 不执行性能采集，不做全量正确性放行（由最终节点负责），不改写预检记录。
context:
  execute:
    skills:
    - cannbot-dsl-test-generator
    - cannbot-dsl-best-practice
  verify:
    skills:
    - cannbot-dsl-test-generator
    - cannbot-dsl-best-practice
