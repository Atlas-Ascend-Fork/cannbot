variables:
  executor_skills: 无补充 Skill。
  verifier_skills: 无补充 Skill。
  knowledge_documents: 无补充文档。
task_type: normal
title: 算子开发
goal:
- 完成满足已确认需求的直调算子实现。
approach:
- 读取 $USER_PROMPT、$WORK_DIR/需求分析.md 和 $WORK_DIR/环境信息.md；必要输入缺失、失效或冲突时，停止依赖该输入的操作，在本阶段报告中记录阻塞证据，按 harness 原生协议结束执行。
- 必须加载 `ops-direct-invoke-engineering`、`ops-direct-invoke-repo-guide` 及本阶段已绑定的平台 API 与工程资料 Skill，按其中的要求执行。
- 补充知识文档：{{var:knowledge_documents}}。有则读取，作为中立参考，区分证据、建议与待验证项；无则直接依据需求、固定 Skill 和测试工程开发，不要求图中存在知识搜集节点。
- '{{var:executor_skills}}'
- 补充 Skill 中的必需项直接加载，候选项仅在实际证据满足所列条件时加载；未命中不加载。所需能力超出清单或需改变已确认约束、任务范围时，记录阻塞，不自行扩展。
- 读取 $WORK_DIR/{{id:黑盒测试设计}}-黑盒测试设计.md 和 $WORK_DIR/{{id:测试工程开发}}-测试工程说明.md，复用资料及测试入口。
- 任务上下文提供前轮穿刺代码或证据时，核对其路径、版本与适用范围，复用有效实现和测试入口，仅补齐正式交付缺口；穿刺通过不代替本节点全量黑盒与代码检视。
- 按目标仓布局实现算子，可根据验证调整草稿中的 API、Buffer、Tiling 与分支；已确认接口、芯片、架构和精度仍是约束。将源码、注册封装和构建入口的实际路径赋给 operator_source、registration_source、build_entry，多文件逐一检查。
- 独立构建当前代码并运行全量黑盒用例；将实现路线、关键分支、变更摘要及补充 Skill 使用依据写入 $WORK_DIR/{{id}}-实现记录.md。按已安装的 $DOC_TEMPLATES_DIR/templates/测试执行记录.md 写入
  $WORK_DIR/{{id}}-测试执行记录.md，保存构建及全量测试原始日志；实现记录仅引用证据路径，不再抄录命令输出和逐用例明细。代码检视由 verifier 执行，白盒由后续节点生成。
procedure:
- 读取 $USER_PROMPT、$WORK_DIR/需求分析.md 和 $WORK_DIR/环境信息.md；必要输入缺失、失效或冲突时，记录阻塞证据并判定验收失败。
- 必须加载 `ops-direct-invoke-engineering`、`ops-direct-invoke-repo-guide` Skill，按其中的要求执行。
- '{{var:verifier_skills}}'
- 补充 Skill 中的必需项直接加载，候选项仅在实际证据满足所列条件时加载；未命中不加载。所需能力超出清单或需改变已确认约束、任务范围时，记录阻塞，不自行扩展。诊断仅限已有证据分析与判定，不修改被验收对象。
- 读取当前代码、$WORK_DIR/{{id}}-实现记录.md、黑盒方案与测试工程说明；给 operator_source、registration_source、build_entry 赋实际路径，多文件逐一检查。
- 读取 $WORK_DIR/{{id}}-测试执行记录.md 与原始构建、测试日志，核对当前源码、测试、构建产物的哈希与运行时加载路径一致；全量黑盒生成数、执行数及结果可核对，无缺失、跳过、待验或失败，不虚构白盒覆盖。只读核验现有证据，不重新构建或运行测试。
- 检视全部算子变更与关联接口，核对需求、硬件约束、编码规则及实现记录；草稿仅作参考。按已安装的 $DOC_TEMPLATES_DIR/templates/代码检视报告.md 写入 $WORK_DIR/{{id}}-代码检视报告.md，两个维度均通过才通过本节点；验收报告记录本阶段实际加载的补充
  Skill 与选择依据（未加载记无）。
- 由 verifier 按已安装的 $DOC_TEMPLATES_DIR/templates/验收报告.md 写入 $WORK_DIR/{{id}}-验收报告.md，执行 test -s "$WORK_DIR/{{id}}-验收报告.md"；通过、失败或阻塞均记录逐项结论与证据路径。重试仅追加问题处理和受影响项复核结果；当前版本缺少有效证据即失败，不补造或重跑测试。
acceptance:
- test -s "$operator_source"
- test -s "$registration_source"
- test -s "$build_entry"
- test -s "$WORK_DIR/{{id}}-实现记录.md"
- test -s "$WORK_DIR/{{id}}-测试执行记录.md"
- 黑盒用例全量通过，当前代码构建成功，接口与精度满足需求，无缺失、跳过或待验项。
- 代码检视通过，当前实现满足需求与编码规则，无阻塞或高级问题；记录和报告与实际交付一致，补充 Skill 使用及依据可追溯。
out_of_scope:
- 改动已确认需求或放宽精度标准、以篡改 golden/用例掩盖失败、伪造确认或验证证据。
- 加载固定项及当前阶段下发清单以外的 Skill、向 PM 或用户发起交互、等待其答复、派发 Agent、修改 harness 或调度状态、重置或回退其他节点。
- 将中间产物写出 $WORK_DIR，或使用不以 {{id}}- 开头的中间报告名；算子交付件按目标仓约定路径写入。
- 性能采集与优化验收、回顾与经验总结、PR、外部 CI 或合并事务。
- executor 编写或修改验收者报告、为等待验收报告而停止交付；verifier 重新构建、安装或运行测试、替执行者补造执行证据。
executor: ops-direct-invoke-developer
verifier: ops-direct-invoke-verifier
on_exhaust: exit
context:
  execute:
    skills:
    - ops-direct-invoke-doc-templates
    - ops-direct-invoke-engineering
    - ops-direct-invoke-repo-guide
    skills_by_platform:
      ascend:
      - ascendc-api-best-practices
      - ascendc-docs-search
      - ascendc-precision-debug
      - ascendc-crash-debug
      - ascendc-tensor-api-best-practice
      - ascendc-blaze-best-practice
      kirin: []
  verify:
    skills:
    - ops-direct-invoke-doc-templates
    - ops-direct-invoke-engineering
    - ops-direct-invoke-repo-guide
    skills_by_platform:
      ascend:
      - ascendc-tensor-api-best-practice
      - ascendc-blaze-best-practice
      kirin: []
