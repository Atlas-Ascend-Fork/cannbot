variables:
  repair_requirements: null
  executor_skills: 无补充 Skill。
  verifier_skills: 无补充 Skill。
task_type: normal
title: 代码修复
goal:
- 完成下发范围内的代码修复并通过回归与检视。
approach:
- 读取 $USER_PROMPT、$WORK_DIR/需求分析.md 和 $WORK_DIR/环境信息.md；必要输入缺失、失效或冲突时，停止依赖该输入的操作，在本阶段报告中记录阻塞证据，按 harness 原生协议结束执行。
- 必须加载 `ops-direct-invoke-repo-guide`、`ops-direct-invoke-engineering` Skill，按其中的要求执行。
- '{{var:executor_skills}}'
- 补充 Skill 中的必需项直接加载，候选项仅在实际证据满足所列条件时加载；未命中不加载。所需能力超出清单或需改变已确认约束、任务范围时，记录阻塞，不自行扩展。
- 本轮修复要求：{{var:repair_requirements}}。读取问题证据、目标代码和测试入口，确认授权路径、预期行为及回归范围；必要信息缺失时记录阻塞，不猜测修复目标。
- 定位根因并修复授权代码，补齐用例；实现分支改变时同步白盒用例和覆盖记录。按已安装的 $DOC_TEMPLATES_DIR/templates/测试执行记录.md 中的证据复用规则，确定重建、回归或复用范围，写入 $WORK_DIR/{{id}}-测试执行记录.md。没有待修复缺陷且已有当前版本的有效全量证据时，记录无需修改与复用依据，不重复构建或测试；不满足复用条件时补齐验证。
- 将修复目标、改动摘要、测试证据路径及补充 Skill 使用依据写入 $WORK_DIR/{{id}}-修复记录.md；将授权对象的实际绝对路径赋给 repair_file，多文件逐一检查。
procedure:
- 读取 $USER_PROMPT、$WORK_DIR/需求分析.md 和 $WORK_DIR/环境信息.md；必要输入缺失、失效或冲突时，记录阻塞证据并判定验收失败。
- 必须加载 `ops-direct-invoke-repo-guide`、`ops-direct-invoke-engineering` Skill，按其中的要求执行。
- '{{var:verifier_skills}}'
- 补充 Skill 中的必需项直接加载，候选项仅在实际证据满足所列条件时加载；未命中不加载。所需能力超出清单或需改变已确认约束、任务范围时，记录阻塞，不自行扩展。诊断仅限已有证据分析与判定，不修改被验收对象。
- 本轮修复要求：{{var:repair_requirements}}。读取原问题证据、当前代码、测试入口及 $WORK_DIR/{{id}}-修复记录.md；给 repair_file 赋实际路径，多文件逐一检查。
- 只读核对 $WORK_DIR/{{id}}-测试执行记录.md、原问题复现及当前版本的全量黑盒/白盒原始日志、当前源码/测试/构建产物哈希和加载路径，确认问题解决且无遗漏或跳过；检视全部修复变更及受影响分支覆盖。按测试执行记录模板核对证据复用条件、版本差异及受影响项；无代码改动也核对完整证据，不重复构建或运行测试。
- 由 verifier 按已安装的 $DOC_TEMPLATES_DIR/templates/验收报告.md 写入 $WORK_DIR/{{id}}-验收报告.md，执行 test -s "$WORK_DIR/{{id}}-验收报告.md"；通过、失败或阻塞均记录逐项结论与证据路径。重试仅追加问题处理和受影响项复核结果；当前版本缺少有效证据即失败，不补造或重跑测试。
acceptance:
- test -s "$repair_file"
- test -s "$WORK_DIR/{{id}}-修复记录.md"
- test -s "$WORK_DIR/{{id}}-测试执行记录.md"
- 下发问题已修复，变更范围明确，相关源码与用例一致。
- 现有全量回归与代码检视通过，证据及补充 Skill 使用依据完整，未放宽需求或测试标准。
out_of_scope:
- 改动已确认需求或放宽精度标准、以篡改 golden/用例掩盖失败、伪造确认或验证证据。
- 加载固定项及当前阶段下发清单以外的 Skill、向 PM 或用户发起交互、等待其答复、派发 Agent、修改 harness 或调度状态、重置或回退其他节点。
- 将中间产物写出 $WORK_DIR，或使用不以 {{id}}- 开头的中间报告名；算子交付件按目标仓约定路径写入。
- 性能采集与优化验收、回顾与经验总结、PR、外部 CI 或合并事务。
- executor 编写或修改验收者报告、为等待验收报告而停止交付；verifier 重新构建、安装或运行测试、替执行者补造执行证据。
executor: ops-direct-invoke-developer
verifier: ops-direct-invoke-verifier
on_exhaust: exit
context:
  execute:
    skills:
    - ops-direct-invoke-doc-templates
    - ops-direct-invoke-engineering
    - ops-direct-invoke-repo-guide
    skills_by_platform:
      ascend:
      - ascendc-api-best-practices
      - ascendc-docs-search
      - ascendc-precision-debug
      - ascendc-crash-debug
      - ascendc-tensor-api-best-practice
      - ascendc-blaze-best-practice
      kirin: []
  verify:
    skills:
    - ops-direct-invoke-doc-templates
    - ops-direct-invoke-engineering
    - ops-direct-invoke-repo-guide
    skills_by_platform:
      ascend:
      - ascendc-tensor-api-best-practice
      - ascendc-blaze-best-practice
      kirin: []
