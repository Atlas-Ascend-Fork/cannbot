variables:
  research_focus: 目标芯片、算子专项资料、可组合 API 与需求 shape 范围的初版 Tiling。
  executor_skills: 无补充 Skill。
  verifier_skills: 无补充 Skill。
task_type: normal
title: 知识搜集
goal:
- 形成可溯源的算子知识资料与初版实现草稿。
approach:
- 读取 $USER_PROMPT、$WORK_DIR/需求分析.md 和 $WORK_DIR/环境信息.md；必要输入缺失、失效或冲突时，停止依赖该输入的操作，在本阶段报告中记录阻塞证据，按 harness 原生协议结束执行。
- 必须加载 `ops-direct-invoke-repo-guide` 及本阶段已绑定的平台知识与工程资料 Skill，按其中的要求执行。
- '{{var:executor_skills}}'
- 按 {{var:research_focus}} 检索目标仓、Skill 库和可用资料库，仅记录与本轮重点相关的关键资料、路径、版本和适用范围；不遍历无关资料，不给所有读过的文件逐一计算哈希；新增 Skill 建议注明适用任务、执行/验收阶段及依据，仅供整轮结束后的编排参考，不改变本轮 Skill
  清单。
- 归纳算法路线、API 签名与组合、数据流及平台约束；按需求中的代表性 shape 分组给出多核、块大小、Buffer 和尾块处理草稿，区分证据、推导和待验证项；非关键资料未命中或无法复核时，删去无依据断言并标注未知。
- 按已安装的 $DOC_TEMPLATES_DIR/templates/知识搜集.md 写入 $WORK_DIR/{{id}}-知识搜集.md；草稿供实现尝试，不作为必须照搬的方案。
procedure:
- 读取 $USER_PROMPT、$WORK_DIR/需求分析.md 和 $WORK_DIR/环境信息.md；必要输入缺失、失效或冲突时，记录阻塞证据并判定验收失败。
- 必须加载 本阶段已绑定的平台知识与工程资料 Skill，按其中的要求执行。
- '{{var:verifier_skills}}'
- 读取 $WORK_DIR/{{id}}-知识搜集.md，按 {{var:research_focus}} 核对决定路线和 API 使用的关键引用、芯片/版本/dtype 适用范围；不重新执行全库检索，不扩展本轮搜集范围。
- 核对 API 组合与代表性 shape 分组的 Tiling 草稿具有可尝试的方向；关键引用虚构、证据矛盾或遗漏搜集要求时失败。非关键资料未命中或无法复核但已标注未知且未被当作事实使用时，不以其单独阻断；残留无依据断言时指出位置并要求执行者修正；待验证假设不等于路线已验证。
- 由 verifier 按已安装的 $DOC_TEMPLATES_DIR/templates/验收报告.md 写入 $WORK_DIR/{{id}}-验收报告.md，执行 test -s "$WORK_DIR/{{id}}-验收报告.md"；通过、失败或阻塞均记录逐项结论与证据路径。重试仅追加问题处理和受影响项复核结果；当前版本缺少有效证据即失败，不补造或重跑测试。
acceptance:
- test -s "$WORK_DIR/{{id}}-知识搜集.md"
- 资料及专项 Skill 检索记录可溯源，结论与适用条件准确。
- API 组合与代表性 shape 分组的初版 Tiling 草稿齐备，事实、建议和待验证项区分清楚。
out_of_scope:
- 改动已确认需求或放宽精度标准、以篡改 golden/用例掩盖失败、伪造确认或验证证据。
- 加载固定项及当前阶段下发清单以外的 Skill、向 PM 或用户发起交互、等待其答复、派发 Agent、修改 harness 或调度状态、重置或回退其他节点。
- 将中间产物写出 $WORK_DIR，或使用不以 {{id}}- 开头的中间报告名；算子交付件按目标仓约定路径写入。
- 性能采集与优化验收、回顾与经验总结、PR、外部 CI 或合并事务。
- executor 编写或修改验收者报告、为等待验收报告而停止交付；verifier 重新构建、安装或运行测试、替执行者补造执行证据。
executor: ops-direct-invoke-architect
verifier: ops-direct-invoke-verifier
on_exhaust: exit
context:
  execute:
    skills:
    - ops-direct-invoke-doc-templates
    - ops-direct-invoke-repo-guide
    skills_by_platform:
      ascend:
      - npu-arch
      - ascendc-docs-search
      kirin:
      - ops-direct-invoke-engineering
  verify:
    skills:
    - ops-direct-invoke-doc-templates
    skills_by_platform:
      ascend:
      - npu-arch
      - ascendc-docs-search
      kirin:
      - ops-direct-invoke-engineering
