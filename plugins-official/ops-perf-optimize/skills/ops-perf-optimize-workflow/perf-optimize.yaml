# Fixed subgraph for both RUN and SKIP. Its single task reads the parent decision.
# Harness owns CLI sessions, task dispatch and executor/verifier status.
nodes:
  - id: perf-optimize-execute
    task_type: normal
    title: Read the recorded decision and run or skip the performance optimization skill
    executor: general-executor
    verifier: general-verifier
    depends_on: []
    goal:
      - "Read the verifier-approved $WORK_DIR/.workflow/perf-optimize-decision.json before loading any performance skill or starting performance work. This recorded decision controls the branch: SKIP only records the skip; RUN executes the original skill. Missing, malformed, unknown or stale decision data is a failure, never an implicit RUN or SKIP."
      - "SKIP: write only $WORK_DIR/perf-optimize/HANDOFF.md with the decision-file path/SHA, reason and evidence references, explicitly stating that optimization was not performed; then finish under the harness reply protocol. Do not load the performance skill, install runtime roles, dispatch specialists, generate a request, initialize a run, benchmark or change operator code."
      - "RUN: Act as the performance primary Agent in this harness-managed CLI session. Resolve SKILL_DIR as the parent directory of the real path of $WORK_DIR/.workflow/perf-optimize.yaml. Fully read SKILL_DIR/SKILL.md and its workflow contract, then execute the original skill with the accepted $WORK_DIR/perf-optimize/optimization-request.json. Locate and pass generation design references to specialists according to their responsibilities below, using the original task-prompts.md role routing."
      - "RUN: Use $WORK_DIR/perf-optimize/run/ for this run's manifest, workflow-state.json and 性能调优报告.md. Preserve the original generation evidence. Completion means the skill's full acceptance conditions are met, including required registration writeback; a partial round or a successful process exit is insufficient."
      - "RUN: Write $WORK_DIR/perf-optimize/HANDOFF.md with the decision, run/report paths, retained implementation, source and loaded-binary identities, and affected-path regression evidence for the final package. Distinguish generation-time results from post-optimization results. Include the decision-file path and SHA."
    approach:
      - "First parse $WORK_DIR/.workflow/perf-optimize-decision.json; check its decision/reason_code pair (RUN/optimization_needed, SKIP/user_opt_out or SKIP/all_targets_met), reason, requirements_path, requirements_sha256 and evidence_paths; compare the current REQUIREMENTS.md SHA. For SKIP/user_opt_out, confirm the recorded explicit intent evidence and proceed directly to the skip handoff: source_identity may be absent, and no source/build/loaded-binary identity or performance evidence check applies. Missing or changed source/build/binary artifacts do not invalidate this opt-out. For SKIP/all_targets_met, require source_identity and verify the current source and loaded binary still match the per-target passing measurements. For a first RUN, require source_identity and verify it still matches the decision; on a resumed RUN, match the accepted original inputs against the existing manifest and verify saved artifacts rather than requiring optimized sources to equal the original source. Fail on missing, inconsistent or stale data. Do not recompute, rewrite or override the parent decision."
      - "If decision=SKIP, write the skip HANDOFF.md and stop here. No RUN-only instruction or acceptance condition applies, and no performance plugin runtime needs to be installed. Preserve historical optimization artifacts without presenting them as this run's work."
      - "RUN: Before specialist dispatch, the primary Agent reads $WORK_DIR/spec/spec.yaml and $WORK_DIR/design/INDEX.md to identify operator constraints and available design references. Consult other documents only as needed to clarify constraints or locate relevant branch documents through BranchCatalog.md; the primary Agent need not read all Tiling, Kernel or branch implementation details before dispatch. Keep the original division of responsibilities: specialists perform detailed design analysis and candidate implementation. These documents live outside code_dir=$WORK_DIR/op; do not assume the request or extracted project contains them."
      - "RUN: Add the available spec/index and role-relevant design documents as absolute paths in the existing task-prompts.md INPUT_ARTIFACTS field, preserving every original required input. Instruct each specialist to read the relevant references before its work and cite them in its existing outputs; do not rely on inherited session context or pass only a summary. Record unavailable references as context gaps, use available documents and actual code, and do not invent missing design content."
      - "RUN: For ROLE=preparation or integration, pass design/Interface.md, DevView.md, API.md and relevant routing references such as BranchRoute.md and TilingKey.md to the project expert; include InferShapeDtype.md when shape/dtype constraints are relevant. The expert reads these to understand project structure, public interfaces and routing before extraction or writeback."
      - "RUN: For ROLE=analysis, pass design/HostTiling.md, Kernel.md, TilingKey.md, TilingData.md, BranchCatalog.md and the relevant design/branches/DESIGN-BRANCH-<key>.md documents. The analysis expert reads them alongside the original profiling and baseline inputs to explain baseline choices, diagnose bottlenecks and propose optimization strategies."
      - "RUN: For ROLE=implementation, retain the analysis report and assigned implementation contract as required inputs and add the design documents relevant to that scheme. The implementation expert reads them before changing the candidate, follows the implementation contract and explains differences from the original design in its existing outputs. Optimization may revise tiling, scheduling and kernel implementation within the original skill's constraints; operator semantics, public interfaces and precision criteria remain unchanged."
      - "RUN: For ROLE=generation, pass spec/spec.yaml and design/Overview.md, Interface.md and Validation.md to the case designer. The expert reads these to understand semantics, supported inputs and validation criteria before generating cases under the original workflow contract."
      - "RUN: Recheck the verifier-accepted request path/SHA from $WORK_DIR/.workflow/perf-optimize-decision.json. The request was prepared under glacier_requirements_defaults; validate/reuse it as the skill's supplied-request path without asking again about already specified/defaulted fields. Do not regenerate it inside this task."
      - "RUN: When the parent decision references performance-acceptance artifacts, read the verified perf-optimize/inputs/optimization-selection.json and its path/SHA-bound tuning and regression inventories. Consume the prepared FAIL/GAP tuning membership, including per-SoC membership, without selecting cases again; GAP has the same tuning eligibility as FAIL while its missing-evidence reason stays visible. Pass only tuning-case mappings, targets and compatible raw/parsed baseline evidence to baseline, preparation and analysis through INPUT_ARTIFACTS; do not send PASS-only cases as optimization objectives, candidate-ranking cases or tuning-profile workloads. Preserve full functional regression and provide the unchanged full acceptance CSV, targets and valid evidence to final integration/performance regression separately. Validate original source/build/load/environment and collection gates before reuse; collect only missing/stale evidence. Do not fabricate a missing GAP target or use a self-baseline as its acceptance target; required missing inputs remain explicit blockers under the original tool contract."
      - "RUN: First execution: run the skill's dependency preflight using $WORK_DIR/ops-test-kit, freeze the accepted request, and start its workflow state. Honor pending collection confirmations and external blockers from the original contract; do not auto-confirm additional decisions or bypass a gate."
      - "RUN: Use the original preparation, analysis, implementation, profiling, selection, final regression and integration procedures, including standard/generalization differences. Keep registry input registered, golden/precision criteria immutable, and non-target SoCs and uninvolved templates isolated."
      - "RUN: On resumed dispatch, read run-manifest.json and workflow-state.json, verify input/artifact identities, and continue only from a valid saved point. Do not re-freeze, reset rounds, automatically restart a blocked run or repeat same-identity performance collection. A completed verified run needs no new tuning rounds."
      - "RUN: Maintain the original performance state/report at each real stage transition. Harness owns process/session lifecycle and executor/verifier verdicts; do not launch another opencode/claude command, tmux session, orchestrator or monitor script, and never write .workflow/status.json."
      - "RUN: Fixed-round completion with no improvement may retain the baseline and finish normally. Record blocked/awaiting_operator and actual missing inputs truthfully; do not claim completion or manufacture success. Honor this harness task's reply protocol instead of STATE.md's DONE protocol."
      - "RUN: Inspect the actual integration diff and identity evidence. If the original implementation is retained unchanged, record a no-op and reuse matching evidence. Reuse the performance skill's same-identity functional/performance and ACLNN integration evidence instead of rerunning it."
      - "RUN: When parent performance-acceptance artifacts exist, use the full original acceptance inventory referenced by optimization-selection.json for final performance regression, including cases that were PASS and excluded from tuning. Compare final integrated NPU latency against the same frozen target latency separately for every case_id/target_soc: npu_us <= target_us is PASS, npu_us > target_us is FAIL, and missing valid comparable evidence is GAP. Record source_kind (competitor or theoretical), npu_us, target_us and per-case PASS/FAIL/GAP plus overall attainment in HANDOFF.md; never use averages or geomeans across cases to determine attainment. Reuse valid integration measurements, collecting only missing/incompatible evidence; do not add a duplicate final profiling batch. Final overall PASS requires complete original required coverage and every case PASS; any valid miss is FAIL, otherwise missing evidence or coverage is GAP. The filtered tuning set, an optimization baseline comparison or fixed-round completion cannot replace this full acceptance verdict. Preserve the original acceptance report as generation-time evidence."
      - "RUN: For accepted changes, verify public interfaces, infer shape, input checks and framework adapters remain unchanged. Map changed tiling/kernel/shared dependencies to branches and existing tests; record affected and preserved paths with evidence, not merely directory names."
      - "RUN: On the final installed package, smoke-test the applicable existing GEIR static/dynamic and source/binary routes, Torch/ACLGraph and TensorFlow routes with representative cases covering affected branches, dtypes and workspace/route boundaries; include TorchAir only when that route actually exists. Preserve existing cases and record selected case IDs and why they cover the changed paths."
      - "RUN: Where cross_check was used, rerun affected-branch adjudication cases with the existing golden/config. Reuse unaffected interface/negative-test conclusions only with unchanged dependency evidence. If impact cannot be bounded or a smoke fails, expand regression to the affected suite; do not require all historical suites blindly or label untested paths PASS."
      - "RUN: Only after all skill completion conditions and required handoff checks pass, use PLUGIN_ROOT/scripts/workflow_state.py finish --state $WORK_DIR/perf-optimize/run/workflow-state.json --status success --reason-code completed --message <factual-final-conclusion>. For a blocker use its actual terminal status and reason instead. The verifier independently checks the evidence behind that terminal record."
    acceptance:
      - "Independently parse $WORK_DIR/.workflow/perf-optimize-decision.json, verify decision/reason_code is RUN/optimization_needed, SKIP/user_opt_out or SKIP/all_targets_met; verify reason, requirements_path, requirements_sha256 and evidence_paths, and compare the current REQUIREMENTS.md SHA; confirm that HANDOFF.md records the same file path/SHA. For SKIP/user_opt_out, verify the recorded explicit intent and skip handoff only: source_identity may be absent, and no source/build/loaded-binary identity or performance evidence check applies. Missing or changed source/build/binary artifacts do not invalidate this opt-out. For SKIP/all_targets_met, require source_identity and independently verify that current source and loaded-binary identities match all per-target passing measurements. RUN still requires the original source/manifest/artifact identity checks below. Missing, malformed, unknown or stale data required for the selected branch fails verification. The decision file is unchanged; the child must follow the accepted decision rather than make a new one."
      - "SKIP only: HANDOFF.md accurately records the reason/evidence and that no optimization was performed. Inspect this task's execution trace and handoff artifacts to confirm no performance skill load, specialist dispatch, runtime install, request/run creation, profiling or operator-code change. For user_opt_out, do not require source/binary snapshots or compare them with generation-time artifacts; the current-code identity checks apply to all_targets_met only. Do not require a manifest, workflow-state.json, performance report or RUN-only gates for SKIP; historical artifacts remain intact."
      - "RUN only: Independently read the performance skill's completion conditions and workflow contract. The request SHA matches $WORK_DIR/.workflow/perf-optimize-decision.json; run-manifest.json, workflow-state.json, 性能调优报告.md, final functional/performance evidence and required integration gates exist and have consistent source/case/binary identities."
      - "RUN only: Run the original workflow_state.py verify on this run after execution has stopped; all required saved artifacts remain valid. terminal.status=success and operator.awaiting is not true; no unresolved blocker or incomplete required stage. A success field alone does not replace the completion checks."
      - "RUN only: Execution evidence shows that the primary Agent read the available spec and design index, and specialist dispatches supplied the available role-relevant absolute document paths through INPUT_ARTIFACTS while retaining the original required inputs. For each dispatched role, the specialist's execution evidence and existing outputs show that it read and used the relevant design references before its work. Do not require the primary Agent to read all implementation design documents. The existing analysis/implementation reports explain the baseline design, affected branches, constraints and proposed or retained changes with document references. HANDOFF.md lists the design references used and any unavailable context; design context does not replace the skill's profiling or implementation gates."
      - "RUN only: Every required round and candidate has the original conformance, isolation, functional and comparable performance evidence or a justified rejection. Final functional/performance coverage and registration writeback satisfy the selected mode's original contract; generalization additionally has competitor/ratio and involved/uninvolved-case evidence."
      - "RUN only: The report distinguishes optimized vs retained baseline, actual target attainment and NOT_FULLY_ACHIEVED where applicable. Earlier generation reports are preserved and are not relabeled as post-optimization results."
      - "RUN only, when the parent supplies performance-acceptance artifacts: independently verify the request and tuning dispatches against optimization-selection.json: FAIL/GAP pairs are tuning-eligible, PASS pairs are regression-only, and no case or per-SoC membership was reselected. Verify the unchanged full acceptance inventory/targets separately from the tuning subset, including every originally PASS case in final performance regression. Reused raw evidence passes the original identity/collection gates, and collection logs justify each missing/stale case remeasurement; changed source/build/load identities invalidate earlier PASS timings unless the original reuse gates establish compatibility. HANDOFF.md independently recomputes npu_us <= target_us for every case_id/target_soc in the full original acceptance set, not only tuned cases, against its original competitor-collection or theoretical-evaluation target using the final implementation, without an extra threshold allowance or cross-case averaging; missing evidence remains GAP and a failed case cannot be hidden by an aggregate improvement."
      - "RUN only: HANDOFF.md records final source, build and actually loaded binary identities, the changed-branch/test mapping, reused evidence and new regression commands/results. No pre-optimization full-suite result is presented as a full rerun on new code."
      - "RUN only: Required affected-path checks pass on the final installed package; N/A and no-op have factual justification. Missing coverage, new failures or unknown loaded-binary identity fail the handoff. Golden, tolerances, original cases and plugin sources remain unchanged."
    out_of_scope:
      - "Do not change the generation workflow or its status, public APIs/constraints/dtypes, frozen cases, golden or tolerances. Original source changes are limited to the skill's verified integration procedure; candidate work stays isolated."
      - "Do not create custom session launchers or polling scripts. CLI provider and process management belong to harness. No unconditional restart on failure or additional rounds merely because some targets remain unmet."
      - "For the final handoff, do not perform another optimization round, rewrite framework adapters or modify tests/golden/thresholds to pass. Write new regression outputs under $WORK_DIR/perf-optimize/; preserve generation evidence and .workflow/status.json."
      - "Treat $WORK_DIR/design/ and $WORK_DIR/spec/spec.yaml as read-only generation context. Record optimization design changes in the performance run's existing reports; preserve the original generation documents."
      - "Do not modify $WORK_DIR/.workflow/perf-optimize-decision.json or replace the parent's verified choice. For SKIP, write only HANDOFF.md and do no optimization work."
    max_retries: 0
    on_exhaust: exit
