      - "Kernel or ACLNN defects are attributed in the RECORD and left to the kernel tasks; package sources, other test suites, tolerances, and TTK stay as-is."
    depends_on:
      - fix-findings
    max_retries: 2
    on_exhaust: exit
  - id: docs-consistency-check
    task_type: normal
    title: Docs consistency check - verify every checkable doc claim empirically against the final package; fix doc deltas only, never code
    executor: general-executor
    verifier: general-verifier
    goal:
      - "Empirically verify the public docs of the finished operator ($WORK_DIR/op/docs/aclnn{OperatorName}.md and $WORK_DIR/op/README.md, exposed via the $WORK_DIR/docs symlink) against the final post-fix package: extract every machine-checkable claim — supported dtypes, formats, shape/rank ranges, attribute defaults, empty-tensor stances, constraints, and error semantics — and drive each through the real aclnn interface via TTK."
      - "Two case families, both derived FROM the docs: positive cases for every documented capability (expect success), and negative cases for abnormal inputs plus scenarios OUTSIDE the documented support range (undocumented dtype/format, out-of-range shape/rank, empty tensor where the doc says unsupported — expect a clean ACLNN rejection, not a crash and not silent execution)."
      - "Mismatch rule (hard): any behavior deviating from the doc, in EITHER direction — a documented feature that fails, or an out-of-scope input that executes/crashes — is fixed by editing the DOC to match the observed code behavior; the code is never touched in this task."
      - "Completion gate: every extracted claim is settled in $WORK_DIR/docs-consistency/REPORT.md (match / mismatch-fixed naming the doc edit / N/A with reason), and the paired-docs validator exits 0 with STATUS: PASSED on the final doc tree."
    approach:
      - "Load the ascendc-docs-gen skill first (mandatory — it is the authority for doc structure, evidence rules, and the closing validator gate); do not restate or bypass its procedure."
      - "Inventory the claims: read both doc files end to end and list every checkable claim with its file:line, cross-checked against $WORK_DIR/spec/spec.yaml and the installed header $WORK_DIR/dev-package/vendors/<OpPascal>/op_api/include/aclnn_<op_name>.h; this list becomes REPORT.md's claim table (unique ID per claim)."
      - "Build the probe cases under $WORK_DIR/docs-consistency/cases/ — a positive CSV and a negative CSV, header per the blackbox ttk CSV contract with api_name = aclnn<OpPascal>; project rows from known-green $WORK_DIR/op/tests/blackbox/ttk/blackbox_l0.csv rows where possible (record the claim-to-case mapping); keep every dtype/format token a valid TTK token so a rejection happens at the operator, not at case parse."
      - "Execute both CSVs from $WORK_DIR/ops-test-kit: rm -f the -o target, then python3 -m ttk aclnn -i <cases.csv> --pc=1 --task-prof false --run 1 --device-whitelist 0 --input-dist uniform --compare stat_rel_err --plugin $WORK_DIR/golden.py -o $WORK_DIR/docs-consistency/results/result_<positive|negative>.csv — golden as-is, never modified."
      - "Judge every row against its doc-derived expectation: a documented-capability case must PASS; an out-of-scope case must be cleanly rejected — FAIL with NO_OUTPUT and a GetWorkspaceSize/ACLNN param error in the log. An executed case with output, a percentage/GOLDEN_FAILURE cell, a crash, or an infra token (TENSOR_DTYPES_INVALID / PARAM_COUNT_MISMATCH / OP_API_NOT_FOUND) is NOT a clean rejection: an infra token means the probe case is buggy (fix the case and rerun); an executed out-of-scope case is a mismatch (the doc is too narrow — widen it)."
      - "Fix discipline: settle every mismatch by editing only the two doc files from the observed evidence — widen or narrow the support cells, flip the empty-tensor stance, adjust constraint wording, add error rows citing a concrete aclnnStatus only when that return was actually observed; respect the validator's anchored regions (prototype text and order, parameter-table row order, the exact empty-tensor stance phrasing the validator requires, compile-checked example). Zero mismatches -> edit no doc, write the zero-mismatch record, and stop."
      - "Re-validate after every doc edit and once on the final tree: the ascendc-docs-gen skill's scripts/validate_operator_docs.py --operator-dir $WORK_DIR/op — exit 0, last line STATUS: PASSED; iterate per its ERROR list until green."
      - "Evidence: $WORK_DIR/docs-consistency/REPORT.md holds the claim table (ID | doc claim with file:line | case name | observed result cell | verdict), the commands run, and the fix history (mismatch ID -> doc edit); a code-side defect suspected behind a mismatch is attributed there, never patched in the doc's place."
    acceptance:
      - "test -s $WORK_DIR/docs-consistency/REPORT.md exits 0 and it holds the settled claim table: every checkable claim from both doc files appears exactly once with a verdict of match, mismatch-fixed (naming the doc location edited), or N/A with reason; the zero-mismatch case is explicitly recorded as a no-op with no doc modified."
      - "Cases cover the claims: the positive and negative CSVs under $WORK_DIR/docs-consistency/cases/ are non-empty, and every executable claim maps to at least one case row recorded in REPORT.md."
      - "Full execution: each result CSV under $WORK_DIR/docs-consistency/results/ exists, is non-empty, and covers its cases CSV's full row set (no unexecuted rows, no unexplained skips)."
      - "Validator green on the final tree: the ascendc-docs-gen skill's scripts/validate_operator_docs.py --operator-dir $WORK_DIR/op > /tmp/docs-consistency-validate.log 2>&1 exits 0 and tail -1 /tmp/docs-consistency-validate.log is exactly STATUS: PASSED."
      - "Frozen assets unchanged: $WORK_DIR/op package sources (op_host/, op_kernel/, op_graph/, op_api/, CMakeLists.txt), $WORK_DIR/golden.py, $WORK_DIR/spec/spec.yaml, and every test suite under $WORK_DIR/op/tests/ are unmodified (verifier checks against the pre-task state); python3 $WORK_DIR/.agents/skills/geir-route-tester/scripts/verify_ttk_geir.py check-frozen --directory $WORK_DIR/op/tests/geir exits 0."
    out_of_scope:
      - "Write only under $WORK_DIR/docs-consistency/ and, for mismatch fixes, the two doc files $WORK_DIR/op/docs/aclnn{OperatorName}.md and $WORK_DIR/op/README.md; the $WORK_DIR/docs symlink stays as doc-gen created it."
      - "Never modify package sources, the public aclnn signature, golden.py, tolerances, test suites, TTK, or design docs to make a doc claim true — doc follows code, never the reverse; a suspected code defect is attributed in REPORT.md and left to the kernel tasks."
      - "Do not regenerate the docs wholesale; this task patches deltas found by empirical checks only."
    depends_on:
      - tensorflow-impl-smoke
    max_retries: 2
    on_exhaust: exit
  - id: prepare-performance-optimization
    task_type: normal
    title: Record the performance optimization decision and prepare its inputs
    executor: general-executor
    verifier: general-verifier
    depends_on:
      - docs-consistency-check
      - detect-npu-arch
      - verify-ops-test-kit
      - write-design-infershape-dtype
    goal:
      - "Read $WORK_DIR/requirements/REQUIREMENTS.md, consulting the original user prompt from the file named by $USER_PROMPT when available, before writing $WORK_DIR/.workflow/perf-optimize-decision.json with RUN or SKIP, the reason and evidence. Explicitly prohibiting optimization takes priority; otherwise SKIP only when every performance target has valid, individually passing measurements for the current implementation. Missing targets, measurements or identity evidence mean RUN, not all-passed."
      - "For RUN, generate $WORK_DIR/perf-optimize/optimization-request.json from the recorded customer requirements and the defaults below; the verifier validates this request before the performance workflow can start. SKIP creates no request or optimization run."
      - "Create $WORK_DIR/.workflow/perf-optimize.yaml as a symlink to the original performance skill perf-optimize.yaml for both RUN and SKIP. The subgraph always loads this same single-task YAML; its task reads the verified decision file before deciding whether to call the performance skill."
      - "Only for RUN, make the performance primary Agent, four specialist Agents and required skills discoverable in the current harness client's project configuration without changing the installed registry-invoke/performance plugins or losing existing generation agents."
    approach:
      - "Read the parent workflow path from $WORK_DIR/.workflow/status.json and resolve its real path as PARENT_WORKFLOW. Resolve SKILL_DIR as (PARENT_WORKFLOW.parent.parent / \"skills/ops-perf-optimize\").resolve(strict=True), using the parent plugin's existing skill link, not a client configuration directory. For RUN, read SKILL_DIR/SKILL.md and references/workflow-contract.md as input-format references and resolve PLUGIN_ROOT with scripts/resolve-plugin-root.sh; do not start the performance skill in this task."
      - "Read REQUIREMENTS.md and, when available, the original prompt from the file named by $USER_PROMPT. $USER_PROMPT is a file path, not the prompt text. If it is unset or the file is missing, unreadable or empty, continue using REQUIREMENTS.md. When the original prompt is available, retain its explicit opt-out and optimization options (mode, rounds/objective, case inputs and environment), even when omitted from REQUIREMENTS.md: an omitted opt-out still means SKIP/user_opt_out, and explicit options must not be replaced by defaults. Conflicting explicit statements fail preparation; never resolve a conflict by defaulting to RUN. Missing, empty or contradictory requirements still fail preparation. Do not rewrite either input. For explicit opt-out, record SKIP/user_opt_out from the intent evidence without reading performance measurements or collecting/checking source, build or loaded-binary identities. Otherwise read $WORK_DIR/design/Validation.md, existing measured performance evidence if any, and the current $WORK_DIR/op source/build identities. This generation workflow does not guarantee an existing performance report: do not invent one or collect performance merely to decide."
      - "Atomically write $WORK_DIR/.workflow/perf-optimize-decision.json as a JSON object containing decision (RUN/SKIP), reason_code (user_opt_out/all_targets_met/optimization_needed), reason, requirements_path, requirements_sha256 and evidence_paths. Include the relevant requirements excerpts and any original-prompt excerpts used for explicit options; for all_targets_met, include per-target/case measurements, units, thresholds and loaded-binary identities. For user_opt_out, evidence_paths references the intent evidence; omit source_identity and require no source, build, loaded-binary or measurement evidence. RUN and all_targets_met require source_identity; all_targets_met also requires current loaded-binary identities matching the measurements. RUN additionally records request_path, request_sha256 and request_field_sources (each field's value and original-prompt/requirement/evidence/default source); SKIP omits request fields. This file is the sole decision record; do not create a parallel DECISION.md or infer the decision from historical run artifacts."
      - "RUN defaults: tuning_mode=standard, optimization_objective=fixed_rounds with 3 rounds, functional_mode=existing, code_dir=$WORK_DIR/op. Explicit user options take precedence, including target mode and generalization; follow the existing skill's requirements for those modes instead of silently changing them to standard."
      - "RUN with standard mode: use an explicitly supplied performance CSV if present. Otherwise construct $WORK_DIR/perf-optimize/inputs/performance.csv from the key shapes in design/Validation.md and the actual ACLNN signature, reusing matching validated blackbox rows and recording the mapping. Reuse $WORK_DIR/golden.py and the existing precision criteria. No invented target values, reduced shapes or substituted APIs."
      - "RUN: the default functional inventory is the complete positive L0/L1 inventory already validated under $WORK_DIR/op/tests/blackbox/ttk/ (blackbox_l0.csv and blackbox_l1.csv). Adapt copies under perf-optimize/inputs/ to the performance tool's schema, retaining all rows, values and source mappings and adding unique case_id and L0/L1 metadata. Preserve L2 and oversized side tables at source; do not mix them into positive cases."
      - "RUN: derive the actual Python executable, CANN setup and verified target SoC from the successful generation environment, $WORK_DIR/ops-test-kit/ttk-verify/env-info.txt and $WORK_DIR/npu-arch.json; verify that these identities still hold. Do not substitute the launcher's Python or equate all supported SoCs with tested SoCs. Missing required environment or explicit generalization competitor inputs is a blocker, not a default to invent."
      - "RUN: use PLUGIN_ROOT/scripts/prepare_case_sets.py create-request with absolute paths and --confirmed-by registry-invoke-requirements-defaults. This records authorization by the generation workflow's requirement/default policy, not a fabricated per-field user confirmation. Record each field's provenance and the request path/SHA in $WORK_DIR/.workflow/perf-optimize-decision.json. Reuse matching inputs on retry; archive superseded unfrozen requests and never overwrite frozen run inputs."
      - "RUN: identify the current harness CLI from the current session/process invocation evidence, not from which executable happens to exist. OpenCode maps to its project agent/skill configuration; Claude Code maps to claude/.claude. Record this evidence in perf-optimize/RUNTIME.md. An unknown client or ambiguous identity fails preparation; do not silently switch provider or start a CLI yourself."
      - "RUN: in $WORK_DIR/perf-optimize/runtime/ call the original PLUGIN_ROOT/init.sh project <current-client> and check its health report. This staging install supplies perf-optimize, the four ascendc-perf-* specialists and the original skill links. Do not run the installer through the installed plugin's $WORK_DIR agent configuration links: that would modify the shared plugin."
      - "RUN: merge only the staged agents/skills into a WORK_DIR-local client configuration. If its root, agents or skills directory is a symlink, first materialize that directory locally, retaining existing entries as absolute links to their original targets; preserve other configuration contents and keep the original symlink targets untouched. Add missing performance entries; reuse collisions only when they resolve to the same source, otherwise fail with the conflicting paths. Never overwrite a different agent/skill, model, permission, default-agent setting, hook or authentication file."
      - "RUN: record configuration paths, original link targets and added role/skill mappings in RUNTIME.md. Verify perf-optimize and all four specialists resolve to this performance plugin, their declared skills resolve, and general-executor/general-verifier and all prior generation entries remain available. Harness starts the next node with general-executor so it can read the decision before loading any performance skill. For RUN, that CLI session acts as the skill's primary Agent and delegates to these specialists; this task only prepares discovery."
      - "For both decisions, run the original workflow/scripts/prepare-perf-subgraph.sh from the resolved parent plugin with the command below and require exit 0. Do not reimplement, copy or edit the script: it locates the performance YAML relative to its own real path using Shell utilities, without reading workflow status. The verifier must approve the decision, RUN request and link before the child is dispatched. The script reuses an identical existing link and rejects conflicting files/links without replacement. Do not generate alternative subgraphs or edit workflow status to express the decision."
      - |
        bash "$(dirname "$PARENT_WORKFLOW")/scripts/prepare-perf-subgraph.sh" "$WORK_DIR"
    acceptance:
      - "$WORK_DIR/.workflow/perf-optimize-decision.json is a valid JSON object with decision, reason_code, reason, requirements_path, requirements_sha256 and evidence_paths. Independently read REQUIREMENTS.md and verify its recorded SHA and excerpts. When the original prompt is available, also check its explicit options are retained even when omitted from REQUIREMENTS.md; an original-prompt opt-out omitted from REQUIREMENTS.md still requires SKIP/user_opt_out. If the original prompt is unavailable, continue verification using REQUIREMENTS.md and the recorded excerpts; do not require a prompt path or SHA and do not reject a decision merely because that file changed or is missing. Defaults apply only to unspecified options. Verify the decision: SKIP/user_opt_out requires explicit intent evidence only; source_identity may be absent, and missing or changed source/build/binary artifacts do not invalidate the opt-out. Do not collect or compare their identities for this branch. SKIP/all_targets_met requires source_identity and every target to have current-source/current-binary passing measurements; RUN/optimization_needed also requires source_identity. No target or missing/stale measurements cannot justify SKIP/all_targets_met. Missing, empty or contradictory requirements fail this task. RUN also has request_path, request_sha256 and per-field provenance; SKIP has no request fields."
      - "RUN: the verifier resolves the original performance plugin and personally runs scripts/prepare_case_sets.py validate-request --request $WORK_DIR/perf-optimize/optimization-request.json; exit 0 and status=valid. Independently check requirement overrides and any recorded original-prompt options against request_field_sources; unspecified options default to standard, fixed_rounds=3, existing full positive L0/L1 inventory and code_dir=$WORK_DIR/op. Verify full inventory coverage, performance-case provenance, actual Python/CANN/SoC and request SHA. Generation by the executor alone is not validation."
      - "SKIP: no new optimization request, run, profiling, runtime configuration or production-code change was made. RUN: only decision/request/input-copy artifacts, the fixed workflow link and the permitted local runtime discovery entries were written; source cases, golden, tolerances and operator sources remain unchanged."
      - "Independently resolve the real parent workflow from .workflow/status.json. For both RUN and SKIP, $WORK_DIR/.workflow/perf-optimize.yaml is a readable symlink to that parent plugin's skills/ops-perf-optimize/perf-optimize.yaml. Its only top-level key is nodes, containing exactly one normal task, perf-optimize-execute with executor=general-executor and verifier=general-verifier. That task reads $WORK_DIR/.workflow/perf-optimize-decision.json before invoking the skill; no alternate subgraph is generated."
      - "RUN: request SHA is unchanged, and RUNTIME.md proves the current-client local configuration discovers perf-optimize, its four specialists and their skills while preserving the existing generation entries and configuration. Shared plugin targets are unchanged."
      - "Plugin sources, shared configuration targets and .workflow/status.json are unchanged. Only an identical existing workflow link may be reused; conflicting files/links must be preserved and reported as failure."
    out_of_scope:
      - "Do not optimize, benchmark, freeze a run, change framework code or query conversation databases. Do not ask the performance execution task to generate or approve its own request."
      - "Write only under $WORK_DIR/perf-optimize/, $WORK_DIR/.workflow/perf-optimize-decision.json, $WORK_DIR/.workflow/perf-optimize.yaml and the current client's WORK_DIR-local agent/skill discovery entries. Do not edit the parent workflow YAML, .workflow/status.json, STATE.md, shared plugin sources, global configuration or generation artifacts; preserve existing model, permission, hook and authentication settings."
      - "Do not execute the child task, initialize a performance run or start a CLI. Do not replace a conflicting workflow file/link."
    max_retries: 0
    on_exhaust: exit
  - id: performance-optimization
    task_type: subgraph
    file: .workflow/perf-optimize.yaml
    depends_on:
      - prepare-performance-optimization
