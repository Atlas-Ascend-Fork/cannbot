      - "Write $WORK_DIR/golden.py in TestSpec format: __spec__ registration + class with golden and tolerance; implement the reference math from spec.yaml only — never import or reuse anything from $WORK_DIR/op/ (kernel artifacts)."
      - "Pick the golden body's implementation backend by this fixed priority ladder, stopping at the first tier that holds (equivalent = same semantics as the spec's math_semantics.formula, including optional-input pairing and attr behavior): tier 1 single PyTorch API — one equivalent torch API exists, build the golden body on it. tier 2 single TensorFlow API — one equivalent TF API exists, build the golden body on it. tier 3 PyTorch API composition — no single equivalent API in either framework, but a composition of torch APIs implements the full formula, build the golden body from it. tier 4 TensorFlow API composition — same via a composition of TF APIs. tier 5 NumPy — hand-implement the formula with numpy primitives. When a torch/TF tier is taken, the golden must CALL the chosen API(s) for every part they cover, casting inputs to float64 around each call; re-implementing an API's internals with elementary tensor ops is a tier-5 hand implementation, not a composition — the API's own numerics (including boundary-value behaviour) are the expected values. Record in golden.py's module docstring the tier taken, the exact API(s) chosen, and what each skipped tier lacked."
      - "Float64 accumulation rule (workflow-mandated, overrides any lower accumulator dtype declared in the spec): wherever the golden performs floating-point accumulation, lift the values to float64 first, accumulate in float64, and cast the final result back to the target output dtype — torch: x.to(torch.float64) -> sum -> .to(out_dtype); tensorflow: tf.cast(x, tf.float64) -> reduce_sum -> tf.cast(out_dtype); numpy: x.astype(np.float64) -> sum -> .astype(out_dtype). Never accumulate in float16/float32."
      - "When any torch/TF tier (1–4) supplies the golden body — single API or composition — compose it with the float64 rule: cast every input to float64, call the torch/TF API(s), cast the outputs back once to the target dtypes — the framework's internal accumulation then runs in float64."
