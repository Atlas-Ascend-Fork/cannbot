      - "Read $WORK_DIR/design/BranchCatalog.md and produce $WORK_DIR/.workflow/kernel-sub-graph.yaml: a dict with exactly one top-level key nodes holding 5*M normal nodes, where M = the number of tilingKeys registered in BranchCatalog.md, discovered at runtime and never assumed — one five-task chain per tilingKey, driving kernel development with whitebox cases. Nothing in this task may hardcode an operator name, a tilingKey set, or a branch count."
    approach:
      - "Node schema = op-develop.yaml normal task (id, task_type: normal, title, goal, approach, acceptance, out_of_scope, depends_on, executor, verifier, max_retries: 2, on_exhaust: exit). Write the file as a YAML mapping whose sole top-level key is nodes (a bare list is invalid). goal / approach / acceptance / out_of_scope must each be a non-empty LIST of non-empty strings (a plain string is rejected by schema validation) — write each item as a separate list entry with the '- ' prefix, never as one long string."
      - "Enumerate the tilingKeys in BranchCatalog.md registration order, m = 1..M; per key (with its DESIGN-BRANCH-<key>.md), generate these five chained nodes (ids branch-<m>-<step>):"
      - "1. branch-<m>-whitebox-gen — executor whitebox-designer, verifier st-verifier: generate this branch's TTK kernel-mode whitebox case set under $WORK_DIR/op/tests/whitebox/branch-<m>/ (design_doc_cases.json + ttk_design_doc_cases.csv) from $WORK_DIR/design/branches/DESIGN-BRANCH-<key>.md §9 branch-verification points and $WORK_DIR/design/Validation.md's matrix rows for this branch; expected values computed by the independent golden $WORK_DIR/golden.py; coverage audit passes; no hardcoded case counts or hand-written CSV."
      - "2. branch-<m>-kernel-bringup — executor kernel-developer, verifier kernel-verifier: implement this branch's kernel per $WORK_DIR/design/Kernel.md and DESIGN-BRANCH-<key>.md §3–§5; select the first row of this branch's ttk_design_doc_cases.csv as the bring-up case; run it via ttk kernel (cd $WORK_DIR/ops-test-kit; python3 -m ttk kernel -i <branch csv> --compare stat_rel_err --plugin $WORK_DIR/golden.py, single-case filtering per the ttk skill's selection mechanism — phase 1 without cross_check; if it fails, rerun with --compare cross_check --config $WORK_DIR/ttk.conf.yaml to adjudicate before entering precision fix); acceptance: package builds (cd $WORK_DIR/op && ./build.sh exits 0), that one case's precision PASSes, and the four ops-impl-review scripts (scalar_mainchain_check, vf_reachability_check, workspace_consistency_check, non3510_scaffold_check) exit 0 against $WORK_DIR/op."
      - "3. branch-<m>-run-20pct — executor kernel-developer, verifier st-verifier: batch-run the first ceil(20%) rows of this branch's csv via ttk kernel under the two-phase execution contract (batch-gate semantics (c) below); fix kernel/tiling per DESIGN-BRANCH-<key>.md until every one of them precision-PASSes; never edit cases, golden, or tolerances; log the exact row set used."
      - "4. branch-<m>-run-50pct — executor kernel-developer, verifier st-verifier: same as step 3 but the batch is the first ceil(50%) rows (cumulative superset of step 3); all must precision-PASS, earlier rows must not regress."
      - "5. branch-<m>-run-100pct — executor kernel-developer, verifier st-verifier: full-branch batch, every case precision-PASS (hard gate), zero skip/fail, earlier stages regress-checked; results recorded under $WORK_DIR/op/tests/whitebox/branch-<m>/."
      - "Batch-gate semantics (applies to steps 3–5, bake into every generated batch node): (a) positive/negative split — a row is negative iff the case set marks it expect_error (or names it a rejection scenario); positive rows must precision-PASS and negative rows must be REJECTED by the operator (a precision PASS on a negative row is a defect); report both counts in the evidence. (b) Precision is judged per the design authority — $WORK_DIR/design/Validation.md 精度验收标准 and DESIGN-BRANCH-<key>.md (per-dtype pointwise rtol/atol); when the ttk framework comparator cannot express the design criterion (documented metric blind spots, e.g. small-value/subnormal guards), build a machine-checkable design-criterion checker over --dump outputs and record the analysis in a stage RECORD.md, never silently relaxing or swapping the criterion. (c) Two-phase execution contract (steps 2–5): phase 1 runs without cross_check — --compare stat_rel_err, no --config, local golden comparison only; phase 2 reruns every FAILED positive row with -t adding --compare cross_check --config $WORK_DIR/ttk.conf.yaml (third_party torch via the local xpu-server); cross_check-passing rows are adjudicated green, rows still failing enter precision localization and fix; phase 2 is skipped when phase 1 is all-green. Negative rows follow (a) — REJECTED is their green; adjudicate anomalies likewise."
      - "Dependencies inside the subgraph: each branch's five nodes chain linearly (gen → bringup → 20 → 50 → 100); every branch-<m>-whitebox-gen has no intra-subgraph dependency (whitebox generation of different branches writes disjoint directories and may run in parallel); for m ≥ 2, branch-<m>-kernel-bringup depends on BOTH branch-<m>-whitebox-gen AND branch-<m-1>-run-100pct — kernel-touching steps of different branches never run concurrently (no resource locks in this orchestrator; shared op_kernel/ entry and aclnn build tree)."
      - "Every node's goal must state its completion gate explicitly and reference its authoritative design docs by absolute path."
    acceptance:
      - 'Contract-valid: ORCH_SKILL=the workflow-orchestrator skill directory ; python3 -c "import sys; sys.path.insert(0,\"$ORCH_SKILL/scripts\"); import get_task; nodes,err=get_task.load_subgraph(\"$WORK_DIR/.workflow/kernel-sub-graph.yaml\"); assert not err, err" exits 0.'
      - "$WORK_DIR/.workflow/kernel-sub-graph.yaml exists; M equals the tilingKey count in $WORK_DIR/design/BranchCatalog.md; python3 -c \"import yaml; d=yaml.safe_load(open('$WORK_DIR/.workflow/kernel-sub-graph.yaml')); assert isinstance(d,dict) and set(d)=={'nodes'} and len(d['nodes'])==5*M\" exits 0."
      - "Node ids are exactly branch-<m>-<step> for m = 1..M and step in {whitebox-gen, kernel-bringup, run-20pct, run-50pct, run-100pct}, in BranchCatalog.md registration order; each chain's DESIGN-BRANCH-<key>.md reference matches its m-th tilingKey."
      - "Every node satisfies the normal-task schema; executor/verifier pairs are exactly (whitebox-designer, st-verifier) for the M gen nodes, (kernel-developer, kernel-verifier) for the M bringup nodes, and (kernel-developer, st-verifier) for the 3*M batch nodes; dependency edges match the approach (linear chains per branch; for m ≥ 2 branch-<m>-kernel-bringup depends on branch-<m>-whitebox-gen and branch-<m-1>-run-100pct)."
      - "Each node's acceptance is checkable (exit codes / file paths) and the 20%/50% sampling rule is deterministic (first-N rows, cumulative)."
    out_of_scope:
      - "Do not create or modify any file other than $WORK_DIR/.workflow/kernel-sub-graph.yaml; do not execute any branch task; do not write kernel code."
    depends_on:
      - gen-golden
      - implement-tiling
    max_retries: 2
    on_exhaust: exit
  - id: kernel-impl
