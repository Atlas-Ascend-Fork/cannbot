  - id: blackbox-gen
    task_type: normal
    title: Generate separate ACLNN and REG_OP/kernel ST case sets (L0/L1/L2 plus oversized side tables)
    executor: general-executor
    verifier: general-verifier
    depends_on:
      - update-opdef
      - setup-op-package
      - gen-golden
    goal:
      - "Produce the full blackbox ACLNN ST case set under $WORK_DIR/op/tests/blackbox/ (design/ intermediates + testcases/ standard *_l0_functional.csv, *_l1_functional.csv, *_l2_exception.csv) for the operator in $WORK_DIR/spec/spec.yaml, designed one-shot from facts independent of the design line: $WORK_DIR/requirements/REQUIREMENTS.md plus the actual interface facts — the proto sources under $WORK_DIR/op/op_graph/ and the actual OpDef in $WORK_DIR/op/op_host/*_def.cpp; reading $WORK_DIR/design/*.md or any existing case set is forbidden, so the blackbox suite stays independent of the whitebox/design line."
      - "Completion gate: the ascendc-st-design skill's generation, QA and review stages all pass; the case parameter interface (names, order, types, optionality, defaults, output positions; api_name = aclnn<OpPascal>) matches the actual OpDef; resource-oversized cases are isolated into same-stem *_oversized.csv side tables that stay out of the executable suites."
    approach:
      - "Load the ascendc-st-design skill first (mandatory — it is the single execution authority for blackbox modeling, generation, QA and standard artifacts; do not restate or bypass its stage procedure); adapt its output layout to this workflow: design/ and testcases/ under $WORK_DIR/op/tests/blackbox/."
      - "Fact mapping (this workflow's equivalent of the agent doc's REQUIREMENTS + proto.md inputs): $WORK_DIR/requirements/REQUIREMENTS.md -> supported scope, value domains, error semantics; $WORK_DIR/op/op_graph/ proto sources + the actual OpDef in $WORK_DIR/op/op_host/*_def.cpp -> parameter ABI and tensor-to-tensor shape bindings. An explicit conflict between the two fact inputs that would flip a positive/negative classification is reported as FAILED with both locations — never guessed away."
      - "Run ascendc-st-design twice, once for ACLNN under tests/blackbox/ and once for REG_OP/kernel under tests/blackbox/kernel/, with independent design/testcases and QA. Targets are predetermined; no interface-selection prompt. Kernel operator_name is the verified opInterface.value and attributes use GE names, not ACLNN aliases. Cover applicable rank-0 inputs in both suites. Every tensor's support_non_contiguous is declared explicitly from the facts (false unless explicitly supported); ValueDepend(OPTIONAL) is modeled per the ACLNN ABI; negative scenarios lock original inputs, never derived quantities."
      - "After the standard CSVs fully pass the skill's generation/QA/review, isolate oversized cases: python3 $WORK_DIR/.agents/skills/ops-registry-invoke/scripts/isolate_oversized_cases.py <the six standard CSVs under $WORK_DIR/op/tests/blackbox/testcases/ and kernel/testcases/> — over-threshold rows move to same-stem *_oversized.csv side tables that never enter the executable suites; thresholds may only be set via the script's documented env overrides and must be recorded; do not shrink factor domains, hand-edit CSVs, or delete side tables to dodge the isolation."
      - "Record $WORK_DIR/op/tests/blackbox/WORKFLOW_PROVENANCE.json: both fact inputs, the skill's real path and repo revision, conflict conclusions, standard artifacts, per-layer main/side-table counts and effective thresholds, the public QA conclusions, and any requirement scenario that could not be landed."
    acceptance:
      - "Both ACLNN and kernel suites contain independently generated standard L0/L1/L2 and full public design/QA reports. Kernel CSVs use input_shapes/output_shapes, verified op_name and GE attribute names; no ACLNN-to-kernel conversion."
      - "Standard CSVs exist non-empty (each glob resolves at least one file): test -s $WORK_DIR/op/tests/blackbox/testcases/*_l0_functional.csv && test -s $WORK_DIR/op/tests/blackbox/testcases/*_l1_functional.csv && test -s $WORK_DIR/op/tests/blackbox/testcases/*_l2_exception.csv."
      - "Design intermediates exist non-empty: $WORK_DIR/op/tests/blackbox/design/ contains the skill's standard artifacts 01_parameter_description.md, 02_test_factors.yaml, 03_scenario_enumeration.md, 04_constraints.py, 05_topology.md, 06_review_report.md, each non-empty."
      - "api_name consistency: OP_PASCAL=$(python3 -c \"import yaml; n=yaml.safe_load(open('$WORK_DIR/spec/spec.yaml'))['op']['name']; print(''.join(w.capitalize() for w in n.split('_')))\") ; a python3 csv.DictReader pass over the three standard CSVs asserts every data row's api_name is exactly aclnn$OP_PASCAL."
      - "Interface consistency with the actual OpDef: parameter names, order, optionality, defaults and output positions in the case set match $WORK_DIR/op/op_host/*_def.cpp, and the tensor-to-tensor shape bindings match the proto contract (st-verifier cross-checks item by item)."
      - "Oversized isolation is effective and stable: rerunning isolate_oversized_cases.py over both suites' six main CSVs exits 0 and moves zero further rows; *_oversized.csv rows are excluded from the executable suites and the side-table counts are recorded in WORKFLOW_PROVENANCE.json."
      - "$WORK_DIR/op/tests/blackbox/WORKFLOW_PROVENANCE.json exists, parses as JSON, and records both fact inputs, skill path + revision, conflict conclusions, main/side-table counts and effective thresholds."
      - "st-verifier reviews per its 用例生成 dimensions (standard artifacts present, structure coverage, interface/shape-binding consistency, no hand-written or sampled CSV) and passes."
    out_of_scope:
      - "Write only under $WORK_DIR/op/tests/blackbox/; do not modify kernel/host sources, $WORK_DIR/golden.py, design docs, whitebox case sets, or anything else."
      - "Do not execute device tests or run any ttk batch; do not hand-write, sample, or post-edit CSV rows; do not delete or shrink side tables to bypass isolation."
    max_retries: 2
    on_exhaust: exit
  - id: blackbox-smoke
    task_type: normal
    title: Blackbox smoke - split the three suite CSVs, run the first L0 case to green
    executor: general-executor
    verifier: general-verifier
    depends_on:
      - blackbox-gen
      - kernel-impl
      - aclnn-impl-smoke
      - setup-xpu-server
    goal:
      - "Run the first case of the L0 test suite with the TTK framework, fixing precision issues until it passes."
    approach:
      - "Locate the cases: use the blackbox-tester skill's merge_cases.py to split the standard layer CSVs under $WORK_DIR/op/tests/blackbox/testcases/ into three executable suites $WORK_DIR/op/tests/blackbox/ttk/blackbox_l0.csv / blackbox_l1.csv / blackbox_l2_neg.csv (*_oversized.csv side tables stay out), and record each suite's data-row count — the --expect-total value for every later task. Done when: the three CSVs exist and the counts are recorded."
      - "Locate the TTK framework root: $WORK_DIR/ops-test-kit; every ttk command runs from that directory."
      - "Phase 1 - run the first case without cross_check: read the first row's testcase_name from blackbox_l0.csv and run python3 -m ttk aclnn -i $WORK_DIR/op/tests/blackbox/ttk/blackbox_l0.csv -t <case-name> --pc=1 --task-prof false --run 1 --device-whitelist 0 --input-dist uniform --compare stat_rel_err --plugin $WORK_DIR/golden.py -o $WORK_DIR/op/tests/blackbox/ttk/result_smoke.csv (local golden comparison only, no third_party), with CANN debug logging tee'd to smoke_debug.log in the same directory. --input-dist uniform is fixed workflow-wide; the golden is $WORK_DIR/golden.py used as-is — if it is missing, the task fails. Done when: result_smoke.csv holds exactly one row."
      - "Phase 2 - adjudicate failed cases: rerun each row whose precision_status is not PASS with -t by name adding --compare cross_check --config $WORK_DIR/ttk.conf.yaml (third_party torch via the local xpu-server), writing to $WORK_DIR/op/tests/blackbox/ttk/result_smoke-crosscheck.csv; a case that passes under cross_check is adjudicated green; a case still failing enters precision localization and fix (wrong-precision class of the triage line + fix discipline) and is rerun until green. Skip this phase when phase 1 is all-green."
      - "Gate script: run the parse_result.py script under the blackbox-tester skill on <result.csv> with --expect-total <N>; it exits 0 if and only if pass==total and fail==skip==0; for the negative suite add --negative — exit 0 if and only if pass==0 (every row rejected)."
      - "Failure triage: reproduce each failure first with -t by case name, then load the skill for its class and record conclusions and fixes in the evidence file — build failure (build.sh error / no artifacts) -> ascendc-compile-debug; AIC Error, runtime crash, error codes (161xxx/361xxx/507xxx/561xxx), hang, timeout -> ascendc-runtime-debug; wrong precision -> ascendc-precision-debug (criteria: $WORK_DIR/design/Validation.md per-dtype rtol/atol); TTK-framework-level failure (malformed results / GOLDEN_FAILURE / OOM / killed) -> ttk-how-diagnose."
      - "Fix discipline: reproduce before attributing; code fixes stay inside the out_of_scope whitelist; after any code change run cd $WORK_DIR/op && ./build.sh to rebuild and deploy into dev-package before rerunning; suite CSVs, golden.py, tolerances and isolation thresholds stay as-is; a failure that cannot be fixed without deviating from design stays red with its attribution (oracle/design defect)."
      - "Operator-source proof: run the check_op_binpath.py script under the blackbox-tester skill on $WORK_DIR/op/tests/blackbox/ttk/smoke_debug.log with --optype <OpPascal> --expect-dir $WORK_DIR/dev-package/vendors/<OpPascal> --require. Done when: exit 0 — the tested kernel comes from this workflow's own deployment."
    acceptance:
      - "Gate: the first L0 case ends green in phase 1 (parse_result.py $WORK_DIR/op/tests/blackbox/ttk/result_smoke.csv --expect-total 1 exits 0) or is adjudicated green in phase 2 (parse_result.py $WORK_DIR/op/tests/blackbox/ttk/result_smoke-crosscheck.csv --expect-total 1 exits 0); a case still failing after cross_check goes through precision fix until green."
      - "Suites ready: the three suite CSVs' data-row counts equal their standard layer CSVs; counts and oversized side-table counts recorded."
