# Minimal op-develop workflow driving the shared workflow-orchestrator skill.
# The orchestrator wires the Codex layout ($WORK_DIR/.agents/skills plus
# $WORK_DIR/.codex/agents) automatically via link_agent_config.py.
workflow: op-develop
max_parallel: 10
system_prompt: If needed, dispatch multi subagents to explore code under $WORK_DIR/requirements/references(if exists) relevant to this task, as development reference.
nodes:
  - id: knowledge-preflight
    task_type: normal
    title: Set up and query the cannbot-knowledge knowledge base
    executor: general-executor
    verifier: general-verifier
    depends_on: []
    goal:
      - "Set up the cannbot-knowledge knowledge base at $WORK_DIR/cannbot-knowledge and query it for knowledge relevant to the operator in the task prompt; write the distilled findings to $WORK_DIR/cannbot-knowledge/artifacts/preflight.md."
    approach:
      - "The knowledge root is $WORK_DIR/cannbot-knowledge. If it has no .git subdirectory, run `git clone --depth 1 https://gitcode.com/cann/cannbot-knowledge.git $WORK_DIR/cannbot-knowledge`; otherwise skip the clone."
      - "If $WORK_DIR/cannbot-knowledge/artifacts/indexes/knowledge.sqlite3 is missing, run `python3 -m pip install -r $WORK_DIR/cannbot-knowledge/requirements.txt`, `bash $WORK_DIR/cannbot-knowledge/get_resources.sh`, and `python3 $WORK_DIR/cannbot-knowledge/.agents/skills/knowledge-query/scripts/knowledge_index.py --knowledge-root $WORK_DIR/cannbot-knowledge build`; if the index already exists, skip all three."
      - "Run `python3 $WORK_DIR/cannbot-knowledge/.agents/skills/knowledge-query/scripts/knowledge_query.py --knowledge-root $WORK_DIR/cannbot-knowledge discover` once, then query for the operator name, its math semantics, and the key CANN/Ascend C APIs mentioned in the task prompt."
      - "For each promising hit, read the full card at the returned path; follow card resource/sources links only when the card is insufficient."
      - "Write $WORK_DIR/cannbot-knowledge/artifacts/preflight.md: per topic, the distilled facts (API contracts, platform limits, tiling/UB constraints, known pitfalls), each citing its source card path. Record zero-hit queries explicitly as 'no coverage' — do not treat them as errors."
    acceptance:
      - "$WORK_DIR/cannbot-knowledge/artifacts/preflight.md exists and is non-empty."
      - "Every fact in it cites a card path under $WORK_DIR/cannbot-knowledge; queries with no hits are listed explicitly."
    out_of_scope:
      - "The knowledge repository is read-only except for its own setup artifacts (indexes, downloaded resources); do not modify any knowledge card."
      - "Do not create or modify any file outside $WORK_DIR/cannbot-knowledge/."
    max_retries: 1
    on_exhaust: continue
  - id: detect-npu-arch
    task_type: normal
    title: Detect the current platform's NPU arch
    executor: general-executor
    verifier: general-verifier
    depends_on: []
    goal:
      - Run `asys info -r hardware` to query the current platform's hardware information, extract the NPU architecture, and write it to $WORK_DIR/npu-arch.json.
    approach:
      - Run `asys info -r hardware` and capture its full output.
      - Identify the NPU architecture in that output.
      - Create $WORK_DIR/ if it does not already exist, then write the architecture as JSON to $WORK_DIR/npu-arch.json.
    acceptance:
      - $WORK_DIR/npu-arch.json exists and parses as valid JSON.
      - The file records the NPU architecture, and the recorded value matches what `asys info -r hardware` reports for this platform.
    out_of_scope:
      - Do not create or modify any file other than $WORK_DIR/npu-arch.json.
      - Do not install, upgrade, or reconfigure anything; only read the environment.
    max_retries: 2
    on_exhaust: exit
  - id: create-requirements-dir
    task_type: normal
    title: Create the requirements analysis directory
    executor: general-executor
    verifier: general-verifier
    depends_on: []
    goal:
      - Create the requirements analysis directory at $WORK_DIR/requirements/.
    approach:
      - Create $WORK_DIR/ if it does not already exist.
      - Create $WORK_DIR/requirements/ under it.
    acceptance:
      - $WORK_DIR/requirements/ exists and is a directory.
    out_of_scope:
      - Do not create or modify any file other than the $WORK_DIR/requirements/ directory.
    max_retries: 2
    on_exhaust: exit
  - id: setup-reference-repos
    task_type: normal
    executor: general-executor
    verifier: general-verifier
    title: Shallow-clone the reference source repos
    goal:
      - "Create $WORK_DIR/requirements/references/ and shallow-clone (--depth 1) the reference source repos required by the requirement analysis into cann/, ascend/, competitor/ subdirectories."
    approach:
      - "Create $WORK_DIR/requirements/references/ if it does not already exist, then create cann/, ascend/, competitor/ subdirectories under it."
      - "For each clone command below, skip it if the target directory already contains a .git subdirectory; otherwise run it as-is."
      - "git clone --depth 1 https://gitcode.com/cann/ops-nn.git $WORK_DIR/requirements/references/cann/ops-nn"
      - "git clone --depth 1 https://gitcode.com/cann/ops-math.git $WORK_DIR/requirements/references/cann/ops-math"
      - "git clone --depth 1 https://gitcode.com/cann/ops-transformer.git $WORK_DIR/requirements/references/cann/ops-transformer"
      - "git clone --depth 1 https://gitcode.com/cann/ops-cv.git $WORK_DIR/requirements/references/cann/ops-cv"
      - "git clone --depth 1 https://gitcode.com/cann/ops-rand.git $WORK_DIR/requirements/references/cann/ops-rand"
      - "git clone --depth 1 https://gitcode.com/cann/canndev.git $WORK_DIR/requirements/references/cann/canndev"
      - "git clone --depth 1 https://gitcode.com/Ascend/op-plugin.git $WORK_DIR/requirements/references/ascend/op-plugin"
      - "git clone --depth 1 https://gitcode.com/Ascend/torchair.git $WORK_DIR/requirements/references/ascend/torchair"
      - "git clone --depth 1 https://github.com/pytorch/pytorch.git $WORK_DIR/requirements/references/competitor/pytorch"
      - "git clone --depth 1 https://github.com/tensorflow/tensorflow.git $WORK_DIR/requirements/references/competitor/tensorflow"
      - "Report which repos were cloned, skipped (already present), or failed to clone."
    acceptance:
      - "$WORK_DIR/requirements/references/ exists and contains cann/, ascend/, competitor/ subdirectories."
      - "Each of these ten target directories contains a .git subdirectory: cann/ops-nn, cann/ops-math, cann/ops-transformer, cann/ops-cv, cann/ops-rand, cann/canndev, ascend/op-plugin, ascend/torchair, competitor/pytorch, competitor/tensorflow."
    out_of_scope:
      - "Do not modify any repo's contents, checkout a different branch, or run any build inside the repos."
      - "Do not create or modify any file outside $WORK_DIR/requirements/references/."
    depends_on:
      - create-requirements-dir
    max_retries: 2
    on_exhaust: exit
  - id: setup-ops-test-kit
    task_type: normal
    executor: general-executor
    verifier: general-verifier
    title: Clone the ops-test-kit repo
    goal:
      - "Clone the ops-test-kit repository into $WORK_DIR/ops-test-kit."
    approach:
      - "Create $WORK_DIR/ if it does not already exist."
      - "Skip the clone if $WORK_DIR/ops-test-kit already contains a .git subdirectory; otherwise run `git clone --depth 1 https://gitcode.com/cann/ops-test-kit $WORK_DIR/ops-test-kit`."
    acceptance:
      - "$WORK_DIR/ops-test-kit exists and contains a .git subdirectory."
    out_of_scope:
      - "Do not modify the repo's contents, checkout a different branch, or run any build inside the repo."
      - "Do not create or modify any file outside $WORK_DIR/ops-test-kit/."
    depends_on: []
    max_retries: 2
    on_exhaust: exit
  - id: verify-ops-test-kit
    task_type: normal
    executor: general-executor
    verifier: general-verifier
    title: Verify TTK works in the current environment
    goal:
      - "Determine whether TTK works in the current environment, for later operator functional and performance verification."
      - "Faithfully run the environment check and the three shipped sample test commands (kernel, geir, aclnn; the e2e path is excluded), save each command's output to disk, and report the results exactly as produced (PASS or FAIL, as-is)."
    approach:
      - "Change into the cloned repo: `cd $WORK_DIR/ops-test-kit` (TTK commands must run from the ops-test-kit directory)."
      - "Create the output directory: `mkdir -p ttk-verify`."
      - "Run the environment check and save its output: `python3 -m ttk info > ttk-verify/env-info.txt 2>&1`."
      - "Pick the input files at runtime instead of hardcoding them: for kernel and geir pick any one file from `examples/case_store/kernel/*.csv`, for aclnn pick any one from `examples/case_store/aclnn/*.csv` (e.g. the first match of `ls <dir>/*.csv | head -1`). Record which file each command used."
      - "Run the three runnable sample test paths in order with the picked files, each saving its full output to a log file under ttk-verify/ (skip the e2e path entirely — it is out of scope for this verification). For each path, append `--ti=0` to run only the first case in the picked CSV; do not run the full CSV:"
      - "`python3 -m ttk kernel -i <picked-kernel.csv> --ti=0 > ttk-verify/kernel.log 2>&1`"
      - "`python3 -m ttk geir -i <picked-kernel.csv> --ti=0 > ttk-verify/geir.log 2>&1`"
      - "`python3 -m ttk aclnn -i <picked-aclnn.csv> --ti=0 > ttk-verify/aclnn.log 2>&1`"
    acceptance:
      - "Every command was actually executed and its output saved: $WORK_DIR/ops-test-kit/ttk-verify/ contains env-info.txt (non-empty, with a `Found N device(s)` block) and the three logs kernel.log, geir.log, aclnn.log (each non-empty, containing a `TTK Test Summary` block). e2e.log is not required."
      - "The environment is verified OK: each of the three logs' `TTK Test Summary` block shows `FAIL     : 0` and `PassRate : 100.00%`. Any FAIL means the environment is not usable, so the task fails and the workflow exits."
    out_of_scope:
      - "Do not fix or work around any failure: do not edit example CSVs, docs, or source, do not modify or reinstall anything, and do not retry or patch commands to force a pass; report results exactly as produced."
      - "Write outputs only under $WORK_DIR/ops-test-kit/ttk-verify/ (build/cache artifacts the repo generates under itself are expected)."
    depends_on:
      - setup-ops-test-kit
    max_retries: 0
    on_exhaust: exit
  - id: setup-xpu-server
    task_type: normal
    executor: general-executor
    verifier: general-verifier
    title: Bring up the local xpu-server for cross_check third_party execution
    goal:
      - "Start a local xpu-server that executes the golden plugin's third_party reference (competitor torch) for cross_check comparison, and write $WORK_DIR/ttk.conf.yaml pointing TTK at it; every later ttk invocation (kernel and aclnn flows) carries --config $WORK_DIR/ttk.conf.yaml."
    approach:
      - "The server ships inside the ops-test-kit clone. Make its package importable and start it detached: mkdir -p $WORK_DIR/xpu-run && ln -sfn $WORK_DIR/ops-test-kit/ttk/remote/server $WORK_DIR/xpu-run/xpu_server."
      - "Start with --devices cpu always: (cd $WORK_DIR/xpu-run && PYTHONPATH=$WORK_DIR/xpu-run setsid python3 -m xpu_server.xpu_server --port 9090 --devices cpu </dev/null > $WORK_DIR/xpu-run/xpu-server.log 2>&1 &). A bare start (without --devices cpu) auto-detects no hardware, falls back to cpu, yet keeps use_device=true with device_ids=[cpu] — the dispatcher then computes max_attempts=0 and every /v1/run silently returns 500 'internal error' leaving no log."
      - "Reuse an already-listening server on 127.0.0.1:9090 (TCP connect succeeds AND GET http://127.0.0.1:9090/v1/heartbeat returns HTTP 200 with JSON containing \"status\":\"ok\" and \"providers\" including \"torch\") instead of starting a second one — this allows multiple operators to share one xpu-server on the same machine. If the existing server is not a healthy xpu_server with the torch provider, kill it and start a fresh one with the command above."
      - "If you started a new server, wait up to 60s for the port to accept connections."
      - "Write $WORK_DIR/ttk.conf.yaml with remote: endpoints: [{host: 127.0.0.1, port: 9090}]."
    acceptance:
      - "127.0.0.1:9090 accepts a TCP connection (python3 -c \"import socket; s=socket.create_connection(('127.0.0.1',9090),5); s.close()\" exits 0)."
      - "GET http://127.0.0.1:9090/v1/heartbeat returns HTTP 200 with JSON body containing \"status\":\"ok\" and \"providers\" including \"torch\" (python3 -c \"import urllib.request,json; r=urllib.request.urlopen('http://127.0.0.1:9090/v1/heartbeat',timeout=5); d=json.loads(r.read()); assert r.status==200 and d.get('status')=='ok' and 'torch' in d.get('providers',[]), d\" exits 0)."
      - "$WORK_DIR/ttk.conf.yaml exists, parses as YAML, and its remote.endpoints[0] is host 127.0.0.1 port 9090."
    out_of_scope:
      - "Create only $WORK_DIR/ttk.conf.yaml and the $WORK_DIR/xpu-run/ directory; modify nothing under $WORK_DIR/ops-test-kit."
    depends_on:
      - setup-ops-test-kit
    max_retries: 2
    on_exhaust: exit
  - id: analyze-requirements
    task_type: normal
    executor: general-executor
    verifier: general-verifier
    title: Generate the requirements analysis document REQUIREMENTS.md
    goal:
      - "Produce $WORK_DIR/requirements/REQUIREMENTS.md for the operator described in $USER_PROMPT, covering its functional scope, inputs/outputs, and constraints, along with the research intermediates under $WORK_DIR/requirements/research/."
      - "The CANN-side research anchors on the existing (A2/A3-era) implementation and produces three artifacts under $WORK_DIR/requirements/research/cann/: code_walkthrough.md (call-chain walkthrough), code_design.md (deliverable coverage + analysis), and formula.md (formula extracted from the existing kernel's Compute method — the semantic anchor of the operator's math, reference evidence for downstream design/golden tasks)."
    approach:
      - "First read the customer requirement from the file named by $USER_PROMPT (the user prompt); extract the operator name and any specified runtime environment, invocation, network, dtype, or shape requirements."
      - "Load the ops-requirement-analysis skill first (mandatory) and follow its pipeline: stage 1 name resolution, stage 2 three-way research (model / competitor / CANN) with decision priority — math semantics and formula follow the competitor implementation (the primary semantic baseline and reference-oracle source); signatures, dtypes and deliverable facts follow the official IR when it hits (built-in or generation-gap operators — the only truth source against same-name ambiguity), and follow the competitor interface as the design baseline when IR misses (brand-new operators: aclnn mirrors PyTorch, GEIR mirrors TensorFlow, with the basis recorded); stage 3 requirement summary per its references/output_template.md."
      - "Load the cannbot-knowledge knowledge base at $WORK_DIR/cannbot-knowledge and query it for this operator and its key CANN/Ascend C APIs; reuse $WORK_DIR/cannbot-knowledge/artifacts/preflight.md when present, cite source card paths in the requirement research, and record no-hit topics explicitly."
      - "Treat $WORK_DIR/requirements/references/ (cann/, ascend/, competitor/ subdirectories) as the skill's reference/ tree for empirical source search."
      - "Consult the local built-in proto at $ASCEND_OPP_PATH/built-in/op_proto/inc/ as the highest-authority CANN fact source."
      - "Use the chip platform recorded in $WORK_DIR/npu-arch.json as the runtime-environment evidence."
      - "Fill any missing customer-requirement fields with the skill's defaults (Ascend 950PR/950DT, single-op + PyTorch) and mark them as assumptions; decide autonomously, never ask the user."
    acceptance:
      - "$WORK_DIR/requirements/REQUIREMENTS.md exists and is non-empty."
      - "The document has the fixed section structure (## 1 需求背景 through ## 8 需求分析总结) with all sections filled."
      - "Supported data types, chip platform / runtime environment, and the operator formula are all traceable in the document."
      - "No bare COPY: directives remain; table of contents entries match the body headings."
      - "The §7.4 performance requirement section lists at least 4 concrete key shapes, states the source route (A / B / both not applicable), and fills in no target values."
      - "$WORK_DIR/requirements/research/cann/ contains code_walkthrough.md, code_design.md and formula.md; when no kernel source was found, formula.md carries an explicit 'Kernel code missing' note instead of invented line-level evidence."
      - "Brand-new operator (no CANN implementation at any level: ops-* / canndev / built-in proto all missed): code_design.md marks every deliverable ❌ and states 'CANN has no existing implementation; A5 is greenfield development'; formula.md then derives from competitor/paper formulas with sources noted."
      - "Each located competitor framework produces research/opensource/{framework}/code_walkthrough.md, code_design.md and formula.md; competitor formula.md carries source file:line references, and code_design.md states the op's forward/backward identity."
      - "model_research.md marks graded sources (arxiv / github / huggingface) on its reference links."
      - "§8.1 deliverables derive from the §7.3 invocation method per the mapping table (union for combined invocations), no fixed all-yes list; for a generation-gap (代际补齐) scenario, §8.2 declares the capability union is not narrowed plus the new-kernel subset + IsAiCoreSupport dispatch/fallback."
      - "formula.md is extracted from the existing kernel's Compute method (not via TensorFlow mapping); kernel dtype branches are listed separately, and every magic-number constant carries a source file:line reference."
      - "Variant full coverage: every tiling/kernel variant in the overview tables has its own detailed subsection (compute flow + buffer allocation + tiling strategy); no 'same as template 1' skips."
      - "Framework registration is enumerated per evidence: any found plugin (TF/ONNX/Caffe) is listed with its ParseParams attribute mapping and registration code, each marked ✅/❌; none found is recorded as ❌, never silently omitted."
      - "The verifier reviews the document item by item against the fixed section, COPY, numbering, TOC, research, performance, and API requirements; every check passes."
    out_of_scope:
      - "Do not write spec.yaml, DESIGN.md, or any implementation code; this task only produces the requirements document and its research intermediates."
    depends_on:
      - setup-reference-repos
    max_retries: 1
    on_exhaust: exit
  - id: generate-spec
    task_type: normal
    executor: general-executor
    verifier: general-verifier
    title: Generate the operator spec file spec.yaml
    goal:
      - "Produce $WORK_DIR/spec/spec.yaml for the operator described in $WORK_DIR/requirements/REQUIREMENTS.md: a machine-checkable structured operator spec translated from and consistent with it, with no omission and no invented addition (every field traceable to REQUIREMENTS.md)."
      - "Use $WORK_DIR/spec/ as this task's working directory; the spec artifact is written there."
    approach:
      - "Load the ops-spec-gen skill first (mandatory); decide category and paradigms from its registries (category_enum.yaml, paradigm_enum.yaml, category_paradigm_map.yaml), never by intuition."
      - "Confirm $WORK_DIR/requirements/REQUIREMENTS.md exists; extract operator category/paradigms, input tensors + dtypes, output dtype/shape rules, math formula, reference oracle, numerical tolerance, boundary cases, target chips (runtime environment section), and non-tensor attributes."
      - "Generate the skeleton with the ops-spec-gen skill's generator (never hand-write spec.yaml): run its scripts/generate_spec.py with --op-name <op-from-REQUIREMENTS> --category <Category> --paradigms <P1,P2> --inputs \"n1:dt1,dt2;n2:...\" --outputs <out> --description \"...\" --output-dir $WORK_DIR/spec"
      - "Select the conditional generator options per the skill's rule table: for Reduction categories choose --axis-source (fixed / implicit_all / input_tensor) by the operator's interface; add --paradigm-groups combination when the operator has mode-switch attributes; add --format-variants when computation differs by data layout."
      - "Hand-fill the required TODO fields per the skill: math_semantics.formula, reference_oracle.api, dtype_policy.supported_combinations, numerical_tolerance.per_dtype, op.platform_constraints.supported_chips, outputs[].shape_rule/dtype_rule, and determinism (accumulation_order / bitwise_reproducible); for VariableOutput/DynamicShape operators declare outputs[].shape_rule_kind: data_dependent with shape_rule_description + shape_bounds.max_elements instead of a shape_rule expression; review boundary_conditions / extreme_inputs / format_variants as needed. The formula form must match the 'core formula' row in REQUIREMENTS section 6 step by step."
      - "Run the ops-spec-gen skill's scripts/validate_spec.py on $WORK_DIR/spec/spec.yaml; fix and rerun on any FAIL until overall: PASS (exit 0); a stage SKIP (e.g. stage 9 without torch, stage 10 with unreachable oracle) counts as pass."
      - "Self-verify: stop and report if any spec-owned field conflicts with REQUIREMENTS rather than choosing silently."
    acceptance:
      - "$WORK_DIR/spec/spec.yaml exists, is non-empty, and parses as YAML: python3 -c \"import yaml; yaml.safe_load(open('$WORK_DIR/spec/spec.yaml'))\" exits 0."
      - "11-stage validation passes: the ops-spec-gen skill's scripts/validate_spec.py on $WORK_DIR/spec/spec.yaml ends with overall: PASS (exit 0)."
      - "No TODO or placeholder residue: ! grep -qiE 'TODO|<[A-Z_]+>' $WORK_DIR/spec/spec.yaml."
      - "spec-verifier reviews per agents/spec-verifier.md (11-stage + SPEC-* clauses) and cross-checks every spec-owned field against $WORK_DIR/requirements/REQUIREMENTS.md item by item: no omission, no invented addition; all clauses must be ✓ or ⚠ (no ❌) — machine-checkable clauses pass, ⚠ hints do not block."
    out_of_scope:
      - "Produce only $WORK_DIR/spec/spec.yaml: do not create or modify any other file — including $WORK_DIR/requirements/REQUIREMENTS.md, LOG.md/LOG.json (logging is handled by the workflow runner), or any implementation code."
    depends_on:
      - analyze-requirements
    max_retries: 1
    on_exhaust: exit
  - id: setup-op-package
    task_type: normal
    executor: general-executor
    verifier: general-verifier
    title: Initialize and verify the operator package from the registry-invoke template
    goal:
      - "Initialize the complete operator package from the ascendc-registry-invoke-template skill into $WORK_DIR/op/, rename it to the target operator, and verify the template's example test."
    approach:
      - "Derive the operator's three name forms from spec.yaml: OP_SNAKE = op.name, OP_PASCAL = PascalCase, OP_UPPER = UPPER_SNAKE."
      - "Resolve the template through the ascendc-registry-invoke-template skill: TEMPLATE_DIR is the loaded skill's own directory ; test -f $TEMPLATE_DIR/SKILL.md && test -d $TEMPLATE_DIR/references/add_example."
      - "Create a fresh package from the template: rm -rf $WORK_DIR/op && mkdir -p $WORK_DIR/op && cp -a $TEMPLATE_DIR/references/add_example/. $WORK_DIR/op/ && rm -rf $WORK_DIR/op/tests. Keep the template's ACLNN example as the baseline."
      - "Rename every file under $WORK_DIR/op/ whose name contains add_example to OP_SNAKE, then replace all sample name forms in file contents: add_example->OP_SNAKE, AddExample->OP_PASCAL, ADD_EXAMPLE->OP_UPPER; set the root CMake package_name to OP_PASCAL and update any ACLNN symbol references to aclnn<OP_PASCAL>."
      - "Build the initialized package with its template build.sh for the lab NPU generation, install the generated .run into $WORK_DIR/dev-package, then run the template's eager example from $WORK_DIR/op/examples/. Point the example at $WORK_DIR/dev-package/vendors/<OP_PASCAL> by exporting ASCEND_CUSTOM_OPP_PATH and placing that vendor's op_api/lib first in LD_LIBRARY_PATH; do not fall back to the system opp vendors directory. Write the example output and environment evidence to $WORK_DIR/op/examples/verify.log."
    acceptance:
      - "$WORK_DIR/op/ contains the package skeleton: test -d $WORK_DIR/op/op_host && test -d $WORK_DIR/op/op_kernel && test -d $WORK_DIR/op/op_graph && test -f $WORK_DIR/op/build.sh && test -f $WORK_DIR/op/CMakeLists.txt && test -f $WORK_DIR/op/README.md && test ! -e $WORK_DIR/op/tests."
      - "No sample-name residue: ! grep -RniE 'add_example|AddExample|ADD_EXAMPLE|addExample' $WORK_DIR/op/."
      - "Run package installed into dev-package: OP_PASCAL=$(python3 -c \"import yaml; n=yaml.safe_load(open('$WORK_DIR/spec/spec.yaml'))['op']['name']; print(''.join(w.capitalize() for w in n.split('_')))\") ; test -s $WORK_DIR/dev-package/vendors/$OP_PASCAL/op_api/lib/libcust_opapi.so."
      - "Template example passes: cd $WORK_DIR/op/examples && ./run.sh --eager > verify.log 2>&1 && ! grep -qF 'FAILED' verify.log && grep -qF 'PASS' verify.log."
      - "The example library resolves from dev-package: OP_PASCAL=$(python3 -c \"import yaml; n=yaml.safe_load(open('$WORK_DIR/spec/spec.yaml'))['op']['name']; print(''.join(w.capitalize() for w in n.split('_')))\") ; ldd $WORK_DIR/op/examples/build-eager/bin/test_aclnn_$OP_PASCAL | grep -F 'libcust_opapi.so' | grep -qF $WORK_DIR/dev-package/vendors/$OP_PASCAL."
      - "verify.log records the dev-package runtime path: test -s $WORK_DIR/op/examples/verify.log && grep -qF 'ASCEND_CUSTOM_OPP_PATH' $WORK_DIR/op/examples/verify.log && grep -qF $WORK_DIR/dev-package/vendors/$OP_PASCAL $WORK_DIR/op/examples/verify.log."
    out_of_scope:
      - "Only create or modify files under $WORK_DIR/op/ and $WORK_DIR/dev-package/."
      - "Keep the template's operator semantics unchanged (input count and kernel math change in later tasks)."
    depends_on:
      - generate-spec
    max_retries: 2
    on_exhaust: exit
  - id: init-design-dir
    task_type: normal
    executor: general-executor
    verifier: general-verifier
    title: Initialize the design document directory structure
    goal:
      - "Create $WORK_DIR/design/branches/ as a directory and $WORK_DIR/design/INDEX.md whose content equals the design-template skill's templates/design/INDEX.md.templ with every {OP} replaced by the operator name from spec.yaml."
    approach:
      - "OP_NAME=$(python3 -c \"import yaml; print(yaml.safe_load(open('$WORK_DIR/spec/spec.yaml'))['op']['name'])\")"
      - "mkdir -p $WORK_DIR/design/branches"
      - "Render the design-template skill's templates/design/INDEX.md.templ to $WORK_DIR/design/INDEX.md with every {OP} replaced (sed \"s/{OP}/${OP_NAME}/g\")"
