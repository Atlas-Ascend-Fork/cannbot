# A2/A3 (NpuArch 2201, e.g. Ascend 910B) operator development workflow.
# Selected by the workflow-dispatch skill when the local NPU arch is 2201;
# arch >= 3510 (A5 and newer) is served by op-develop.yaml instead.
#
# This workflow is a thin bootstrap and is fully independent from op-develop.yaml:
# it does not reference, reuse, or share any task, skill, agent, or artifact of
# the A5+ workflow. Task 1 installs the A2/A3 ops-registry-invoke plugin into
# $WORK_DIR at project level, gives $WORK_DIR its own project boundary (own git
# root on a main branch with an initial commit), and wires the resource paths
# the plugin's workflow expects; Task 2 hands the user prompt to the plugin's
# ops-registry-invoke-workflow skill, which owns the whole development process
# including its gate policy.
#
# The harness owns project-level skill and agent configuration discovery and
# loading; this workflow neither names nor manages that configuration.
#
# Gate policy: this workflow only routes, installs, and invokes the plugin's
# skill. It does not set, override, or answer the plugin's gate level or
# confirmation points (CP1-CP5); autonomy_level stays whatever the installed
# plugin ships, and confirmations are surfaced, never self-answered.
workflow: a2-a3-op-develop
max_parallel: 1
system_prompt: Work only inside $WORK_DIR. The .git repository at $WORK_DIR is this run's own workspace repository — never run git against an ancestor repository, and never modify the cannbot-skills clone's tracked sources. The A2/A3 workflow you drive keeps its own state (development log, checkpoints); never restart it from scratch when it can be resumed. Do not re-link or import configuration from any other plugin.
nodes:
  - id: install-a23-plugin
    task_type: normal
    title: Install the A2/A3 ops-registry-invoke plugin at project level in the workflow directory
    executor: general-executor
    verifier: general-verifier
    depends_on: []
    goal:
      - "Clone the cannbot-skills repository into $WORK_DIR and install its ops-registry-invoke plugin at project level, so that $WORK_DIR afterwards is a self-contained project: its own git root (main branch, initial commit), the plugin's project-level skills and agents, the resource paths that plugin's workflow commands expect, and isolation that survives workflow resumes and this task's own retries — while any configuration not created by this workflow is protected, never overwritten."
    approach:
      - "Guard existing configuration FIRST: if $WORK_DIR carries project-level skill/agent configuration or a work_dir-owned repository that this workflow did not create, and $WORK_DIR/.a23-bootstrap/INSTANCE does not exist, fail immediately and report the conflicting entries; never overwrite foreign configuration. If the INSTANCE marker exists, verify its recorded work_dir path equals $WORK_DIR's realpath, record the pre-existing entries in the install report, and proceed idempotently."
      - "Persist the instance marker only after the guard passes: write $WORK_DIR/.a23-bootstrap/INSTANCE (create the directory first) recording owner-workflow, the realpath of $WORK_DIR, and the creation time."
      - "Give $WORK_DIR its own complete git workspace (the plugin's workflow checkpoints branch, commit, and finally merge into main, so the repository must exist, be rooted exactly at $WORK_DIR, carry a main branch, and have at least one commit): run git init -q -b main $WORK_DIR (on older git without init -b, fall back to git init -q $WORK_DIR followed by git -C $WORK_DIR branch -m main), then create the initial commit: git -C $WORK_DIR commit --allow-empty -m \"chore: initialize A2/A3 operator development workspace\". The initial commit is required, not best-effort: if it fails for a missing git identity, fail and report that a git user.name/user.email must be configured; this task never changes global configuration. On a retry whose repository was created by this workflow, verify git -C $WORK_DIR rev-parse --verify --quiet main and rev-parse --verify HEAD both succeed and repair a half-created state."
      - "Clone the A2/A3 plugin repository (idempotent): if $WORK_DIR/cannbot-skills/.git exists, skip the clone; otherwise run git clone --depth 1 https://gitcode.com/cann/cannbot-skills.git $WORK_DIR/cannbot-skills. The plugin is the subdirectory $WORK_DIR/cannbot-skills/plugins-official/ops-registry-invoke; its installer needs the whole repository, so clone the repository, not the subdirectory alone."
      - "Install the A2/A3 plugin at project level: bash $WORK_DIR/cannbot-skills/plugins-official/ops-registry-invoke/init.sh project $WORK_DIR. The project-level install places the plugin's skills and agents into the configuration the harness loads and installs its gate policy; leave autonomy_level exactly as the plugin ships it — this workflow never edits the gate policy. Do not pass or record any process selector."
      - "Wire the resource paths the plugin's workflow commands use relative to the project root: ln -sfn $WORK_DIR/cannbot-skills/plugins-official/ops-registry-invoke/workflow $WORK_DIR/workflow ; ln -sfn $WORK_DIR/cannbot-skills/ops $WORK_DIR/ops ; ln -sfn $WORK_DIR/cannbot-skills/plugins-official/ops-registry-invoke/reference $WORK_DIR/reference. These cover the workflow's own resources (`$WORK_DIR/workflow/resources/*.py`), its shared skills' scripts (`$WORK_DIR/ops/*/scripts/*.py`), and the reference library tree ($WORK_DIR/reference/cann/asc-devkit/...)."
      - "Write $WORK_DIR/.a23-bootstrap/install-report.md recording: the cloned cannbot-skills commit, the guard outcome (fresh install vs verified retry, pre-existing entries), the git workspace state, the resource symlinks created, the plugin's installed skill/agent names, and the installer's exit status."
    acceptance:
      - "The clone is present: test -d $WORK_DIR/cannbot-skills/.git."
      - "The instance marker exists and is bound to this directory: test -s $WORK_DIR/.a23-bootstrap/INSTANCE and its recorded work_dir path equals $WORK_DIR's realpath."
      - "$WORK_DIR is its own complete git workspace: git -C $WORK_DIR rev-parse --show-toplevel outputs a path whose realpath equals $WORK_DIR's realpath (not an ancestor, not the cannbot-skills clone), git -C $WORK_DIR rev-parse --verify --quiet main succeeds, and git -C $WORK_DIR rev-parse --verify HEAD succeeds."
      - "The workflow skill is installed and named correctly: a file matching */ops-registry-invoke-workflow/SKILL.md exists under $WORK_DIR and its frontmatter declares name: ops-registry-invoke-workflow."
      - "The plugin's operator-development agents are installed: at least one agent definition matching ascendc-ops-* exists in the project configuration under $WORK_DIR."
      - "The plugin's gate policy is untouched: the installed instruction block carries autonomy_level exactly as the plugin ships it, and it names the ops-registry-invoke-workflow skill."
      - "The plugin's resource paths resolve from $WORK_DIR: cd $WORK_DIR && python3 $WORK_DIR/workflow/resources/validate_checklist.py --help exits 0, and test -f $WORK_DIR/ops/ops-spec-gen/scripts/validate_spec.py && test -d $WORK_DIR/reference/cann/asc-devkit."
      - "The cloned repository's plugin sources are untouched: git -C $WORK_DIR/cannbot-skills status --porcelain shows no change under the plugin's skills, agents and workflow directories (the verifier inspects the output); the installer-managed instruction file is excluded from this check."
      - "The install report exists and is non-empty: test -s $WORK_DIR/.a23-bootstrap/install-report.md."
    out_of_scope:
      - "Do not modify any git-tracked source file inside $WORK_DIR/cannbot-skills/; dependency directories the installer manages are its own behavior."
      - "Do not touch any file outside $WORK_DIR; no git command may run against a repository outside $WORK_DIR."
      - "Do not edit the installed gate policy (autonomy_level) or any other configuration the plugin ships — install, do not adapt."
      - "Do not start any operator development work; that belongs to the next task."
      - "Do not install into any directory other than $WORK_DIR (no global-level installs), and never change global git configuration."
    max_retries: 2
    on_exhaust: exit
  - id: run-a23-op-workflow
    task_type: normal
    title: Run the A2/A3 ops-registry-invoke workflow for the user prompt
    executor: general-executor
    verifier: general-verifier
    depends_on:
      - install-a23-plugin
    goal:
      - "Acting as the primary agent of the A2/A3 ops-registry-invoke plugin now installed at project level in $WORK_DIR, load its ops-registry-invoke-workflow skill and drive the operator development it defines — requirements and design, iterative development, acceptance, and upstream preparation — for the requirement in $USER_PROMPT, either to completion or, when the plugin's process reaches a user confirmation this unattended run cannot deliver, to a clean handover at that stopping point."
    approach:
      - "Read the requirement from $USER_PROMPT; if it names a file, read that file for the full requirement text. Pass the requirement to the workflow verbatim, without narrowing or rewriting it."
      - "Load the ops-registry-invoke-workflow skill by name and follow it as the single process authority: its stages, its gate policy (read the autonomy_level from the installed project instruction block exactly as the skill defines), its checkpoint and confirmation rules, its subagent dispatch parameters, and its artifact layout (`$WORK_DIR/operators/<operator_name>/`). Dispatch subagents exactly as the skill prescribes."
      - "Never answer a user confirmation on the user's behalf: this workflow only routes, installs, and invokes the plugin's skill — its CP confirmations belong to the user. When the skill reaches a confirmation this run cannot surface to a human, do not pick a default and do not proceed silently. Instead, stop cleanly and make that stopping point the task's outcome: record in the development log and the final task report (a) what the skill asks the user to confirm, (b) what the process will do next once confirmed, and (c) the takeover instructions — open a harness session in $WORK_DIR (the installed plugin, its gate policy, the development log, and the git checkpoints are all in place there) and continue per the skill's own task-resume rules (the user states they want to continue developing the operator). Also write $WORK_DIR/HANDOVER.md at this fixed path — the handover notice the user reads after the run, stating plainly that this was a handover, not a completion — carrying: the handover nature (the operator development is NOT finished), the pending confirmation (what the skill asks, what happens next once confirmed), the development-log location, and the concrete takeover steps. Do not treat the stopping point as a failure to retry away: a retry would reach the same confirmation. This stopping point is a legitimate terminal state for this task, judged by the Verifier alongside completion."
      - "On the completion path, remove a stale $WORK_DIR/HANDOVER.md left behind by an earlier handover of the same run (resumed and finished after takeover): the run has now completed, and a leftover handover notice would contradict that completed state."
      - "Resume, never restart: if the development log already exists under $WORK_DIR (`$WORK_DIR/operators/<operator_name>/docs/LOG.md`) and its current stage is not completed, follow the skill's task-resume mapping instead of rebuilding from scratch."
      - "Keep every artifact inside $WORK_DIR, and run every git operation against $WORK_DIR's own repository only."
    acceptance:
      - "The run reached one of the two legitimate terminal states. Either completion: $WORK_DIR/operators/ contains a directory for the operator named in the requirement holding at least the op_host/ and op_kernel/ subtrees, its `$WORK_DIR/operators/<operator_name>/docs/LOG.md` exists, is non-empty, records completion (its current-stage field, 当前开发状态.当前阶段, reads 已完成), its original-requirement field (用户原始需求) carries the $USER_PROMPT requirement content, and no $WORK_DIR/HANDOVER.md remains. Or clean handover: the development log exists and is non-empty at the stopping stage, $WORK_DIR/HANDOVER.md exists, is non-empty, and carries the pending confirmation point (what the skill asks, what happens next) together with the concrete takeover instructions (work in $WORK_DIR with the installed plugin, continue per the skill's task-resume rules), and the final task report states the same handover."
    out_of_scope:
      - "Do not modify $WORK_DIR/cannbot-skills/ tracked sources, $WORK_DIR/.a23-bootstrap/, the harness-managed project configuration, or any workflow YAML — the process may only produce the artifacts the skill defines, plus the HANDOVER.md handover notice this workflow itself prescribes (an artifact of this adaptation layer, not of the plugin's skill)."
      - "Do not load or invoke any skill, task, or template of the A5-and-newer (NpuArch >= 3510) workflow; the A2/A3 plugin's own skills are the only toolset."
      - "Do not set, override, or bypass the skill's gate policy or its checkpoint and confirmation rules, and never self-answer a user confirmation."
    max_retries: 1
    on_exhaust: exit
