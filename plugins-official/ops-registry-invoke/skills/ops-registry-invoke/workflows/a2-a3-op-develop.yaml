# A2/A3 (NpuArch 2201, e.g. Ascend 910B) operator development workflow.
# Selected by the workflow-dispatch skill when the local NPU arch is 2201;
# arch >= 3510 (A5 and newer) is served by op-develop.yaml instead.
#
# This workflow is a thin bootstrap for the legacy A2/A3 architecture and is fully
# independent from op-develop.yaml: it does not reference, reuse, or share any
# task, skill, agent, or artifact of the A5+ workflow. Every A2/A3 component lives
# in the isolated bundle plugins-official/ops-registry-invoke/a2-a3/ and is never
# installed into, mixed with, or derived from the current ops-registry-invoke
# architecture. Task 1 installs that bundle into $WORK_DIR at project level from
# the cannbot checkout that ships this workflow, gives $WORK_DIR its own project
# boundary (own git root on a main branch with an initial commit), and wires the
# resource paths the legacy workflow expects; Task 2 hands the user prompt to the
# bundle's ops-registry-invoke-workflow skill, which owns the whole development
# process including its gate policy.
#
# Installation mirrors the A5+ op-develop dispatch path: locate the plugin source
# checkout by walking the ancestors of this workflow YAML, then run that plugin's
# unified source installer. A2/A3 Skills are a separate, isolated tree shipped in
# the same checkout (plugins-official/ops-registry-invoke/a2-a3-skills/) and are
# installed by the same mechanism, so this route installs only the Skills it
# needs and takes every Skill from cannbot — the cannbot-skills repository is
# never cloned, read, or required. The only external repository the install may
# fetch is asc-devkit (API documentation), and only as a best-effort reference.
#
# The harness owns project-level skill and agent configuration discovery and
# loading; this workflow neither names nor manages that configuration.
#
# Gate policy: this workflow only routes, installs, and invokes the plugin's
# skill. It does not set, override, or answer the plugin's gate level or
# confirmation points (CP1-CP5); autonomy_level stays whatever the installed
# plugin ships, and confirmations are surfaced, never self-answered.
workflow: a2-a3-op-develop
max_parallel: 1
system_prompt: Work only inside $WORK_DIR. The .git repository at $WORK_DIR is this run's own workspace repository — never run git against an ancestor repository. The A2/A3 workflow you drive keeps its own state (development log, checkpoints); never restart it from scratch when it can be resumed. The install source is the isolated legacy bundle in the cannbot checkout that ships this workflow (plugins-official/ops-registry-invoke/a2-a3/); install with that bundle's unified source installer only, never from or into the current ops-registry-invoke architecture, and never clone, read or modify a cannbot-skills ops-registry-invoke checkout. Do not re-link or import configuration from any other plugin.
nodes:
  - id: install-a23-plugin
    task_type: normal
    title: Install the isolated A2/A3 legacy bundle at project level in the workflow directory
    executor: general-executor
    verifier: general-verifier
    depends_on: []
    goal:
      - "Install the isolated A2/A3 legacy bundle (plugins-official/ops-registry-invoke/a2-a3/) into $WORK_DIR at project level, so that $WORK_DIR afterwards is a self-contained project: its own git root (main branch, initial commit), the legacy bundle's Skills, agents and workflow resources, the shared Skills this route needs, the resource paths that the legacy workflow commands expect, and isolation that survives workflow resumes and this task's own retries — while any configuration not created by this workflow is protected, never overwritten. Nothing from the current cannbot ops-registry-invoke architecture is installed or modified, and no cannbot-skills ops-registry-invoke checkout is read, cloned or required."
    approach:
      - "Guard existing configuration FIRST: if $WORK_DIR carries project-level skill/agent configuration or a work_dir-owned repository that this workflow did not create, and $WORK_DIR/.a23-bootstrap/INSTANCE does not exist, fail immediately and report the conflicting entries; never overwrite foreign configuration. If the INSTANCE marker exists, verify its recorded work_dir path equals $WORK_DIR's realpath, record the pre-existing entries in the install report, and proceed idempotently."
      - "Persist the instance marker only after the guard passes: write $WORK_DIR/.a23-bootstrap/INSTANCE (create the directory first) recording owner-workflow, the realpath of $WORK_DIR, and the creation time."
      - "Resolve the isolated bundle before installing anything: read the running workflow YAML path from $WORK_DIR/.workflow/status.json (falling back to this workflow's own file path), take its realpath, and walk its ancestors until a directory holds both plugins-official/ops-registry-invoke/a2-a3/init.sh and plugins-official/ops-registry-invoke/a2-a3/skills.txt; set CANNBOT_ROOT to that directory and A23_BUNDLE to $CANNBOT_ROOT/plugins-official/ops-registry-invoke/a2-a3. When no ancestor checkout exists (the workflow was started from an installed client layout), do not clone and do not guess: fail the task and record that this legacy route needs a cannbot source checkout, naming the path that was searched."
      - "Give $WORK_DIR its own complete git workspace (the legacy workflow checkpoints branch, commit, and finally merge into main, so the repository must exist, be rooted exactly at $WORK_DIR, carry a main branch, and have at least one commit): run git init -q -b main $WORK_DIR (on older git without init -b, fall back to git init -q $WORK_DIR followed by git -C $WORK_DIR branch -m main), then create the initial commit: git -C $WORK_DIR commit --allow-empty -m \"chore: initialize A2/A3 operator development workspace\". The initial commit is required, not best-effort: if it fails for a missing git identity, fail and report that a git user.name/user.email must be configured; this task never changes global configuration. On a retry whose repository was created by this workflow, verify git -C $WORK_DIR rev-parse --verify --quiet main and rev-parse --verify HEAD both succeed and repair a half-created state."
      - "Install the legacy bundle from that checkout with the unified source installer: bash $A23_BUNDLE/init.sh project <tool> $WORK_DIR, where <tool> is the client this workflow runs in (opencode for OpenCode and CANNBot, codex for Codex, claude for Claude Code; use opencode when the client is unclear). It installs only what this isolated tree ships — spec-to-design, the legacy ops-registry-invoke-workflow Skill (from its workflow/ tree) and the seven ascendc-ops-* agents — reads the checkout only, writes no AGENTS.md instruction block, and never touches the current ops-registry-invoke architecture; never pass a process selector."
      - "Install the shared Skills this route needs by name from cannbot-skills at dispatch time, without copying their bodies into cannbot: read the names from $A23_BUNDLE/skills.txt, then from inside $WORK_DIR run one npx --yes skills@latest add https://gitcode.com/cann/cannbot-skills.git --skill <name> ... --agent <agent-id> -y with one --skill per listed name (<agent-id> is the client this workflow runs in: claude-code for Claude Code, codex for Codex, opencode for OpenCode/CANNBot; the .git suffix is required, the plain repository URL is not accepted by the skills CLI). Re-check every listed Skill's SKILL.md under the installed Skills root afterwards; report a failure truthfully instead of substituting a copy, a different repository, or a clone."
      - "Wire the project-root resource paths the legacy workflow commands document, resolving the installed Skills root instead of assuming a client layout: take the installed ops-spec-gen Skill file (find $WORK_DIR -path '*/ops-spec-gen/SKILL.md' -not -path '*/ops/*' | head -n 1), set SKILLS_ROOT to its Skill directory's parent, then ln -sfn $SKILLS_ROOT/ops-registry-invoke-workflow $WORK_DIR/workflow (the legacy bundle ships that Skill tree as the workflow resource root) and, after creating $WORK_DIR/ops, ln -sfn $SKILLS_ROOT/<name> $WORK_DIR/ops/<name> for every Skill directory with a SKILL.md under $SKILLS_ROOT (the legacy workflow resolves shared-Skill scripts as ops/<skill>/scripts/*). The asc-devkit reference library stays optional: attempt one shallow clone into $WORK_DIR/reference/cann/asc-devkit only when it is absent, and record a failure as a warning in the install report instead of failing the task."
      - "Write the install report $WORK_DIR/.a23-bootstrap/install-report.md and install-report.json: the guard outcome (fresh install vs verified retry, pre-existing entries), the git workspace state, the resolved CANNBOT_ROOT, the bundle provenance recorded in $A23_BUNDLE/PROVENANCE.json, the exact install commands with their exit status (including the npx install of the shared Skills), the installed Skill and agent names split into the bundle part and the cannbot-skills-by-name part, SKILLS_ROOT and the resource links created, the asc-devkit status, and an explicit clonePerformed=false statement together with a statement that no current-architecture component was touched."
    acceptance:
      - "The isolated bundle was used and nothing was cloned from cannbot-skills: test ! -e $WORK_DIR/cannbot-skills, the install report records clonePerformed=false, and no directory under $WORK_DIR is a checkout of that repository."
      - "The bundle's own components are installed from the checkout: a matching <SKILLS_ROOT>/spec-to-design/SKILL.md and <SKILLS_ROOT>/ops-registry-invoke-workflow/SKILL.md exist under $WORK_DIR, and at least one agent definition matching ascendc-ops-* is installed, where SKILLS_ROOT is the root recorded in the install report, that root is inside $WORK_DIR, and it is not the cannbot checkout."
      - "Every skill listed in $A23_BUNDLE/skills.txt came from cannbot-skills by name, not from a copy in this repository: each listed name has a SKILL.md under SKILLS_ROOT, the install report records the npx add command and its exit status, and <CANNBOT_ROOT>/plugins-official/ops-registry-invoke/a2-a3/ contains no directory for those names."
      - "The current cannbot ops-registry-invoke architecture is untouched: the install report states that no component was installed from plugins-official/ops-registry-invoke/skills/, .../agents/ or .../workflows/, and no installed Skill or agent resolves into those directories."
      - "The instance marker exists and is bound to this directory: test -s $WORK_DIR/.a23-bootstrap/INSTANCE and its recorded work_dir path equals $WORK_DIR's realpath."
      - "$WORK_DIR is its own complete git workspace: git -C $WORK_DIR rev-parse --show-toplevel outputs a path whose realpath equals $WORK_DIR's realpath (not an ancestor), git -C $WORK_DIR rev-parse --verify --quiet main succeeds, and git -C $WORK_DIR rev-parse --verify HEAD succeeds."
      - "No instruction file was created or edited: $WORK_DIR/AGENTS.md is either absent or byte-identical to what the project already had before the install (the installer writes no managed block for this bundle), and the install report states which of the two holds."
      - "The resources the legacy workflow commands need resolve from $WORK_DIR: cd $WORK_DIR && python3 $WORK_DIR/workflow/resources/validate_checklist.py --help exits 0, and test -f $WORK_DIR/ops/ops-spec-gen/scripts/validate_spec.py."
      - "The asc-devkit reference is either present or its absence is recorded: test -d $WORK_DIR/reference/cann/asc-devkit, or $WORK_DIR/.a23-bootstrap/install-report.md explicitly records the asc-devkit clone failure so the design stage can report the missing API documentation."
      - "The install report is complete: test -s $WORK_DIR/.a23-bootstrap/install-report.md and $WORK_DIR/.a23-bootstrap/install-report.json parses as JSON carrying target, cannbotRoot, bundle, clonePerformed=false, skillsSource, skillCount, skills, agents, resourceLinks and ascDevkit."
    out_of_scope:
      - "Do not clone, read from a remote, or modify any cannbot-skills ops-registry-invoke checkout: cloning that repository is forbidden and every bundle component comes from the cannbot checkout that ships this workflow."
      - "Do not install, copy, re-link or modify any component of the current cannbot ops-registry-invoke architecture (plugins-official/ops-registry-invoke/skills, /agents, /workflows): this route is fully isolated in plugins-official/ops-registry-invoke/a2-a3."
      - "Do not touch any file outside $WORK_DIR; no git command may run against a repository outside $WORK_DIR."
      - "Do not create or edit $WORK_DIR/AGENTS.md, and do not adapt any other configuration the bundle ships — install, do not adapt."
      - "Do not start any operator development work; that belongs to the next task."
      - "Do not install into any directory other than $WORK_DIR (no global-level installs), and never change global git configuration."
    max_retries: 2
    on_exhaust: exit
  - id: run-a23-op-workflow
    task_type: normal
    title: Run the A2/A3 ops-registry-invoke workflow for the user prompt
    executor: general-executor
    verifier: general-verifier
    depends_on:
      - install-a23-plugin
    goal:
      - "Acting as the primary agent of the A2/A3 ops-registry-invoke plugin now installed at project level in $WORK_DIR, load its ops-registry-invoke-workflow skill and drive the operator development it defines — requirements and design, iterative development, acceptance, and upstream preparation — for the requirement in $USER_PROMPT, either to completion or, when the plugin's process reaches a user confirmation this unattended run cannot deliver, to a clean handover at that stopping point."
    approach:
      - "Read the requirement from $USER_PROMPT; if it names a file, read that file for the full requirement text. Pass the requirement to the workflow verbatim, without narrowing or rewriting it."
      - "Load the ops-registry-invoke-workflow skill by name and follow it as the single process authority: its stages, its gate policy (the skill reads autonomy_level from the project instruction file and defaults to 0 when it is absent — never invent a level), its checkpoint and confirmation rules, its subagent dispatch parameters, and its artifact layout (`$WORK_DIR/operators/<operator_name>/`). Dispatch subagents exactly as the skill prescribes."
      - "Never answer a user confirmation on the user's behalf: this workflow only routes, installs, and invokes the plugin's skill — its CP confirmations belong to the user. When the skill reaches a confirmation this run cannot surface to a human, do not pick a default and do not proceed silently. Instead, stop cleanly and make that stopping point the task's outcome: record in the development log and the final task report (a) what the skill asks the user to confirm, (b) what the process will do next once confirmed, and (c) the takeover instructions — open a harness session in $WORK_DIR (the installed plugin, its gate policy, the development log, and the git checkpoints are all in place there) and continue per the skill's own task-resume rules (the user states they want to continue developing the operator). Also write $WORK_DIR/HANDOVER.md at this fixed path — the handover notice the user reads after the run, stating plainly that this was a handover, not a completion — carrying: the handover nature (the operator development is NOT finished), the pending confirmation (what the skill asks, what happens next once confirmed), the development-log location, and the concrete takeover steps. Do not treat the stopping point as a failure to retry away: a retry would reach the same confirmation. This stopping point is a legitimate terminal state for this task, judged by the Verifier alongside completion."
      - "On the completion path, remove a stale $WORK_DIR/HANDOVER.md left behind by an earlier handover of the same run (resumed and finished after takeover): the run has now completed, and a leftover handover notice would contradict that completed state."
      - "Resume, never restart: if the development log already exists under $WORK_DIR (`$WORK_DIR/operators/<operator_name>/docs/LOG.md`) and its current stage is not completed, follow the skill's task-resume mapping instead of rebuilding from scratch."
      - "Keep every artifact inside $WORK_DIR, and run every git operation against $WORK_DIR's own repository only."
    acceptance:
      - "The run reached one of the two legitimate terminal states. Either completion: $WORK_DIR/operators/ contains a directory for the operator named in the requirement holding at least the op_host/ and op_kernel/ subtrees, its `$WORK_DIR/operators/<operator_name>/docs/LOG.md` exists, is non-empty, records completion (its current-stage field, 当前开发状态.当前阶段, reads 已完成), its original-requirement field (用户原始需求) carries the $USER_PROMPT requirement content, and no $WORK_DIR/HANDOVER.md remains. Or clean handover: the development log exists and is non-empty at the stopping stage, $WORK_DIR/HANDOVER.md exists, is non-empty, and carries the pending confirmation point (what the skill asks, what happens next) together with the concrete takeover instructions (work in $WORK_DIR with the installed plugin, continue per the skill's task-resume rules), and the final task report states the same handover."
    out_of_scope:
      - "Do not modify any cannbot-skills checkout (none exists), the isolated legacy bundle, the current ops-registry-invoke architecture, $WORK_DIR/.a23-bootstrap/, the harness-managed project configuration, or any workflow YAML — the process may only produce the artifacts the skill defines, plus the HANDOVER.md handover notice this workflow itself prescribes (an artifact of this adaptation layer, not of the plugin's skill)."
      - "Do not load or invoke any skill, task, or template of the A5-and-newer (NpuArch >= 3510) workflow; the A2/A3 plugin's own skills are the only toolset."
      - "Do not set, override, or bypass the skill's gate policy or its checkpoint and confirmation rules, and never self-answer a user confirmation."
    max_retries: 1
    on_exhaust: exit
