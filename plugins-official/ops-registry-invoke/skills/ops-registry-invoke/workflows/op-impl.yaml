workflow: op-impl
max_parallel: 10
system_prompt: If needed, dispatch multi subagents to explore code under $WORK_DIR/requirements/references(if exists) relevant
  to this task, as development reference.
nodes:
- id: generate-prototype-subgraph
  task_type: normal
  executor: general-executor
  verifier: general-verifier
  title: Generate the per-branch direct-invoke prototype subgraph
  goal:
  - 'Read $WORK_DIR/design/BranchCatalog.md and produce $WORK_DIR/.workflow/prototype-sub-graph.yaml: a dict with exactly
    one top-level key nodes holding M normal nodes, where M = the number of tilingKeys registered in BranchCatalog.md, discovered
    at runtime and never assumed — one standalone direct-invoke prototype task per tilingKey, all mutually independent so
    the orchestrator runs them concurrently (gen-golden completes before prototype-impl starts, so every prototype may cross-check
    against $WORK_DIR/golden.py). Nothing in this task may hardcode an operator name, a tilingKey set, or a branch count.'
  approach:
  - 'Node schema = op-develop.yaml normal task (id, task_type: normal, title, goal, approach, acceptance, out_of_scope, depends_on,
    executor, verifier, max_retries: 2, on_exhaust: exit). Write the file as a YAML mapping whose sole top-level key is nodes
    (a bare list is invalid). goal / approach / acceptance / out_of_scope must each be a non-empty LIST of non-empty strings
    (a plain string is rejected by the schema check); depends_on lists only ids that exist in the same file, and a node with
    no dependencies uses an empty list.'
  - 'Enumerate the tilingKeys in BranchCatalog.md registration order, m = 1..M; per key (with its DESIGN-BRANCH-<key>.md),
    generate one node:'
  - 'prototype-branch-<key> — executor kernel-developer, verifier kernel-verifier: prove this branch''s compute functionality
    as a standalone Ascend C direct-invoke prototype before any package integration, following the toolkit''s direct-invoke
    sample recipe: one self-contained .asc under $WORK_DIR/op/tests/prototype/branch-<key>/ (main.asc) holding BOTH the device
    kernel (taking a plain tiling struct by value) and a host test harness that queries the core count and UB size at runtime
    and launches the kernel directly — no op-package machinery. A standalone CMakeLists.txt beside the .asc builds it with
    the cann toolkit environment for the target NPU architecture recorded in $WORK_DIR/npu-arch.json.'
  - 'Derive the kernel logic ONLY from $WORK_DIR/design/ Overview + Interface + Validation and DESIGN-BRANCH-<key>.md compute
    semantics (data flow, dtype/cast contract, broadcast, boundary and special-value behavior) — do not copy the design''s
    Tiling/Kernel implementation: a simple self-made runtime split (runtime core/UB query) is enough, correctness over performance.'
  - 'Functional gate for prototype-branch-<key>: the harness embeds an independent CPU golden built from the same design semantics
    (dtype/cast contract, broadcast, boundary and special-value behavior); it drives the branch''s cases from DESIGN-BRANCH-<key>.md
    verification points and the Validation.md matrix rows routed to this branch; it prints a per-case PASS/FAIL summary and
    exits 0 only when every case passes; evidence in $WORK_DIR/op/tests/prototype/branch-<key>/prototype.log.'
  - 'Dependencies inside the subgraph: none — every prototype-branch-<key> has depends_on: [] (disjoint directories under
    $WORK_DIR/op/tests/prototype/, no shared build tree), so different branches'' prototypes run concurrently.'
  - Every node's goal must state its completion gate explicitly and reference its authoritative design docs by absolute path.
  acceptance:
  - 'Contract-valid: ORCH_SKILL=the workflow-orchestrator skill directory ; python3 -c "import sys; sys.path.insert(0,\"$ORCH_SKILL/scripts\");
    import get_task; nodes,err=get_task.load_subgraph(\"$WORK_DIR/.workflow/prototype-sub-graph.yaml\"); assert not err, err"
    exits 0.'
  - $WORK_DIR/.workflow/prototype-sub-graph.yaml exists; M equals the tilingKey count in $WORK_DIR/design/BranchCatalog.md;
    python3 -c "import yaml; d=yaml.safe_load(open('$WORK_DIR/.workflow/prototype-sub-graph.yaml')); assert isinstance(d,dict)
    and set(d)=={'nodes'} and len(d['nodes'])==M" exits 0.
  - Node ids are exactly prototype-branch-<key> for the tilingKeys registered in BranchCatalog.md, in BranchCatalog.md registration
    order; each node's DESIGN-BRANCH-<key>.md reference matches its tilingKey.
  - 'Every node satisfies the normal-task schema with executor kernel-developer, verifier kernel-verifier, and depends_on:
    [] (full branch concurrency); every node''s acceptance is checkable (exit codes / file paths / log contents).'
  - 'Golden independence: every generated prototype node''s goal/approach requires its harness expected values to be cross-checked
    against $WORK_DIR/golden.py, and the harness cites the golden derivation (verifier traces one case per branch).'
  out_of_scope:
  - Do not create or modify any file other than $WORK_DIR/.workflow/prototype-sub-graph.yaml; do not write kernel code; do
    not execute any prototype task.
  depends_on: []
  max_retries: 2
  on_exhaust: exit
- id: prototype-impl
  task_type: subgraph
  file: .workflow/prototype-sub-graph.yaml
  depends_on:
  - generate-prototype-subgraph
  - gen-golden
  - setup-op-package
- id: setup-op-package
  task_type: normal
  executor: general-executor
  verifier: general-verifier
  title: Initialize and verify the operator package from the registry-invoke template
  goal:
  - Initialize the complete operator package from the ascendc-registry-invoke-template skill into $WORK_DIR/op/, rename it
    to the target operator, and verify the template's example test.
  approach:
  - 'Derive the operator''s three name forms from spec.yaml: OP_SNAKE = op.name, OP_PASCAL = PascalCase, OP_UPPER = UPPER_SNAKE.'
  - 'Resolve the template through the relative skill symlink: WORKFLOW_YAML=$(python3 -c "import json; print(json.load(open(''$WORK_DIR/.workflow/status.json''))[''workflow''])")
    ; TEMPLATE_DIR=$(dirname "$(dirname "$WORKFLOW_YAML")")/skills/ascendc-registry-invoke-template ; test -f $TEMPLATE_DIR/SKILL.md
    && test -d $TEMPLATE_DIR/references/add_example.'
  - 'Create a fresh package from the template: rm -rf $WORK_DIR/op && mkdir -p $WORK_DIR/op && cp -a $TEMPLATE_DIR/references/add_example/.
    $WORK_DIR/op/ && rm -rf $WORK_DIR/op/tests. Keep the template''s ACLNN example as the baseline.'
  - 'Rename every file under $WORK_DIR/op/ whose name contains add_example to OP_SNAKE, then replace all sample name forms
    in file contents: add_example->OP_SNAKE, AddExample->OP_PASCAL, ADD_EXAMPLE->OP_UPPER; set the root CMake package_name
    to OP_PASCAL and update any ACLNN symbol references to aclnn<OP_PASCAL>.'
  - Build the initialized package with its template build.sh for the lab NPU generation, install the generated .run into $WORK_DIR/dev-package,
    then run the template's eager example from $WORK_DIR/op/examples/. Point the example at $WORK_DIR/dev-package/vendors/<OP_PASCAL>
    by exporting ASCEND_CUSTOM_OPP_PATH and placing that vendor's op_api/lib first in LD_LIBRARY_PATH; do not fall back to
    the system opp vendors directory. Write the example output and environment evidence to $WORK_DIR/op/examples/verify.log.
  acceptance:
  - '$WORK_DIR/op/ contains the package skeleton: test -d $WORK_DIR/op/op_host && test -d $WORK_DIR/op/op_kernel && test -d
    $WORK_DIR/op/op_graph && test -f $WORK_DIR/op/build.sh && test -f $WORK_DIR/op/CMakeLists.txt && test -f $WORK_DIR/op/README.md
    && test ! -e $WORK_DIR/op/tests.'
  - 'No sample-name residue: ! grep -RniE ''add_example|AddExample|ADD_EXAMPLE|addExample'' $WORK_DIR/op/.'
  - 'Run package installed into dev-package: OP_PASCAL=$(python3 -c "import yaml; n=yaml.safe_load(open(''$WORK_DIR/spec/spec.yaml''))[''op''][''name''];
    print(''''.join(w.capitalize() for w in n.split(''_'')))") ; test -s $WORK_DIR/dev-package/vendors/$OP_PASCAL/op_api/lib/libcust_opapi.so.'
  - 'Template example passes: cd $WORK_DIR/op/examples && ./run.sh --eager > verify.log 2>&1 && ! grep -qF ''FAILED'' verify.log
    && grep -qF ''PASS'' verify.log.'
  - 'The example library resolves from dev-package: OP_PASCAL=$(python3 -c "import yaml; n=yaml.safe_load(open(''$WORK_DIR/spec/spec.yaml''))[''op''][''name''];
    print(''''.join(w.capitalize() for w in n.split(''_'')))") ; ldd $WORK_DIR/op/examples/build-eager/bin/test_aclnn_$OP_PASCAL
    | grep -F ''libcust_opapi.so'' | grep -qF $WORK_DIR/dev-package/vendors/$OP_PASCAL.'
  - 'verify.log records the dev-package runtime path: test -s $WORK_DIR/op/examples/verify.log && grep -qF ''ASCEND_CUSTOM_OPP_PATH''
    $WORK_DIR/op/examples/verify.log && grep -qF $WORK_DIR/dev-package/vendors/$OP_PASCAL $WORK_DIR/op/examples/verify.log.'
  out_of_scope:
  - Only create or modify files under $WORK_DIR/op/ and $WORK_DIR/dev-package/.
  - Keep the template's operator semantics unchanged (input count and kernel math change in later tasks).
  depends_on: []
  max_retries: 2
  on_exhaust: exit
- id: update-opdef
  task_type: normal
  executor: general-executor
  verifier: general-verifier
  title: Transcribe the OpDef from Interface.md; keep the kernel entry as a compiling no-op stub
  goal:
  - 'Rewrite $WORK_DIR/op/op_host/*_def.cpp so its `class ... : public OpDef` body matches the `## OpDef 代码片段` fenced cpp
    block in $WORK_DIR/design/Interface.md exactly.'
  - Align the kernel entry's param list — in the $WORK_DIR/op/op_kernel/ source declaring the `__global__ __aicore__` entry
    — to the `Kernel 入口` section of $WORK_DIR/design/Kernel.md as a no-op stub (no compute yet); it only needs to compile.
  approach:
  - Read the `## OpDef 代码片段` fenced cpp block in $WORK_DIR/design/Interface.md — the authoritative, already-resolved OpDef;
    record its Input/Output names in declaration order.
  - 'Rewrite $WORK_DIR/op/op_host/*_def.cpp: keep the file header, `#include "register/op_def_registry.h"`, and the `namespace
    ops { ... }` wrapper; replace only the `class ... : public OpDef` body (from `class` to its closing `};`) and the `OP_ADD(...)`
    macro with the snippet''s — do not paste the snippet''s `namespace ops { ... }` wrapper, the file already has one.'
  - Read the `Kernel 入口` section of $WORK_DIR/design/Kernel.md for the kernel entry signature (symbol name + param list);
    this is the authoritative source for the entry, not the OpDef names.
  - 'Rewrite the kernel-entry source (the $WORK_DIR/op/op_kernel/ file declaring the `__global__ __aicore__` entry): take
    the entry symbol name and param list (input tensors in order, then output tensors, then workspace, then tiling) from Kernel.md''s
    入口 code, keeping the package''s existing entry boilerplate (`extern "C" __global__ __aicore__ void <op>`, `__gm__ uint8_t*`
    params) and the tiling readout (REGISTER_TILING_DEFAULT + GET_TILING_DATA); drop the compute (no kernel class call), leaving
    a no-op stub (InitSocState + tiling readout + PipeBarrier). Silence an unused `tilingData` with `(void)tilingData;`, and
    drop the kernel-header include if the stub no longer uses it.'
  - 'Build the package with its build.sh for the target NPU architecture recorded in $WORK_DIR/npu-arch.json (pass the SoC
    argument the script requires) — exit 0. The build''s CMake falls back to $ENV{ASCEND_HOME_PATH} when CANN_HOME is unset;
    only if both are unset, source the toolkit''s bin/set_env.bash first.'
  acceptance:
  - 'Package builds for the target architecture: cd $WORK_DIR/op && ./build.sh with the SoC argument required for the architecture
    recorded in $WORK_DIR/npu-arch.json exits 0.'
  - 'def.cpp transcribes the snippet: the `this->Input("...")` / `this->Output("...")` names in $WORK_DIR/op/op_host/*_def.cpp
    appear in the same order as in the `## OpDef 代码片段` fenced block of $WORK_DIR/design/Interface.md (same names, same order,
    no extras or missing).'
  - 'No placeholder residue: ! grep -qF ''{OP}'' $WORK_DIR/op/op_host/*_def.cpp && ! grep -qE ''<(Op|op|in[0-9]*|out[0-9]*|optional_in|attr|req_attr|bool_attr|default|soc)>''
    $WORK_DIR/op/op_host/*_def.cpp.'
  out_of_scope:
  - Only $WORK_DIR/op/op_host/*_def.cpp and the $WORK_DIR/op/op_kernel/ kernel-entry source (the file declaring the `__global__
    __aicore__` entry) may change (plus build/ regenerated by build.sh).
  - Do not implement the compute — the kernel body is written by the kernel task from design/Kernel.md.
  - Do not touch _infershape.cpp, tiling, CMakeLists, or tests; the ACLNN test is stale after the interface change and is
    updated by the downstream implementation workflow.
  depends_on:
  - setup-op-package
  max_retries: 2
  on_exhaust: exit
- id: update-op-api
  task_type: normal
  executor: general-executor
  verifier: general-verifier
  title: Rewrite the aclnn L2/L0 API from Interface.md and prove it in aclnn invocation mode
  goal:
  - 'Rewrite the four files under $WORK_DIR/op/op_api/ — aclnn_<op>.h / aclnn_<op>.cpp (L2 API) and <op>.h
    / <op>.cpp (L0 API), with <op> the operator''s snake_case name from $WORK_DIR/spec/spec.yaml — so the
    package''s aclnn API is the operator''s real interface: the template''s add_example interface (x1, x2,
    out) must be fully replaced by the inputs, attrs, and outputs of $WORK_DIR/design/Interface.md''s ##
    算子原型, in its declaration order (the aclnnGetWorkspaceSize parameter list is exactly: inputs in
    order, then attrs in order, then outputs in order).'
  - 'Prove the rewritten API works in aclnn invocation mode — the mode every external caller uses (TTK
    aclnn, the bench, downstream frameworks): a single-case ttk aclnn run against the independent golden
    $WORK_DIR/golden.py precision-PASSes.'
  approach:
  - '$WORK_DIR/design/Interface.md is the authoritative interface: ## 算子原型 (prototype, Inputs/Outputs/Attrs
    with names, semantics, shape contract, optionality, defaults) plus ## OpDef 代码片段 (the resolved OpDef).
    Interface.md''s ## 算子规格(受支持 dtype 组合) table is the dtype-support truth for the L0 checks.'
  - 'Keep the template''s proven l0op-style structure in both files — null/dtype checks, Contiguous handling,
    executor creation, and the launcher-list registration — transcribing the operator''s real names: OP_INPUT
    and OP_OUTPUT lists carry the operator''s input/output names, and every attr declared in Interface.md is
    carried from the L2 API into the executor (the TilingFunc reads attrs from the framework context); an
    attr is never dropped or renamed. Consult the ascendc-registry-invoke-template skill''s add_example
    op_api pair for the code pattern; consult the samples corpus (runtime shallow clone: if $WORK_DIR/cannbot-skills has no .git, git clone --depth 1 https://gitcode.com/cann/cannbot-skills.git $WORK_DIR/cannbot-skills; use its ops/samples) when the template pattern does not cover
    this operator''s aclnn conventions.'
  - 'Rebuild and reinstall: cd $WORK_DIR/op && ./build.sh with the SoC argument for the architecture
    recorded in $WORK_DIR/npu-arch.json exits 0; install the generated .run into $WORK_DIR/dev-package the
    way setup-op-package did (replacing the template install).'
  - 'aclnn-mode smoke: write a one-case CSV under $WORK_DIR/op/tests/aclnn/ modeled on the ops-test-kit
    aclnn case format (columns testcase_name, api_name, tensor_view_shapes, tensor_dtypes, ...,
    attributes — see $WORK_DIR/ops-test-kit/examples/case_store/aclnn/cases.csv), taking the case from the
    first plain positive row of $WORK_DIR/design/Validation.md''s 端到端测试用例矩阵 (first supported dtype,
    a representative shape, default attrs). Run it via TTK aclnn mode against the golden: cd
    $WORK_DIR/ops-test-kit && python3 -m ttk aclnn -i <smoke csv> --compare mixed --plugin
    $WORK_DIR/golden.py, with the dev-package vendors tree made visible to the runtime (ASCEND_CUSTOM_OPP_PATH
    and the vendor''s op_api/lib first in LD_LIBRARY_PATH — consult the blackbox-tester skill for the
    aclnn-mode invocation contract). Save the full output to $WORK_DIR/op/tests/aclnn/smoke.log; the case
    must precision-PASS.'
  acceptance:
  - 'Four files exist for the operator''s own name: OP_SNAKE=$(python3 -c "import yaml;
    print(yaml.safe_load(open(''$WORK_DIR/spec/spec.yaml''))[''op''][''name''])") ; test -f
    $WORK_DIR/op/op_api/aclnn_${OP_SNAKE}.h && test -f $WORK_DIR/op/op_api/aclnn_${OP_SNAKE}.cpp && test -f
    $WORK_DIR/op/op_api/${OP_SNAKE}.h && test -f $WORK_DIR/op/op_api/${OP_SNAKE}.cpp.'
  - 'Build and exported symbols: cd $WORK_DIR/op && ./build.sh with the SoC argument exits 0, and the
    installed libcust_opapi.so under $WORK_DIR/dev-package/vendors/<OP_PASCAL> exports the L2 pair:
    nm -D <that .so> | grep -cE '' T aclnn<OP_PASCAL>(GetWorkspaceSize)?$'' equals 2.'
  - 'Signature matches Interface.md, machine-checked: a python check parses aclnn_${OP_SNAKE}.h''s
    aclnn<OP_PASCAL>GetWorkspaceSize parameter list and asserts it equals Interface.md''s ## 算子原型
    inputs, then attrs, then outputs — same names, same order, tensor for every input/output and the
    attr''s numeric/string type per its declaration (the check script and its PASS output are recorded in
    $WORK_DIR/op/tests/aclnn/signature_check.log).'
  - 'aclnn smoke green: $WORK_DIR/op/tests/aclnn/smoke.log exists, is non-empty, and shows the smoke case
    precision-PASS (TTK summary FAIL : 0 for the case).'
  out_of_scope:
  - 'Modify only $WORK_DIR/op/op_api/ (the four files), the artifacts build.sh regenerates (build/,
    dev-package/), and $WORK_DIR/op/tests/aclnn/ (the smoke CSV, smoke.log, signature_check.log).
    op_host/, op_kernel/, op_graph/, tests/tiling/, tests/prototype/, package-root CMakeLists.txt /
    build.sh, and every design/spec/requirements file are read-only.'
  - 'Do not change the kernel or tiling behavior; this task only re-exposes the operator''s real interface
    at the aclnn API layer and proves it in aclnn mode.'
  depends_on:
  - update-opdef
  - gen-golden
  max_retries: 2
  on_exhaust: exit
- id: gen-golden
  task_type: normal
  executor: general-executor
  verifier: general-verifier
  title: Generate the TestSpec golden.py and its invariant self-check
  goal:
  - Produce $WORK_DIR/golden.py as a TTK TestSpec-format golden (independent of the kernel under test) for the operator in
    $WORK_DIR/spec/spec.yaml, plus $WORK_DIR/golden_invariant_check.py which proves the golden satisfies the spec's math_semantics
    invariants on random inputs.
  approach:
  - Read $WORK_DIR/spec/spec.yaml's reference_oracle and math_semantics; consult the ttk-how-write-plugin skill under $WORK_DIR/ops-test-kit/
    for TestSpec conventions, plus $WORK_DIR/ops-test-kit/ttk/test_spec/examples/.
  - 'Write $WORK_DIR/golden.py in TestSpec format: __spec__ registration + class with golden and tolerance; implement the
    reference math from spec.yaml only — never import or reuse anything from $WORK_DIR/op/ (kernel artifacts).'
  - 'Pick the golden body''s implementation backend by this fixed priority ladder, stopping at the first tier that holds (equivalent
    = same semantics as the spec''s math_semantics.formula, including optional-input pairing and attr behavior): tier 1 single
    PyTorch API — one equivalent torch API exists, build the golden body on it. tier 2 single TensorFlow API — one equivalent
    TF API exists, build the golden body on it. tier 3 PyTorch API composition — no single equivalent API in either framework,
    but a composition of torch APIs implements the full formula, build the golden body from it. tier 4 TensorFlow API composition
    — same via a composition of TF APIs. tier 5 NumPy — hand-implement the formula with numpy primitives. When a torch/TF
    tier is taken, the golden must CALL the chosen API(s) for every part they cover, casting inputs to float64 around each
    call; re-implementing an API''s internals with elementary tensor ops is a tier-5 hand implementation, not a composition
    — the API''s own numerics (including boundary-value behaviour) are the expected values. Record in golden.py''s module
    docstring the tier taken, the exact API(s) chosen, and what each skipped tier lacked.'
  - 'Float64 accumulation rule (workflow-mandated, overrides any lower accumulator dtype declared in the spec): wherever the
    golden performs floating-point accumulation, lift the values to float64 first, accumulate in float64, and cast the final
    result back to the target output dtype — torch: x.to(torch.float64) -> sum -> .to(out_dtype); tensorflow: tf.cast(x, tf.float64)
    -> reduce_sum -> tf.cast(out_dtype); numpy: x.astype(np.float64) -> sum -> .astype(out_dtype). Never accumulate in float16/float32.'
  - 'Memory-safe golden: the float64 lift must never fail on large inputs — accumulate/chunk element-by-element or block-wise
    when a whole-tensor float64 materialization would exceed host memory; the numerical result must equal the unchunked
    float64 computation within the output dtype''s rounding.'
  - 'When any torch/TF tier (1–4) supplies the golden body — single API or composition — compose it with the float64 rule:
    cast every input to float64, call the torch/TF API(s), cast the outputs back once to the target dtypes — the framework''s
    internal accumulation then runs in float64.'
  - 'Derive tolerance.standard from $WORK_DIR/spec.yaml, never from the operator name. Default classification by op.paradigms
    (compute paradigms with float output -> mix_tolerance; pure data-reorganization -> binary_equal; int output -> binary_equal;
    quantization -> quant — the enum set defined by the ttk test_spec validator is authoritative), overridable by the spec''s
    numerical_tolerance. cross_check override (the spec''s top-level cross_check block is always present — generate-spec writes
    it for every operator): set each float16/bfloat16/float32 dtype''s tolerance to {standard: cross_check, level: the spec''s
    cross_check.level}; other dtypes keep their classification. Declare the reference_oracle competitor API as third_party
    — cross_check requires third_party; competitor APIs are reached via the third_party declaration, not an in-process import.
    A third_party class''s __init__/__call__ parameter names must match the op''s attribute names verbatim — the xpu-server
    binds by name, so a camelCase attr never feeds a snake_case parameter and the class silently runs with its default.'
  - 'Write $WORK_DIR/golden_invariant_check.py: build 3+ random legal input sets, run every value-level invariant in spec
    math_semantics.invariants against the golden, print PASS per invariant, exit 0 only if all pass.'
  acceptance:
  - '$WORK_DIR/golden.py exists and parses: python3 -c "import ast; ast.parse(open(''$WORK_DIR/golden.py'').read())" exits
    0; it contains __spec__ registration and a class definition (TestSpec format).'
  - 'Oracle independence: ! grep -qE ''from op|import op/'' $WORK_DIR/golden.py (no kernel artifact reuse); golden math matches
    spec.yaml reference_oracle semantics.'
  - 'Backend priority traceable: golden.py''s module docstring names the priority tier taken (torch single API / tensorflow
    single API / torch composition / tensorflow composition / numpy) and the exact API(s) used; for every skipped higher tier
    it states what equivalent API the search lacked.'
  - 'Float64 accumulation: the golden''s accumulation path casts to float64 before summing and casts back to the output dtype
    after (torch: .to(torch.float64); tensorflow: tf.cast(x, tf.float64); numpy: astype(np.float64) -> np.sum -> astype(out_dtype));
    no float16/float32 accumulation anywhere in the reduction.'
  - $WORK_DIR/golden_invariant_check.py exists and python3 $WORK_DIR/golden_invariant_check.py exits 0 with every invariant
    PASS — deleting or relaxing invariants to force green is forbidden.
  out_of_scope:
  - Create only $WORK_DIR/golden.py and $WORK_DIR/golden_invariant_check.py; do not modify spec.yaml, design docs, or anything
    under $WORK_DIR/op/.
  depends_on: []
  max_retries: 2
  on_exhaust: exit
- id: write-tiling-ut
  task_type: normal
  executor: general-executor
  verifier: general-verifier
  title: Write the Tiling gtest unit test (TDD red baseline, only the exempt tiling(nullptr) case passes)
  goal:
  - 'Rewrite $WORK_DIR/op/tests/tiling/test_tiling_gtest.cpp as the complete Tiling UT for the operator in $WORK_DIR/spec/spec.yaml:
    one TEST_F per host-tiling feature and per validation/exception exit, expectations from an independent hand-written oracle,
    following the tiling-developer TDD discipline.'
  - 'Exception coverage is checklist-driven: load the tiling-exception-coverage skill (mandatory) and work its full checklist
    per its procedure (the item set and its mandatory/conditional classification are the skill''s own definition, not restated
    here), recording the coverage matrix as a comment block inside $WORK_DIR/op/tests/tiling/test_tiling_gtest.cpp (this workflow
    relocates the skill''s matrix in-file; no separate matrix file); the skill''s completion criterion defines done — every
    item covered or N/A with spec evidence, no third state.'
  - 'Install and build the UT in isolation under $WORK_DIR/op/tests/tiling/dev-package/, run it against the red-phase stub,
    and record the red baseline in $WORK_DIR/op/tests/tiling/ut-baseline.log: every scenario failed except the exempt tiling(nullptr)
    case; the log must show which .so was loaded.'
  approach:
  - Load the tiling-exception-coverage skill first (mandatory); its checklist procedure and assertion playbook are the authority
    for every exception case below.
  - Load the tiling-ut-harness skill first (mandatory); its platform-mock mapping table, compile-link recipe, and env_doctor
    verification are the authority for the mock harness below — do not reverse-engineer SDK binaries when env_doctor returns
    VERIFIED.
  - 'Derive the case set and the oracle from these sources; each line states what the file provides and the exhaustiveness
    bar it drives:'
  - $WORK_DIR/design/HostTiling.md -> every shared tiling formula becomes a labeled oracle rule, each exercised at its exact
