- id: implement-tiling
  task_type: normal
  executor: general-executor
  verifier: general-verifier
  title: Implement the real host Tiling so the entire Tiling UT suite passes (TDD green)
  goal:
  - Replace the stub TilingFunc currently in $WORK_DIR/op/op_host/arch35/*_tiling_arch35.cpp with the real TilingFunc for
    the operator in $WORK_DIR/spec/spec.yaml — TilingData struct, common split formulas, branch determination with tilingKey
    setting, validation/short-circuit exits, and the IMPL_OP_OPTILING registration — transcribed from the same $WORK_DIR/design/
    docs the UT oracle was derived from.
  - 'Make the complete Tiling UT pass, with the UT itself as the pinned oracle: cd $WORK_DIR/op/tests/tiling && ./run.sh exits
    0 with every TEST_F passed and 0 failed, recorded as $WORK_DIR/op/tests/tiling/ut-green.log.'
  approach:
  - 'The Tiling UT at $WORK_DIR/op/tests/tiling/test_tiling_gtest.cpp is the read-only pinned oracle (independent hand-written
    formulas, success and exception cases alike): implement until it passes; the oracle itself is never edited. The completion
    gate is strict: run.sh exits 0 with every TEST_F passed and 0 failed.'
  - 'Implement from the design docs; the UT oracle was derived from the same files, so any deviation shows up as exactly one
    red case:'
  - 'The per-branch standalone prototypes under $WORK_DIR/op/tests/prototype/ are this operator''s proven compute/data-flow
    reference — they already run the full host+kernel E2E on the NPU with every case green. Port their validated split logic
    (core-count/UB budget queries, tile shape and loop-structure choices, special-value handling) into TilingData/TilingFunc
    field-for-field, changing only the plumbing: TilingContext/CompileInfo inputs replace the prototype''s runtime platform
    queries, the package build replaces the standalone CMake, and TilingData fields replace the prototype''s plain struct.
    The prototype''s host harness is the executable spec of what TilingFunc must produce (which fields the kernel actually
    consumes, how the split behaves at boundaries); the framework contract (registration, builder, UT harness) is the only
    part to learn from the SDK. Do not re-derive a split the prototype already validated — adapt it, then let the UT oracle
    arbitrate.'
  - $WORK_DIR/design/TilingData.md section 1 -> $WORK_DIR/op/op_kernel/arch35/*_tiling_struct.h rewritten field-for-field
    (no missing, no extra field; units per section 2).
  - '$WORK_DIR/design/HostTiling.md -> the common TilingFunc: shared split formulas, every 异常值校验 exit as a GRAPH_FAILED return,
    the short-circuit/early-return paths it documents (empty tensor among them), TilingData fill + SetBlockDim + workspace
    sizes, and the determinism guarantees (accumulation_order / bitwise_reproducible) honored in the split order it records.'
  - '$WORK_DIR/design/TilingKey.md + BranchRoute.md -> the authoritative key set: branch determination and SetTilingKey per
    BranchRoute.md''s entry conditions, using the bit encoding fixed at design time (GET_TPL_TILING_KEY or literal, exactly
    as TilingKey.md documents).'
  - $WORK_DIR/design/branches/DESIGN-BRANCH-<key>.md 「具体切分计算」 sections -> per-branch constants and formulas transcribed verbatim
    into constexpr — never from memory.
  - $WORK_DIR/design/Kernel.md -> which TilingData fields degenerate/short-circuit paths read (fill exactly those); $WORK_DIR/spec.yaml
    boundary_conditions -> the boundary cases the UT pins; $WORK_DIR/design/Interface.md's OpDef contract -> the IO/attr view
    TilingFunc reads.
  - 'Iterate: implement the common formulas first, then branch by branch, rerunning the full suite after each increment —
    gtest''s failed list is the worklist, and regression means the whole suite stays green, never a subset.'
  - Reuse the existing harness under $WORK_DIR/op/tests/tiling/ as-is (run.sh, CMakeLists.txt, and the isolated install under
    dev-package/); consume platform facts (coreNum / ubSize) from CompileInfo when present, with the platform-info fallback
    the tiling-developer agent doc documents.
  - 'Conflict rule: when an oracle expectation and the implementation disagree, the design doc is the arbiter, and the implementation
    side is the only side this task may fix. If a case cannot pass without deviating from the design, leave it red and report
    the conflict as the task outcome — that is a UT defect, and absorbing it by editing the oracle is forbidden.'
  - 'Evidence: cd $WORK_DIR/op/tests/tiling && ./run.sh > ut-green.log 2>&1 (exit 0, all pass, loaded-.so print retained);
    ut-baseline.log stays untouched.'
  acceptance:
  - 'Green baseline fully green: cd $WORK_DIR/op/tests/tiling && ./run.sh > ut-green.log 2>&1 exits 0, and test -s $WORK_DIR/op/tests/tiling/ut-green.log
    && grep -qF ''[  PASSED  ]'' $WORK_DIR/op/tests/tiling/ut-green.log && ! grep -qF ''[  FAILED  ]'' $WORK_DIR/op/tests/tiling/ut-green.log
    && test -x $WORK_DIR/op/tests/tiling/build/test_tiling_gtest.'
  - 'Loaded-library evidence: grep -qF ''loading op_host .so'' $WORK_DIR/op/tests/tiling/ut-green.log && grep -qF $WORK_DIR/op/tests/tiling/dev-package
    $WORK_DIR/op/tests/tiling/ut-green.log.'
  - 'No hidden registration failure: ! grep -qi ''do not registe tiling struct'' $WORK_DIR/op/tests/tiling/ut-green.log.'
  - 'The oracle ran unchanged: the green run''s total test count (the `[==========] N tests from M test suites ran` line of
    ut-green.log) equals the total recorded in $WORK_DIR/op/tests/tiling/ut-baseline.log (its `Running N tests` count); every
    test name listed in ut-baseline.log appears as a TEST_F in test_tiling_gtest.cpp; the source file remains the sole .cpp:
    test $(find $WORK_DIR/op/tests/tiling -maxdepth 1 -name ''*.cpp'' | wc -l) -eq 1.'
  - 'Oracle independence unchanged: ! grep -qE ''#include[[:space:]]+"[^"]*(tiling_struct|tiling_arch35)[.]h"'' $WORK_DIR/op/tests/tiling/test_tiling_gtest.cpp.'
  - 'tiling-verifier reviews per agents/tiling-verifier.md in 「Tiling 实现」 mode, with UT artifacts rooted at $WORK_DIR/op/tests/tiling/
    and design docs at $WORK_DIR/design/ (not the operators/{OP}_package / docs/{OP} layout shown in the agent doc): dimensions
    0/1/2/3/4/5 all pass — TilingData struct fields match TilingData.md (no missing, no extra), branch constants match the
    DESIGN-BRANCH-<key>.md 「具体切分计算」 sections, SetTilingKey routing matches BranchRoute.md (literal or GET_TPL_TILING_KEY —
    no literal grep), and the UT source and harness (test_tiling_gtest.cpp, CMakeLists.txt, run.sh) are untouched.'
  out_of_scope:
  - 'Modifiable scope (exhaustive): $WORK_DIR/op/op_kernel/arch35/*_tiling_struct.h, $WORK_DIR/op/op_host/arch35/*_tiling_arch35.h
    and *_tiling_arch35.cpp, and the artifacts run.sh regenerates under $WORK_DIR/op/tests/tiling/ (build/, dev-package/,
    ut-green.log). Everything else is read-only, including the pinned-oracle files: test_tiling_gtest.cpp, CMakeLists.txt,
    run.sh, and ut-baseline.log.'
  - Do not touch $WORK_DIR/op/op_host/*_def.cpp or *_infershape.cpp, the op_kernel compute sources (the `__global__ __aicore__`
    kernel-entry source and kernel templates — everything under $WORK_DIR/op/op_kernel/ except the TilingData struct header
    named in the modifiable scope), op_graph/, package-root CMakeLists.txt / build.sh, $WORK_DIR/dev-package/, or any file
    under $WORK_DIR/design/.
  depends_on:
  - write-tiling-ut
  max_retries: 2
  on_exhaust: exit
- id: generate-kernel-subgraph
  task_type: normal
  executor: general-executor
  verifier: general-verifier
  title: Generate the kernel-implementation branch subgraph kernel-sub-graph.yaml
  goal:
  - 'Read $WORK_DIR/design/BranchCatalog.md and produce $WORK_DIR/.workflow/kernel-sub-graph.yaml: a dict with exactly one
    top-level key nodes holding 5*M normal nodes, where M = the number of tilingKeys registered in BranchCatalog.md, discovered
    at runtime and never assumed — one five-task chain per tilingKey, driving kernel development with whitebox cases (the
    per-branch direct-invoke functional prototype was already proven by the prototype-impl stage). Nothing in this task
    may hardcode an operator name, a tilingKey set, or a branch count.'
  approach:
  - 'Node schema = op-develop.yaml normal task (id, task_type: normal, title, goal, approach, acceptance, out_of_scope, depends_on,
    executor, verifier, max_retries: 2, on_exhaust: exit). Write the file as a YAML mapping whose sole top-level key is nodes
    (a bare list is invalid). goal / approach / acceptance / out_of_scope must each be a non-empty LIST of non-empty strings
    (a plain string is rejected by schema validation) — write each item as a separate list entry with the ''- '' prefix, never
    as one long string.'
  - 'Enumerate the tilingKeys in BranchCatalog.md registration order, m = 1..M; per key (with its DESIGN-BRANCH-<key>.md),
    generate these five chained nodes (ids branch-<m>-<step>):'
  - '1. branch-<m>-whitebox-gen — executor whitebox-designer, verifier st-verifier: generate this branch''s TTK kernel-mode
    whitebox case set under $WORK_DIR/op/tests/whitebox/branch-<m>/ (design_doc_cases.json + ttk_design_doc_cases.csv) from
    $WORK_DIR/design/branches/DESIGN-BRANCH-<key>.md §9 branch-verification points and $WORK_DIR/design/Validation.md''s matrix
    rows for this branch; expected values computed by the independent golden $WORK_DIR/golden.py; coverage audit passes; no
    hardcoded case counts or hand-written CSV. Every design verification point routed to this branch must have at least one
    case whose generated inputs actually exercise it (the value ranges and special values the design doc specifies for that
    point — a case that only references a point without feeding it exercising inputs does not cover it), and the csv rows
    are ordered so the design''s precision-critical and special-value scenarios land in the earliest rows, letting the staged
    20%/50% batch gates catch them before the full-batch run. No deferral: when the case generator cannot express an input
    pattern a design point requires, extend the generator as part of this task — recording a gap instead of producing the
    case is a defect.'
  - 'Include this reuse rule in every whitebox-gen approach and acceptance: reuse successfully generated cases for export-only,
    ordering or notes changes without repeating Golden probes. Record fingerprints of the case model, generation inputs,
    Golden and generator; changes to any of these or case content require full regeneration. For export-only changes,
    use cases-to-ttk <cases.json> <opspec.json> <cases.csv> in a separate directory, with helper-supported thresholds within
    task resource limits. Preserve every required case and the complete record multiset across main CSV and oversized sidecar,
    including all fields and duplicate counts; sorting moves whole records. Retain successful full-generation evidence and
    recheck coverage, execution eligibility and CSV validity after reuse.'
  - '2. branch-<m>-kernel-bringup — executor kernel-developer, verifier kernel-verifier: implement this branch''s kernel per
    $WORK_DIR/design/Kernel.md and DESIGN-BRANCH-<key>.md §3–§5, adapting the validated branch-<m> prototype''s proven compute/data-flow
    into the package''s separated Tiling/Kernel structure (the prototype is the working reference for this branch, not throwaway);
    select the first row of this branch''s ttk_design_doc_cases.csv as the bring-up case; run it via ttk kernel (cd $WORK_DIR/ops-test-kit;
    python3 -m ttk kernel -i <branch csv> -c -d --compile-opts op_debug_config=oom --compare mixed --plugin $WORK_DIR/golden.py, single-case filtering per the
    ttk skill''s selection mechanism — phase 1 without cross_check; if it fails, rerun with --compare cross_check --config
    $WORK_DIR/ttk.conf.yaml to adjudicate before entering precision fix); acceptance: package builds for the target architecture
    recorded in $WORK_DIR/npu-arch.json (build.sh with the required SoC argument exits 0), that one case''s precision PASSes,
    and the four ops-impl-review scripts (scalar_mainchain_check, vf_reachability_check,
    workspace_consistency_check, non3510_scaffold_check) exit 0 against $WORK_DIR/op.'
  - '3. branch-<m>-run-20pct — executor kernel-developer, verifier st-verifier: batch-run the first ceil(20%) in-fence rows of
    this branch''s csv (case-size fence, batch-gate semantics (d) below) via ttk kernel under the two-phase execution contract
    ((c) below); fix kernel/tiling per DESIGN-BRANCH-<key>.md until every one of them precision-PASSes; never edit cases, golden,
    or tolerances; log the exact row set used — executed and fence-excluded rows separately.'
  - '4. branch-<m>-run-50pct — executor kernel-developer, verifier st-verifier: same as step 3 but the batch is the first
    ceil(50%) in-fence rows (cumulative superset of step 3); all must precision-PASS, earlier rows must not regress.'
  - '5. branch-<m>-run-100pct — executor kernel-developer, verifier st-verifier: full-branch batch of the in-fence rows, every
    in-fence case precision-PASS (hard gate), zero skip/fail among them, fence-excluded rows recorded per (d), earlier stages
    regress-checked; results recorded under $WORK_DIR/op/tests/whitebox/branch-<m>/.'
  - 'Batch-gate semantics (applies to steps 3–5, bake into every generated batch node): (a) positive/negative split — a row
    is negative iff the case set marks it expect_error (or names it a rejection scenario); positive rows must precision-PASS
    and negative rows must be REJECTED by the operator (a precision PASS on a negative row is a defect); report both counts
    in the evidence. (b) Precision is judged per the design authority — $WORK_DIR/design/Validation.md 精度验收标准 and
    DESIGN-BRANCH-<key>.md (per-dtype pointwise rtol/atol). DEFAULT: `--compare mixed` with the per-dtype thresholds
    from Validation.md expresses the criterion, and its per-case result IS the design-criterion check — do NOT build a
    --dump-based checker in that case (no NPY dump pass, no duplicate rerun of green rows). EXCEPTION: a --dump-based
    machine-checkable design-criterion checker is built ONLY when the op''s design criterion contains a clause the ttk
    comparator demonstrably cannot express — e.g. small-value/subnormal guards or cross-case consistency the comparator
    has no flag for; the stage RECORD.md must then name the exact criterion clause, the comparator limitation, and the
    checker''s clause-by-clause mapping. Silently relaxing or swapping the criterion is forbidden in all cases. (c) Two-phase
    execution contract (steps 2–5): all existing Kernel commands, including adjudication and repaired reruns, retain -c -d --compile-opts op_debug_config=oom (merge oom into existing op_debug_config options; retain binary tests); phase 1 runs without cross_check — --compare mixed, no --config, local golden
    comparison only; phase 2 reruns every FAILED positive row with -t adding --compare cross_check --config
    $WORK_DIR/ttk.conf.yaml (third_party torch via the local xpu-server); cross_check-passing rows are adjudicated green,
    rows still failing enter precision localization and fix; phase 2 is skipped when phase 1 is all-green. Negative rows
    follow (a) — REJECTED is their green; adjudicate anomalies likewise. (d) Case-size fence — bake it into the goal AND the
    acceptance of every generated batch node: the executed row set is this branch''s csv rows whose total input elements
    (per input the product of its input_shapes dims, summed over inputs) are ≤ 2**22 (4,194,304); a row over the fence is
    excluded by design — whitebox gates verify precision semantics, which are shape-size-independent for this operator class,
    and full-scale memory/perf behavior is the independent judge''s bench. Mechanism (ttk has no shape filter and its -l
    per-case budget is integer-GB, coarser than these sizes): a recorded python pre-pass (ast.literal_eval each csv
    input_shapes; numel = product of dims; keep total ≤ 2**22) derives the executed name list, and every ttk invocation of
    steps 3–5 — phase 1, phase-2 reruns, and any failure-localization rerun — runs with -t <comma-separated in-fence case
    names> (exact-name match; the -t list must equal the recorded pre-pass output). Every excluded row (name → shape → total
    elements) is listed in the stage RECORD.md. If the fence would exclude the only case exercising a design verification
    point, that is a whitebox-gen defect: regenerate a smaller case for that point (same dtype(s), rank, alignment class,
    value pattern) — coverage is never silently lost. The zero-skip hard gate of step 5 applies to the in-fence set; the fence
    value is fixed workflow contract, never widened to make a failing case disappear.'
  - 'Dependencies inside the subgraph: each branch''s five nodes chain linearly (gen → bringup → 20 → 50 → 100); every branch-<m>-whitebox-gen
    has no intra-subgraph dependency (whitebox generation of different branches writes disjoint directories and may run in
    parallel); for m ≥ 2, branch-<m>-kernel-bringup depends on BOTH branch-<m>-whitebox-gen AND branch-<m-1>-run-100pct —
    kernel-touching steps of different branches never run concurrently (no resource locks in this orchestrator; shared op_kernel/
    entry and aclnn build tree). Every bringup step starts from the functionally-validated per-branch direct-invoke prototype
    at $WORK_DIR/op/tests/prototype/branch-<key>/main.asc produced by the earlier prototype-impl stage (read-only reference:
    port its proven compute/data-flow into the package''s separated Tiling/Kernel structure; never edit the prototype).'
  - Every node's goal must state its completion gate explicitly and reference its authoritative design docs by absolute path.
  acceptance:
  - 'Contract-valid: ORCH_SKILL=the workflow-orchestrator skill directory ; python3 -c "import sys; sys.path.insert(0,\"$ORCH_SKILL/scripts\");
    import get_task; nodes,err=get_task.load_subgraph(\"$WORK_DIR/.workflow/kernel-sub-graph.yaml\"); assert not err, err"
    exits 0.'
  - $WORK_DIR/.workflow/kernel-sub-graph.yaml exists; M equals the tilingKey count in $WORK_DIR/design/BranchCatalog.md; python3
    -c "import yaml; d=yaml.safe_load(open('$WORK_DIR/.workflow/kernel-sub-graph.yaml')); assert isinstance(d,dict) and set(d)=={'nodes'}
    and len(d['nodes'])==5*M" exits 0.
