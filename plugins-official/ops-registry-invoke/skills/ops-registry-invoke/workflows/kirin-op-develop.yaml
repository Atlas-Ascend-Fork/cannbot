      - "Load the tiling-ut-harness skill first (mandatory); its platform-mock mapping table, compile-link recipe, and env_doctor verification are the authority for the mock harness below — do not reverse-engineer SDK binaries when env_doctor returns VERIFIED."
      - "Derive the case set and the oracle from these sources: $WORK_DIR/design/HostTiling.md (shared tiling formulas as oracle rules, every 异常值校验 exit as one GRAPH_FAILED case), $WORK_DIR/design/TilingData.md (expected TilingData layout), $WORK_DIR/design/TilingKey.md + BranchCatalog.md (authoritative tilingKey set), $WORK_DIR/design/branches/DESIGN-BRANCH-<key>.md 「具体切分计算」 (per-branch constants), $WORK_DIR/design/Interface.md 算子规格 table, $WORK_DIR/design/Kernel.md, $WORK_DIR/spec/spec.yaml (error_codes / boundary_conditions / shape_constraints)."
      - "the tiling-exception-coverage skill -> the exception-coverage floor: walk every checklist item per the skill's procedure against the Interface.md IO table / OpDef attrs / spec.yaml constraints; every hit item becomes one TEST_F using the skill's construction recipe and assertion playbook, and the disposition of every item lands as a coverage-matrix comment block inside test_tiling_gtest.cpp, in the skill's row format, as the task's checklist audit trail."
      - "Establish the red-phase stub first: reduce TilingFunc in $WORK_DIR/op/op_host/<arch>/*_tiling_<arch>.cpp to the red-phase stub per the tiling-developer TDD discipline before running the UT; the tiling(nullptr) guard case already passes against the stub and is exempt."
      - "Harness: keep the sample tests/tiling/ pattern B (registry dlopen of the installed op_host .so; fe::PlatFormInfos mock for per-case core count / UB size — both are set per the kirin model's specs from the kirin-env.json / npu-arch mapping, not hardcoded here)."
      - "Isolation: point run.sh's --install-path and CMake's OPP_INSTALL_DIR at $WORK_DIR/op/tests/tiling/dev-package/; the shared toolchain-installed vendor stays untouched."
      - "Run `cd $WORK_DIR/op/tests/tiling && ./run.sh` (non-zero exit expected) and save the full output to ut-baseline.log. Any case beyond the exemptions passing against the stub does not discriminate the unimplemented state: sharpen that expectation until the baseline shows only the exemption case(s) passed."
    acceptance:
      - "UT artifacts exist with a single source file: test -s $WORK_DIR/op/tests/tiling/test_tiling_gtest.cpp && test -f $WORK_DIR/op/tests/tiling/CMakeLists.txt && test -f $WORK_DIR/op/tests/tiling/run.sh."
      - "Isolated install: test -d $WORK_DIR/op/tests/tiling/dev-package/vendors && find $WORK_DIR/op/tests/tiling/dev-package/vendors -name 'libcust_opmaster_rt2.0.so' | grep -q ."
      - "Oracle independence: ! grep -qE '#include[[:space:]]+\"[^\"]*(tiling_struct|tiling_<arch>)[.]h\"' $WORK_DIR/op/tests/tiling/test_tiling_gtest.cpp."
      - "Red baseline recorded: test -s $WORK_DIR/op/tests/tiling/ut-baseline.log && grep -qF '[  FAILED  ]' $WORK_DIR/op/tests/tiling/ut-baseline.log, and the passed set is exactly the exemption rows (the tiling(nullptr) guard)."
      - "Loaded-library evidence: grep -qF 'loading op_host .so' $WORK_DIR/op/tests/tiling/ut-baseline.log && grep -qF $WORK_DIR/op/tests/tiling/dev-package $WORK_DIR/op/tests/tiling/ut-baseline.log."
      - "Exception checklist audited in-file: every checklist item the tiling-exception-coverage skill defines appears exactly once in the coverage-matrix comment block of $WORK_DIR/op/tests/tiling/test_tiling_gtest.cpp (IDs are whatever the skill currently defines)."
      - "Checklist row content: every TEST_F name cited in the in-file coverage matrix grep-matches a TEST_F in test_tiling_gtest.cpp; every covered row names its interception layer (infer / tiling / platform); every covered expect-failure row names its asserted log anchor; every N/A row cites Interface.md or spec.yaml as evidence."
      - "Broadly-applicable items never N/A by default: for the checklist items the skill marks as applying to nearly every operator, N/A is legitimate only when the op spec provably lacks that degree of freedom (e.g. a single-input operator makes the cross-input-dtype item vacuous — the N/A row must say so by quoting the IO table)."
      - "tiling-verifier reviews per agents/tiling-verifier.md in TilingUT/red-baseline mode, with UT artifacts rooted at $WORK_DIR/op/tests/tiling/; all clauses pass."
      - "tiling-verifier additionally re-judges every N/A row of the in-file coverage matrix against the op spec: an N/A whose trigger actually fires (e.g. an operator with broadcast semantics marking the broadcast-rule item N/A) fails the review."
    out_of_scope:
      - "Only create or modify files under $WORK_DIR/op/tests/tiling/ (including the build/, dev-package/ and ut-baseline.log artifacts run.sh generates there); the one exception is $WORK_DIR/op/op_host/<arch>/*_tiling_<arch>.cpp, which may only be reduced to the red-phase stub."
      - "Do not turn the red baseline green here: the TilingFunc stays stub-only; record design gaps as test comments only."
    depends_on:
      - design-branches
      - update-opdef
      - setup-op-package
    max_retries: 2
    on_exhaust: exit
# kirin-adapt: implement-tiling：改按 kirin 型号确定的 <arch>（TilingData struct header 在
#   op_kernel/<arch>/*_tiling_struct.h）。
  - id: implement-tiling
    task_type: normal
    executor: general-executor
    verifier: general-verifier
    title: Implement the real host Tiling so the entire Tiling UT suite passes (TDD green)
    goal:
      - "Replace the stub TilingFunc currently in $WORK_DIR/op/op_host/<arch>/*_tiling_<arch>.cpp with the real TilingFunc for the operator in $WORK_DIR/spec/spec.yaml — TilingData struct, common split formulas, branch determination with tilingKey setting, validation/short-circuit exits, and the IMPL_OP_OPTILING registration — transcribed from the same $WORK_DIR/design/ docs the UT oracle was derived from."
      - "Make the complete Tiling UT pass, with the UT itself as the pinned oracle: cd $WORK_DIR/op/tests/tiling && ./run.sh exits 0 with every TEST_F passed and 0 failed, recorded as $WORK_DIR/op/tests/tiling/ut-green.log."
    approach:
      - "The Tiling UT at $WORK_DIR/op/tests/tiling/test_tiling_gtest.cpp is the read-only pinned oracle; implement until it passes; the oracle itself is never edited. The completion gate is strict: run.sh exits 0 with every TEST_F passed and 0 failed."
      - "Implement from the design docs: $WORK_DIR/design/TilingData.md -> $WORK_DIR/op/op_kernel/<arch>/*_tiling_struct.h rewritten field-for-field; $WORK_DIR/design/HostTiling.md -> the common TilingFunc (shared split formulas, 异常值校验 exits, short-circuit/early-return paths, TilingData fill + SetBlockDim + workspace sizes, determinism guarantees); $WORK_DIR/design/TilingKey.md + BranchRoute.md -> branch determination and SetTilingKey per entry conditions using the literal GET_TPL_TILING_KEY encoding fixed at design time; $WORK_DIR/design/branches/DESIGN-BRANCH-<key>.md 「具体切分计算」 -> per-branch constants transcribed verbatim into constexpr."
      - "Iterate: implement the common formulas first, then branch by branch, rerunning the full suite after each increment — gtest's failed list is the worklist, and regression means the whole suite stays green, never a subset."
      - "Conflict rule: when an oracle expectation and the implementation disagree, the design doc is the arbiter, and the implementation side is the only side this task may fix. If a case cannot pass without deviating from the design, leave it red and report the conflict as the task outcome."
      - "Evidence: cd $WORK_DIR/op/tests/tiling && ./run.sh > ut-green.log 2>&1 (exit 0, all pass, loaded-.so print retained); ut-baseline.log stays untouched."
    acceptance:
      - "Green baseline fully green: cd $WORK_DIR/op/tests/tiling && ./run.sh > ut-green.log 2>&1 exits 0, and test -s $WORK_DIR/op/tests/tiling/ut-green.log && grep -qF '[  PASSED  ]' $WORK_DIR/op/tests/tiling/ut-green.log && ! grep -qF '[  FAILED  ]' $WORK_DIR/op/tests/tiling/ut-green.log."
      - "Loaded-library evidence: grep -qF 'loading op_host .so' $WORK_DIR/op/tests/tiling/ut-green.log && grep -qF $WORK_DIR/op/tests/tiling/dev-package $WORK_DIR/op/tests/tiling/ut-green.log."
      - "No hidden registration failure: ! grep -qi 'do not registe tiling struct' $WORK_DIR/op/tests/tiling/ut-green.log."
      - "The oracle ran unchanged: the green run's total test count equals the total recorded in $WORK_DIR/op/tests/tiling/ut-baseline.log; every test name listed in ut-baseline.log appears as a TEST_F in test_tiling_gtest.cpp."
      - "Oracle independence unchanged: ! grep -qE '#include[[:space:]]+\"[^\"]*(tiling_struct|tiling_<arch>)[.]h\"' $WORK_DIR/op/tests/tiling/test_tiling_gtest.cpp."
      - "tiling-verifier reviews per agents/tiling-verifier.md in 「Tiling 实现」 mode: TilingData struct fields match TilingData.md (no missing, no extra), branch constants match the DESIGN-BRANCH-<key>.md sections, SetTilingKey routing matches BranchRoute.md, and the UT source and harness are untouched."
    out_of_scope:
      - "Modifiable scope (exhaustive): $WORK_DIR/op/op_kernel/<arch>/*_tiling_struct.h, $WORK_DIR/op/op_host/<arch>/*_tiling_<arch>.h and *_tiling_<arch>.cpp, and the artifacts run.sh regenerates under $WORK_DIR/op/tests/tiling/."
      - "Do not touch $WORK_DIR/op/op_host/*_def.cpp or *_infershape.cpp, the op_kernel compute sources, op_graph/, package-root CMakeLists.txt / build.sh, or any file under $WORK_DIR/design/."
    depends_on:
      - write-tiling-ut
    max_retries: 2
    on_exhaust: exit
# kirin-adapt: gen-golden：产出 numpy 参考实现 + 每 dtype rtol/atol 字典（消费方以 ops-kirin-device-verify
#   compare_output.py 为主、camodel sim 直调 harness 为辅），并补 $WORK_DIR/op/tests/sim_verify/gen_cases.py
#   （适配 ops-kirin-device-verify 的 scripts/gen_cases.py）。
  - id: gen-golden
    task_type: normal
    executor: general-executor
    verifier: general-verifier
    title: Generate the golden reference golden.py and its invariant self-check
    goal:
      - "Produce $WORK_DIR/golden.py as a numpy-based golden reference (independent of the kernel under test) for the operator in $WORK_DIR/spec/spec.yaml, plus $WORK_DIR/golden_invariant_check.py which proves the golden satisfies the spec's math_semantics invariants on random inputs. On the kirin platform the golden is consumed primarily by the kirin-device comparison (ops-kirin-device-verify compare) and secondarily by the simulator sim-direct harness (degradation/development), so it must expose a plain numpy function and the per-dtype rtol/atol."
    approach:
      - "Read $WORK_DIR/spec/spec.yaml's reference_oracle and math_semantics; implement the reference math in numpy (implement the formula with numpy primitives, or one equivalent torch/TF API if it runs on host CPU) — never import or reuse anything from $WORK_DIR/op/ (kernel artifacts)."
      - "Float64 accumulation rule (workflow-mandated): wherever the golden performs floating-point accumulation, lift to float64 first, accumulate in float64, cast back to the target output dtype; never accumulate in float16/float32."
      - "Derive tolerance per-dtype from $WORK_DIR/spec/spec.yaml's numerical_tolerance; expose them as a dict so the sim harness and compare_output.py consume them (rtol/atol)."
      - "Write $WORK_DIR/golden_invariant_check.py: build 3+ random legal input sets, run every value-level invariant in spec math_semantics.invariants against the golden, print PASS per invariant, exit 0 only if all pass."
      - "Also write $WORK_DIR/op/tests/sim_verify/gen_cases.py for the kirin sim harness by adapting the ops-kirin-device-verify skill's scripts/gen_cases.py: numpy golden function per spec + --special injection (nan/inf/equal/ulp/spread/zpair) + fixed seed, matching the spec dtype/shape rules."
    acceptance:
      - "$WORK_DIR/golden.py exists and parses: python3 -c \"import ast; ast.parse(open('$WORK_DIR/golden.py').read())\" exits 0; it exposes a numpy reference function and a per-dtype tolerance dict."
      - "Oracle independence: ! grep -qE 'from op|import op/' $WORK_DIR/golden.py (no kernel artifact reuse); golden math matches spec.yaml reference_oracle semantics."
      - "Float64 accumulation: the golden's accumulation path casts to float64 before summing and casts back to the output dtype after."
      - "$WORK_DIR/golden_invariant_check.py exists and python3 $WORK_DIR/golden_invariant_check.py exits 0 with every invariant PASS."
      - "$WORK_DIR/op/tests/sim_verify/gen_cases.py exists and python3 -c \"import ast; ast.parse(open('$WORK_DIR/op/tests/sim_verify/gen_cases.py').read())\" exits 0."
    out_of_scope:
      - "Create only $WORK_DIR/golden.py, $WORK_DIR/golden_invariant_check.py, and $WORK_DIR/op/tests/sim_verify/gen_cases.py; do not modify spec.yaml, design docs, or any existing files under $WORK_DIR/op/ (creating gen_cases.py under $WORK_DIR/op/tests/sim_verify/ is in scope)."
    depends_on:
      - generate-spec
      - setup-op-package
    max_retries: 2
    on_exhaust: exit
# kirin-adapt: setup-sim-harness：新增节点——相对 op-develop.yaml，其 blackbox 系列节点直接跑 TTK-on-NPU，
#   无需自建 harness；本工作流改用 camodel sim 直调后，kernel 子图 branch-<m>-kernel-bringup 的验收依赖
#   $WORK_DIR/op/tests/sim_verify/ 的 harness，故把 harness 构建抽成独立节点（run_sim.sh + <op>_sim.cpp +
#   --perf 模式），kernel-impl 子图、blackbox-device-verify（情形 A/B/C 降级执行）与性能 tick 基线均依赖
#   它，消除「未建先被消费」的时序断链。依赖 update-opdef（其重写 kernel 入口 stub）保证 harness 的
#   <op>_sim.cpp 对 Kernel.md 入口签名编译，避免与模板原始入口并发冲突。
#   载体定位：sim harness 为**辅助载体/降级底座**——kernel 开发白盒快迭代（bringup）与降级场景（情形 A/B/C）
#   使用，不作为主验证证据源；主验证证据以麒麟设备验证为准。sim 固有局限（供执行体在起 sim 前预判，命中即
#   停止 sim 调试并切麒麟设备主载体、记录局限，不以 sim bitwise-PASS 为验证门禁）：camodel 对 int8 B 通路
#   （L0B/MMAD）仿真受限、sim tick 上限（见头部统一约定）、dav-l300 上 Fixpipe NZ->ND 转换断言崩溃等。
  - id: setup-sim-harness
    task_type: normal
    executor: general-executor
    verifier: general-verifier
    title: Build the simulator sim-direct harness under $WORK_DIR/op/tests/sim_verify/
    goal:
      - "Create the operator's simulator sim-direct harness under $WORK_DIR/op/tests/sim_verify/ as the **auxiliary carrier** (kernel bringup development iteration and degradation scenarios A/B/C), consumable by the kernel bringup subgraph and the blackbox-device-verify degradation paths (cases A/B/C): a direct-invocation program (cmake -DASCEND_RUN_MODE=sim building a <op>_sim.cpp that instantiates the per-model-arch kernel templates, reads input bins, runs, writes output bin) plus a run_sim.sh wrapping cmake configure+build+run+compare against golden, and a --perf mode emitting total tick / cycles-per-element for the camodel baseline (subject to the sim-carrier tick cap defined in the workflow header)."
    approach:
      - "Load the ascendc-kirin-env-check skill's simulator line as the execution authority (sim-direct run convention — LD_LIBRARY_PATH ordering + GLIBCXX LD_PRELOAD — per the unified conventions in the workflow header); consult the tiling-ut-harness skill for the compile-link recipe if needed."
      - "Derive the kernel entry signature from $WORK_DIR/design/Kernel.md 入口 (the authoritative symbol + param list) and write <op>_sim.cpp accordingly: instantiate the per-model-arch kernel templates (op_kernel/<arch>), read input bins from the case set, run, write output bin."
      - "Write run_sim.sh wrapping cmake configure+build+run+compare against $WORK_DIR/golden.py (per-dtype rtol/atol); the compare step consumes $WORK_DIR/op/tests/sim_verify/gen_cases.py for bin generation when run case-by-case."
      - "Add a --perf mode to run_sim.sh that runs the camodel simulation and emits the baseline (total tick / cycles-per-element), consumed by the performance decision task."
      - "Build once to prove the harness compiles: cd $WORK_DIR/op/tests/sim_verify && bash run_sim.sh --check (exit 0)."
    acceptance:
      - "test -f $WORK_DIR/op/tests/sim_verify/run_sim.sh && find $WORK_DIR/op/tests/sim_verify -maxdepth 1 -name '*_sim.cpp' | grep -q ."
      - "run_sim.sh supports --perf and prints a total tick / cycles-per-element line when invoked in perf mode."
      - "The harness builds: cd $WORK_DIR/op/tests/sim_verify && bash run_sim.sh --check exits 0."
    out_of_scope:
      - "Write only under $WORK_DIR/op/tests/sim_verify/; do not modify kernel/host sources, case CSVs, $WORK_DIR/golden.py, tolerances, or design docs."
      - "Do not execute any case or batch here; do not run the performance baseline."
    depends_on:
      - gen-golden
      - setup-op-package
      - update-opdef
      - write-design-kernel
    max_retries: 2
    on_exhaust: exit
# kirin-adapt: generate-kernel-subgraph：生成的节点验证载体为麒麟设备验证为主（ops-kirin-device-verify
#   8 步）、camodel sim 直调 harness 为辅（ASCEND_RUN_MODE=sim；sim 直调运行约定见头部统一约定；
#   开发辅助 + 情形 A/B/C 降级），精度与 numpy golden 比对。
#   共享框架分支（同一 kernel 模板）合并 bringup：共享框架只在代表分支（branch-0）完整验证一次，其余分支
#   仅实例化，子图节点标注「共享框架已由 branch-0 验证，其余分支仅实例化」。
#   **载体定位**：bringup/批次以麒麟设备验证为主、sim 直调 harness 为辅/降级；其经 sim 的执行仅属**开发辅助**
#   （kernel 开发期快迭代、快速定位），不构成正式验证证据；每分支 kernel 的正式验证证据以
#   blackbox-device-verify（麒麟设备验证）收口，设备离线（情形 A）时 sim 结果作为降级证据。sim 载体受仿真
#   tick 上限（见头部统一定义）约束，超限用例跳过并记录。
  - id: generate-kernel-subgraph
    task_type: normal
    executor: general-executor
    verifier: general-verifier
    title: Generate the kernel-implementation branch subgraph (kirin-device primary, simulator sim-direct auxiliary) kernel-sub-graph.yaml
    goal:
      - "Read $WORK_DIR/design/BranchCatalog.md and produce $WORK_DIR/.workflow/kernel-sub-graph.yaml: a dict with exactly one top-level key nodes holding the kernel-development nodes, where the tilingKey count is discovered at runtime and never assumed. Branches that share the same kernel template/framework form one framework group and **merge their bringup**: the shared framework is fully verified once on the group's representative branch, the remaining branches of the group are instance-only nodes. Execution of kernel bringup and batch runs uses **kirin-device verification as the primary carrier** (ops-kirin-device-verify 8-step) with the **simulator sim-direct harness as the auxiliary carrier** (camodel, development aid + case A/B/C degradation) — not TTK-on-NPU. Nothing in this task may hardcode an operator name, a tilingKey set, or a branch count."
    approach:
      - "Node schema = this workflow's normal task (id, task_type: normal, title, goal, approach, acceptance, out_of_scope, depends_on, executor, verifier, max_retries: 2, on_exhaust: exit). Write the file as a YAML mapping whose sole top-level key is nodes."
      - "Enumerate the tilingKeys in BranchCatalog.md registration order, m = 1..M; group branches by shared kernel framework — branches whose DESIGN-BRANCH-<key>.md §3–§5 instantiate the same kernel template form one framework group, and the group's representative branch is its first registered one."
      - "For the representative branch of each framework group: generate the full five-task chain (ids branch-<m>-whitebox-gen, branch-<m>-kernel-bringup, branch-<m>-run-20pct, branch-<m>-run-50pct, branch-<m>-run-100pct) — the shared kernel framework is verified in full exactly once on this branch."
      - "For each remaining branch of the group: generate a single instance-only node branch-<m>-instantiate — it instantiates the group's already-verified shared framework per that branch's constants (no re-full-verification of the shared framework), and its title/goal/acceptance carry the marker「共享框架已由 branch-0 验证，其余分支仅实例化」(branch-0 is the group's representative branch, i.e. the first one registered in BranchCatalog.md; in the marker, branch-0 denotes the representative-branch concept, not a node id — the actual subgraph node ids are branch-1..branch-M in registration order); its acceptance is that the branch compiles and its representative case passes (device primary / sim auxiliary)."
      - "Carrier (all bringup/batch/instantiate nodes): **kirin-device verification primary** — cases driven through ops-kirin-device-verify 8-step (vendor rebuilt + installed, per-case atc->OMC, device inference, compare with golden) — with the **simulator sim-direct harness as the auxiliary carrier** (development-aid fast iteration and case A/B/C degradation; $WORK_DIR/op/tests/sim_verify/ + sim-direct run convention per the unified conventions in the workflow header); whitebox cases generated by whitebox-gen feed both carriers; precision judged per Validation.md."
      - "1. branch-<m>-whitebox-gen — executor whitebox-designer, verifier st-verifier: generate this branch's whitebox case set under $WORK_DIR/op/tests/whitebox/branch-<m>/ (design_doc_cases.json + a case CSV) from $WORK_DIR/design/branches/DESIGN-BRANCH-<key>.md §9 branch-verification points and $WORK_DIR/design/Validation.md's matrix rows for this branch; expected values computed by the independent golden $WORK_DIR/golden.py; coverage audit passes; no hardcoded case counts or hand-written CSV. Annotate every row with the §9 carrier column (device primary / sim auxiliary per the unified conventions in the workflow header) and a sim-feasibility flag: compute the element count from the case shape; rows with element count > SIM_MAX_ELEMS (defined in the unified conventions in the workflow header) are sim-infeasible (device-only) and are written to $WORK_DIR/op/tests/whitebox/branch-<m>/*_oversized.csv (excluded from the sim batch, still device-runnable)."
      - "2. branch-<m>-kernel-bringup — executor kernel-developer, verifier kernel-verifier: implement this branch's kernel per $WORK_DIR/design/Kernel.md and DESIGN-BRANCH-<key>.md §3–§5 under op_kernel/<arch>/; the bring-up case is the first row of this branch's whitebox case CSV. Carry out the carrier protocol strictly in order: (i) build the package (cd $WORK_DIR/op && bash build.sh --soc=<soc> exits 0); (ii) bash $WORK_DIR/op/tests/sim_verify/run_sim.sh --check — compile/wiring-level sanity only, never precision evidence; (iii) read device_online from $WORK_DIR/kirin-env.json — refresh it first by re-running the kirin device-segment environment check (the snapshot written at kirin-env-check may be stale by kernel-impl time) — when online, run the bring-up case through the **kirin-device verification primary** (ops-kirin-device-verify 8-step) and require precision-PASS against golden (sim is not acceptance evidence while the device is online); (iv) degrade to the **simulator sim-direct harness** $WORK_DIR/op/tests/sim_verify/ (sim-direct run convention per the unified conventions in the workflow header) only for case A (device offline) / case B (per-case execution anomaly) / case C (per-case failure reproduce/localize), recording the degradation reason. Sim debugging is development aid with a stop condition: use sim solely for structural/wiring checks; on hitting an inherent sim limitation (e.g. camodel int8 B-path L0B/MMAD restriction, the sim tick cap, the dav-l300 Fixpipe NZ->ND assertion) stop sim debugging, switch to the device primary, and record the limitation — never chase a sim bitwise-PASS as the bring-up gate. Acceptance (non-disjunctive): package builds, the bring-up case precision-PASSes on the kirin-device carrier when device_online (sim-only evidence fails unless a case A/B/C degradation reason is recorded), and the four ops-impl-review scripts exit 0 against $WORK_DIR/op."
      - "3. branch-<m>-run-20pct — executor kernel-developer, verifier st-verifier: batch-run the first ceil(20%) rows of this branch's case set through the step-2 carrier protocol (kirin-device verification primary when device_online, sim only on case A/B/C degradation with the reason recorded; one invocation per case, per-case timeout from Validation.md); fix kernel/tiling per DESIGN-BRANCH-<key>.md until every one precision-PASSes against golden; never edit cases, golden, or tolerances; log the exact row set used."
      - "4. branch-<m>-run-50pct — executor kernel-developer, verifier st-verifier: same as step 3 but the batch is the first ceil(50%) rows (cumulative superset of step 3); all must precision-PASS, earlier rows must not regress."
      - "5. branch-<m>-run-100pct — executor kernel-developer, verifier st-verifier: full-branch batch, every run case precision-PASS (hard gate), zero fail, earlier stages regress-checked; rows in *_oversized.csv (element count > SIM_MAX_ELEMS, device-only) are excluded from the sim batch — when the carrier has degraded to sim (case A/B/C) they are skipped and explicitly recorded (case + skip reason: sim tick budget infeasible, never counted as pass or fail), otherwise (device online) they still run through kirin-device verification; results recorded under $WORK_DIR/op/tests/whitebox/branch-<m>/ and $WORK_DIR/op/tests/sim_verify/logs/."
      - "Positive/negative split: a row is negative iff the case set marks it expect_error; positive rows must precision-PASS and negative rows must be REJECTED by the operator; report both counts in the evidence. Precision is judged per the design authority — $WORK_DIR/design/Validation.md 精度验收标准 and DESIGN-BRANCH-<key>.md (per-dtype rtol/atol)."
