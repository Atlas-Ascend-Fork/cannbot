      - "Fact mapping: $WORK_DIR/requirements/REQUIREMENTS.md -> supported scope, value domains, error semantics; $WORK_DIR/op/op_graph/ proto sources + the actual OpDef in $WORK_DIR/op/op_host/*_def.cpp -> parameter ABI and tensor-to-tensor shape bindings. An explicit conflict between the two fact inputs that would flip a positive/negative classification is reported as FAILED with both locations."
      - "Run ascendc-st-design for the ACLNN suite under tests/blackbox/ (kernel/REG_OP suite only if the operator's REG_OP proto is a required deliverable for the kirin-device atc->OMC singleop/onnx route; generate it under tests/blackbox/kernel/ otherwise skip). Cover applicable rank-0 inputs; every tensor's support_non_contiguous is declared explicitly from the facts. **Apply the coverage-complete-minimal construction**: within the skill's generation rules, merge equivalent shape/parameter combinations so each coverage cell (dtype × tilingKey × shape class × negative semantics) holds the minimal number of rows while every cell stays non-empty; record the minimization decisions (merged equivalences, per-layer main counts) in WORKFLOW_PROVENANCE.json."
      - "After the standard CSVs fully pass the skill's generation/QA/review, split oversized rows explicitly by threshold: compute each case's element count from its shape; rows with element count > SIM_MAX_ELEMS (defined in the unified conventions in the workflow header) are sim-infeasible (device-only) — move them to same-stem *_oversized.csv side tables that never enter the executable suites (they remain runnable on the kirin-device carrier; when the carrier is degraded to sim they are skipped and explicitly recorded). No dedicated isolation script exists under the ops-registry-invoke workflows/scripts/, so this split is done by the generator itself from the explicit threshold."
