    title: Generate the ST case sets (ACLNN L0/L1/L2 plus oversized side tables) via ascendc-st-design and split them into executable suites
    goal:
      - "Produce the ST case set under $WORK_DIR/op/tests/blackbox/ (design/ intermediates + testcases/ standard *_l0_functional.csv, *_l1_functional.csv, *_l2_exception.csv) for the operator in $WORK_DIR/spec/spec.yaml, designed one-shot from facts independent of the design line: $WORK_DIR/requirements/REQUIREMENTS.md plus the actual interface facts — the proto sources under $WORK_DIR/op/op_graph/ and the actual OpDef in $WORK_DIR/op/op_host/*_def.cpp. The cases are executed primarily by the kirin-device verification (ops-kirin-device-verify) and secondarily by the simulator sim-direct harness (development aid + degradation A/B/C), not by TTK-on-NPU. **Case-set construction constraint**: ST case sets must be **coverage-complete yet minimal** — merge equivalent shape/parameter combinations (e.g. the same shape across dtypes, equivalent boundary conditions, negatives that only trigger distinct validation paths) to compress the count without shrinking coverage. After the standard CSVs pass QA, split them into the three executable suites under $WORK_DIR/op/tests/blackbox/cases/ (blackbox_l0.csv / blackbox_l1.csv / blackbox_l2_neg.csv; *_oversized.csv side tables excluded) and record each suite's data-row count for downstream traceability (suite scale)."
