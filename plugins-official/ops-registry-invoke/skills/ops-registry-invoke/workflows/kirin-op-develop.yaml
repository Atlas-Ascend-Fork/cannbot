      - "Record $WORK_DIR/op/tests/blackbox/WORKFLOW_PROVENANCE.json: both fact inputs, the skill's real path and revision, conflict conclusions, standard artifacts, per-layer main/side-table counts and effective thresholds (SIM_MAX_ELEMS), each executable suite's data-row count, the public QA conclusions, and any requirement scenario that could not be landed."
