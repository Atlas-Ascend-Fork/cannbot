# kirin-adapt: blackbox-determinism：以**麒麟设备验证为主**——在麒麟设备上对每用例同输入重复 10 次并做输出
#   逐位比对（确定性 = bit 一致）；**降级到仿真载体时每用例只执行 1 次**（仿真验证耗时较长，不再重复 10 次，
#   差异显式记录）；用 check_runtime_result.py determinism 作门禁，在 RECORD.md 显式声明「sim 上确定性为
#   指示性证据，不替代麒麟设备时序/调度证据」。
  - id: blackbox-determinism
    task_type: normal
    executor: general-executor
    verifier: general-verifier
    title: Verify full L0 determinism after ST testing (kirin-device primary; degraded sim 1x per case)
    goal:
      - "After the kirin-device primary verification (blackbox-device-verify) completes the ST L0/L1/L2 coverage, check the frozen blackbox_l0.csv once in full for determinism. **Kirin-device carrier (primary)**: run each L0 case on the kirin device 10 times with the same initial inputs and compare outputs bitwise. **Degraded sim carrier (case A/B/C)**: run each case through the simulator **1 time only** (not 10 — simulation is time-consuming), no repeats. Deliver results under $WORK_DIR/op/tests/determinism/ and record the carrier (device vs degraded-sim) and repeat count explicitly."
    approach:
      - "Choose the carrier: kirin device online -> run determinism on-device (primary); device offline (case A) or per-case degradation (case B/C) -> run the affected cases on the simulator with **1 execution per case**."
      - "Kirin-device carrier: run each L0 case on the device 10 times with identical input bins (per the ops-kirin-device-verify 8-step flow); every repeat must produce bit-identical output bins."
      - "Degraded sim carrier: run each affected case through the sim harness 1 time only (fixed seed), per the sim-carrier tick cap defined in the workflow header — an over-cap case is skipped and recorded (case name + reason), not judged."
      - "Check (kirin-device carrier only): resolve CHECKER to workflows/scripts/check_runtime_result.py under the installed ops-registry-invoke skill; run python3 \"$CHECKER\" determinism --cases <frozen L0 CSV> --attempt <result.csv> <run log>. The checker hard-codes a repeat count of 10 (int(count)==10) and therefore applies **only to the kirin-device 10x carrier**; for the degraded-sim 1x carrier the 1-execution-per-case evidence is verified manually against RECORD.md (checker is not run on 1x results). Record the checker output in RECORD.md; reconcile split/repaired attempts oldest to newest with repeated --attempt arguments, preserving originals."
      - "Evidence: write RECORD.md with the L0 case inventory, the carrier used (device / degraded-sim), the repeat count per case (device 10 / sim 1), commands, exit status, original result/log paths. RECORD.md must explicitly record: determinism on the simulator is indicative evidence only (the simulator's execution path is fixed) and is not a substitute for kirin-device timing/scheduling evidence; the repeat-count difference (device 10x vs degraded-sim 1x, due to simulation being time-consuming) is documented as intended."
    acceptance:
      - "Gate: kirin-device carrier — resolve CHECKER to workflows/scripts/check_runtime_result.py under the installed ops-registry-invoke skill; independently run python3 \"$CHECKER\" determinism --cases <frozen L0 CSV> --attempt <result.csv> <run log> (oldest to newest for multiple attempts), exiting 0; every L0 case has deterministic_status PASS with native evidence of 10 repeated executions in the same attempt. Degraded-sim carrier — the checker (hard-coded to 10 repeats) does not apply; instead RECORD.md proves each affected case was executed exactly 1 time with bit-identical/expected output, verified manually. Missing/skip results, insufficient repeats and mismatch cannot pass."
      - "Evidence: RECORD.md and the original results/logs exist under $WORK_DIR/op/tests/determinism/, including the explicit statement that simulator determinism is indicative evidence only and does not substitute for kirin-device timing/scheduling evidence, and the explicit device-10x-vs-sim-1x repeat-count rationale."
    out_of_scope:
      - "Operator sources, golden, case CSVs, tolerances stay unchanged."
    depends_on:
      - blackbox-device-verify
    max_retries: 2
    on_exhaust: continue
