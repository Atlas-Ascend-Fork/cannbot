# kirin-adapt: setup-ops-test-kit / verify-ops-test-kit / setup-xpu-server：相对 op-develop：克隆 ops-test-kit
#   + TTK 环境验证 + xpu-server -> 删除。原因：TTK（ops-test-kit）的 kernel/aclnn/geir 黑盒链路依赖昇腾 NPU
#   执行，本地开发机（宿主机）上无该链路（无昇腾驱动，asys info -r hardware 即见无可用昇腾设备）；
#   verify-ops-test-kit 要求 `Found N device(s)` 并跑样例测试（NPU 运行）；setup-xpu-server 服务 TTK 的
#   cross_check（third_party torch）链路。kirin 的执行/比对载体为麒麟设备验证为主、camodel sim 直调为辅
#   （降级处理时选项），numpy golden 比对，三者均无消费方。环境由 kirin-env-check 能力线 2 承接，golden
#   比对见 gen-golden / blackbox-device-verify。
#
# kirin-adapt: analyze-requirements：相对 op-develop：由依赖 $WORK_DIR/npu-arch.json 作运行时证据、昇腾
#   950PR/950DT 默认改为 $WORK_DIR/kirin-env.json（soc_version + 麒麟设备验证为主、sim 辅助执行载体），
#   默认 KirinX90/单算子/无 PyTorch NPU 依赖。
  - id: analyze-requirements
    task_type: normal
    executor: general-executor
    verifier: general-verifier
    title: Generate the requirements analysis document REQUIREMENTS.md
    goal:
      - "Produce $WORK_DIR/requirements/REQUIREMENTS.md for the operator described in $USER_PROMPT, covering its functional scope, inputs/outputs, and constraints, along with the research intermediates under $WORK_DIR/requirements/research/."
      - "The CANN-side research anchors on the existing implementation and produces three artifacts under $WORK_DIR/requirements/research/cann/: code_walkthrough.md (call-chain walkthrough), code_design.md (deliverable coverage + analysis), and formula.md (formula extracted from the existing kernel's Compute method — the semantic anchor of the operator's math, reference evidence for downstream design/golden tasks)."
      - "The runtime environment section (## 7 运行环境) targets the kirin end-side platform recorded in $WORK_DIR/kirin-env.json (soc_version), single-op invocation via atc->OMC kirin-device inference primarily and simulator sim-direct execution as the auxiliary/degradation carrier — not an Ascend server NPU."
    approach:
      - "First read the customer requirement from the file named by $USER_PROMPT (the user prompt); extract the operator name and any specified runtime environment, invocation, network, dtype, or shape requirements."
      - "Load the ops-requirement-analysis skill first (mandatory) and follow its pipeline: stage 1 name resolution, stage 2 three-way research (model / competitor / CANN) with decision priority — math semantics and formula follow the competitor implementation (the primary semantic baseline and reference-oracle source); signatures, dtypes and deliverable facts follow the official IR when it hits; stage 3 requirement summary per its references/output_template.md."
      - "Load the cannbot-knowledge knowledge base at $WORK_DIR/cannbot-knowledge and query it for this operator and its key CANN/Ascend C APIs; reuse $WORK_DIR/cannbot-knowledge/artifacts/preflight.md when present, cite source card paths in the requirement research, and record no-hit topics explicitly."
      - "Treat $WORK_DIR/requirements/references/ (cann/, ascend/, competitor/ subdirectories) as the skill's reference/ tree for empirical source search."
      - "Consult the local built-in proto at $ASCEND_OPP_PATH/built-in/op_proto/inc/ as the highest-authority CANN fact source."
      - "Use the target platform recorded in $WORK_DIR/kirin-env.json as the runtime-environment evidence (SoC version, sim vs kirin-device execution carrier)."
      - "Fill any missing customer-requirement fields with the skill's defaults (KirinX90 / the SoC in kirin-env.json, single-op, no PyTorch NPU dependency) and mark them as assumptions; decide autonomously, never ask the user."
    acceptance:
      - "$WORK_DIR/requirements/REQUIREMENTS.md exists and is non-empty."
      - "The document has the fixed section structure (## 1 需求背景 through ## 8 需求分析总结) with all sections filled."
      - "Supported data types, chip platform / runtime environment, and the operator formula are all traceable in the document; the runtime environment names the kirin SoC and states that execution is via kirin-device inference primarily with simulator sim-direct as the auxiliary/degradation carrier."
      - "No bare COPY: directives remain; table of contents entries match the body headings."
      - "The §7.4 performance requirement section lists at least 4 concrete key shapes, states the source route, and fills in no target values (kirin performance baseline is camodel tick, per REQUIREMENTS the target metric may be tick-based)."
      - "$WORK_DIR/requirements/research/cann/ contains code_walkthrough.md, code_design.md and formula.md; when no kernel source was found, formula.md carries an explicit 'Kernel code missing' note instead of invented line-level evidence."
      - "The verifier reviews the document item by item against the fixed section, COPY, numbering, TOC, research, performance, and API requirements; every check passes."
    out_of_scope:
      - "Do not write spec.yaml, DESIGN.md, or any implementation code; this task only produces the requirements document and its research intermediates."
    depends_on:
      - setup-reference-repos
      - kirin-env-check
    max_retries: 1
    on_exhaust: exit
# kirin-adapt: generate-spec：相对 op-develop：由按昇腾目标芯片（默认 950PR/950DT，stage 9 torch）走 11
#   阶段校验，改为将 op.platform_constraints.supported_chips 设为 kirin SoC（KirinX90；ops-spec-gen 的
#   chip_registry 加入 KirinX90 为本地补丁，上游未合入，见方法中的校验步骤），不含昇腾服务器芯片；
#   kirin 上 torch 阶段 SKIP 计 pass。
  - id: generate-spec
    task_type: normal
    executor: general-executor
    verifier: general-verifier
    title: Generate the operator spec file spec.yaml (kirin chip)
    goal:
      - "Produce $WORK_DIR/spec/spec.yaml for the operator described in $WORK_DIR/requirements/REQUIREMENTS.md: a machine-checkable structured operator spec translated from and consistent with it, with no omission and no invented addition (every field traceable to REQUIREMENTS.md)."
      - "Use $WORK_DIR/spec/ as this task's working directory; the spec artifact is written there."
    approach:
      - "Load the ops-spec-gen skill first (mandatory); decide category and paradigms from its registries (category_enum.yaml, paradigm_enum.yaml, category_paradigm_map.yaml), never by intuition."
      - "Confirm $WORK_DIR/requirements/REQUIREMENTS.md exists; extract operator category/paradigms, input tensors + dtypes, output dtype/shape rules, math formula, reference oracle, numerical tolerance, boundary cases, target chips (runtime environment section — the kirin SoC from $WORK_DIR/kirin-env.json), and non-tensor attributes."
      - "Generate the skeleton with the generator (never hand-write spec.yaml): python3 the ops-spec-gen skill's scripts/generate_spec.py --op-name <op-from-REQUIREMENTS> --category <Category> --paradigms <P1,P2> --inputs \"n1:dt1,dt2;n2:...\" --outputs <out> --description \"...\" --output-dir $WORK_DIR/spec"
      - "Select the conditional generator options per the skill's rule table (axis-source / paradigm-groups / format-variants as the operator's interface requires)."
      - "Hand-fill the required TODO fields per the skill: math_semantics.formula, reference_oracle.api, dtype_policy.supported_combinations, numerical_tolerance.per_dtype, op.platform_constraints.supported_chips (the kirin SoC, e.g. KirinX90; verify the ops-spec-gen chip_registry has the chip, else report and stop), outputs[].shape_rule/dtype_rule, and determinism. The formula form must match the 'core formula' row in REQUIREMENTS section 6 step by step."
      - "Pin the io table to the official truth (dtype-and-naming fence) as the ops-spec-gen skill prescribes; never invent dtypes beyond the IR/competitor source the REQUIREMENTS names."
      - "Run python3 the ops-spec-gen skill's scripts/validate_spec.py $WORK_DIR/spec/spec.yaml; fix and rerun on any FAIL until overall: PASS (exit 0); a stage SKIP (e.g. stage 9 without torch) counts as pass."
      - "Self-verify: stop and report if any spec-owned field conflicts with REQUIREMENTS rather than choosing silently."
    acceptance:
      - "$WORK_DIR/spec/spec.yaml exists, is non-empty, and parses as YAML: python3 -c \"import yaml; yaml.safe_load(open('$WORK_DIR/spec/spec.yaml'))\" exits 0."
      - "11-stage validation passes: python3 the ops-spec-gen skill's scripts/validate_spec.py $WORK_DIR/spec/spec.yaml ends with overall: PASS (exit 0)."
      - "No TODO or placeholder residue: ! grep -qiE 'TODO|<[A-Z_]+>' $WORK_DIR/spec/spec.yaml."
      - "op.platform_constraints.supported_chips names the kirin SoC from $WORK_DIR/kirin-env.json; no Ascend server chip is declared as the target."
      - "spec-verifier cross-checks every spec-owned field against $WORK_DIR/requirements/REQUIREMENTS.md item by item: no omission, no invented addition; all clauses must be ✓ or ⚠ (no ❌)."
    out_of_scope:
      - "Produce only $WORK_DIR/spec/spec.yaml: do not create or modify any other file — including $WORK_DIR/requirements/REQUIREMENTS.md or any implementation code."
    depends_on:
      - analyze-requirements
      - kirin-env-check
    max_retries: 1
    on_exhaust: exit
# kirin-adapt: setup-op-package：相对 op-develop：由用模板 build.sh 按昇腾 lab 代际构建并跑 aclnn eager
#   示例（NPU 运行时，两段式链路；模板 build.sh 的 --soc 只认 ascend910b/910_93/950）改为按 kirin SoC
#   构建（经 ascendc-build-system 按 kirin 型号设置 soc/arch；构建命令约定见头部统一约定），把 vendor 包
#   装入所 source 的 mobile-station opp，并以「atc 把模板算子转出 .omc」作为工具链等价验收（替代 NPU eager
#   示例）。
  - id: setup-op-package
    task_type: normal
    executor: general-executor
    verifier: general-verifier
    title: Initialize and verify the operator package from the registry-invoke template (kirin soc build)
    goal:
      - "Initialize the complete operator package from the ascendc-registry-invoke-template skill into $WORK_DIR/op/, rename it to the target operator, and verify the kirin toolchain path: build with the kirin SoC under the mobile-station CANN, install the vendor package into the sourced opp, and prove atc can convert the template operator to an OMC (the toolchain-equivalent of op-develop's eager example verification, which is NPU-bound and not applicable on kirin)."
    approach:
      - "Derive the operator's three name forms from spec.yaml: OP_SNAKE = op.name, OP_PASCAL = PascalCase, OP_UPPER = UPPER_SNAKE; read SOC_VERSION from $WORK_DIR/kirin-env.json."
      - "Resolve the template through the ascendc-registry-invoke-template skill: TEMPLATE_DIR is the loaded skill's own directory; test -f $TEMPLATE_DIR/SKILL.md && test -d $TEMPLATE_DIR/references/add_example."
      - "Create a fresh package from the template: rm -rf $WORK_DIR/op && mkdir -p $WORK_DIR/op && cp -a $TEMPLATE_DIR/references/add_example/. $WORK_DIR/op/ && rm -rf $WORK_DIR/op/tests. Keep the template's ACLNN example as the baseline."
      - "Rename every file under $WORK_DIR/op/ whose name contains add_example to OP_SNAKE, then replace all sample name forms in file contents: add_example->OP_SNAKE, AddExample->OP_PASCAL, ADD_EXAMPLE->OP_UPPER; set the root CMake package_name to OP_PASCAL and update any ACLNN symbol references to aclnn<OP_PASCAL>."
      - "Build for the kirin SoC: source the mobile-station toolkit's set_env.sh (the one recorded in $WORK_DIR/kirin-env.json), then cd $WORK_DIR/op && bash build.sh --soc=<SOC_VERSION lowercase> (build command per the unified conventions in the workflow header). The template build.sh only accepts ascend910b/ascend910_93/ascend950 — if it rejects the kirin SoC, load the ascendc-build-system skill and set the soc/arch via its documented mechanism (arch and the project layout op_host/<arch>/ + op_kernel/<arch>/ are determined per kirin model from the toolchain mapping — the arch_code recorded in $WORK_DIR/kirin-env.json / npu-arch mapping; e.g. ASC_VALID_SOC_LIST mapping 'kirinx90'->'KirinX90'; do not hardcode an arch name not in the toolchain)."
      - "Install the vendor run package into the sourced opp: run the produced custom_opp_<host-arch>.run --install (append --force when the installer mis-reports 'undefined symbol: mmDladdr'; the package name carries the host arch, e.g. custom_opp_ubuntu_x86_64.run). After any re-install, the fresh op_proto/tiling/kernel files must appear under $ASCEND_OPP_PATH/vendors/<OP_PASCAL>/ (check timestamps)."
      - "Prove the atc route: load the tool-atc skill; use the ops-kirin-device-verify skill's assets (create_onnx.py / singleop_json example) to build a minimal add_example-derived ONNX or singleop description for the template's own add_example operator, then `atc --model=... --framework=5 --soc_version=${SOC_VERSION} --output=...` (or --singleop) and require an .omc output with no EZ3003/E90003/E10032 — this proves the vendor proto loads and the kirin toolchain is operational for this package."
    acceptance:
      - "$WORK_DIR/op/ contains the package skeleton: test -d $WORK_DIR/op/op_host && test -d $WORK_DIR/op/op_kernel && test -d $WORK_DIR/op/op_graph && test -f $WORK_DIR/op/build.sh && test -f $WORK_DIR/op/CMakeLists.txt && test -f $WORK_DIR/op/README.md."
      - "No sample-name residue: ! grep -RniE 'add_example|AddExample|ADD_EXAMPLE|addExample' $WORK_DIR/op/ (except under the tests/ directory the task removed)."
      - "Kirin build succeeds: cd $WORK_DIR/op && bash build.sh --soc=<soc> exits 0 and the vendor run package exists under $WORK_DIR/op/build/."
      - "Vendor installed: test -d $ASCEND_OPP_PATH/vendors/$OP_PASCAL and the op_proto/tiling/kernel dirs carry fresh files (timestamp no older than the build)."
      - "atc route proven: an OMC file was produced for the template operator under $WORK_DIR/op/verify-atc/ and the atc log contains none of EZ3003/E90003/E10032."
    out_of_scope:
      - "Only create or modify files under $WORK_DIR/op/ and the toolchain-installed vendor under the sourced opp."
      - "Do not run any NPU device test; the kirin execution carriers are simulator and kirin-device, both exercised in later stages."
      - "Keep the template's operator semantics unchanged (input count and kernel math change in later tasks)."
    depends_on:
      - generate-spec
      - kirin-env-check
    max_retries: 2
    on_exhaust: exit
