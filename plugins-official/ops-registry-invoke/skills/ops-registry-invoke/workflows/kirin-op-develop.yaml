# kirin-op-develop：op-develop.yaml 的 kirin 平台变体（工作流定义文件）。以 op-develop.yaml 为唯一参考基线，
# 针对麒麟端侧平台（Kirin NPU）的执行/验证载体为：麒麟设备验证（ops-kirin-device-verify）为主，
# camodel simulator（sim 直调）为辅（麒麟设备异常时降级处理的选项），删除昇腾特有链路、补充 kirin 收口节点，
# 并保留手写 l0op op_api 交付、check_runtime_result.py determinism 门禁、sim 确定性指示性声明、
# ASSUMPTIONS.md 汇总 TODO/假设等严谨点。全部改动点均带 # kirin-adapt 注释，说明原因与目的。
#
# 目标平台：麒麟端侧（Kirin NPU，KirinX90/Kirin9030 等端侧型号；arch 与 UB 规格按 kirin 型号经工具链确定，
# 不在此写死，见 kirin-env-check）。算子的开发与验证以「麒麟设备验证（ops-kirin-device-verify）为主，
# CANN Simulator（camodel 仿真，sim 直调）为辅（麒麟设备异常时降级处理的选项）」。
# 工具链要求 mobile-station 完整形态 CANN 包（opp/built-in 下 op_graph/op_proto、op_impl、framework 齐备）。
# 麒麟设备验证为默认执行载体；sim 直调仅作为辅助载体，用于 kernel 开发白盒快迭代与下述降级场景：
#   情形 A｜麒麟设备离线：验证整体降级为仿真，仿真作为替代载体。
#   情形 B｜单用例在麒麟设备上执行过程异常：仅该用例降级为仿真，仿真作为替代载体。
#   情形 C｜单用例在麒麟设备上验证结果失败：仅该用例先用仿真复现/定位，修复后重新进行麒麟设备验证，
#     最终判定以麒麟设备验证结果为准；其余用例不受影响。
# 降级按用例进行，不允许因个别用例异常而把整轮验证切到仿真。两种载体皆不可达时显式 N/A。
# 仿真 tick 上限（统一定义）：camodel 单用例 tick 硬上限，当前值 100M（暂定值，获取方式待确认——CANN 包
# 未暴露该参数：config.json 的 max_sim_time、digitalNpu.json 等修改实测不生效；该值来自实测观察
# 「total tick: 100000001 / stopped by exceed max sim time」）。其余位置一律引用本定义，不再重复写死数值。
# 约束范围：该上限仅作用**仿真载体执行**的用例，麒麟设备验证的用例不受此约束。仅当用例已降级到仿真
# （情形 A/B/C）且超过此上限（预估超限或运行中触顶识别均可）时暂时跳过该用例，不判定通过或失败，
# 并显式记录「用例名 + 跳过原因（降级到仿真 + 超过仿真 tick 上限）」。
#
# 统一约定（其余位置一律引用本约定，不重复写死具体值）：
#   - sim 直调运行约定：ASCEND_RUN_MODE=sim；LD_LIBRARY_PATH 顺序 simulator 目录在包 lib64 前（否则 100039）；
#     需要时 GLIBCXX_3.4.32 经 LD_PRELOAD 就绪。事实源：ascendc-kirin-env-check（仿真线）。
#   - 构建命令约定：cd $WORK_DIR/op && bash build.sh --soc=<SOC_VERSION 小写（来自 kirin-env.json）>，
#     在所 source 的 mobile-station CANN 下执行；示例 soc 为 kirinx90，实际以 kirin-env.json 的 soc_version 为准。
#   - sim 上 aclnn 两段式受限错误码 361001（事实源：ascendc-kirin-env-check 仿真线）。
#   - SIM_MAX_ELEMS：sim 载体元素数上限，3_000_000（保守下取，由 camodel 100M tick 上限 ≈4.67M 元素（fp32）
#     推得，见上方仿真 tick 上限统一定义）；元素数超过该值的用例 sim 不可行（仅设备运行），正文一律引用本定义。
#
# 与 op-develop.yaml 相比的节点/子图改动总览：
#   [修改节点]（适配 kirin 执行载体、工程树与验证证据源）
#     detect-npu-arch -> kirin-env-check：asys info -r hardware 为昇腾 NPU 查询命令，本地开发机（宿主机）上
#       不可用（无昇腾驱动）；改用 ascendc-kirin-env-check + check_kirin_env.sh 输出 kirin-env.json
#       （SoC/架构/双能力线/设备链路）。
#     blackbox-gen：用例生成保留 ascendc-st-design，去向改为麒麟设备验证为主、sim 辅助；并按「覆盖全面 +
#       集合最小化」构造（合并等价形状/参数组合，压缩数量不牺牲覆盖面）；生成后经 merge_cases.py 离线切分为
#       可执行套件 cases/blackbox_l0.csv / blackbox_l1.csv / blackbox_l2_neg.csv（*_oversized.csv 侧表不进入），
#       记录各套件数据行数（供下游核对与回归基线使用）。
#     blackbox-determinism：麒麟设备载体每用例重复 10 次 bit 比对；降级到仿真载体时每用例只执行 1 次
#       （仿真耗时较长）；check_runtime_result.py determinism 门禁 + 「sim 上确定性为指示性证据」显式声明。
#     analyze-requirements / generate-spec：运行时证据换 kirin-env.json；spec 芯片换 kirin SoC。
#     setup-op-package：--soc 构建 + atc->OMC 转换证明替代 NPU eager 示例（模板 build.sh 只认昇腾代际）。
#     write-design-validation：numpy golden；性能目标换 camodel tick 基线。
#     write-design-devview-*/write-design-kernel：工程树 arch 按 kirin 型号确定（不在此写死）。
#     update-opdef / write-tiling-ut / implement-tiling：arch 按 kirin 型号确定 + --soc 构建。
#     gen-golden：numpy golden + gen_cases.py，供麒麟设备验证比对为主、sim 辅助比对。
#     generate-kernel-subgraph / kernel-impl：子图验证以麒麟设备验证为主、sim harness 为辅（开发辅助白盒快迭代），
#       每分支 kernel 的正式验证证据以麒麟设备验证收口（设备离线时 sim 结果作降级证据）；共享框架分支合并 bringup。
#     doc-gen / fix-findings / docs-consistency-check：验证证据源以麒麟设备验证为主、sim 辅助（降级）。
#     aclnn-impl-smoke：回归载体修正——**host 契约验证为收口层（closing layer）**（构建 + 符号 + 头文件字节级
#       校验，默认可落地）；camodel sim 直调为尽力而为层（可选增强，aclnn 两段式在 sim 上受限，错误码见统一约定）；
#       设备侧以 atc->OMC 单算子路线为操作等价承接（每覆盖格用例的 atc 转换由 blackbox-device-verify 证明）；
#       **设备无 host aclnn API 执行路线**（ops-kirin-device-verify 8 步为 atc->OMC->HAP->推理）。
#     prepare-performance-optimization / performance-optimization：camodel tick 基线 + kirin 子图。
#   [删除节点]（kirin 无等价链路，逐条原因见对应 # kirin-adapt 注释；删除均为显式记录，不静默跳过）
#     setup-ops-test-kit / verify-ops-test-kit / setup-xpu-server：TTK kernel/aclnn 跑昇腾 NPU。
#     geir-testcase-gen / geir-impl-smoke / geir-run-100pct：GEIR 图模式为昇腾 A5 路由，kirin 用 atc->OMC。
#     torch-impl-smoke：端侧无 PyTorch NPU 支持；tensorflow-impl-smoke：无 TF 路线。
#     blackbox-smoke / blackbox-run-l0/l1/l2-100pct（kirin 变体名 st-sim-smoke / st-sim-l0/l1/l2-100pct）：
#       仿真全量套件节点删除——套件切分职责并入 blackbox-gen；情形 A/B/C 降级执行并入 blackbox-device-verify
#       （以覆盖格最小集跑 sim，不再单独跑 sim 全量套件）；仿真 tick 上限跳过规则保留（用例名 + 跳过原因，
#       不判定通过或失败）。
#   [新增节点]
#     setup-sim-harness：构建 camodel sim 直调 harness（run_sim.sh + <op>_sim.cpp + --perf 模式），作为降级
#       底座与开发辅助——供 kernel bringup 子图、blackbox-device-verify（情形 A/B/C 降级执行）与性能 tick 基线
#       消费，消除 harness 构建时序断链。
#     blackbox-device-verify：麒麟设备验证**主验证节点**。用**覆盖全面 + 集合最小化**的用例集合：对 spec dtype
#       矩阵 × tilingKey × shape 形态类（大/小尾/rank-0/非连续/广播）做等价类覆盖，从 blackbox-gen 产出的最小化
#       套件中经集合覆盖算法选最小子集，证明每格至少 1 条而总量最小；每项经 ops-kirin-device-verify 8 步麒麟
#       设备验证比对，承接 setup-op-package 的模板示例（atc->OMC 单算子推理）与 aclnn-impl-smoke 的 host 契约
#       延后项（每覆盖格用例的 atc 转换），并产出 ASSUMPTIONS.md 汇总全流程 TODO/假设；集成三种降级路径并承接
#       仿真全量套件（基线 blackbox-smoke / blackbox-run-l0/l1/l2-100pct）的降级执行职责：情形 A（设备离线，
#       整体降级 sim，以覆盖格最小集经 sim harness 执行，不再单独跑 sim 全量套件）/ 情形 B（单用例执行异常，
#       逐用例降级 sim）/ 情形 C（单用例失败，先 sim 复现定位、修复后重新设备验证，最终以设备结果为准）。
#   [子图] design-sub-graph.yaml（不变，运行时生成）、kernel-sub-graph.yaml（运行时生成，验证以麒麟设备验证
#     为主、sim 辅助，供开发辅助与降级场景使用）、kirin-perf-optimize.yaml（sim 性能决策，运行时生成）。
#   [性能] 走 camodel tick 基线摸底（total tick / cycles-per-element），非麒麟设备延迟/吞吐；cannsim 不支持
#     Kirin。仿真载体受单用例仿真 tick 上限约束（见上方统一定义），超限用例跳过并显式记录。
#   [验证载体优先级]（五条）：
#     1) 载体优先级为麒麟设备验证为主、camodel 仿真为辅（麒麟设备异常时降级处理的选项）；验证链为
#       blackbox-gen -> kernel-impl -> aclnn-impl-smoke -> blackbox-device-verify（主）-> blackbox-determinism -> doc-gen；
#       blackbox-smoke / blackbox-run-l0/l1/l2-100pct（st-sim-*）节点删除（套件切分并入 blackbox-gen、
#       降级执行并入 blackbox-device-verify）。
#     2) 仿真 tick 上限（见上方统一定义）：仅降级到仿真（情形 A/B/C）且超限的用例暂时跳过并显式记录，
#       不判定通过或失败；该上限仅作用仿真载体执行的用例，麒麟设备验证用例不受影响。
#     3) ST 用例集按「覆盖全面 + 集合最小化」构造（合并等价形状/参数组合，压缩数量不牺牲覆盖面），
#       写入 blackbox-gen 与 blackbox-device-verify 的用例选择逻辑。
#     4) blackbox-determinism：麒麟设备载体每用例重复 10 次；降级到仿真载体时每用例只执行 1 次（仿真耗时较长）。
#     5) 载体强制顺序（kernel 子图 bringup/batch/instantiate 与 blackbox 批次通用）：device_online 时以麒麟设备
#       验证为主载体，精度 PASS 必须出自设备 8 步验证，sim 不作为在线时的验收证据；sim 仅限编译/接线级 sanity
#       （run_sim.sh --check）与情形 A/B/C 降级（须记录降级原因）；sim 调试有终止条件——命中 sim 固有局限
#       （int8 B 通路 L0B/MMAD 限制、tick 上限、dav-l300 Fixpipe NZ->ND 断言）立即停止并切设备；
#       验收门禁只认设备 8 步结果，sim bitwise-PASS 仅作接线 sanity。
#
# 依赖 skill（均真实存在于 cannbot 仓或 cannbot-skills 仓）：
#   native（cannbot 仓）：ops-requirement-analysis、design-template、ascendc-build-system、st-verifier、
#     tiling-ut-harness、tiling-exception-coverage、workflow-orchestrator（blackbox-tester 的用例切分脚本
#     merge_cases.py 被 blackbox-gen 复用为离线 CSV 切分工具，不作为本工作流声明的依赖 skill 加载）。
#   external（cannbot-skills/；tool-atc / tool-hdc 位于 cannbot-skills/tools/）：ascendc-kirin-env-check、
#     ops-kirin-device-verify、tool-atc、tool-hdc、npu-arch、ops-spec-gen、
#     ops-design-paradigms、ascendc-st-design、ascendc-code-review、ascendc-docs-gen、
#     ascendc-registry-invoke-template、ascendc-whitebox-design、ascendc-runtime-debug、ascendc-precision-debug。
#   perf：cannbot 仓 plugins-official/ops-perf-optimize（技能 ops-perf-optimize-workflow，kirin 适配见
#     prepare-performance-optimization 的 TODO）。
#   ops-impl-review：与 op-develop.yaml 引用一致（四脚本门禁；脚本路径以安装后实际为准）。
#   skill/agent 引用兜底说明：develop-hand-written-aclnn、ops-impl-review 技能，以及 designer / whitebox-designer /
#     st-verifier 等角色 agent 可能未在磁盘落地——此类引用按「执行其文档化步骤，由执行器按文档 fallback 执行」
#     处理（不臆造脚本存在）；实际脚本路径在安装后 / 运行时核对。
workflow: kirin-op-develop
max_parallel: 10
system_prompt: "If needed, dispatch multi subagents to explore code under $WORK_DIR/requirements/references(if exists) relevant to this task, as development reference. Target platform is kirin end-side (Kirin NPU); the primary verification carrier is the kirin-device verification (ops-kirin-device-verify), and the camodel simulator (sim-direct) is the auxiliary/degradation carrier only (cases A: device offline whole-round, B: per-case execution anomaly, C: per-case failure reproduce/localize — never a whole-round sim switch for isolated anomalies); the ttk aclnn/kernel, torch_npu, TF, GEIR and other Ascend-NPU-dependent paths are forbidden."
nodes:
  - id: knowledge-preflight
    task_type: normal
    executor: general-executor
    verifier: general-verifier
    title: Set up and query the cannbot-knowledge knowledge base
    goal:
      - "Set up the cannbot-knowledge knowledge base at $WORK_DIR/cannbot-knowledge and query it for knowledge relevant to the operator in the task prompt; write the distilled findings to $WORK_DIR/cannbot-knowledge/artifacts/preflight.md."
    approach:
      - "The knowledge root is $WORK_DIR/cannbot-knowledge. If it has no .git subdirectory, run `git clone --depth 1 https://gitcode.com/cann/cannbot-knowledge.git $WORK_DIR/cannbot-knowledge`; otherwise skip the clone."
      - "If $WORK_DIR/cannbot-knowledge/artifacts/indexes/knowledge.sqlite3 is missing, run `python3 -m pip install -r $WORK_DIR/cannbot-knowledge/requirements.txt`, `bash $WORK_DIR/cannbot-knowledge/get_resources.sh`, and `python3 $WORK_DIR/cannbot-knowledge/.agents/skills/knowledge-query/scripts/knowledge_index.py --knowledge-root $WORK_DIR/cannbot-knowledge build`; if the index already exists, skip all three."
      - "Run `python3 $WORK_DIR/cannbot-knowledge/.agents/skills/knowledge-query/scripts/knowledge_query.py --knowledge-root $WORK_DIR/cannbot-knowledge discover` once, then query for the operator name, its math semantics, and the key CANN/Ascend C APIs mentioned in the task prompt."
      - "For each promising hit, read the full card at the returned path; follow card resource/sources links only when the card is insufficient."
      - "Write $WORK_DIR/cannbot-knowledge/artifacts/preflight.md: per topic, the distilled facts (API contracts, platform limits, tiling/UB constraints, known pitfalls), each citing its source card path. Record zero-hit queries explicitly as 'no coverage' — do not treat them as errors."
    acceptance:
      - "$WORK_DIR/cannbot-knowledge/artifacts/preflight.md exists and is non-empty."
      - "Every fact in it cites a card path under $WORK_DIR/cannbot-knowledge; queries with no hits are listed explicitly."
    out_of_scope:
      - "The knowledge repository is read-only except for its own setup artifacts (indexes, downloaded resources); do not modify any knowledge card."
      - "Do not create or modify any file outside $WORK_DIR/cannbot-knowledge/."
    depends_on: []
    max_retries: 1
    on_exhaust: continue
# kirin-adapt: kirin-env-check：相对 op-develop：detect-npu-arch 依赖 `asys info -r hardware`（昇腾 NPU
#   查询命令，本地开发机（宿主机）上不可用（无昇腾驱动；实测报错以实际执行为准）→ 改用 ascendc-kirin-env-check，
#   输出 kirin-env.json（记录 SoC/架构/双能力线/设备链路）；下游消费方 analyze-requirements 与
#   prepare-performance-optimization 同步改为读 kirin-env.json。
  - id: kirin-env-check
    task_type: normal
    executor: general-executor
    verifier: general-verifier
    title: Detect the kirin target platform, toolchain and device link via ascendc-kirin-env-check
    goal:
      - "Run the ascendc-kirin-env-check skill to establish the three capability lines and record them in $WORK_DIR/kirin-env.json: (1) development prerequisites, (2) CANN package dual capability — atc->omc conversion line and camodel simulator sim-direct line (independently assessed), (3) hdc device connection and chip model. Also record the target SoC version (e.g. KirinX90/Kirin9030), device serial, ASCEND_HOME_PATH, and GLIBCXX readiness. device_online determines the primary/degradation carrier for the later verification stages: device online -> kirin-device verification is the primary carrier; device offline -> whole-round degradation to the simulator (case A)."
    approach:
      - "Load the ascendc-kirin-env-check skill first (mandatory); its scripts/check_kirin_env.sh is the execution authority: run `bash <skill>/scripts/check_kirin_env.sh` (full, including the device segment). If the device segment fails (offline), rerun with `--skip-device` and record the offline state — do not treat device offline as a blocker at this stage; the kirin-device stage will re-check or degrade."
      - "Load the tool-hdc skill for hdc connection details (hdc list targets; chip model via `hdc shell hidumper -c base`), and the npu-arch skill for the SoC->arch mapping (the mapping is per kirin model and is captured from the toolchain check as arch_code into $WORK_DIR/kirin-env.json — arch/UB specs are not fixed here)."
      - "Confirm the CANN package is the mobile-station full package (opp/built-in has op_graph/op_proto, op_impl and framework) — a trimmed devkit makes atc FE fail with E20002; record the conclusion and the ASCEND_HOME_PATH of the sourced set_env.sh."
      - "Confirm the simulator line: x86_64-linux/simulator/{SoC}/lib/libruntime_camodel.so present, plus the camodel libascendcl shell (~16KB) and GLIBCXX_3.4.32 readiness; record whether sim-direct is usable and the required LD_LIBRARY_PATH ordering (simulator dir before package lib64, else 100039)."
      - "Write $WORK_DIR/kirin-env.json as JSON: {platform: kirin, soc_version, arch_code (the kirin model's chip/arch code captured from the toolchain check, not fixed), device_sn (or null), ascend_home_path, atc_capable, sim_capable, glibcxx_ready, device_online}. Decide autonomously from the check outputs; never guess the SoC — if the device/chip model is unavailable, ask the user for the SoC version before proceeding."
    acceptance:
      - "$WORK_DIR/kirin-env.json exists and parses as JSON with platform: kirin and concrete soc_version; the value matches the toolchain check, not a guess."
      - "The check script(s) actually ran and their outputs are preserved under $WORK_DIR/kirin-env-check/ (full log per capability line, PASS/FAIL each)."
      - "atc_capable and sim_capable are each decided independently with evidence; if sim_capable is false or GLIBCXX_3.4.32 is missing, the record states the exact blocker and the prescribed fix (from ascendc-kirin-env-check), and the workflow must not start the sim-dependent stages until resolved or explicitly accepted by the user."
      - "The SoC version used across all later tasks equals kirin-env.json's soc_version."
    out_of_scope:
      - "Do not install, upgrade, or reconfigure anything; only check and record. Do not run npu-smi (the Ascend NPU status query command) on kirin — the end-side device status is queried via hdc (hdc list targets) instead."
      - "Do not create or modify any file outside $WORK_DIR/kirin-env.json and $WORK_DIR/kirin-env-check/."
    depends_on: []
    max_retries: 2
    on_exhaust: exit
  - id: create-requirements-dir
    task_type: normal
    executor: general-executor
    verifier: general-verifier
    title: Create the requirements analysis directory
    goal:
      - Create the requirements analysis directory at $WORK_DIR/requirements/.
    approach:
      - Create $WORK_DIR/ if it does not already exist.
      - Create $WORK_DIR/requirements/ under it.
    acceptance:
      - $WORK_DIR/requirements/ exists and is a directory.
    out_of_scope:
      - Do not create or modify any file other than the $WORK_DIR/requirements/ directory.
    depends_on: []
    max_retries: 2
    on_exhaust: exit
  - id: setup-reference-repos
    task_type: normal
    executor: general-executor
