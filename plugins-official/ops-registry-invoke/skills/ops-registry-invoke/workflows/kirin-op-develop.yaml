#   集成三种降级路径（承接仿真全量套件 blackbox-smoke / blackbox-run-l0/l1/l2-100pct 的降级执行职责）：
#     情形 A（设备离线，整体降级 sim——以覆盖格最小集经 sim harness 执行作为替代载体，不再单独跑 sim 全量套件）
#     / 情形 B（单用例在设备上执行过程异常，仅该用例降级 sim）/ 情形 C（单用例在设备上验证结果失败，仅该
#     用例先用 sim 复现定位、修复后重新进行设备验证，最终以设备验证结果为准）；降级按用例进行，不允许因个别
#     用例异常切整轮。
#   仿真 tick 上限（见头部统一定义）仅作用 sim 载体：降级到 sim 的用例超限时跳过并显式记录（用例名 + 跳过
#   原因），覆盖格以同格后备候选回填，无候选则记录 degrade_note，绝不静默丢弃。
  - id: blackbox-device-verify
    task_type: normal
    executor: general-executor
    verifier: general-verifier
    title: Kirin-device verification of a coverage-complete minimal case set via ops-kirin-device-verify (primary verification)
    goal:
      - "Execute the **primary verification** of the operator on a kirin device via the ops-kirin-device-verify skill (8 steps: compile vendor -> install -> generate cases -> atc->OMC -> HAP prepare -> hdc push -> start inference -> recv + compare), covering a **coverage-complete minimal case set**: the selected cases fill every cell of the spec coverage matrix (dtype × tilingKey × shape class: large / small-tail / rank-0 / non-contiguous / broadcast when supported, plus representative negative semantics) with at least one case each, while keeping the total count minimal (greedy set-cover over the minimized suite produced by blackbox-gen). The kirin-device verdict (PASS/FAIL per case, bitwise/tolerance against golden) is the **primary verification evidence**; sim only acts as the degradation carrier (cases A/B/C)."
      - "Integrate the three degradation paths: case A (device offline — whole-round degradation to sim as replacement carrier), case B (per-case execution anomaly on device — that case only degrades to sim), case C (per-case verification failure on device — reproduce/localize on sim first, fix, then re-verify on device; the device result is final for that case). No whole-round switch to sim due to isolated anomalies."
      - "This node is the closing aggregator for deferred kirin-device items: the setup-op-package template example (atc->OMC singleop inference) and the aclnn-impl-smoke host-contract close (each coverage cell's atc conversion) land here, and it produces $WORK_DIR/ASSUMPTIONS.md aggregating every TODO/假设 item across the workflow."
    approach:
      - "Load the ops-kirin-device-verify skill first (mandatory — the single execution authority for the 8-step device flow); atc/hdc command details come from tool-atc / tool-hdc inside the skill; the skill itself degrades to direct-doc fallback when those skills are absent."
      - "Re-check the device link: run the skill's check_onboard_env.sh (--skip-device first, then the full run). If the device segment fails (offline), **case A**: record the whole-round degradation, run the selected coverage-complete minimal set through the simulator sim-direct harness instead (the whole-round replacement; the former sim full-suite nodes are deleted, so the sim evidence under case A is the minimal set, not a separate full-suite run), and report to the user — do not fail the workflow. Under case A/B/C, a degraded-to-sim selected case that exceeds the sim-carrier tick cap defined in the workflow header is skipped (case name + reason) and its coverage cell is **back-filled** by another minimal-set candidate from the same cell (recorded as a backup selection) — if no candidate fits, the cell is recorded as a degraded coverage gap (degrade_note), never silently dropped."
      - "Select the coverage-complete minimal set: build the coverage matrix from $WORK_DIR/spec/spec.yaml (dtype × tilingKey from $WORK_DIR/design/TilingKey.md / BranchCatalog.md × shape classes) and solve a greedy set-cover over the minimized L0/L1/L2 suites produced by blackbox-gen under $WORK_DIR/op/tests/blackbox/cases/ (adding l1/l2 representatives only where a cell needs a negative), so every cell has at least one covering case and the selected set is as small as possible. Record in the report the per-cell mapping (cell -> covering case_id) proving completeness, and the minimization (selected count vs suite row count). Do not default to 'one large + one small per dtype'."
      - "For each selected case: rebuild and re-install the vendor if code changed since the last install (rm -rf build then full rebuild per the kirin discipline — the installer skips existing vendor dirs), generate input bins + numpy golden + an ONNX or singleop description strictly per the spec (opset=11 / ir_version=6; fp32/bf16 require --precision_mode=must_keep_origin_dtype), atc convert to OMC with soc_version from $WORK_DIR/kirin-env.json, HAP install (bundle name verified via hdc shell bm dump -a), hdc file send (case-prefixed names), aa force-stop + aa start with --ps path/omPath, recv output0.bin, compare with golden (bitwise for bool/int, rtol/atol for float via compare_output.py). Per-case degradation: **case B** — a case that anomalously fails to execute on device (runtime crash/hang) degrades to sim for that case only, with the degrade recorded; **case C** — a case that runs but FAILs verification first goes to sim to reproduce/localize, is fixed, then is re-verified on device, with the device result as final. Degraded-to-sim cases on the sim carrier are subject to the sim-carrier tick cap defined in the workflow header: an over-cap case is skipped (not pass/fail) and recorded with case name + reason. Run the deferred items (the setup-op-package template example and the aclnn-impl-smoke host-contract close — each coverage cell's atc->OMC singleop conversion) through the same 8-step flow and record them in the report."
      - "Assumptions aggregation: scan every node of this workflow for TODO/假设 markers and write $WORK_DIR/ASSUMPTIONS.md with one row per item (node id, statement, current status, carrier to close it) — the closed-loop carrier for 'facts not yet verified are marked TODO/假设'."
    acceptance:
      - "The device-verification report exists: $WORK_DIR/op/tests/blackbox/device-verify/KIRIN_DEVICE_VERIFY_REPORT.md records per selected case: case_id, dtype, shape, the coverage cells it fills, route (st_real for on-device, st_cpp/sim for degraded; the route taxonomy follows the ascendc-st-design case route column), degradation reason (case B/C or offline A), status (PASS/FAIL/blocked_by_device_runtime/skipped-over-cap-tick), compare mode and tolerance used."
      - "Coverage complete: the coverage matrix in the report shows every cell (dtype × tilingKey × shape class) filled by at least one selected case_id, with the selected count recorded and visibly smaller than the suite row count (minimal-set proof); this replaces the 'per-dtype representative' requirement."
      - "Degradation paths complete: every degraded case names its trigger (case A whole-round / case B execution anomaly / case C failure-then-reverify) and no whole-round switch to sim happened due to isolated anomalies; an over-cap degraded-sim case is recorded as skipped with case name + reason, never as pass/fail, and its coverage cell is either back-filled by a backup selection from the same cell or recorded as a degraded coverage gap (degrade_note) — never silently dropped."
      - "Deferred items closed: the template example and the aclnn-impl-smoke host-contract close (per-cell atc->OMC singleop conversion) each appear in the report with a status (PASS on-device / degraded-sim / blocked_with_note)."
      - "test -s $WORK_DIR/ASSUMPTIONS.md exits 0 and it covers the workflow's TODO/假设 items (each with node id and status); no TODO/假设 item is silently dropped."
      - "Each on-device FAIL that is also red in the whitebox sim batches or the degraded minimal set ($WORK_DIR/op/tests/sim_verify/ logs) is a kernel defect — attribute it and report; a device-runtime-rejected case is recorded as blocked_by_device_runtime with its degrade note, not as an operator failure."
      - "Frozen assets unchanged: case CSVs, $WORK_DIR/golden.py, tolerances, design docs."
    out_of_scope:
      - "Write only under $WORK_DIR/op/tests/blackbox/device-verify/ and $WORK_DIR/ASSUMPTIONS.md; do not modify package sources (kernel/host fixes belong to the sim/whitebox gates)."
      - "Do not execute destructive device operations (uninstall HAP) without user confirmation."
      - "Rebuilding and re-installing the vendor into $ASCEND_OPP_PATH/vendors/ when code changed is permitted toolchain behavior (not a file write under out_of_scope); the operator sources themselves stay unmodified."
    depends_on:
      - blackbox-gen
      - kernel-impl
      - aclnn-impl-smoke
      - setup-op-package
      - gen-golden
      - setup-sim-harness
    max_retries: 2
    on_exhaust: continue
# kirin-adapt: doc-gen：相对 op-develop：由引用昇腾 NPU 测试报告作为文档证据，改为验证结果证据以麒麟设备
#   验证为主、sim 为辅助（tests/ 下 blackbox/device-verify/ 报告为主、sim_verify/ 为降级补充），文档结构与
#   校验器不变；依赖 aclnn-impl-smoke（手写公共头是文档校验的实质输入）。
  - id: doc-gen
    task_type: normal
    executor: general-executor
    verifier: general-verifier
    title: Generate the operator docs under $WORK_DIR/docs/ (aclnn API doc + linked README) and pass the paired-docs validator
    goal:
      - "Execute the ascendc-docs-gen skill for the finished operator package at $WORK_DIR/op: generate the paired public docs — the aclnn API interface doc $WORK_DIR/op/docs/aclnn{OperatorName}.md first, then $WORK_DIR/op/README.md linking it (README delivery mode fixed to full) — and expose both under $WORK_DIR/docs/."
      - "Completion gate: the deterministic paired-docs validator passes — the ascendc-docs-gen skill's scripts/validate_operator_docs.py --operator-dir $WORK_DIR/op exits 0 with STATUS: PASSED as its last output line."
    approach:
      - "Load the ascendc-docs-gen skill first (mandatory — it is the single execution authority for doc structure, evidence sourcing, community-template fetching, and the paired delivery order); run as agents/docs-writer.md."
      - "Workflow overlays on the agent/skill docs (where an overlay differs, the overlay wins): the operator root is $WORK_DIR/op (not operators/{OP}_package); the fact inputs are $WORK_DIR/spec/spec.yaml, $WORK_DIR/requirements/REQUIREMENTS.md, $WORK_DIR/design/*.md, the package sources under $WORK_DIR/op/, and the verification results under $WORK_DIR/op/tests/ (kirin-device evidence as primary, simulator evidence as degradation/auxiliary, not NPU reports)."
      - "The validator requires the docs inside the operator root: write $WORK_DIR/op/docs/aclnn{OperatorName}.md and overwrite the sample-derived $WORK_DIR/op/README.md. Once they validate, expose them at the workflow-level path: ln -sfn op/docs $WORK_DIR/docs."
      - "Iterate until green: on non-zero exit or a last line other than STATUS: PASSED, fix per the validator's ERROR list from verifiable facts and rerun."
    acceptance:
      - "OP_PASCAL=$(python3 -c \"import yaml; n=yaml.safe_load(open('$WORK_DIR/spec/spec.yaml'))['op']['name']; print(''.join(w.capitalize() for w in n.split('_')))\") ; test -s $WORK_DIR/op/docs/aclnn${OP_PASCAL}.md && test -s $WORK_DIR/op/README.md && test -s $WORK_DIR/docs/aclnn${OP_PASCAL}.md."
      - "Paired validation passes: the ascendc-docs-gen skill's scripts/validate_operator_docs.py --operator-dir $WORK_DIR/op exits 0 and its last line is exactly STATUS: PASSED."
      - "README links the doc it ships with: grep -qF \"docs/aclnn${OP_PASCAL}.md\" $WORK_DIR/op/README.md."
    out_of_scope:
      - "Write only $WORK_DIR/op/docs/, $WORK_DIR/op/README.md, and the $WORK_DIR/docs symlink; do not modify package sources, tests, $WORK_DIR/spec/, $WORK_DIR/design/, $WORK_DIR/requirements/."
    depends_on:
      - blackbox-determinism
      - blackbox-device-verify
      - aclnn-impl-smoke
    max_retries: 2
    on_exhaust: exit
  - id: code-review
    task_type: normal
    executor: general-executor
    verifier: general-verifier
    title: Review the finished operator code and record the findings under $WORK_DIR/code-review/
    goal:
      - "Review the finished operator sources under $WORK_DIR/op/ (op_host/ and op_graph/ as the Host side, op_kernel/ as the Kernel side, op_api/ as the aclnn layer) exactly per the scope defined in agents/code-reviewer.md — every applicable TOPK, security-redline (plus SIMT kernel redlines when SIMT code is present), and performance clause of the ascendc-code-review skill — and write the aggregated report to $WORK_DIR/code-review/CODE_REVIEW.md."
      - "Completion gate: the report exists and is internally consistent — the first-line status matches the FAIL finding count, every finding carries a unique ID with file:line evidence that resolves under $WORK_DIR/op/, and the four deterministic ops-impl-review script logs are saved under $WORK_DIR/code-review/checks/. This task is explicitly NOT gated on zero findings: findings are recorded for the downstream fix-findings task, never fixed here."
    approach:
      - "Run as agents/code-reviewer.md with this workflow's path overlay: the review inputs are $WORK_DIR/op/op_host/, $WORK_DIR/op/op_graph/, $WORK_DIR/op/op_kernel/, and $WORK_DIR/op/op_api/; the report lands at $WORK_DIR/code-review/CODE_REVIEW.md."
      - "Load the ascendc-code-review skill first (mandatory) and run its file-review workflow end to end (rule routing, per-clause review, line verification); every FAIL / SUSPICIOUS finding keeps its unique F / S ID, full file path, and line-verified line number."
      - "Load the ops-impl-review skill and run its four deterministic scripts over the package, saving each full output to $WORK_DIR/code-review/checks/<script_name>.log: scalar_mainchain_check, vf_reachability_check, and non3510_scaffold_check against $WORK_DIR/op, and workspace_consistency_check with the design root $WORK_DIR."
      - "Fold the deterministic results into the report: a script verdict of FAIL (exit 2) becomes at least one FAIL finding citing the offending location; INCONCLUSIVE (exit 1) is recorded as a SUSPICIOUS finding; PASS contributes no finding."
    acceptance:
      - "test -s $WORK_DIR/code-review/CODE_REVIEW.md exits 0, and the four deterministic logs exist non-empty."
      - "The report's first line is a single status that matches its body: it is ❌失败 exactly when at least one FAIL finding is listed (verifier cross-checks the finding list)."
      - "Every finding is re-checkable: each finding entry carries a unique ID, a severity, and a file path with line number that resolves under $WORK_DIR/op/."
    out_of_scope:
      - "Read-only over the code under review: do not modify anything under $WORK_DIR/op/, $WORK_DIR/design/, $WORK_DIR/spec/, the test suites, $WORK_DIR/golden.py, or tolerances."
      - "Do not fix any finding — remediation belongs to the downstream fix-findings task; write only under $WORK_DIR/code-review/ and run no builds."
    depends_on:
      - doc-gen
    max_retries: 2
    on_exhaust: exit
# kirin-adapt: fix-findings：相对 op-develop：由重跑昇腾门禁（TTK 黑盒 L0/L1/L2、GEIR、aclnn harness、
#   torch e2e）改为重跑 kirin 门禁：tiling UT、白盒全量批次与受影响的麒麟设备验证覆盖格用例。
#   载体优先级：回归以**麒麟设备验证为主**（受影响覆盖格用例必须重跑并通过；前序验证已降级到仿真即情形
#   A/B/C 时，受影响覆盖格用例经 sim harness 重跑——sim 全量套件不单独重跑）；sim 载体受仿真 tick 上限
#   （见头部统一定义）约束，超限用例跳过并显式记录。
  - id: fix-findings
    task_type: normal
    executor: general-executor
    verifier: general-verifier
    title: Fix every code-review finding and re-run the affected kirin test gates green
    goal:
      - "Close every FAIL finding recorded in $WORK_DIR/code-review/CODE_REVIEW.md by fixing the operator sources, then re-run every test gate the touched code feeds and leave it green; record each closure in $WORK_DIR/code-review/CODE_REVIEW_FIX.md."
      - "When the review recorded zero FAIL findings, change no code and only write the no-op record."
      - "Completion gate: every FAIL finding ID from CODE_REVIEW.md is quoted and closed in CODE_REVIEW_FIX.md, and the regression gates below hold — or the zero-findings no-op is recorded."
    approach:
      - "Inventory: read $WORK_DIR/code-review/CODE_REVIEW.md and its checks/ logs; list every FAIL finding. Zero FAIL findings -> write the no-op record and stop."
      - "Fix discipline: confirm each finding at its cited location before editing; fixes land only in $WORK_DIR/op/op_host/, $WORK_DIR/op/op_kernel/, $WORK_DIR/op/op_api/, $WORK_DIR/op/op_graph/, and $WORK_DIR/op/CMakeLists.txt; after any code change run cd $WORK_DIR/op && bash build.sh --soc=<soc> (exit 0, re-install vendor) before any test re-run."
      - "Relevant tests = every gate fed by the whitelisted sources. Re-run each with the exact command form its gate node already recorded in its own evidence files: Tiling UT (cd $WORK_DIR/op/tests/tiling && ./run.sh, 0 failed); whitebox branch full batches through the sim harness (development-aid batches, commands from the RECORD files); **kirin-device verification coverage-cell cases that the changed code feeds — rerun via ops-kirin-device-verify on the coverage cells the change affects (primary regression); when the previous verification degraded to sim (case A/B/C), the affected cells are re-run through the sim harness instead**; the aclnn host-contract checks if aclnn-impl-smoke ran a sim direct-call of the harness (commands from its RECORD), otherwise the atc->OMC per-cell close stays with blackbox-device-verify. Degraded-sim reruns honor the sim-carrier tick cap defined in the workflow header (over-cap -> skip with case name + reason)."
      - "Evidence: write $WORK_DIR/code-review/CODE_REVIEW_FIX.md quoting each FAIL finding verbatim with its fix and the per-gate rerun results."
    acceptance:
      - "test -s $WORK_DIR/code-review/CODE_REVIEW_FIX.md exits 0; every FAIL finding ID listed in CODE_REVIEW.md appears in CODE_REVIEW_FIX.md; the zero-findings case is explicitly recorded as a no-op."
      - "cd $WORK_DIR/op && bash build.sh --soc=<SOC_VERSION lowercase> (build command per the unified conventions in the workflow header) exits 0."
      - "Tiling UT green: cd $WORK_DIR/op/tests/tiling && ./run.sh exits 0 with no [  FAILED  ] line."
      - "kirin-device verification coverage-cell cases affected by the change re-PASS (or are recorded as blocked/degraded per the kirin-device verification discipline) — the primary regression; degraded (case A/B/C) reruns go through the sim harness with over-cap cases recorded as skips."
      - "Frozen assets unchanged: every case CSV, $WORK_DIR/golden.py, tolerances, the tiling UT oracle files, and $WORK_DIR/design/ docs are unmodified."
    out_of_scope:
      - "Modification whitelist: $WORK_DIR/op/op_host/, op_kernel/, op_graph/, CMakeLists.txt, plus the build/test artifacts the gates regenerate and CODE_REVIEW_FIX.md; everything else stays as-is."
      - "Never modify test cases, suite CSVs, golden.py, tolerances, or thresholds to force a gate green."
    depends_on:
      - code-review
    max_retries: 2
    on_exhaust: exit
# kirin-adapt: docs-consistency-check：以**麒麟设备验证为主**探测文档声明（能力用例 PASS、越界用例被干净
#   拒绝），camodel sim 直调 harness 为辅助载体（仅情形 A/B/C 降级时使用），文档按实测修正。
  - id: docs-consistency-check
    task_type: normal
    executor: general-executor
    verifier: general-verifier
    title: Docs consistency check - verify every checkable doc claim empirically against the final package; fix doc deltas only, never code
    goal:
      - "Empirically verify the public docs of the finished operator ($WORK_DIR/op/docs/aclnn{OperatorName}.md and $WORK_DIR/op/README.md, exposed via the $WORK_DIR/docs symlink) against the final post-fix package: extract every machine-checkable claim — supported dtypes, formats, shape/rank ranges, attribute defaults, empty-tensor stances, constraints, and error semantics — and drive each through the **kirin-device verification primarily** (ops-kirin-device-verify), with the simulator sim-direct harness as the degradation/auxiliary carrier (case A/B/C only)."
    approach:
      - "Load the ascendc-docs-gen skill first (mandatory — it is the authority for doc structure, evidence rules, and the closing validator gate)."
      - "Inventory the claims: read both doc files end to end and list every checkable claim with its file:line, cross-checked against $WORK_DIR/spec/spec.yaml; this list becomes REPORT.md's claim table."
      - "Build the probe cases under $WORK_DIR/docs-consistency/cases/ — a positive CSV and a negative CSV, projected from known-green $WORK_DIR/op/tests/blackbox/cases/blackbox_l0.csv rows where possible."
      - "Execute both CSVs through the primary carrier (kirin-device verification via ops-kirin-device-verify) or, under degradation cases A/B/C only, through the sim harness (input bins from gen_cases.py, compare with golden): a documented-capability case must PASS; an out-of-scope case must be cleanly rejected (device rejection / sim execution failure / validation error), not silently execute. Degraded-sim cases are subject to the sim-carrier tick cap defined in the workflow header (over-cap -> skip with case name + reason)."
      - "Mismatch rule (hard): any behavior deviating from the doc, in EITHER direction, is fixed by editing the DOC to match the observed behavior; the code is never touched in this task."
      - "Re-validate after every doc edit and once on the final tree: the ascendc-docs-gen skill's scripts/validate_operator_docs.py --operator-dir $WORK_DIR/op — exit 0, last line STATUS: PASSED."
      - "Evidence: $WORK_DIR/docs-consistency/REPORT.md holds the claim table (ID | doc claim with file:line | case name | observed result | verdict), the commands run, and the fix history."
    acceptance:
      - "test -s $WORK_DIR/docs-consistency/REPORT.md exits 0 and it holds the settled claim table; the zero-mismatch case is explicitly recorded as a no-op."
      - "Cases cover the claims: the positive and negative CSVs under $WORK_DIR/docs-consistency/cases/ are non-empty, and every executable claim maps to at least one case row."
      - "Full execution: each result CSV exists, is non-empty, and covers its cases CSV's full row set."
      - "Validator green on the final tree: validate_operator_docs.py --operator-dir $WORK_DIR/op exits 0 and its last line is exactly STATUS: PASSED."
      - "Frozen assets unchanged: $WORK_DIR/op package sources, $WORK_DIR/golden.py, $WORK_DIR/spec/spec.yaml, and every test suite under $WORK_DIR/op/tests/ are unmodified."
    out_of_scope:
      - "Write only under $WORK_DIR/docs-consistency/ and, for mismatch fixes, the two doc files $WORK_DIR/op/docs/aclnn{OperatorName}.md and $WORK_DIR/op/README.md."
      - "Never modify package sources, golden.py, tolerances, test suites, or design docs to make a doc claim true; a suspected code defect is attributed in REPORT.md and left to the kernel tasks."
    depends_on:
      - fix-findings
    max_retries: 2
    on_exhaust: exit
# kirin-adapt: prepare-performance-optimization：性能口径为 camodel tick 基线（total tick /
#   cycles-per-element），决策文件 kirin-perf-decision.json，子图 kirin-perf-optimize.yaml（单任务，读决策后
#   执行）。
#   TODO：ops-perf-optimize-workflow 技能为昇腾设计，其优化执行环节对 kirin 的适配（tick 基线作为目标度量）
#   尚需人工确认；本节点负责决策与基线采集，不臆造优化执行细节。
#   tick 基线与验证一致受 camodel 单用例仿真 tick 上限（见头部统一定义）约束：超限的关键形状无法采集基线，
#   显式记录（shape + 原因），不判定优化未达标。
  - id: prepare-performance-optimization
    task_type: normal
    executor: general-executor
    verifier: general-verifier
    title: Record the kirin performance decision and prepare its simulator baseline inputs
    goal:
      - "Read $WORK_DIR/requirements/REQUIREMENTS.md (consulting the original user prompt when available) before writing $WORK_DIR/.workflow/kirin-perf-decision.json with RUN or SKIP, the reason and evidence. On the kirin platform the performance measurement is a **camodel simulator baseline** (total tick / cycles-per-element) — not a kirin-device latency/throughput; the decision compares against the requirement's tick-based targets when present."
    approach:
      - "Read the parent workflow path from $WORK_DIR/.workflow/status.json and resolve it as PARENT_WORKFLOW."
      - "Read REQUIREMENTS.md and, when available, the original prompt from the file named by $USER_PROMPT. Retain its explicit opt-out and optimization options; conflicting explicit statements fail preparation; never resolve a conflict by defaulting to RUN."
      - "For RUN, collect the camodel tick baseline for the key shapes in design/Validation.md via the sim harness (the harness's extract_perf step over the camodel run); targets are tick-based per REQUIREMENTS §7.4. For all_targets_met, include per-target/case measurements, units (tick / cycles-per-element), thresholds and the loaded-binary identity."
      - "Atomically write $WORK_DIR/.workflow/kirin-perf-decision.json as a JSON object containing decision (RUN/SKIP), reason_code, reason, requirements_path, requirements_sha256 and evidence_paths. RUN additionally records request_path and provenance; SKIP omits request fields."
      - "Generate $WORK_DIR/.workflow/kirin-perf-optimize.yaml as a single normal task (kirin-perf-execute, executor=general-executor, verifier=general-verifier) that reads the decision file before invoking the optimization skill — the cannbot plugin `ops-perf-optimize` (plugins-official/ops-perf-optimize, skills/ops-perf-optimize-workflow) — and passes it $WORK_DIR, the decision file path and the camodel tick-baseline evidence; do not generate alternative subgraphs."
    acceptance:
      - "$WORK_DIR/.workflow/kirin-perf-decision.json is a valid JSON object with decision, reason_code, reason, requirements_path, requirements_sha256 and evidence_paths."
      - "RUN/optimization_needed also has request fields and a tick-baseline evidence file; SKIP/all_targets_met requires per-target tick measurements; SKIP/user_opt_out requires explicit intent evidence only."
      - "$WORK_DIR/.workflow/kirin-perf-optimize.yaml is contract-valid (single normal task), and the verifier approves the decision before the child is dispatched."
    out_of_scope:
