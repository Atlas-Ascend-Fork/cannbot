      - "Interface consistency with the actual OpDef: parameter names, order, optionality, defaults and output positions in the case set match $WORK_DIR/op/op_host/*_def.cpp (st-verifier cross-checks item by item)."
      - "$WORK_DIR/op/tests/blackbox/WORKFLOW_PROVENANCE.json exists, parses as JSON, and records both fact inputs, skill path + revision, conflict conclusions, main/side-table counts with effective thresholds (SIM_MAX_ELEMS), and each executable suite's data-row count."
      - "Executable suites exist non-empty and match their standard layers: test -s $WORK_DIR/op/tests/blackbox/cases/blackbox_l0.csv && test -s $WORK_DIR/op/tests/blackbox/cases/blackbox_l1.csv && test -s $WORK_DIR/op/tests/blackbox/cases/blackbox_l2_neg.csv; each suite's data-row count equals its standard layer CSV's data-row count (recorded in WORKFLOW_PROVENANCE.json)."
      - "st-verifier reviews per its 用例生成 dimensions and passes."
    out_of_scope:
      - "Write only under $WORK_DIR/op/tests/blackbox/; do not modify kernel/host sources, $WORK_DIR/golden.py, or design docs."
      - "Do not execute device tests or run any sim/NPU batch here; do not hand-write, sample, or post-edit CSV rows."
    depends_on:
      - update-opdef
      - setup-op-package
      - gen-golden
