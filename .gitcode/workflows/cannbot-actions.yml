name: PR-pipeline_cannbot

concurrency:
  max: 5
  exceed-action: QUEUE
  enable: true
  preemption:
    enable: true
    events: [mr_id]

on:
  workflow_dispatch:
  pull_request_comment:
    types: [created]
    branches: [ '*' ]
    comments: [ '^(?:\/)?compile*' ]
  pr_comment:
    types: [ created ]
    keyword: '^(?:\/)?compile*'

env:
  org_name: ${{ vars.ORG_NAME }}
  repo_name: ${{ atomgit.event.repository.name}}
  MERGE_ID: ${{ atomgit.event.pull_request.number }}
  TARGET_BRANCH: ${{ atomgit.base_ref }}
  SOURCE_BRANCH: ${{ atomgit.head_ref }}
  obs_path: "${{ env.org_name }}/${{ env.repo_name }}/ci/package/${{ env.MERGE_ID }}"
  # RDV 报告（md）本地暂存根目录：**按仓隔离**——runner 与 cannbot-skills 同机共享 /tmp，
  # 不隔离会让同名 PR 号在两仓之间互相覆盖、并被 upload 的 glob 一起上传
  ci_report_dir: "/tmp/cannbot-ci-reports/${{ env.repo_name }}/${{ env.MERGE_ID }}"
  online: ${{ vars.APPLY_LABEL }}

stages:
  stage1:
    name: PreBuild
    jobs:
      JOB_image:
        name: Test_image
        steps:
          - name: revise_image
            identifier: revise_image
            uses: cann/.gitcode/actions/revise-img@master
            with:
              repo_name: ${{ env.repo_name }}
              target_branch: ${{ env.TARGET_BRANCH }}
              comment: ${{ atomgit.event.comment.body }}
              token: ${{ secrets.TESTTOKEN }}
        runs-on: ['self-hosted', 'arch=x64', 'spec=small']
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/ubuntu20.04.05_x86:k8s_v1.1006
      JOB_pre:
        name: Test_PreBuild
        uses: cann/.gitcode/.gitcode/workflows/pre_action.yml@master
    pre:
    - type: auto
    fail-fast: true
  stage_ci_reuse:
    name: Prepare_checks
    jobs:
      JOB_ci_reuse_plan:
        name: Prepare_checks
        timeout-minutes: 5
        outputs:
          codecheck_mode: ${{ steps.rdv_ci_reuse_prepare.outputs.codecheck_mode }}
          ut_mode: ${{ steps.rdv_ci_reuse_prepare.outputs.ut_mode }}
          ut_suite_identity: ${{ steps.rdv_ci_reuse_prepare.outputs.ut_suite_identity }}
          ut_image_version: ${{ steps.rdv_ci_reuse_prepare.outputs.ut_image_version }}
          ut_runtime_identity: ${{ steps.rdv_ci_reuse_prepare.outputs.ut_runtime_identity }}
        steps:
          - name: rdv_ci_reuse_prepare
            identifier: rdv_ci_reuse_prepare
            env:
              BASE_URL: https://cannbot.cloud
              ADMIN_PASSWORD: ${{ secrets.ST_PLATFORM_ADMIN_PASSWORD }}
              PR_NUMBER: ${{ atomgit.event.pull_request.number }}
              CI_RUN_ID: ${{ atomgit.workflow_run_id }}
              CI_RUN_ATTEMPT: ${{ atomgit.run_attempt }}
              PR_HEAD_SHA: ${{ atomgit.event.pull_request.head.sha }}
              PR_BASE_SHA: ${{ atomgit.event.pull_request.base.sha }}
              PR_MERGE_SHA: ${{ atomgit.event.pull_request.merge_commit_sha }}
              CI_REUSE_CI_PATH: ${{ vars.CI_PATH }}
              CI_REUSE_PRECOMMIT_IMAGE: ${{ jobs.JOB_image.outputs.precommit }}
              CI_REUSE_CODECHECK_IMAGE: ${{ jobs.JOB_image.outputs.codecheck }}
              CI_REUSE_APPLY_LABEL: ${{ vars.APPLY_LABEL }}
              CI_REUSE_PRECOMMIT_BLOCK: ${{ vars.PRECOMMIT_BLOCK }}
              CI_REUSE_CODECHECK_STYLE_ENABLE: ${{ vars.CODECHECK_STYLE_ENABLE }}
              CI_REUSE_PR_ISSUE: ${{ vars.PR_ISSUE }}
              COMMENT_BODY: ${{ atomgit.event.comment.body }}
              UT_IMAGE_VERSION: ubuntu24.04_x86:lv6_v1.1094
              UT_GE_ST_RT2: ''
            run: |
              set -eu -o pipefail
              client=$(mktemp)
              client_sha=afbbf2de7d8373b135c2fbe2ee694b52e0eeac884488146a38a927f5675d1a8e
              curl --disable --fail --silent --show-error --max-time 30 --output "$client" "https://cannbot.cloud/api/pr-ut/client/$client_sha"
              printf '%s  %s\n' "$client_sha" "$client" | sha256sum --check --status
              exec python3 -I "$client" reuse --action prepare --gitcode-repo cann/cannbot --pr-number "$PR_NUMBER" --run-id "$CI_RUN_ID" --attempt "$CI_RUN_ATTEMPT"
        runs-on: [self-hosted, arch=x64, spec=small]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/ubuntu24.04_x86:lv6_v1.1094
    pre:
    - type: auto
    fail-fast: false
  stage2:
    name: CodeCheck
    jobs:
      JOB_codecheck_execute:
        name: CodeCheck_execute
        if: ${{ jobs.JOB_ci_reuse_plan.outputs.codecheck_mode != 'REUSE' }}
        uses: cann/.gitcode/.gitcode/workflows/codecheck_action.yml@master
        with:
          precommit_image_version: ${{ jobs.JOB_image.outputs.precommit }}
          codecheck_image_version: ${{ jobs.JOB_image.outputs.codecheck }}
      JOB_codecheck_fresh:
        name: CodeCheck_fresh
        if: ${{ jobs.JOB_ci_reuse_plan.outputs.codecheck_mode == 'REUSE' }}
        steps:
          - name: Checkout
            identifier: process_checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
              allow-unsafe-pr-checkout: true
          - name: download
            uses: obs-download
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              key: |
                ${{ env.obs_path }}/pr_filelist.txt
                ${{ env.obs_path }}/pr_filelist_mod.txt
                ${{ env.obs_path }}/update_file_detail.txt
              path: ${{ steps.process_checkout.outputs.path }}
          - name: check-pr
            identifier: check-pr
            uses: cann/.gitcode/actions/check-pr@master
            with:
              repo_name: ${{ env.repo_name }}
              workspace: ${{ steps.process_checkout.outputs.path }}
              target_branch: ${{ env.TARGET_BRANCH }}
              pr_number: ${{ atomgit.event.pull_request.number }}
              git_token: ${{ secrets.GIT_TOKEN }}
              pr_issue: ${{ vars.PR_ISSUE }}
        runs-on: ["self-hosted", "arch=x64", "spec=slim"]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/${{ jobs.JOB_image.outputs.codecheck }}
      JOB_codecheck:
        name: CodeCheck
        needs: [JOB_codecheck_execute, JOB_codecheck_fresh]
        if: ${{ always() }}
        timeout-minutes: 5
        steps:
          - name: rdv_ci_reuse_verify
            identifier: rdv_ci_reuse_verify
            env:
              BASE_URL: https://cannbot.cloud
              ADMIN_PASSWORD: ${{ secrets.ST_PLATFORM_ADMIN_PASSWORD }}
              PR_NUMBER: ${{ atomgit.event.pull_request.number }}
              CI_RUN_ID: ${{ atomgit.workflow_run_id }}
              CI_RUN_ATTEMPT: ${{ atomgit.run_attempt }}
            run: |
              set -eu -o pipefail
              client=$(mktemp)
              client_sha=afbbf2de7d8373b135c2fbe2ee694b52e0eeac884488146a38a927f5675d1a8e
              curl --disable --fail --silent --show-error --max-time 30 --output "$client" "https://cannbot.cloud/api/pr-ut/client/$client_sha"
              printf '%s  %s\n' "$client_sha" "$client" | sha256sum --check --status
              exec python3 -I "$client" reuse --action verify --gitcode-repo cann/cannbot --pr-number "$PR_NUMBER" --run-id "$CI_RUN_ID" --attempt "$CI_RUN_ATTEMPT"
        runs-on: [self-hosted, arch=x64, spec=small]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/ubuntu24.04_x86:lv6_v1.1094
    pre:
    - type: auto
    fail-fast: false
  stage3:
    name: Security_content_Scan
    jobs:
      # 聚合静态门禁：单 Job 一次 POST /api/pr-vet 跑完 Sift 差分 / SkillSpector 风险分 /
      # Bandit / Semgrep / 内容审查（advisory），等价于 cannbot-skills 的 JOB_static_vet
      # （详见 cannbot-skills-rdv/docs/pr-vet-aggregate.md）
      JOB_static_vet:
        name: Static_Vet
        steps:
          - name: check_static_vet_script
            run: |
              test -f /opt/cannbot-skills-rdv/scripts/ci-pr-vet.sh \
                || { echo "❌ runner 上未找到 ci-pr-vet.sh，请先部署 cannbot-skills-rdv" >&2; exit 3; }
              # Step Summary 共享库：缺失时摘要与 md 报告落盘会**静默失效**（退出码不变、
              # 日志只有 command not found），所以与主脚本一样前置 fail-closed 拦下。
              test -f /opt/cannbot-skills-rdv/scripts/lib/ci-summary.sh \
                || { echo "❌ runner 上未找到 lib/ci-summary.sh，请先部署 cannbot-skills-rdv" >&2; exit 3; }
          - name: run_static_vet
            env:
              ATOMGIT_RUN_ATTEMPT: ${{ atomgit.run_attempt }}
              ADMIN_PASSWORD: ${{ secrets.ST_PLATFORM_ADMIN_PASSWORD }}
              CI_REPORT_DIR: "${{ env.ci_report_dir }}/static-vet"
            run: |
              bash /opt/cannbot-skills-rdv/scripts/ci-pr-vet.sh \
                --pr-number "${{ env.MERGE_ID }}" \
                --gitcode-repo cann/cannbot \
                --timeout 1800
          # 完整 md 报告上传 OBS（`always()`：门禁未通过也上传；`continue-on-error`：上传异常不染红）
          - name: upload_static_vet_report
            if: ${{ always() }}
            continue-on-error: true
            uses: obs-upload
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{ secrets.AK }}
              secret-key: ${{ secrets.SK }}
              artifact-path: "${{ env.ci_report_dir }}/static-vet/*.md"
              object-prefix: ${{ env.obs_path }}/
        runs-on:
          - self-hosted
          - runner_name=A5_skill_tester_02
      JOB_ut:
        if: ${{ jobs.JOB_ci_reuse_plan.outputs.ut_mode == 'RUN' }}
        name: UT
        uses: cann/cannbot/.gitcode/workflows/ut_action.yml@${{ atomgit.event.pull_request.head.sha }}
        with:
          image_version: ${{ jobs.JOB_ci_reuse_plan.outputs.ut_image_version }}
          suite_identity: ${{ jobs.JOB_ci_reuse_plan.outputs.ut_suite_identity }}
          runtime_identity: ${{ jobs.JOB_ci_reuse_plan.outputs.ut_runtime_identity }}
    pre:
    - type: auto
    fail-fast: false

  stage4:
    name: UT_Gate
    jobs:
      JOB_ut_gate:
        name: UT_gate
        if: ${{ always() }}
        timeout-minutes: 5
        steps:
          - name: rdv_ut_gate
            identifier: rdv_ut_gate
            env:
              BASE_URL: https://cannbot.cloud
              ADMIN_PASSWORD: ${{ secrets.ST_PLATFORM_ADMIN_PASSWORD }}
              PR_NUMBER: ${{ atomgit.event.pull_request.number }}
              CI_RUN_ID: ${{ atomgit.workflow_run_id }}
              CI_RUN_ATTEMPT: ${{ atomgit.run_attempt }}
            run: |
              set -eu -o pipefail
              client=$(mktemp)
              client_sha=afbbf2de7d8373b135c2fbe2ee694b52e0eeac884488146a38a927f5675d1a8e
              curl --disable --fail --silent --show-error --max-time 30 --output "$client" "https://cannbot.cloud/api/pr-ut/client/$client_sha"
              printf '%s  %s\n' "$client_sha" "$client" | sha256sum --check --status
              exec python3 -I "$client" gate --gitcode-repo cann/cannbot --pr-number "$PR_NUMBER" --run-id "$CI_RUN_ID" --attempt "$CI_RUN_ATTEMPT"
        runs-on: [self-hosted, arch=x64, spec=small]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/ubuntu24.04_x86:lv6_v1.1094
    pre:
    - type: auto
    fail-fast: false

post:
  jobs:
    job_post:
      name: Test_post
      uses: cann/.gitcode/.gitcode/workflows/post_action.yml@master
