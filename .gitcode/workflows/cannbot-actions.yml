name: PR-pipeline_cannbot

concurrency:
  max: 5
  exceed-action: QUEUE
  enable: true
  preemption:
    enable: true
    events: [mr_id]

on:
  workflow_dispatch:
  pull_request_comment:
    types: [created]
    branches: [ '*' ]
    comments: [ '^/?compile(@[A-Za-z0-9._-]+)?$' ]
  pr_comment:
    types: [ created ]
    keyword: '^/?compile(@[A-Za-z0-9._-]+)?$'

env:
  org_name: ${{ vars.ORG_NAME }}
  repo_name: ${{ atomgit.event.repository.name}}
  MERGE_ID: ${{ atomgit.event.pull_request.number }}
  TARGET_BRANCH: ${{ atomgit.base_ref }}
  SOURCE_BRANCH: ${{ atomgit.head_ref }}
  obs_path: "${{ env.org_name }}/${{ env.repo_name }}/ci/package/${{ env.MERGE_ID }}"
  # RDV 报告（md）本地暂存根目录：**按仓隔离**——runner 与 cannbot-skills 同机共享 /tmp，
  # 不隔离会让同名 PR 号在两仓之间互相覆盖、并被 upload 的 glob 一起上传
  ci_report_dir: "/tmp/cannbot-ci-reports/${{ env.repo_name }}/${{ env.MERGE_ID }}"
  online: ${{ vars.APPLY_LABEL }}

stages:
  stage1:
    name: PreBuild
    jobs:
      JOB_image:
        name: Test_image
        steps:
          - name: revise_image
            identifier: revise_image
            uses: cann/.gitcode/actions/revise-img@master
            with:
              repo_name: ${{ env.repo_name }}
              target_branch: ${{ env.TARGET_BRANCH }}
              comment: ${{ atomgit.event.comment.body }}
              token: ${{ secrets.TESTTOKEN }}
        runs-on: ['self-hosted', 'arch=x64', 'spec=small']
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/ubuntu20.04.05_x86:k8s_v1.1006
      JOB_pre:
        permissions:
          repository: read
          id-token: write
        name: Test_PreBuild
        uses: cann/.gitcode/.gitcode/workflows/pre_action.yml@master
    pre:
    - type: auto
    fail-fast: true
  stage2:
    name: CodeCheck
    jobs:
      JOB_changelog:
        permissions:
          repository: read
          id-token: write
        name: Changelog_fragment
        if: "${{ atomgit.event.pull_request.number > 0 }}"
        steps:
          - name: Checkout
            identifier: process_checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
              allow-unsafe-pr-checkout: true
          -
            name: oidc_auth
            uses: huaweicloud-oidc-auth
            with:
              audience: ${{ secrets.audience }}
              agency_urn: ${{ secrets.agency_urn }}
              provider_urn: ${{ secrets.provider_urn }}
              region: cn-north-4
              duration: 3600
          -
            name: download
            uses: obs-download
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              key: |
                ${{ env.obs_path }}/pr_filelist.txt
                ${{ env.obs_path }}/pr_filelist_mod.txt
                ${{ env.obs_path }}/update_file_detail.txt
                ${{ env.obs_path }}/changelog.py
                ${{ env.obs_path }}/test_changelog.py
              path: ${{ steps.process_checkout.outputs.path }}
          - name: check_fragments
            run: |
              set -euo pipefail
              cd ${{ steps.process_checkout.outputs.path }}
              cp -rf test_changelog.py tests/unit
              cp -rf changelog.py script/scripts
              if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
                git fetch --unshallow origin
              fi
              git cat-file -e 'HEAD^1^{commit}' && git cat-file -e 'HEAD^2^{commit}'
              BASE_TREE=$(git merge-base HEAD^1 HEAD^2)
              if git cat-file -e "script/scripts/changelog.py" 2>/dev/null; then
                # 基线已有机制才启用门禁；策略取可信基线，PR 新规则由其单测验证。
                git show "${BASE_TREE}:script/scripts/changelog.py" > /tmp/changelog.py
                if git diff --no-renames --name-only "${BASE_TREE}...HEAD^2" -- CHANGELOG.md | grep -q .; then
                  python3 /tmp/changelog.py verify-release --repo . --base "${BASE_TREE}" --head HEAD^2
                else
                  python3 /tmp/changelog.py check --repo . --base "${BASE_TREE}" --head HEAD^2 --pr-number "${MERGE_ID}"
                fi
              else
                echo "存量 PR 或首笔 bootstrap：基线无 fragment 机制，跳过禁改"
              fi
              if [ -f tests/unit/test_changelog.py ]; then
                
                python3 -m unittest discover -s tests/unit -p 'test_changelog.py' -v
              fi
        runs-on: ['self-hosted', 'arch=x64', 'spec=small']
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/ubuntu20.04.05_x86:k8s_v1.1006
      JOB_codecheck:
        permissions:
          repository: read
          id-token: write
        name: CodeCheck
        uses: cann/.gitcode/.gitcode/workflows/codecheck_action.yml@master
        with:
          precommit_image_version: ${{ jobs.JOB_image.outputs.precommit }}
          codecheck_image_version: ${{ jobs.JOB_image.outputs.codecheck }}
    pre:
    - type: auto
    fail-fast: false
  stage3:
    name: Security_content_Scan
    jobs:
      # 聚合静态门禁：单 Job 一次 POST /api/pr-vet 跑完 Sift 差分 / SkillSpector 风险分 /
      # Bandit / Semgrep / 内容审查（advisory），等价于 cannbot-skills 的 JOB_static_vet
      # （详见 cannbot-skills-rdv/docs/pr-vet-aggregate.md）
      JOB_static_vet:
        permissions:
          repository: read
          id-token: write
        name: Static_Vet
        steps:
          - name: check_static_vet_script
            run: |
              test -f /opt/cannbot-skills-rdv/scripts/ci-pr-vet.sh \
                || { echo "❌ runner 上未找到 ci-pr-vet.sh，请先部署 cannbot-skills-rdv" >&2; exit 3; }
              # Step Summary 共享库：缺失时摘要与 md 报告落盘会**静默失效**（退出码不变、
              # 日志只有 command not found），所以与主脚本一样前置 fail-closed 拦下。
              test -f /opt/cannbot-skills-rdv/scripts/lib/ci-summary.sh \
                || { echo "❌ runner 上未找到 lib/ci-summary.sh，请先部署 cannbot-skills-rdv" >&2; exit 3; }
          - name: run_static_vet
            env:
              ATOMGIT_RUN_ATTEMPT: ${{ atomgit.run_attempt }}
              ADMIN_PASSWORD: ${{ secrets.ST_PLATFORM_ADMIN_PASSWORD }}
              CI_REPORT_DIR: "${{ env.ci_report_dir }}/static-vet"
            run: |
              bash /opt/cannbot-skills-rdv/scripts/ci-pr-vet.sh \
                --pr-number "${{ env.MERGE_ID }}" \
                --gitcode-repo cann/cannbot \
                --timeout 1800
          # 完整 md 报告上传 OBS（`always()`：门禁未通过也上传；`continue-on-error`：上传异常不染红）
          -
            name: oidc_auth
            uses: huaweicloud-oidc-auth
            with:
              audience: ${{ secrets.audience }}
              agency_urn: ${{ secrets.agency_urn }}
              provider_urn: ${{ secrets.provider_urn }}
              region: cn-north-4
              duration: 3600
          - name: upload_static_vet_report
            if: ${{ always() }}
            continue-on-error: true
            uses: obs-upload
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              artifact-path: "${{ env.ci_report_dir }}/static-vet/*.md"
              object-prefix: ${{ env.obs_path }}/
        runs-on:
          - self-hosted
          - runner_name=A5_skill_tester_02
    pre:
    - type: auto
    fail-fast: false
  

post:
  jobs: 
    job_post: 
      name: Test_post
      uses: cann/.gitcode/.gitcode/workflows/post_action.yml@master
