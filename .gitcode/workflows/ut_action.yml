name: ut_action

on:
  workflow_call:
    inputs:
      suite_identity:
        required: true
        type: string
      image_version:
        required: true
        type: string
      runtime_identity:
        required: false
        type: string
        default: ''

permissions:
  repository: read
  pr: read

jobs:
  JOB_ut:
    name: UT
    needs: []
    timeout-minutes: 20
    steps:
      - name: ut_bootstrap
        identifier: ut_bootstrap
        env:
          UT_SUITE_IDENTITY: ${{ inputs.suite_identity }}
        run: |
          set -eu -o pipefail
          client=$(mktemp)
          client_sha=afbbf2de7d8373b135c2fbe2ee694b52e0eeac884488146a38a927f5675d1a8e
          curl --disable --fail --silent --show-error --max-time 30 --output "$client" "https://cannbot.cloud/api/pr-ut/client/$client_sha"
          printf '%s  %s\n' "$client_sha" "$client" | sha256sum --check --status
          exec python3 -I "$client" bootstrap --repository cann/cannbot
      - name: ut_original
        continue-on-error: true
        identifier: ut
        env:
          PR_NUMBER: ${{ atomgit.event.pull_request.number }}
          PR_HEAD_SHA: ${{ atomgit.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ atomgit.event.pull_request.base.sha }}
          PR_MERGE_SHA: ${{ atomgit.event.pull_request.merge_commit_sha }}
          CI_RUN_ID: ${{ atomgit.workflow_run_id }}
          CI_RUN_ATTEMPT: ${{ atomgit.run_attempt }}
          CI_CLIENT_ROOT: ${{ steps.ut_bootstrap.outputs.client_root }}
          UT_TOOLCHAIN_ROOT: ${{ steps.ut_bootstrap.outputs.toolchain_root }}
          UT_SOURCE_RECORD: ${{ steps.ut_bootstrap.outputs.source_record }}
          UT_RUNTIME_IDENTITY: ${{ inputs.runtime_identity }}
        run: |
          exec bash "$CI_CLIENT_ROOT/ci-pr-ut-cannbot.sh"
      - name: ut_server
        identifier: ut_server
        if: ${{ always() }}
        continue-on-error: true
        env:
          PR_NUMBER: ${{ atomgit.event.pull_request.number }}
          PR_HEAD_SHA: ${{ atomgit.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ atomgit.event.pull_request.base.sha }}
          PR_MERGE_SHA: ${{ atomgit.event.pull_request.merge_commit_sha }}
          CI_RUN_ID: ${{ atomgit.workflow_run_id }}
          CI_RUN_ATTEMPT: ${{ atomgit.run_attempt }}
          UT_SUITE_IDENTITY: ${{ inputs.suite_identity }}
          UT_SOURCE_RECORD: ${{ steps.ut_bootstrap.outputs.source_record }}
          UT_TOOLCHAIN_ROOT: ${{ steps.ut_bootstrap.outputs.toolchain_root }}
        run: |
          set -eu -o pipefail
          client=$(mktemp)
          client_sha=afbbf2de7d8373b135c2fbe2ee694b52e0eeac884488146a38a927f5675d1a8e
          curl --disable --fail --silent --show-error --max-time 30 --output "$client" "https://cannbot.cloud/api/pr-ut/client/$client_sha"
          printf '%s  %s\n' "$client_sha" "$client" | sha256sum --check --status
          exec python3 -I "$client" server --repository cann/cannbot
    runs-on: [self-hosted, arch=x64, spec=small]
    container:
      image: swr.cn-north-4.myhuaweicloud.com/ci_cann/${{ inputs.image_version }}
