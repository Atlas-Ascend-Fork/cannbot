# 本地部署由 install 配置。head、actions、note 供旧版下载入口使用。

head:
  num: '01'
  kicker: PREVIEW
  title: 开箱即用，现在就能跑
  lede:
    - 一条命令装进你常用的 Agent 客户端，算子生成、算子测试与模型迁移立刻可用。

actions:
  - text: 查看安装说明
    theme: brand
    href: /docs/workflows/index.html
  - text: 查看源码仓
    theme: alt
    href: https://atomgit.com/cann/cannbot

# 按钮下方的补充说明；留空则不渲染
note: 支持 OpenCode、DSH、Codex、Claude Code、TRAE 五种客户端，安装命令在首屏面板里按工作流切换。

install:
  title: 本地部署
  lede: 整包安装、插件安装，选择你喜欢的方式，把CANNBot部署在工作环境上。
  methodsLabel: 安装方式
  packageTitle: 整包安装
  packageDescription: 一键下载安装CANNBot插件和宿主harness
  packageGuide: { text: 安装指南, href: /docs/workflows/cannbot-install.html }
  osLabel: 选择操作系统
  platformIcons: /portal/img/download-platforms.svg
  # packages 按显示顺序排列，下载地址见同目录 installer-links.yaml。
  platforms:
    - icon: windows
      label: Windows 版
      packages:
        - { arch: x64 }
        - { arch: ARM64 }
    - icon: mac
      label: Mac 版
      packages:
        - { arch: ARM64, label: Apple 芯片 }
        - { arch: x64, label: Intel 芯片 }
    - icon: linux
      label: Linux 版
      packages:
        - { arch: x86_64 }
        - { arch: aarch64 }
  plugin:
    hosts:
      - tool: dsh
        label: DSH
        marketHint: 在 DSH 插件市场打开「添加插件」，粘贴以下包名。
        tutorialLabel: DSH 插件安装教程
        packageName: cannbot-dsh@1.0.0-alpha.4
        tutorial: /docs/workflows/dsh-plugin-install.html
  cliTitle: 插件安装
  cliDescription: 安装CANNBot插件到宿主harness
  console:
    steps: 安装步骤
    guide: 安装指南
    category: 领域
    workflow: 工作流
    harness: Harness 框架
    title: 安装插件
    copy: 复制
    copied: 已复制
    announced: 命令已复制到剪贴板
