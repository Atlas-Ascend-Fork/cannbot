# 首页首屏：hero 文案 + 分类 / 工作流 / 客户端 三层。
# 读取方：.vitepress/config.ts（只取 hero 段）、.vitepress/src/config/plugins.ts（clients / categories 段）。
#
# 维护约定：
#   · clients 段只声明客户端身份（label 显示名 + tool 标识），**不放命令**。
#   · 安装命令写在每个工作流的 clients 里，tool → 该工作流自己的完整命令：
#     同一客户端在不同工作流下的命令可以完全不同，前端不做任何占位符替换。
#   · 工作流 clients 里写了的 tool 才展示；写了但命令为空串 → 置灰、不可点击。
#   · 新增工作流 = 在所属分类下加一段；新增客户端 = clients 段加一行 + 在工作流里给命令。

hero:
  name: 现在，交给 CANNBot
  text: ""
  tagline: 算子开发、性能调优、模型迁移与推理优化，你来定需求，CANNBot来搞定。
  actions:
    - theme: brand
      text: 查看安装说明
      link: ./docs/workflows/index.html
    - theme: alt
      text: 查看源码仓
      link: https://atomgit.com/cann/cannbot

# 已适配的 Agent 客户端。这里只管显示名与标识，命令在各工作流下分别配置。
clients:
  - label: OpenCode
    tool: opencode

  - label: DSH
    tool: dsh

  - label: Codex
    tool: codex

  - label: Claude Code
    tool: claude

  - label: TRAE
    tool: trae

# 是否显示分类：false 时隐藏分类，按原顺序平铺所有工作流。
# true 或未填写时显示分类。
showCategories: true

# 分类 → 工作流 → 客户端。分类顺序即首屏一级 tab 顺序，工作流顺序即二级 tab 顺序。
categories:
  - title: 算子领域
    workflows:
      - id: ops-direct-invoke
        title: 算子生成
        clients:
          opencode: 'npx @cannbot-plugin/cannbot@latest install ops-direct-invoke --tool opencode'
          dsh: 'npx @cannbot-plugin/cannbot@latest install ops-direct-invoke --tool dsh'
          codex: 'npx @cannbot-plugin/cannbot@latest install ops-direct-invoke --tool codex'
          claude: 'npx @cannbot-plugin/cannbot@latest install ops-direct-invoke --tool claude'
          trae: 'npx @cannbot-plugin/cannbot@latest install ops-direct-invoke --tool trae'

      - id: ascendc-st-design
        title: 算子测试
        clients:
          opencode: 'npx @cannbot-plugin/cannbot@latest install ascendc-st-design --tool opencode'
          dsh: 'npx @cannbot-plugin/cannbot@latest install ascendc-st-design --tool dsh'
          codex: 'npx @cannbot-plugin/cannbot@latest install ascendc-st-design --tool codex'
          claude: 'npx @cannbot-plugin/cannbot@latest install ascendc-st-design --tool claude'
          trae: 'npx @cannbot-plugin/cannbot@latest install ascendc-st-design --tool trae'

  - title: 模型领域
    workflows:
      - id: model-infer-optimize
        title: 模型迁移与推理优化
        clients:
          opencode: 'npx @cannbot-plugin/cannbot@latest install model-infer-optimize --tool opencode'
          dsh: 'npx @cannbot-plugin/cannbot@latest install model-infer-optimize --tool dsh'
          codex: 'npx @cannbot-plugin/cannbot@latest install model-infer-optimize --tool codex'
          claude: 'npx @cannbot-plugin/cannbot@latest install model-infer-optimize --tool claude'
          trae: 'npx @cannbot-plugin/cannbot@latest install model-infer-optimize --tool trae'

  # 占位工作流：演示「新增工作流 = 在所属分类下加一段」，接入真实插件时替换本段。
  - title: 扩展领域
    workflows:
      - id: xx-placeholder
        title: xx插件
        clients:
          opencode: 'npx @cannbot-plugin/cannbot@latest install xx-placeholder --tool opencode'
          dsh: 'npx @cannbot-plugin/cannbot@latest install xx-placeholder --tool dsh'
          codex: 'npx @cannbot-plugin/cannbot@latest install xx-placeholder --tool codex'
          claude: 'npx @cannbot-plugin/cannbot@latest install xx-placeholder --tool claude'
          trae: 'npx @cannbot-plugin/cannbot@latest install xx-placeholder --tool trae'
