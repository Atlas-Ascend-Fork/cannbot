# 首页首屏：hero 文案 + 分类 / 工作流 / 客户端 三层。
# 读取方：.vitepress/config.ts（只取 hero 段）、.vitepress/src/config/plugins.ts（clients / categories 段）。
#
# 维护约定：
#   · clients 段只声明客户端身份（label 显示名 + tool 标识），**不放命令**。
#   · 安装命令写在每个工作流的 clients 里，tool → 该工作流自己的完整命令：
#     同一客户端在不同工作流下的命令可以完全不同，前端不做任何占位符替换。
#   · 工作流 clients 里写了的 tool 才展示；写了但命令为空串 → 置灰、不可点击。
#   · 新增工作流 = 在官方工作流列表加一段；新增客户端 = clients 段加一行 + 在工作流里给命令。

hero:
  name: 现在，交给 CANNBot
  text: ""
  tagline: 算子开发、性能调优、模型迁移与推理优化，你来定需求，CANNBot来搞定。
  actions:
    - theme: brand
      text: 查看安装说明
      link: ./docs/workflows/index.html
    - theme: alt
      text: 查看源码仓
      link: https://atomgit.com/cann/cannbot

# 已适配的 Agent 客户端。这里只管显示名与标识，命令在各工作流下分别配置。
clients:
  - label: DSH
    tool: dsh

  - label: OpenCode
    tool: opencode

  - label: Codex
    tool: codex

  - label: Claude Code
    tool: claude

  - label: TRAE
    tool: trae

# 直接按列表展示可安装的官方工作流。
showCategories: false
categories:
  - title: 官方工作流
    workflows:
      - id: ops-direct-invoke
        clients:
          dsh: 'npx @cannbot-plugin/cannbot@latest install ops-direct-invoke --tool dsh'
          opencode: 'npx @cannbot-plugin/cannbot@latest install ops-direct-invoke --tool opencode'
          codex: 'npx @cannbot-plugin/cannbot@latest install ops-direct-invoke --tool codex'
          claude: 'npx @cannbot-plugin/cannbot@latest install ops-direct-invoke --tool claude'
          trae: 'npx @cannbot-plugin/cannbot@latest install ops-direct-invoke --tool trae'

      - id: ops-direct-invoke-flash
        clients:
          dsh: 'npx @cannbot-plugin/cannbot@latest install ops-direct-invoke-flash --tool dsh'
          opencode: 'npx @cannbot-plugin/cannbot@latest install ops-direct-invoke-flash --tool opencode'
          codex: 'npx @cannbot-plugin/cannbot@latest install ops-direct-invoke-flash --tool codex'
          claude: 'npx @cannbot-plugin/cannbot@latest install ops-direct-invoke-flash --tool claude'
          trae: 'npx @cannbot-plugin/cannbot@latest install ops-direct-invoke-flash --tool trae'

      - id: ops-registry-invoke
        clients:
          opencode: 'npx skills add https://gitcode.com/cann/cannbot.git --skill ops-registry-invoke'
          codex: 'npx skills add https://gitcode.com/cann/cannbot.git --skill ops-registry-invoke'
          claude: 'npx skills add https://gitcode.com/cann/cannbot.git --skill ops-registry-invoke'

      - id: torch-compile
